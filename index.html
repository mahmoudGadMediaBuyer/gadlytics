function aiTools(){
  const D={type:"object",properties:{
    from:{type:"string",description:L("بداية الفترة YYYY-MM-DD، لو ماتبعتش بياخد الفترة المختارة في الشاشة","Period start YYYY-MM-DD; if omitted, the period selected on screen is used")},
    to:{type:"string",description:L("نهاية الفترة YYYY-MM-DD","Period end YYYY-MM-DD")},
    clientId:{type:"string"},platformId:{type:"string"},campaign:{type:"string"}}};
  return [
  {name:"get_context",
   description:L("ابدأ بيها دايماً. بترجع النهاردة، الفترة المختارة والفلاتر الشغالة، قائمة العملاء والمنصات والحملات والميترِكس المتاحة، وأول وآخر يوم فيه بيانات.","Always start here. Returns today, the selected period and active filters, the list of clients, platforms, campaigns and available metrics, and the first and last day with data."),
   execute(){
     const sc=aiScope(), ds=S.facts.map(f=>f.date).sort();
     return {today:todayISO(), selected_range:{from:sc.from,to:sc.to}, active_filters:sc.label,
       data_from:ds[0]||null, data_to:ds[ds.length-1]||null, snapshots:sum(S.facts.map(f=>f.snaps.length)),
       currency:S.cfg.settings.currency,
       clients:S.cfg.clients.map(c=>({id:c.id,name:c.name,margin:c.margin,monthly_budget:c.monthlyBudget,
         is_demo:!!c.demo})),
       platforms:S.cfg.platforms.map(p=>({id:p.id,name:p.name})),
       campaigns:[...new Set(S.facts.map(f=>f.campaign).filter(Boolean))].slice(0,40),
       metrics:S.cfg.metrics.map(m=>({key:m.key,label:mLabel(m),type:m.type,unit:m.unit,
         better:m.dir,formula:m.formula||null})),
       targets:(S.cfg.targets||[]).map(t=>({metric:t.metricKey,value:t.value,
         client:t.clientId==="*"?"all":((clientById(t.clientId)||{}).name||t.clientId)}))};
   }},
  {name:"get_metrics",
   description:L("إجمالي كل الميترِكس لفترة ونطاق. استخدمها لأي سؤال عن أرقام.","Totals for every metric over a period and scope. Use it for any numeric question."),
   inputSchema:D,
   execute(i){ const [f,t]=aiRange(i);
     const facts=factsIn(f,t,aiScopeOf(i));
     if(!facts.length) return {range:{from:f,to:t},no_data:true};
     const days={}; facts.forEach(x=>{ days[x.date]=1; });
     return {range:{from:f,to:t},days_with_data:Object.keys(days).length,
       snapshots:sum(facts.map(x=>x.snaps.length)),values:aiVals(aggFacts(facts))};
   }},
  {name:"get_breakdown",
   description:L("تفصيل الأداء حسب بُعد: platform أو client أو campaign. للمقارنة بين المنصات أو الحملات.","Performance broken down by dimension: platform, client or campaign. For comparing platforms or campaigns."),
   inputSchema:{type:"object",properties:Object.assign({
     dim:{type:"string",enum:["platform","client","campaign"]},
     limit:{type:"number"}},D.properties),required:["dim"]},
   execute(i){ const [f,t]=aiRange(i), dim=String(i.dim||"platform");
     const rows=breakdown(f,t,dim,aiScopeOf(i)).filter(r=>(r.vals.spend||0)>0)
       .sort((a,b)=>(b.vals.spend||0)-(a.vals.spend||0)).slice(0,Math.min(+i.limit||15,20));
     const nm=k=> dim==="platform"?platById(k).name : dim==="client"?((clientById(k)||{}).name||k)
       : (k==="—"?"(بدون حملة)":k);
     return {range:{from:f,to:t},dim:dim,rows:rows.map(r=>({name:nm(r.key),
       spend:r2(r.vals.spend),orders:r2(r.vals.orders),revenue:r2(r.vals.revenue),
       roas:r2(r.vals.roas),cpa:r2(r.vals.cpa),ctr:r2(r.vals.ctr),cvr:r2(r.vals.cvr)}))};
   }},
  {name:"get_series",
   description:L("سلسلة زمنية لميترك واحد. grain: hour ليوم واحد، day، أو week.","A time series for one metric. grain: hour for a single day, day, or week."),
   inputSchema:{type:"object",properties:Object.assign({
     metric:{type:"string"},grain:{type:"string",enum:["auto","hour","day","week"]}},D.properties),
     required:["metric"]},
   execute(i){ const [f,t]=aiRange(i), k=String(i.metric||"roas");
     if(!metricByKey(k)) throw new Error(L("ميترك مش موجود: ","Metric not found: ")+k+L(" — شوف get_context"," — see get_context"));
     const g=seriesGrain(f,t,aiScopeOf(i),i.grain||"auto");
     const rows=g.rows.filter(r=>r.n>0).slice(-60);
     return {range:{from:f,to:t},metric:k,grain:g.grain,
       points:rows.map(r=>({at:r.label,value:r2(r.vals[k])}))};
   }},
  {name:"get_analysis",
   description:L("التحليل الجاهز: درجة الصحة ومكوناتها، القرار المقترح وسببه، كفاية البيانات، الاتجاه، الشذوذ، "+esc(L("الميزانية","Budget"))+"، أفضل ساعة/يوم/منصة، ومراحل القمع. استخدمها لأسئلة «ليه» و«إيه رأيك».","The prepared analysis: health score and its components, the recommended decision and why, data sufficiency, trend, anomalies, budget, best hour/day/platform, and funnel stages. Use it for 'why' and 'what do you think' questions."),
   inputSchema:D,
   execute(i){ const [f,t]=aiRange(i), ov=aiScopeOf(i);
     let cid=i.clientId?String(i.clientId):(S.ws||(S.f.clients.length===1?S.f.clients[0]:null));
     const present={}; factsIn(f,t,ov).forEach(x=>{ present[x.clientId]=1; });
     const inScope=Object.keys(present);
     if(!cid&&inScope.length===1) cid=inScope[0];   // عميل واحد بس في النطاق = هو المقصود
     const a=assess(f,t,ov,cid);
     const cmp=resolveCmp(f,t);
     const out={range:{from:f,to:t},
       data_sufficiency:{ok:a.suff.ok,level:a.suff.level,missing:a.suff.reasons},
       health:a.health.score==null?{available:false,why:a.health.why}
         :{score:r2(a.health.score),band:a.health.label,
           components:a.health.parts.map(p=>({name:p.label,score:r2(p.score),weight:p.weight,detail:p.note}))},
       decision:{status:a.decision.status,confidence:a.decision.conf,
         why:a.decision.why,recommendation:a.decision.rec.replace(/<[^>]+>/g,"")},
       trend_roas:a.trend?{pct_change:r2(a.trend.pct),days:a.trend.n,strength:r2(a.trend.r2)}:null,
       budget:null};
     const bl=(cid?[cid]:inScope).map(id=>{ const pc=pacingFor(id); if(!pc) return null;
       return {client:(clientById(id)||{}).name||id,budget:pc.budget,spent:r2(pc.actual),
         planned_so_far:r2(pc.expected),forecast_end:r2(pc.forecast),
         pacing_pct:r2(pc.pacing*100),status:pc.status,days_left:pc.left,
         safe_daily_cap:r2(pc.dailyLeft)}; }).filter(Boolean);
     if(bl.length===1) out.budget=bl[0]; else if(bl.length) out.budgets=bl;
     else out.budget=L("مفيش ميزانية محددة للعميل ده","No budget set for this client");
     ["roas","cpa","cvr","ctr"].forEach(k=>{
       const an=anomalyFor(a.vals[k],a.baselines[k]);
       if(an){ out.anomalies=out.anomalies||[];
         out.anomalies.push({metric:k,current:r2(a.vals[k]),usual_range:[r2(an.lo),r2(an.hi)],
           usual_mean:r2(an.mean),days_of_history:an.n}); } });
     if(cmp){ const B=aggFacts(factsIn(cmp[0],cmp[1],ov));
       const ch=whatChanged(a.vals,B); const d=diagnose(ch);
       out.vs_previous={period:{from:cmp[0],to:cmp[1]},
         changes:ch.slice(0,8).map(x=>({metric:x.key,now:r2(x.cur),before:r2(x.prev),pct:r2(x.pct)})),
         diagnosis:d.text.replace(/<[^>]+>/g,""),diagnosis_confident:d.sure}; }
     const p=peaksFor(f,t,ov);
     out.peaks={};
     if(p.platform&&p.platform.best) out.peaks.best_platform_roas=
       {name:platById(p.platform.best.key).name,roas:r2(p.platform.best.vals.roas)};
     if(p.weekday&&p.weekday.best) out.peaks.best_weekday=
       {day:AR_D[p.weekday.best.i],roas:r2(p.weekday.best.vals.roas),samples:p.weekday.best.n};
     if(p.hour&&p.hour.best) out.peaks.best_hour=
       {hour:p.hour.best.h,roas:r2(p.hour.best.vals.roas),readings:p.hour.best.n};
     if(p.hour&&p.hour.window) out.peaks.best_window=
       {from_hour:p.hour.window.h,to_hour:p.hour.window.end,roas:r2(p.hour.window.roas),
        revenue_share_pct:r2(pctOf(p.hour.window.r,p.hour.TR)),
        spend_share_pct:r2(pctOf(p.hour.window.sp,p.hour.TS))};
     if(!p.hour) out.peaks.hour_analysis=L("مقفول — محتاج أكتر من لقطة في اليوم","Off — needs more than one snapshot a day");
     const st=FUNNEL_STAGES.filter(x=>(a.vals[x[0]]||0)>0);
     if(st.length>=2) out.funnel=st.map((x,n)=>({stage:x[1],volume:r2(a.vals[x[0]]),
       conversion_from_previous_pct: n>0? r2(a.vals[x[0]]/a.vals[st[n-1][0]]*100) : null}));
     else out.funnel=L("غير متاح — مراحل القمع مش مسجلة","Not available — funnel stages aren't recorded");
     return out;
   }},
  {name:"build_ui",
   description:L("بيبني جوه الأداة لما المستخدم يطلب صراحةً: list_types بيرجع أنواع الأقسام والشاشات والميترِكس، add_section بيضيف قسم لشاشة، add_screen بيعمل صفحة جديدة، add_metric بيضيف ميترك بمعادلة.",

     if(act==="add_metric"){
       const key=String(i.key||"").toLowerCase().replace(/[^a-z0-9_]/g,""), label=String(i.label||"").trim(), f=String(i.formula||"").trim();
       if(!key||!label||!f) throw new Error("key, label and formula are required");
       if(metricByKey(key)) throw new Error("metric key already exists: "+key);

       S.cfg.metrics.push({key:key,label:label,labelEn:label,type:"calc",unit:i.unit||"num",dec:2,dir:i.better||"up",formula:f});
       saveCfg(); setTimeout(render,0); return {ok:true,key:key}; }
     if(act==="add_section"){
       const ty=SEC_TYPES.find(x=>x[0]===i.type); if(!ty) throw new Error("unknown section type — call list_types");
       const scr=String(i.screen||sectionScreen()||"overview");
       if(!screenList().some(x=>x.k===scr)) throw new Error("unknown screen — call list_types");
       const o={id:"s_"+uid(),screen:scr,type:ty[0],title:String(i.title||L(ty[1],ty[3]||ty[1])),size:i.size||"full",simple:true};
       const mk=(i.metrics||[]).filter(k=>metricByKey(k)); if(mk.length) o.metrics=mk;

       else if(["bars","stack","heat","hourmap","trend","table"].indexOf(ty[0])>=0) o.metrics=ty[0]==="trend"?["revenue","spend","roas"]:ty[0]==="table"?kpiKeys().slice():["spend"];

       if(i.chart) o.chart=String(i.chart); if(i.mode) o.mode=String(i.mode);
       const pl=(i.platforms||[]).filter(x=>S.cfg.platforms.some(p=>p.id===x)); if(pl.length) o.filter={platforms:pl};
       if(ty[0]==="note") o.text=String(i.text||"");
       if(ty[0]==="aiblock") o.prompt=String(i.prompt||i.text||"");
       if(ty[0]==="sheet") o.cols=(i.columns&&i.columns.length?i.columns:[{name:"Item",type:"text"},{name:"Value",type:"num"}])
         .slice(0,20).map(c=>({id:"c"+uid(),name:String(c.name||"Column"),type:SH_TYPES.some(x=>x[0]===c.type)?c.type:"text",opts:c.options||""}));
       S.cfg.sections.push(o); saveCfg();
       if(scr==="entry_snap"||scr==="entry_daily"){ S.view="entry"; S.entryTab=scr==="entry_daily"?"daily":"snap"; }

       return {ok:true,section_id:o.id,screen:scr,title:o.title,type:o.type}; }

   }},
  {name:"get_actions",
   description:L("قائمة اللي محتاج تدخل دلوقتي مرتبة بالأولوية، مع التغييرات المسجلة وأثرها والتجارب.","What needs action now, ranked by priority, with logged changes, their impact, and experiments."),

/* على الموقع مفيش claude.use — بنعمل نفس الواجهة فوق دالة «ai» في Supabase (اللي بتكلم Claude بمفتاحك)،
   والأدوات بتشتغل هنا في المتصفح على أرقامك زي ما هي */
async function siteSample(turns,opts){ opts=opts||{};
  const tools=opts.tools||[], defs=tools.map(t=>({name:t.name,description:t.description||"",input_schema:t.inputSchema||{type:"object",properties:{}}}));
  const msgs=(Array.isArray(turns)?turns:[{role:"user",content:String(turns)}]).map(t=>({role:t.role,content:t.content}));
  for(let round=0;round<8;round++){
    if(opts.signal&&opts.signal.aborted) throw {code:"cancelled",message:"cancelled"};
    const r=await SUPA_DB.client.functions.invoke("ai",{body:{messages:msgs,tools:defs,tier:opts.modelTier||"default"}});
    if(r.error) throw {code:"api",message:L("مقدرتش أوصل للمساعد: ","Couldn't reach the assistant: ")+(r.error.message||r.error)};
    const d=r.data||{};
    if(d.error) throw {code:d.code||"api",message:d.code==="no_key"? L("المساعد محتاج مفتاح Claude API يتحط في Supabase الأول (Edge Functions ← Secrets ← ANTHROPIC_API_KEY).","The assistant needs a Claude API key in Supabase first (Edge Functions → Secrets → ANTHROPIC_API_KEY).")
      : d.code==="bad_key"? L("مفتاح Claude API اللي في Supabase مش شغال — راجعه.","The Claude API key in Supabase is invalid — check it.") : d.error};
    const content=d.content||[], text=content.filter(c=>c.type==="text").map(c=>c.text).join(""), uses=content.filter(c=>c.type==="tool_use");
    msgs.push({role:"assistant",content:content});
    if(!uses.length||d.stop_reason!=="tool_use"){ if(opts.onText) opts.onText({text:text,delta:text}); return {text:text,truncated:d.stop_reason==="max_tokens"}; }
    const results=[];
    for(const u of uses){ let out; const t=tools.find(x=>x.name===u.name);
      try{ out=t? await t.execute(u.input||{},{}) : {error:"unknown tool"}; }catch(e){ out={error:String(e&&e.message||e)}; }
      results.push({type:"tool_result",tool_use_id:u.id,content:JSON.stringify(out===undefined?null:out).slice(0,30000)}); }
    msgs.push({role:"user",content:results});
  }
  throw {code:"loop",message:L("المساعد لف كتير من غير ما يوصل لإجابة — اسأل بشكل أدق.","The assistant looped without an answer — try a narrower question.")};
}

      if(!window.claude||typeof claude.use!=="function") return null;

}

ACT.aiSend=()=>{
  if(AI.busy){ if(AI.ctl) AI.ctl.abort(); return; }
  const i=$("#aiInput"); if(!i) return;
  const q=i.value.trim(); if(!q) return;

};
async function aiSend(q){
  if(AI.busy) return;
  const s=await aiInit();
  if(!s){ AI.msgs.push({role:"error",content:L("المساعد مش متاح في العرض ده.","The assistant isn't available in this view.")}); aiRender(); return; }
  AI.msgs.push({role:"user",content:q});
  AI.busy=true; AI.used=[]; aiRender();
  const ctl=new AbortController(); AI.ctl=ctl;
  const hist=AI.msgs.filter(m=>m.role==="user"||m.role==="assistant").slice(-6);
  const turns=hist.map((m,n)=>({role:m.role,content:n===0?AI_RULES_GET()+"\n\n---\n\n"+L("السؤال: ","Question: ")+m.content:m.content}));
  if(turns[0].role!=="user") turns.shift();
  const canTools=!!(AI.limits&&AI.limits.tools);
  const opts={signal:ctl.signal,modelTier:aiTier(),
    onText:({text})=>{
      const last=AI.msgs[AI.msgs.length-1];
      if(last&&last.role==="assistant"&&last.streaming) last.content=text;
      else AI.msgs.push({role:"assistant",content:text,streaming:true});
      aiRender();
    }};
  if(canTools){
    const all=aiTools(), mx=Math.max(1,AI.limits.tools.maxCount||6);
    const wantsBuild=/قسم|سكشن|شاش|صفح|ميترك|معادل|ضيف|اضف|أضف|زوّد|زود|ابني|ابنى|اعمل|section|screen|page|metric|formula|add|build|create/i.test(q);
    let list=all.filter(x=>x.name!=="build_ui");
    if(wantsBuild) list=[list[0],all.find(x=>x.name==="build_ui")].concat(list.slice(1));
    opts.tools=list.slice(0,mx)
      .map(t=>Object.assign({},t,{execute:(inp,cx)=>{
        if(AI.used.indexOf(t.name)<0) AI.used.push(t.name);
        try{ return t.execute(inp||{},cx); }catch(e){ throw e; }
      }}));
  } else {
    const c=aiTools()[0].execute(), m=aiTools()[1].execute({});
    turns[turns.length-1].content+="\n\n[بيانات الصفحة "+esc(L("الحالي","Current"))+"ة]\n"+
      JSON.stringify({context:c,totals:m}).slice(0,20000)+
      "\n(استدعاء الأدوات مش متاح في العرض ده — جاوب من البيانات اللي فوق بس.)";
  }
  try{
    const res=await s(turns,opts);
    const last=AI.msgs[AI.msgs.length-1];
    if(last&&last.role==="assistant"&&last.streaming){
      last.content=res.text; last.streaming=false; last.tools=AI.used.map(aiToolLabel);
    } else AI.msgs.push({role:"assistant",content:res.text,tools:AI.used.map(aiToolLabel)});
    if(res.truncated) AI.msgs.push({role:"error",content:L("الرد اتقطع لأنه طويل — اسأل عن جزء أصغر.","The answer was cut off because it was long — ask about a smaller slice.")});
  }catch(e){
    const last=AI.msgs[AI.msgs.length-1];
    if(last&&last.role==="assistant"&&last.streaming){
      if(e&&e.code==="refused"){ AI.msgs.pop(); }
      else { last.content=e&&e.text?e.text:last.content; last.streaming=false;
             last.tools=AI.used.map(aiToolLabel); }
    }
    const msg=aiErrMsg(e);
    if(msg) AI.msgs.push({role:"error",content:msg});
  }
  AI.busy=false; AI.ctl=null; aiRender();
}
function aiToolLabel(n){
  return {get_context:"سياق الحساب",get_metrics:"الإجماليات",get_breakdown:L("تفصيل حسب البُعد","Breakdown by dimension"),
    get_series:L("السلسلة الزمنية","Time series"),build_ui:L("بناء في الأداة","Built in the tool"),get_analysis:"التحليل والصحة",get_actions:L("الإجراءات والتغييرات","Actions and changes")}[n]||n;
}
function aiErrMsg(e){
  const c=e&&e.code;
  if(c==="cancelled") return null;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled")
    return L("المساعد مش مفعّل للحساب ده.","The assistant isn't enabled for this account.");
  if(c==="rate_limited") return L("وصلت لحد الاستخدام — استنى شوية وجرب تاني.","You've hit the usage limit — wait a little and try again.");
  if(c==="session_expired") return L("الجلسة انتهت — اعمل تسجيل دخول تاني وجرب.","Session expired — sign in again and retry.");
  if(c==="prompt_too_large") return L("السؤال أو الداتا كبيرة أوي — ضيّق الفترة أو اسأل عن جزء.","The question or data is too large — narrow the period or ask about part of it.");
  if(c==="empty_completion") return L("مطلعش رد — صيغ السؤال بشكل تاني.","No answer came back — rephrase the question.");
  if(c==="refused") return L("مقدرش أرد على السؤال ده.","I can't answer that question.");
  if(c==="tools_unavailable") return L("الوصول للأرقام مش متاح في العرض ده.","Access to the numbers isn't available in this view.");
  if((c==="no_key"||c==="bad_key"||c==="api"||c==="loop")&&e.message) return e.message;   // رسائل نسخة الموقع
  return L("حصلت مشكلة مؤقتة — جرب تاني.","A temporary problem occurred — try again.");
}
document.addEventListener("keydown",e=>{
  if(e.target&&e.target.id==="aiInput"&&e.key==="Enter"&&!e.shiftKey){
    e.preventDefault(); ACT.aiSend();
  }
  if(e.key==="Escape"&&AI.open&&!$("#modalHost").innerHTML) ACT.aiClose();
});

/** أعلى مرحلة وصلها الفيديو + كل المراحل اللي عدّى بيها */
function stageTrail(c){
  const hist=(c.history||[]).map(h=>+h.stage).filter(x=>x>0);
  const cur=+c.stage||1;
  const all=[...new Set(hist.concat([cur]))].sort((a,b)=>a-b);
  return {cur:cur, peak:Math.max.apply(null,all), all:all,
    reached:s=>all.indexOf(s)>=0||cur>=s};
}

          "</tr>"; }); }); });
  h+="</table></div>";
  if(shown>=600) h+='<div class="hint">'+esc(L("ظاهر أول ٦٠٠ فيديو — استخدم الفلاتر عشان تضيّق.","Showing the first 600 videos — use the filters to narrow down."))+"</div>";
  if(MG) h+='<div class="hint" style="margin-top:12px">'+esc(L("هنا الفيديوهات اللي اتطلقت بس. القرار المتقطّع = اقتراح من الأداء (قوي ← هيكمل، ضعيف ← مش هيكمل، غير كده يتراقب). دوس ✓ أو ✕ أو … عشان تثبّت قرارك، ودوسة تانية على نفس الزرار ترجّعه للاقتراح.",

  h+='<div class="hint" style="margin-top:12px">'+esc(L(
    "الفيديوهات بتيجي لوحدها من بورد Airtable (آخر مزامنة: ","Videos come from the Airtable board automatically (last sync: "))+

CHG.maQ=v=>{ MA.q=v||""; render(); };
CHG.maProj=v=>{ MA.proj=v||""; MA.adv=""; render(); };
CHG.maAdv=v=>{ MA.adv=v||""; render(); };
CHG.maPlat=v=>{ MA.plat=v||""; render(); };
ACT.maSt=t=>{ MA.st=MA.st===t.dataset.s? "" : t.dataset.s; render(); };
ACT.maClear=()=>{ MA.q=""; MA.proj=""; MA.adv=""; MA.plat=""; MA.st=""; render(); };
ACT.maReload=()=>maLoad(true);
ACT.maDecSet=async t=>{ const id=t.dataset.id, k=t.dataset.k, cur=(MA.data.N[id]||{}).decision, n=Object.assign({},MA.data.N[id]||{});
  if(cur===k) delete n.decision; else n.decision=k;   // دوسة تانية على نفس القرار بترجّعه للاقتراح
  try{ await DB.doc("media_notes/"+id).set(n); MA.data.N[id]=n; render(); }
  catch(e){ toast(L("مقدرتش أحفظ: ","Couldn't save: ")+(e.message||e),true); } };
ACT.maHook=t=>{ const id=t.dataset.id, m=MA.data.media.find(x=>x.creative_id===id)||{}, cur=(MA.data.N[id]||{}).hook||m.hook||"";
  modal(L("هوك الفيديو ","Hook · ")+id+(m.advertiser?" — "+m.advertiser:""),
    '<textarea class="inp" id="maHookT" style="min-height:90px;width:100%;direction:rtl;text-align:right;font-family:var(--f-ui);font-size:14px">'+esc(cur)+"</textarea>"+
    (m.url?'<div style="margin-top:8px"><a href="'+esc(m.url)+'" target="_blank" rel="noopener">'+esc(L("▶ افتح الفيديو","▶ Open video"))+"</a></div>":""),
    '<button class="btn btn-p" data-a="maHookSave" data-id="'+esc(id)+'">'+esc(L("حفظ","Save"))+"</button>"); };
ACT.maHookSave=async t=>{ const id=t.dataset.id, v=(($("#maHookT")||{}).value||"").trim(), n=Object.assign({},MA.data.N[id]||{},{hook:v});
  try{ await DB.doc("media_notes/"+id).set(n); MA.data.N[id]=n; closeModal(); render(); toast(L("اتحفظ","Saved")); }

function renderCreatives(){
  if(window.SUPA_DB&&SUPA_DB.client) return renderMediaAuto("manage");
  const all=S.creatives||[], list=creativeList();
  const f=S.mf;
  let h='<div class="md-bar">'+
    '<button class="btn btn-p" data-a="crAdd">'+esc(L("+ فيديو","+ Video"))+"</button>"+
    '<input class="inp" style="width:190px" placeholder="'+
      esc(L("بحث بالـ ID أو المشهور أو الهوك","Search ID, creator or hook"))+
      '" data-c="mfQ" value="'+esc(f.q||"")+'">'+
    '<select class="sel" data-c="mfStage"><option value="">'+esc(L("كل المراحل","All stages"))+"</option>"+
      STAGES.map(s=>'<option value="'+s+'"'+(+f.stage===s?" selected":"")+">"+
        esc(stageLabel(s))+"</option>").join("")+"</select>"+
    '<select class="sel" data-c="mfRate"><option value="">'+esc(L("كل التقييمات","All ratings"))+"</option>"+
      RATES.slice(1).map(r=>'<option value="'+r[0]+'"'+(f.rate===r[0]?" selected":"")+">"+
        esc(L(r[1],r[2]))+"</option>").join("")+"</select>"+
    '<select class="sel" data-c="mfPlat"><option value="">'+esc(L("كل المنصات","All platforms"))+"</option>"+
      S.cfg.platforms.filter(p=>!isAcct(p.id)).map(p=>'<option value="'+p.id+'"'+
        (f.plat===p.id?" selected":"")+">"+esc(p.name)+"</option>").join("")+"</select>"+
    (f.q||f.stage||f.rate||f.plat?'<button class="btn btn-s" data-a="mfClear">'+
      esc(L("مسح الفلاتر","Clear"))+"</button>":"")+
    '<button class="btn btn-s" data-a="stageNames" style="margin-inline-start:auto">'+esc(L("✎ أسماء المراحل","✎ Stage names"))+"</button></div>";

  /* ملخص المراحل */
  const maxStage=Math.max(1,...all.map(c=>stageTrail(c).peak));
  h+='<div class="md-sum">'+STAGES.filter(s=>s<=Math.max(3,maxStage)).map(s=>{
    const reached=all.filter(c=>stageTrail(c).reached(s)).length;   // عدّى من هنا
    const here=all.filter(c=>(+c.stage||1)===s).length;             // واقف هنا دلوقتي
    const on=+f.stage===s;
    return '<div class="md-s pick'+(on?" on":"")+'" data-a="mfStageCard" data-s="'+s+
      '" title="'+esc(on?L("دوس تشيل الفلتر","Click to clear the filter")
                        :L("دوس تشوف ميديا المرحلة دي","Click to see this stage's media"))+
      '"><div class="l">'+esc(stageLabel(s))+"</div>"+
      '<div class="n" style="color:'+stageColor(s)+'">'+reached+"</div>"+
      '<div class="l">'+here+esc(L(" واقف هنا"," here now"))+"</div></div>";
  }).join("")+
    '<div class="md-s pick'+(f.stage?"":" on")+'" data-a="mfStageCard" data-s=""><div class="l">'+
    esc(L("الإجمالي","Total"))+"</div>"+
    '<div class="n">'+all.length+"</div>"+
    '<div class="l">'+all.filter(c=>c.rating==="winner").length+esc(L(" وينر"," winners"))+"</div></div>"+
    "</div>"+
    '<div class="hint" style="margin:-6px 0 14px">'+esc(L(
      "الرقم الكبير = كام فيديو عدّى من المرحلة دي (حتى لو اترقّى بعدها)، وتحته الواقفين فيها دلوقتي.",
      "The big number = how many videos passed through this stage (even if promoted later); below it, how many sit there now."))+
    "</div>";

  if(!all.length) return h+emptyBox(
    L("سجّل فيديوهات المشاهير بالهوك ورقم الفيديو، وتابع اللي بينجح وينتقل للمرحلة اللي بعدها.",
      "Log creator videos with their hook and video ID, and track which ones pass to the next stage."),
    '<button class="btn btn-p" data-a="crAdd">'+esc(L("سجّل أول فيديو","Log the first video"))+"</button>");
  if(!list.length) return h+emptyBox(L("مفيش نتايج بالفلاتر دي.","No results with these filters."),
    '<button class="btn" data-a="mfClear">'+esc(L("شيل الفلاتر","Clear filters"))+"</button>");

  const plats=S.cfg.platforms.filter(p=>!isAcct(p.id)).slice(0,4);
  h+='<div class="tw"><table class="md-t"><thead><tr>'+
    "<th>"+esc(L("المشهور","Creator"))+"</th>"+
    "<th>"+esc(L("رقم الفيديو","Video ID"))+"</th>"+
    "<th>"+esc(L("اللينك","Link"))+"</th>"+
    "<th>"+esc(L("الهوك","Hook"))+"</th>"+
    "<th>"+esc(L("تاريخ الإطلاق","Launch"))+"</th>"+
    plats.map(p=>"<th>"+esc(p.name)+"</th>").join("")+
    "<th>"+esc(L("رفع الميديا","Uploaded"))+"</th>"+
    "<th>"+esc(L("إطلاق الحملة","Launched"))+"</th>"+
    "<th>"+esc(L("اسم الحملة","Campaign"))+"</th>"+
    "<th>"+esc(L("التقييم","Rating"))+"</th>"+
    "<th>"+esc(L("المرحلة","Stage"))+"</th>"+
    "<th></th></tr></thead><tbody>";
  let prevCre=null;
  list.forEach(c=>{
    const grp=c.creator!==prevCre; prevCre=c.creator;
    const r=rateOf(c.rating);
    h+="<tr"+(grp?' class="grp"':"")+">"+
      '<td class="md-cre">'+(grp?esc(c.creator||"—"):"")+"</td>"+
      '<td class="md-vid">'+esc(c.videoId||"—")+"</td>"+
      "<td>"+(c.url? '<a href="'+esc(c.url)+'" target="_blank" rel="noopener" class="btn btn-s" '+
        'title="'+esc(c.url)+'">▶</a>' : '<span style="color:var(--ink-3)">—</span>')+"</td>"+
      '<td class="md-hook">'+esc(c.hook||"—")+
        (c.project?'<div class="md-proj">'+esc(c.project)+"</div>":"")+
        (c.notes?'<div class="md-note" title="'+esc(c.notes)+'">'+esc(c.notes)+"</div>":"")+"</td>"+
      "<td style='white-space:nowrap'>"+(c.launchDate?esc(fdate(c.launchDate)):"—")+"</td>"+
      plats.map(p=>'<td><span class="md-chk'+((c.platforms||[]).includes(p.id)?" on":"")+
        '" data-a="crTogPlat" data-id="'+esc(c.id)+'" data-p="'+p.id+'">'+
        ((c.platforms||[]).includes(p.id)?"✓":"")+"</span></td>").join("")+
      '<td><span class="md-chk'+(c.mediaUploaded?" on":"")+'" data-a="crTogFlag" data-id="'+
        esc(c.id)+'" data-f="mediaUploaded">'+(c.mediaUploaded?"✓":"")+"</span></td>"+
      '<td><span class="md-chk'+(c.campaignLaunched?" on":"")+'" data-a="crTogFlag" data-id="'+
        esc(c.id)+'" data-f="campaignLaunched">'+(c.campaignLaunched?"✓":"")+"</span></td>"+
      '<td class="md-vid">'+((c.campaignNames||[]).map(esc).join("<br>")||"—")+"</td>"+
      '<td><span class="md-rate" style="color:'+r[3]+'">'+esc(L(r[1],r[2]))+"</span></td>"+
      '<td>'+(()=>{ const tr=stageTrail(c);
        return '<span class="md-stage" style="color:'+stageColor(tr.cur)+'">'+tr.cur+'</span> <span class="md-stn">'+esc(stageName(tr.cur))+"</span>"+
          (tr.all.length>1?'<div class="md-trail" title="'+
            esc((c.history||[]).map(x=>stageLabel(x.stage)+" · "+(x.at||"")).join("\n"))+'">'+
            tr.all.map(x=>'<i style="background:'+stageColor(x)+
              (x===tr.cur?";outline:2px solid currentColor;outline-offset:1px":"")+'"></i>').join("")+
            "</div>":""); })()+"</td>"+
      '<td class="n" style="white-space:nowrap">'+
        ((+c.stage||1)<STAGES[STAGES.length-1]?'<button class="btn btn-s" data-a="crPromote" data-id="'+esc(c.id)+
          '" title="'+esc(L("رحّله للمرحلة اللي بعدها","Promote to next stage"))+'">↑</button> ':"")+
        ((+c.stage||1)>1?'<button class="btn btn-s" data-a="crDemote" data-id="'+esc(c.id)+'">↓</button> ':"")+
        '<button class="btn btn-s" data-a="crEdit" data-id="'+esc(c.id)+'">'+esc(L("تعديل","Edit"))+"</button> "+
        '<button class="btn btn-s btn-d" data-a="crDel" data-id="'+esc(c.id)+'">✕</button></td></tr>';
  });
  h+="</tbody></table></div>";
  h+='<div class="hint" style="margin-top:12px">'+esc(L(
    "السهم ↑ بيرحّل الفيديو للمرحلة اللي بعدها ويسجّل تاريخ الترحيل، والرقم الصغير جنب المرحلة بيقولك عدى بكام مرحلة. ",
    "The ↑ arrow promotes the video to the next stage and records the date; the small number beside the stage shows how many stages it passed. "))+
    esc(L("التقييم بتحطه إنت بإيدك.","You set the rating yourself."))+"</div>";
  return h;
}

/* ── روستر الحملات اليومي ──
   صف لكل منصة، وعمود لكل يوم. الحملة الشغالة بتترحّل لبكرة والضعيفة بتتقفل. */
function rosterId(cid,date){ return cid+"__"+date; }
function rosterGet(cid,date){
  const d=(S.roster||[]).find(x=>x.clientId===cid&&x.date===date);
  return d? d : {clientId:cid,date:date,byPlatform:{}};
}
function rosterIds(cid,date,pid){ return (rosterGet(cid,date).byPlatform||{})[pid]||[]; }
async function rosterSave(doc){
  doc.id=rosterId(doc.clientId,doc.date);
  try{ await Store.setDoc("roster",doc.id,doc);
    S.roster=(S.roster||[]).filter(x=>!(x.clientId===doc.clientId&&x.date===doc.date)).concat([doc]);
    bumpVer(); return true; }
  catch(e){ toast(L("مشكلة في الحفظ","Problem saving"),true); return false; }
}
function rosterClient(){
  if(S.rf.client&&clientById(S.rf.client)) return S.rf.client;
  if(S.ws) return S.ws;
  return S.cfg.clients.length? S.cfg.clients[0].id : null;
}

function renderRoster(){
  if(!S.cfg.clients.length) return emptyBox(L("محتاج تضيف عميل الأول.","Add a client first."),
    '<button class="btn btn-p" data-a="go" data-v="admin" data-tab="clients">'+
    esc(L("إضافة عميل","Add client"))+"</button>");
  const cid=rosterClient();
  const end=S.rf.date||todayISO(), nDays=+S.rf.days||7;
  const days=dateRange(addDays(end,-(nDays-1)),end);
  // يوم التركيز = اللي الملخص بيتكلم عنه. افتراضياً آخر يوم فيه حملات فعلاً
  const hasAny=d=>S.cfg.platforms.some(p=>!isAcct(p.id)&&rosterIds(cid,d,p.id).length);
  let focus=(S.rf.focus&&days.indexOf(S.rf.focus)>=0)? S.rf.focus
    : (days.slice().reverse().find(hasAny)||end);
  const q=(S.rf.q||"").trim();
  const plats=S.cfg.platforms.filter(p=>!isAcct(p.id))
    .filter(p=>!S.rf.plat||p.id===S.rf.plat);

  let h='<div class="md-bar">'+
    '<span class="flab">'+esc(L("آخر يوم","Last day"))+'</span>'+
    '<input class="inp" type="date" data-c="rfDate" value="'+esc(end)+'" style="width:150px">'+
    '<button class="btn btn-s" data-a="rfToday">'+esc(L("النهارده","Today"))+"</button>"+
    '<select class="sel" data-c="rfDays">'+[7,10,14,21,30].map(n=>'<option value="'+n+'"'+
      (nDays===n?" selected":"")+">"+n+esc(L(" يوم"," days"))+"</option>").join("")+"</select>"+
    (S.cfg.clients.length>1?'<span class="flab">'+esc(L("العميل","Client"))+'</span>'+
      '<select class="sel" data-c="rfClient">'+S.cfg.clients.map(c=>'<option value="'+c.id+'"'+
        (cid===c.id?" selected":"")+">"+esc(c.name)+"</option>").join("")+"</select>":"")+
    '<input class="inp" style="width:160px" placeholder="'+esc(L("بحث بكود الحملة","Search campaign ID"))+
      '" data-c="rfQ" value="'+esc(q)+'">'+
    '<select class="sel" data-c="rfPlat"><option value="">'+esc(L("كل المنصات","All platforms"))+"</option>"+
      S.cfg.platforms.filter(p=>!isAcct(p.id)).map(p=>'<option value="'+p.id+'"'+
        (S.rf.plat===p.id?" selected":"")+">"+esc(p.name)+"</option>").join("")+"</select>"+
    (q||S.rf.plat?'<button class="btn btn-s" data-a="rfClear">'+esc(L("مسح الفلاتر","Clear"))+"</button>":"")+
    "</div>";

  /* ملخص آخر يوم */
  const Y=addDays(focus,-1);
  let kept=0,stopped=0,added=0;
  plats.forEach(p=>{
    const y=rosterIds(cid,Y,p.id), t=rosterIds(cid,focus,p.id);
    kept+=t.filter(x=>y.includes(x)).length;
    stopped+=y.filter(x=>!t.includes(x)).length;
    added+=t.filter(x=>!y.includes(x)).length;
  });
  h+='<div class="md-sum">'+
    '<div class="md-s"><div class="l">'+esc(L("مستمرة من امبارح","Carried over"))+
      '</div><div class="n" style="color:var(--good)">'+kept+"</div></div>"+
    '<div class="md-s"><div class="l">'+esc(L("جديدة","New"))+
      '</div><div class="n" style="color:var(--cyan)">'+added+"</div></div>"+
    '<div class="md-s"><div class="l">'+esc(L("اتقفلت","Stopped"))+
      '</div><div class="n" style="color:var(--bad)">'+stopped+"</div></div>"+
    '<div class="md-s"><div class="l">'+esc(L("شغالة في ","Running on ")+fdate(focus))+
      '</div><div class="n">'+(kept+added)+"</div></div></div>";

  /* الشبكة: عمود لكل يوم، صف لكل منصة — زي الشيت */
  h+='<div class="sh-w"><table class="rs-t"><thead><tr>'+
    '<th class="rs-p">'+esc(L("المنصة","Platform"))+"</th>"+
    days.map(d=>'<th'+(d===focus?' class="rs-now"':"")+">"+
      '<button class="rs-dbtn" data-a="rsFocus" data-d="'+esc(d)+'" title="'+
        esc(L("دوس تشوف ملخص اليوم ده","Click to summarize this day"))+'">'+
      '<div class="rs-d">'+esc(fdate(d))+"</div>"+
      '<div class="rs-dn">'+esc(AR_D[parseISO(d).getDay()])+"</div></button>"+
      '<button class="btn btn-s rs-carry" data-a="rsCarryDay" data-d="'+esc(d)+'" title="'+
        esc(L("رحّل حملات اليوم اللي قبله","Carry from the previous day"))+'">↓</button>'+
      "</th>").join("")+"</tr></thead><tbody"+(S.rf.plat?"":' data-sort="plat:roster"')+">";
  const canSort=!S.rf.plat&&plats.length>1;
  plats.forEach((p,pi)=>{
    h+='<tr data-sid="'+esc(p.id)+'" data-gname="'+esc(p.name)+'"><td class="rs-p">'+
      '<div class="rs-ph">'+
        (canSort?'<span class="sec-h" title="'+esc(L("اسحب لفوق أو لتحت عشان ترتّب","Drag up or down to reorder"))+'">⠿</span>':"")+
        '<span class="rs-dot" style="background:'+p.color+'"></span>'+
        '<span class="rs-pn">'+esc(p.name)+"</span></div>"+
      '<div class="rs-pt">'+
        (canSort?
          '<button data-a="platMove" data-id="'+esc(p.id)+'" data-d="-1"'+(pi===0?" disabled":"")+
            ' title="'+esc(L("طلّعها فوق","Move up"))+'">▲</button>'+
          '<button data-a="platMove" data-id="'+esc(p.id)+'" data-d="1"'+(pi===plats.length-1?" disabled":"")+
            ' title="'+esc(L("نزّلها تحت","Move down"))+'">▼</button>' : "")+
        '<button data-a="editPlat" data-id="'+esc(p.id)+'" title="'+esc(L("تعديل الاسم واللون","Edit name & color"))+'">✎</button>'+
        '<button class="rs-pdel" data-a="delPlat" data-id="'+esc(p.id)+'" title="'+esc(L("احذف المنصة","Delete platform"))+'">✕</button>'+
      "</div></td>"+
      days.map(d=>{
        const ids=rosterIds(cid,d,p.id), prev=rosterIds(cid,addDays(d,-1),p.id);
        const shown=q? ids.filter(x=>String(x).indexOf(q)>=0) : ids;
        const nxt=addDays(d,1), nxtIds=rosterIds(cid,nxt,p.id);
        const allNext=shown.length>0&&shown.every(x=>nxtIds.includes(x));
        return '<td class="rs-c'+(d===focus?" rs-now":"")+'">'+
          shown.map(id=>{
            const carried=prev.includes(id);
            const already=nxtIds.includes(id);
            return '<div class="rs-id '+(carried?"keep":"new")+(q&&String(id).indexOf(q)>=0?" hit":"")+
              '"><span>'+esc(id)+"</span>"+
              '<button class="rs-nx'+(already?" done":"")+'" data-a="rsNext" data-p="'+p.id+
                '" data-i="'+esc(id)+'" data-d="'+esc(d)+'" title="'+
                esc(already? L("موجودة بالفعل في اليوم اللي بعده","Already on the next day")
                           : L("رحّلها لليوم اللي بعده","Carry to the next day"))+'">'+
                (already?"✓":L("←","→"))+"</button>"+
              '<button data-a="rsStop" data-p="'+p.id+'" data-i="'+esc(id)+'" data-d="'+esc(d)+
              '" title="'+esc(L("شيلها من اليوم ده","Remove from this day"))+'">✕</button></div>';
          }).join("")+
          (q&&ids.length&&!shown.length?'<div class="rs-mut">'+ids.length+"</div>":"")+
          '<div class="rs-cf"><button class="rs-add" data-a="rsAdd" data-p="'+p.id+'" data-d="'+esc(d)+'" title="'+
          esc(L("زوّد حملات","Add campaigns"))+'">+</button>'+
          (shown.length?'<button class="rs-cc'+(allNext?" done":"")+'" data-a="rsCarryCell" data-p="'+p.id+
            '" data-d="'+esc(d)+'" title="'+esc(allNext
              ? L("كل حملات المنصة دي موجودة في اليوم اللي بعده","All of this platform's campaigns are already on the next day")
              : L("رحّل كل حملات المنصة دي لليوم اللي بعده","Carry all of this platform's campaigns to the next day"))+'">'+
            (allNext?"✓":esc(L("الكل ←","All →")))+"</button>":"")+
          "</div></td>";
      }).join("")+"</tr>";
  });
  h+="</tbody><tfoot><tr><td class=\"rs-p\">"+
    '<button class="btn btn-s" data-a="editPlat">'+esc(L("+ منصة","+ Platform"))+"</button></td>"+
    '<td colspan="'+days.length+'"></td></tr></tfoot></table></div>';
  h+='<div class="hint" style="margin-top:12px">'+esc(L(
    "كل عمود يوم وكل صف منصة، زي شيتك. الأخضر = مكمّلة من اليوم اللي قبله · الأزرق = جديدة في اليوم ده. ",
    "Each column is a day and each row a platform, like your sheet. Green = carried from the previous day · blue = new that day. "))+
    esc(L("الترحيل: ← جنب الحملة بيرحّلها هي بس · «الكل ←» تحت الخانة بيرحّل حملات المنصة دي كلها لليوم اللي بعده · ↓ فوق العمود بيجيب كل حملات اليوم اللي قبله، وبعدين تشيل اللي مش عايزه بـ ✕. ترتيب المنصات: اسحب ⠿ لفوق أو لتحت أو دوس ▲▼.",
      "Carrying: ← next to a campaign carries just that one · “All →” under a cell carries all of that platform's campaigns to the next day · ↓ on a column pulls every campaign from the previous day, then drop what you don't want with ✕. Reorder platforms: drag ⠿ up or down, or press ▲▼."))+
    "</div>";
  return h;
}

ACT.rsNext=async t=>{
  const cid=rosterClient(), D=t.dataset.d, N=addDays(D,1), id=t.dataset.i, pid=t.dataset.p;
  const doc=JSON.parse(JSON.stringify(rosterGet(cid,N)));
  doc.byPlatform=doc.byPlatform||{};
  const a=doc.byPlatform[pid]||[];
  if(a.includes(id)) return toast(L("موجودة بالفعل في ","Already on ")+fdate(N));
  a.push(id); doc.byPlatform[pid]=a;
  if(await rosterSave(doc)){ toast(id+L(" اترحّلت لـ "," carried to ")+fdate(N)); render(); }
};
ACT.rsCarryCell=async t=>{
  const cid=rosterClient(), D=t.dataset.d, N=addDays(D,1), pid=t.dataset.p, q=(S.rf.q||"").trim();
  let src=rosterIds(cid,D,pid);
  if(q) src=src.filter(x=>String(x).indexOf(q)>=0);   // مع البحث: بيرحّل اللي ظاهر قدامك بس
  if(!src.length) return toast(L("مفيش حملات في الخانة دي","No campaigns in this cell"),true);
  const doc=JSON.parse(JSON.stringify(rosterGet(cid,N)));
  doc.byPlatform=doc.byPlatform||{};
  const a=doc.byPlatform[pid]||[], add=src.filter(x=>!a.includes(x));
  if(!add.length) return toast(L("كلها موجودة بالفعل في ","All already on ")+fdate(N));
  doc.byPlatform[pid]=a.concat(add);
  if(await rosterSave(doc)){
    toast(platById(pid).name+" · "+add.length+L(" حملة اترحّلت لـ "," carried to ")+fdate(N)); render(); }
};
CHG.rfQ=v=>{ S.rf.q=v; const e=$("#view"); if(e) e.innerHTML=wsBar()+headerFor()+renderView(); };

ACT.rsCarryDay=async t=>{
  const cid=rosterClient(), D=t.dataset.d, P=addDays(D,-1);
  const prev=rosterGet(cid,P);
  if(!Object.keys(prev.byPlatform||{}).length)
    return toast(L("مفيش حملات في اليوم اللي قبله","No campaigns on the previous day"),true);
  const doc=JSON.parse(JSON.stringify(rosterGet(cid,D)));
  doc.byPlatform=doc.byPlatform||{};
  let n=0;
  Object.keys(prev.byPlatform).forEach(p=>{
    if(S.rf.plat&&p!==S.rf.plat) return;
    const a=doc.byPlatform[p]||[];
    (prev.byPlatform[p]||[]).forEach(id=>{ if(!a.includes(id)){ a.push(id); n++; } });
    doc.byPlatform[p]=a;
  });
  if(await rosterSave(doc)){ toast(L("اترحّلت ","Carried ")+n+L(" حملة لـ "," campaigns to ")+fdate(D)); render(); }
};

ACT.rsStop=async t=>{

  const doc=JSON.parse(JSON.stringify(rosterGet(cid,D)));
  doc.byPlatform=doc.byPlatform||{};
  doc.byPlatform[t.dataset.p]=(doc.byPlatform[t.dataset.p]||[]).filter(x=>x!==t.dataset.i);

ACT.rsStart=async t=>{

  if(await rosterSave(doc)) render();
};

ACT.rsAddOk=async t=>{

/* ══════════ مقارنة أيام في نفس الساعة ══════════ */
function lcDays(sec){
  const base=secDay(sec);
  const d=(sec.days&&sec.days.length)? sec.days.slice() : [addDays(base,-1),addDays(base,-7)];
  return [base].concat(d.filter(x=>x!==base)).slice(0,6);
}
function lcMetrics(sec){
  return ((sec.metrics&&sec.metrics.length)? sec.metrics : ["spend","orders","revenue","roas"]).filter(metricByKey);
}
function lcValAt(day,ms,ov){ return stateAtOv(day,ms,ov); }
function secLiveCompare(sec){
  const ov=liveOv(sec), base=secDay(sec), days=lcDays(sec), mets=lcMetrics(sec);
  const mode=sec.cmpMode||"at";
  const pts=intraday(base,ov), lastMs=pts.length? pts[pts.length-1].ts-parseISO(base).getTime() : null;
  const hm=sec.atTime||(lastMs!=null? ftimeHM(parseISO(base).getTime()+lastMs) : nowHM());
  const [h1,h2]=(sec.win||"12:00-18:00").split("-");
  const msOf=t=>{ const p=String(t||"00:00").split(":"); return (+p[0]||0)*36e5+(+p[1]||0)*6e4; };
  const valsFor=day=>{
    if(mode==="win"){ const a=lcValAt(day,msOf(h1),ov), b=lcValAt(day,msOf(h2),ov);
      return (a&&b)? deltaVals(a,b) : null; }
    return lcValAt(day,msOf(hm),ov);
  };
  const rows=days.map(d=>({d:d,v:valsFor(d)})).filter(r=>r.v);
  const bv=rows.length&&rows[0].d===base? rows[0].v : null;
  const timeCtl='<span class="flab">'+esc(L("المقارنة","Compare"))+'</span>'+
    '<select class="sel lc-s" data-c="lcpMode" data-id="'+esc(sec.id)+'">'+
      [["at","لحد ساعة معينة","Up to a time"],["win","بين ساعتين","Between two times"]].map(x=>'<option value="'+x[0]+'"'+
        (mode===x[0]?" selected":"")+">"+esc(L(x[1],x[2]))+"</option>").join("")+"</select>"+
    (mode==="at"? '<input class="inp lc-s" type="time" data-c="lcpAt" data-id="'+esc(sec.id)+'" value="'+esc(hm)+'">'
      : '<input class="inp lc-s" type="time" data-c="lcpW1" data-id="'+esc(sec.id)+'" value="'+esc(h1)+'"><span class="flab">→</span>'+
        '<input class="inp lc-s" type="time" data-c="lcpW2" data-id="'+esc(sec.id)+'" value="'+esc(h2)+'">');
  const quick=[[-1,"امبارح","Yesterday"],[-2,"أول امبارح","2 days ago"],[-3,"٣ أيام","3 days ago"],[-7,"نفس اليوم الأسبوع اللي فات","Same day last week"]];
  const chips='<div class="chips" style="margin-bottom:10px"><span class="flab">'+esc(L("الأيام","Days"))+"</span>"+
    quick.map(q=>{ const d=addDays(base,q[0]); return '<button class="chip'+(days.indexOf(d)>=0?" on":"")+
      '" data-a="lcDay" data-id="'+esc(sec.id)+'" data-d="'+d+'">'+esc(L(q[1],q[2]))+"</button>"; }).join("")+
    '<button class="chip" data-a="lcPick" data-id="'+esc(sec.id)+'">'+esc(L("+ يوم من التقويم","+ Day from calendar"))+"</button>"+
    days.slice(1).filter(d=>!quick.some(q=>addDays(base,q[0])===d)).map(d=>'<button class="chip on" data-a="lcDay" data-id="'+
      esc(sec.id)+'" data-d="'+d+'">'+esc(fdate(d))+" ✕</button>").join("")+"</div>";
  if(rows.length<2) return card(esc(secTitle(sec)),timeCtl,chips+
    '<div class="empty" style="padding:22px">'+esc(L("محتاج لقطات في يومين على الأقل في الوقت ده.",
      "Needs snapshots on at least two days at this time."))+"</div>"+chartCtl(sec,{metrics:1,plats:1}));
  let t='<div class="tw"><table><thead><tr><th>'+esc(L("اليوم","Day"))+"</th>"+
    mets.map(k=>'<th class="n">'+esc(mkLabel(k))+"</th>").join("")+"</tr></thead><tbody>";
  rows.forEach((r,i)=>{
    t+="<tr"+(i===0?' class="tot"':"")+'><td><b>'+esc(fdate(r.d))+"</b> "+
      '<span class="conf">'+esc(AR_D[parseISO(r.d).getDay()]+(i===0?" · "+L("الأساس","Base"):""))+"</span></td>"+
      mets.map(k=>{ const m=metricByKey(k);
        return '<td class="n num">'+esc(fval(r.v[k],m,true))+
          (i>0&&bv?'<div class="lc-dl">'+deltaChip(bv[k],r.v[k],m)+"</div>":"")+"</td>"; }).join("")+"</tr>";
  });
  if(rows.length>2){
    const others=rows.slice(1), avg={};
    rawMetrics().forEach(m=>{ avg[m.key]=mean(others.map(r=>+r.v[m.key]||0)); });
    avg._gp=mean(others.map(r=>+r.v._gp||0)); avg.margin=others[0].v.margin;
    if(others[0].v._noMargin) avg._noMargin=1;
    const av=computeAll(avg);
    t+='<tr class="tot"><td><b>'+esc(L("متوسط الأيام دي","Average of those days"))+"</b></td>"+
      mets.map(k=>{ const m=metricByKey(k);
        return '<td class="n num">'+esc(fval(av[k],m,true))+(bv?'<div class="lc-dl">'+deltaChip(bv[k],av[k],m)+"</div>":"")+"</td>"; }).join("")+"</tr>";
  }
  t+="</tbody></table></div>";
  /* منحنى كل يوم لحد نفس الساعة */
  const k0=mets[0], m0=metricByKey(k0);
  const hours=[]; for(let x=1;x<=24;x++) hours.push(x);
  const cols=["var(--cyan)","var(--violet)","var(--amber)","var(--good)","var(--rose)","var(--info)"];
  const series=rows.map((r,i)=>({name:fdate(r.d),color:cols[i%cols.length],axis:0,area:i===0?undefined:false,
    pts:hours.map(x=>{ const v=lcValAt(r.d,x*36e5-6e4,ov); return v? v[k0] : null; })}));
  const chart=chPlot({type:sec.chart||"line",h:210,xlab:hours.map(x=>fhour(x%24)),series:series});
  return card(esc(secTitle(sec))+" · "+esc(fdateFull(base)),timeCtl+" "+ctlBtn(sec),
    chips+t+'<div style="margin-top:12px">'+chart+'</div><div class="legend" style="margin-top:8px">'+
    series.map(x=>'<span><i style="background:'+x.color+'"></i>'+esc(x.name)+"</span>").join("")+"</div>"+
    '<div class="hint" style="margin-top:8px">'+esc(mode==="win"
      ? L("الأرقام هنا زيادة الفترة اللي بين الساعتين في كل يوم.","These are the increase between the two times on each day.")
      : L("الأرقام تراكمية لحد الساعة دي في كل يوم — مقارنة عادلة.","Cumulative up to that time on each day — a fair comparison."))+"</div>"+
    chartCtl(sec,{metrics:1,plats:1,chart:"trend"}));
}
function ftimeHM(ts){ const d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }

const T_REMIND=[["","من غير تذكير","No reminder"],["0","في ميعادها","At the time"],["15","قبلها ١٥ دقيقة","15 min before"],
  ["60","قبلها ساعة","1 hour before"],["180","قبلها ٣ ساعات","3 hours before"],["1440","قبلها يوم","1 day before"]];
function taskTypes(){ const c=S.cfg.settings.taskTypes; return (c&&c.length)? c : T_TYPES_DEF; }
const tStatus=k=>T_STATUS.find(x=>x[0]===k)||T_STATUS[0];
const tPri=k=>T_PRI.find(x=>x[0]===k)||T_PRI[2];
function taskDueTs(t){ if(!t.due) return null;
  const hm=String(t.dueTime||"18:00").split(":");
  return parseISO(t.due).getTime()+(+hm[0]||0)*36e5+(+hm[1]||0)*6e4; }
function taskLate(t){ const ts=taskDueTs(t); return t.status!=="done"&&ts!=null&&ts<Date.now(); }
function taskToday(t){ return t.status!=="done"&&t.due===todayISO(); }
function tasksOpen(){ return (S.tasks||[]).filter(t=>t.status!=="done"); }
function tasksDueSoon(){ return tasksOpen().filter(t=>taskLate(t)||taskToday(t))
  .sort((a,b)=>(taskDueTs(a)||0)-(taskDueTs(b)||0)); }
async function taskSave(t){
  t.updatedAt=Date.now(); if(!t.createdBy&&ME.id) t.createdBy=ME.id;
  try{ if(t.private){ const c=Object.assign({},t); delete c.private; c.private=true; await PRIV.set(t.id,c); } else await Store.setDoc("tasks",t.id,t);
    S.tasks=(S.tasks||[]).filter(x=>x.id!==t.id).concat([t]); bumpVer(); scheduleReminders(); return true; }
  catch(e){ toast(L("المهمة مش اتحفظت","The task didn't save"),true); return false; }
}
function taskList(){
  const f=S.tf, q=(f.q||"").trim().toLowerCase();
  return (S.tasks||[]).filter(t=>{
    if(f.client&&t.clientId!==f.client) return false;
    if(f.type&&t.type!==f.type) return false;
    if(f.who&&(t.assignee||"")!==f.who) return false;
    if(!f.showDone&&t.status==="done"&&!(f.status==="done")) return false;
    if(f.status&&t.status!==f.status) return false;
    if(q&&[t.title,t.desc,t.type,t.assignee].join(" ").toLowerCase().indexOf(q)<0) return false;
    return true;
  }).sort((a,b)=>{
    const la=taskLate(a)?0:1, lb=taskLate(b)?0:1; if(la!==lb) return la-lb;
    const da=taskDueTs(a), db=taskDueTs(b);
    if(da!=null&&db!=null&&da!==db) return da-db;
    if((da==null)!==(db==null)) return da==null?1:-1;
    return T_PRI.findIndex(x=>x[0]===(a.pri||"normal"))-T_PRI.findIndex(x=>x[0]===(b.pri||"normal"));
  });
}

let REM_T=[];
function scheduleReminders(){
  REM_T.forEach(clearTimeout); REM_T=[];
  const now=Date.now();
  tasksOpen().forEach(t=>{
    if(t.remind===""||t.remind==null) return;
    const ts=taskDueTs(t); if(ts==null) return;
    const at=ts-(+t.remind||0)*60000;
    if(at>now&&at-now<12*36e5) REM_T.push(setTimeout(()=>fireReminder(t),at-now));
  });
}
function fireReminder(t){
  const msg=L("تذكير: ","Reminder: ")+(t.title||"")+(t.dueTime?" · "+t.dueTime:"");
  toast(msg);
  try{ if(window.Notification&&Notification.permission==="granted")
    new Notification(L("مرصد الميديا باينج","Media Desk"),{body:msg}); }catch(e){}
}

let USER=null;
const ME={id:null,isOwner:true,canEdit:true,email:null,role:"owner"};
const TEAM={members:{},invites:{},ownerId:null,presence:{},loaded:false};
const PROF={};
let CLAIMS=[], SCOPE=null, _cfgToast=false;
const ROLE_NAMES={owner:["المالك","Owner"],admin:["مدير","Admin"],member:["موظف","Member"],client:["عميل","Client"]};
function isAdmin(){ return ME.role==="owner"||ME.role==="admin"; }
function isMember(){ return ME.role==="member"; }
function isPending(){ return ME.role==="guest"||ME.role==="invited"||ME.role==="blocked"; }
function teamMembers(){ return Object.keys(TEAM.members).map(id=>Object.assign({id:id},TEAM.members[id])); }
function activeMembers(){ return teamMembers().filter(m=>m.status!=="disabled"); }
function peopleIds(){ const s=new Set(); if(TEAM.ownerId) s.add(TEAM.ownerId); activeMembers().filter(m=>m.role!=="client").forEach(m=>s.add(m.id)); if(ME.id&&!isClient()) s.add(ME.id); return [...s]; }
function roleOf(id){ if(id&&id===TEAM.ownerId) return "owner"; const m=TEAM.members[id]; return m? (m.role==="admin"?"admin":"member") : null; }
function roleName(r){ const x=ROLE_NAMES[r]; return x? L(x[0],x[1]) : ""; }
function pname(id){
  if(!id) return "";
  if(id==="all") return L("الكل","everyone");
  const p=PROF[id], m=TEAM.members[id];
  if(p&&p.name) return p.name;
  if(m&&m.email) return String(m.email).split("@")[0];
  if(id===ME.id) return L("أنت","You");
  if(id===TEAM.ownerId) return L("المالك","Owner");
  return L("عضو","Member");
}
function pcolor(id){ const p=PROF[id]; if(p&&p.color) return p.color;
  let h=0; String(id||"").split("").forEach(c=>{ h=(h*31+c.charCodeAt(0))%360; }); return "hsl("+h+" 55% 46%)"; }
function pav(id,sz){ sz=sz||30; const p=PROF[id];
  if(p&&p.avatarUrl) return '<img class="pav" src="'+esc(p.avatarUrl)+'" alt="" style="width:'+sz+'px;height:'+sz+'px">';
  return '<span class="pav" style="width:'+sz+'px;height:'+sz+'px;background:'+pcolor(id)+';font-size:'+Math.round(sz*.42)+'px">'+esc(pname(id).slice(0,1))+"</span>"; }

/* ── تخزين لحظي: السحابة (onSnapshot) أو المتصفح (للتجربة المحلية) ── */
const RT={
  _lk:"mbc.rt.v1", _subs:[],
  cloud(){ return STORE_MODE==="cloud"&&!!DB; },
  _all(){ try{ return JSON.parse(localStorage.getItem(this._lk)||"{}"); }catch(e){ return {}; } },
  _save(a){ try{ localStorage.setItem(this._lk,JSON.stringify(a)); }catch(e){ toast(L("المساحة المحلية اتملت","Local storage is full"),true); } },
  _fire(){ this._subs.slice().forEach(f=>{ try{ f(); }catch(e){} }); },
  async get(path){ if(this.cloud()){ const s=await DB.doc(path).get(); return s.exists? thaw(s.data()) : null; }
    const a=this._all(); return a[path]? JSON.parse(JSON.stringify(a[path])) : null; },
  async set(path,d){ if(this.cloud()) return DB.doc(path).set(d); const a=this._all(); a[path]=d; this._save(a); this._fire(); },
  async update(path,d){ if(this.cloud()) return DB.doc(path).update(d); const a=this._all(); a[path]=Object.assign(a[path]||{},d); this._save(a); this._fire(); },
  async del(path){ if(this.cloud()) return DB.doc(path).delete(); const a=this._all(); delete a[path]; this._save(a); this._fire(); },
  _match(d,w){ if(!w) return true; const v=d[w[0]]; return w[1]===">="? v>=w[2] : w[1]==="=="? v===w[2] : true; },
  async list(coll,w){
    if(this.cloud()){ let q=DB.collection(coll); if(w) q=q.where(w[0],w[1],w[2]);
      const s=await q.get(); return s.docs.map(d=>Object.assign({_id:d.id},thaw(d.data()))); }
    const a=this._all(), pre=coll+"/";
    return Object.keys(a).filter(k=>k.indexOf(pre)===0&&k.slice(pre.length).indexOf("/")<0&&this._match(a[k],w))
      .map(k=>Object.assign({_id:k.slice(pre.length)},a[k])); },
  on(coll,cb,w){
    if(this.cloud()){ let q=DB.collection(coll); if(w) q=q.where(w[0],w[1],w[2]);
      return q.onSnapshot(s=>cb(s.docs.map(d=>Object.assign({_id:d.id},thaw(d.data())))),e=>console.warn("rt",coll,e&&e.code)); }
    let last=""; const f=()=>this.list(coll,w).then(d=>{ const k=JSON.stringify(d); if(k===last) return; last=k; cb(d); });
    f(); this._subs.push(f); return ()=>{ this._subs=this._subs.filter(x=>x!==f); }; }
};
window.addEventListener("storage",e=>{ if(e.key===RT._lk) RT._fire(); });
setInterval(()=>{ if(!RT.cloud()&&RT._subs.length) RT._fire(); },4000);

    try{ return Object.values(JSON.parse(localStorage.getItem("mbc.priv.v1")||"{}")); }catch(e){ return []; } },
  async set(id,d){ if(this.cloud()) return DB.doc("data/users/"+ME.id+"/"+id).set(d);

};

/* ── الهوية والدور ── */
async function loadTeam(){
  const d=await RT.get("team/roster").catch(()=>null);
  TEAM.members=(d&&d.members)||{}; TEAM.invites=(d&&d.invites)||{}; TEAM.ownerId=(d&&d.ownerId)||null; TEAM.loaded=true;
}
async function saveTeam(){
  if(!isAdmin()) return false;
  try{ await RT.set("team/roster",{members:TEAM.members,invites:TEAM.invites,ownerId:TEAM.ownerId,updatedAt:Date.now()}); return true; }
  catch(e){ toast(L("الفريق مااتحفظش — لازم تكون متشارك في السيستم كـ Editor","The team didn't save — you need Editor access"),true); return false; }
}
function resolveRole(){
  if(ME.isOwner){ ME.role="owner"; return; }
  const m=ME.id&&TEAM.members[ME.id];
  if(m){ ME.role= m.status==="disabled"? "blocked" : (m.role==="admin"?"admin":m.role==="client"?"client":"member"); return; }
  if(ME.email&&TEAM.invites[String(ME.email).toLowerCase()]){ ME.role="invited"; return; }
  ME.role= ME.canEdit? "admin" : "guest";
}
async function initIdentity(){
  if(STORE_MODE==="cloud"&&window.claude&&typeof claude.use==="function"){
    try{ USER=await Promise.race([claude.use("user"),new Promise(r=>setTimeout(()=>r(null),6000))]); }catch(e){ USER=null; }
  }
  if(USER){ try{ const me=await USER.me(); ME.id=me.id||null; ME.isOwner=!!me.isOwner; ME.canEdit=!!me.canEdit; ME.email=me.email||null; }catch(e){} }
  else ME.id="local-owner";
  try{ await withTimeout(loadTeam(),10000,"meta"); }catch(e){}
  resolveRole();
  if(ME.role==="owner"&&ME.id&&TEAM.ownerId!==ME.id){ TEAM.ownerId=ME.id; saveTeam(); }
  if(USER&&ME.id&&!isPending()) RT.set("presence/"+ME.id,{at:Date.now()}).catch(()=>{});
  if(USER&&ME.id&&isPending()&&ME.role!=="blocked") RT.set("claims/"+ME.id,{at:Date.now(),email:ME.email||null}).catch(()=>{});
  if(isAdmin()&&USER) processClaims().catch(()=>{});
}
function applyScope(){
  if(!isMember()&&!isClient()){ SCOPE=null; return; }
  const m=TEAM.members[ME.id]||{}; SCOPE=new Set(m.clients||[]);
  if(!S.cfgClientsAll) S.cfgClientsAll=S.cfg.clients;
  S.cfg.clients=S.cfgClientsAll.filter(c=>SCOPE.has(c.id));
}
function inScope(cid){ return !SCOPE||(cid&&SCOPE.has(cid)); }
async function processClaims(){
  const cl=await RT.list("claims").catch(()=>[]);
  CLAIMS=cl.filter(c=>!TEAM.members[c._id]);
  let changed=false;
  CLAIMS.forEach(c=>{ const em=String(c.email||"").toLowerCase(), inv=em&&TEAM.invites[em];
    if(inv){ TEAM.members[c._id]={role:inv.role||"member",clients:inv.clients||[],title:inv.title||"",email:em,status:"active",addedAt:Date.now(),addedBy:ME.id};
      delete TEAM.invites[em]; changed=true; RT.del("claims/"+c._id).catch(()=>{}); } });
  if(changed){ await saveTeam(); CLAIMS=CLAIMS.filter(c=>!TEAM.members[c._id]); }
  if(BOOTED) render();
}
async function loadPresence(){
  if(!USER) return; const ps=await RT.list("presence").catch(()=>[]);
  TEAM.presence={}; ps.forEach(p=>{ TEAM.presence[p._id]=p.at; });
}
let _profT=0, _profBusy=false;
async function loadProfiles(){
  if(!USER||_profBusy) return false; _profBusy=true;
  try{
    const ids=[...new Set(peopleIds().concat(Object.keys(TEAM.members),CLAIMS.map(c=>c._id),chPeopleIds()))].filter(Boolean);
    if(!ids.length) return false;
    let ps={}; try{ ps=await USER.profiles(ids); }catch(e){ return false; }
    let ch=false;
    ids.forEach(id=>{ const p=ps[id]; if(!p) return; const o=PROF[id];
      if(!o||o.name!==p.name||o.avatarUrl!==p.avatarUrl||o.email!==(p.email||null)){
        PROF[id]={name:p.name||"",avatarUrl:p.avatarUrl||"",color:p.color||"",email:p.email||null}; ch=true; } });
    return ch;
  } finally { _profBusy=false; }
}
function schedProfiles(){ clearTimeout(_profT); _profT=setTimeout(()=>loadProfiles().then(ch=>{ if(ch) render(); }),350); }

/* ══════════ المجتمع (قنوات + رسائل مباشرة + منشن) ══════════ */
const CH={chans:{},msgs:{},unsub:{},cur:null,read:{},started:false,seen:new Set(),first:{},draft:{},pick:{},sending:false,seeded:false};
const CH_PURPOSE=[["general","عام","General"],["updates","تحديثات وإعلانات","Updates"],["fun","ترفيه ودردشة","Fun"],["client","خاصة بعميل","Client"],["custom","مخصص","Custom"]];
function chMonth(ts){ const d=new Date(ts); return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0"); }
function chPrevMonth(){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return chMonth(d.getTime()); }
function chCanSee(c){ if(!c||c.archived) return false; if(c.kind==="public") return true;
  const inIt=(c.members||[]).indexOf(ME.id)>=0; return c.kind==="dm"? inIt : (inIt||isAdmin()); }
function chCanPost(c){ return chCanSee(c)&&!READONLY&&!(c.announce&&!isAdmin()); }
function chList(){ return Object.values(CH.chans).filter(chCanSee).sort((a,b)=>(a.order||0)-(b.order||0)||(a.createdAt||0)-(b.createdAt||0)); }
function chMsgs(cid){ const out=[]; Object.values(CH.msgs[cid]||{}).forEach(d=>(d.msgs||[]).forEach(m=>out.push(Object.assign({by:d.by,cid:cid},m)))); return out.sort((a,b)=>a.at-b.at); }
function chMentionsMe(m){ const x=m.men||[]; return m.by!==ME.id&&(x.indexOf(ME.id)>=0||x.indexOf("all")>=0); }
function chUnread(cid){ const r=CH.read[cid]||0; return chMsgs(cid).filter(m=>m.at>r&&m.by!==ME.id).length; }
function chUnreadMen(cid){ const r=CH.read[cid]||0; const c=CH.chans[cid]; return chMsgs(cid).filter(m=>m.at>r&&(chMentionsMe(m)||(c&&c.kind==="dm"&&m.by!==ME.id))).length; }
function chTotalUnread(){ return chList().reduce((s,c)=>s+chUnread(c.id),0); }
function chTotalMen(){ return chList().reduce((s,c)=>s+chUnreadMen(c.id),0); }
function chPeopleIds(){ const s=new Set(); Object.values(CH.chans).forEach(c=>(c.members||[]).forEach(x=>s.add(x))); Object.keys(CH.msgs).forEach(cid=>Object.values(CH.msgs[cid]).forEach(d=>d.by&&s.add(d.by))); return [...s]; }
function chName(c){ if(!c) return ""; if(c.kind==="dm"){ const o=(c.members||[]).find(x=>x!==ME.id)||ME.id; return pname(o); } return c.name||L("قناة","Channel"); }
function chAudience(c){ if(!c) return []; return (c.kind==="public"? peopleIds() : (c.members||[])).filter(x=>x&&x!==ME.id); }
function chReady(){ return !!ME.id&&!isPending()&&!isClient()&&!(STORE_MODE==="cloud"&&!USER); }
async function chatStart(){
  if(CH.started||!chReady()) return; CH.started=true;
  try{ CH.read=(await PRIV.getDoc("chatread"))||{}; }catch(e){ CH.read={}; }
  RT.on("chat",docs=>{
    CH.chans={}; docs.forEach(d=>{ CH.chans[d._id]=Object.assign({},d,{id:d._id}); });
    chSyncSubs();
    if(isAdmin()&&!docs.length&&!CH.seeded){ CH.seeded=true; chSeed(); }
    chPaint(); schedProfiles();
  });
}
function chSyncSubs(){
  const want=new Set(chList().slice(0,50).map(c=>c.id)), from=chPrevMonth();
  Object.keys(CH.unsub).forEach(cid=>{ if(!want.has(cid)){ try{ CH.unsub[cid](); }catch(e){} delete CH.unsub[cid]; delete CH.msgs[cid]; } });
  want.forEach(cid=>{ if(CH.unsub[cid]) return; CH.first[cid]=true;
    CH.unsub[cid]=RT.on("chat/"+cid+"/m",docs=>chOnMsgs(cid,docs),["month",">=",from]); });
}
function chOnMsgs(cid,docs){
  const map={}; docs.forEach(d=>{ map[d._id]=d; }); CH.msgs[cid]=map;
  const all=chMsgs(cid), first=CH.first[cid]; CH.first[cid]=false;
  all.forEach(m=>{ if(CH.seen.has(m.id)) return; CH.seen.add(m.id); if(first||m.by===ME.id) return;
    const c=CH.chans[cid]; if(S.view==="chat"&&CH.cur===cid&&!document.hidden) return;
    if(chMentionsMe(m)||(c&&c.kind==="dm")) chNotify(c,m); });
  if(S.view==="chat"&&CH.cur===cid&&!document.hidden) chMarkRead(cid);
  chPaint(); schedProfiles();
}
function chNotify(c,m){
  const who=pname(m.by), where=c&&c.kind==="dm"? L("رسالة من ","Message from ")+who : who+L(" عمل لك منشن في #"," mentioned you in #")+chName(c);
  toast(where);
  try{ if(window.Notification&&Notification.permission==="granted") new Notification("GADLYTICS",{body:where+": "+chPlain(m.text).slice(0,90)}); }catch(e){}
}
let _rdT;
function chMarkRead(cid,at){
  const last=chMsgs(cid).reduce((s,m)=>Math.max(s,m.at),0); const v=Math.max(CH.read[cid]||0,at||0,last);
  if(v===(CH.read[cid]||0)) return; CH.read[cid]=v;
  clearTimeout(_rdT); _rdT=setTimeout(()=>{ PRIV.setDoc("chatread",Object.assign({},CH.read)).catch(()=>{}); },1500);
}
async function chSeed(){
  const now=Date.now(), mk=(id,o,i)=>RT.set("chat/"+id,Object.assign({kind:"public",members:[],createdBy:ME.id,createdAt:now+i,lastAt:0,order:i},o));
  try{ await mk("general",{name:"عام",purpose:"general",desc:"كلام الشغل اليومي لكل الفريق"},0);
       await mk("updates",{name:"التحديثات",purpose:"updates",desc:"إعلانات وتحديثات من الإدارة — الأدمن بس بيكتب",announce:true},1);
       await mk("fun",{name:"ترفيه",purpose:"fun",desc:"دردشة وفواصل خفيفة"},2); }catch(e){}
}
function chEncode(raw){
  let text=raw; const men=new Set();
  Object.keys(CH.pick).sort((a,b)=>b.length-a.length).forEach(label=>{ const id=CH.pick[label];
    if(text.indexOf("@"+label)>=0){ text=text.split("@"+label).join("<@"+id+">"); men.add(id); } });
  text=text.replace(/@(الكل|all|everyone)(?=\s|$)/g,()=>{ men.add("all"); return "<@all>"; });
  return {text:text,men:[...men]};
}
function chPlain(t){ return String(t||"").replace(/<@([A-Za-z0-9_\-.~:+]+)>/g,(m,id)=>"@"+pname(id)); }
function chRender(t){
  return esc(t).replace(/&lt;@([A-Za-z0-9_\-.~:+]+)&gt;/g,(m,id)=>'<span class="mn'+(id===ME.id||id==="all"?" me":"")+'">@'+esc(pname(id))+"</span>").replace(/\n/g,"<br>");
}
async function chSend(){
  const ta=$("#chIn"); if(!ta||CH.sending) return; const raw=ta.value.trim(); if(!raw) return;
  const c=CH.chans[CH.cur]; if(!c||!chCanPost(c)) return;
  const enc=chEncode(raw), m={id:"m"+Date.now().toString(36)+uid().slice(0,4),at:Date.now(),text:enc.text.slice(0,4000),men:enc.men};
  const mon=chMonth(m.at), docs=CH.msgs[c.id]||(CH.msgs[c.id]={});
  let part=0, did=ME.id+"__"+mon;
  while(docs[did]&&JSON.stringify(docs[did]).length>200000){ part++; did=ME.id+"__"+mon+"_"+part; }
  const body={by:ME.id,month:mon,msgs:((docs[did]&&docs[did].msgs)||[]).concat([m])};
  docs[did]=body; CH.seen.add(m.id); ta.value=""; CH.draft[c.id]=""; CH.pick={}; chPopClose();
  CH.sending=true; chPaint(true);
  try{ await RT.set("chat/"+c.id+"/m/"+did,body); RT.update("chat/"+c.id,{lastAt:m.at,lastBy:ME.id}).catch(()=>{}); chMarkRead(c.id,m.at); }
  catch(e){ ta.value=raw; toast(e&&e.code==="quota_exceeded"? L("مساحة الرسايل اتملت — الأدمن يمسح الرسايل القديمة من الفريق","Message storage is full — an admin should clear old messages") : L("الرسالة مااتبعتتش","Message not sent"),true); }
  CH.sending=false;
}
/* قايمة المنشن */
let CHPOP=null;
function chPopClose(){ CHPOP=null; const p=$("#chPop"); if(p) p.innerHTML=""; }
function chPopUpdate(){
  const ta=$("#chIn"), p=$("#chPop"); if(!ta||!p) return;
  const pre=ta.value.slice(0,ta.selectionStart), mt=pre.match(/@([^\s@]{0,30})$/);
  if(!mt){ chPopClose(); return; }
  const q=mt[1].toLowerCase(), c=CH.chans[CH.cur];
  let list=chAudience(c).map(id=>({id:id,n:pname(id)})).filter(x=>!q||x.n.toLowerCase().indexOf(q)>=0).slice(0,7);
  if(c&&c.kind!=="dm"&&(!q||"الكل all".indexOf(q)>=0)) list.push({id:"all",n:L("الكل","everyone")});
  CHPOP={q:mt[1],list:list};
  p.innerHTML=list.length? '<div class="ch-pop">'+list.map((x,i)=>'<button class="ch-pi'+(i===0?" on":"")+'" data-a="chPick" data-id="'+esc(x.id)+'">'+
    (x.id==="all"?'<span class="pav" style="width:24px;height:24px;background:var(--violet);font-size:12px">@</span>':pav(x.id,24))+"<span>"+esc(x.n)+"</span>"+
    (x.id!=="all"&&roleOf(x.id)?'<small>'+esc(roleName(roleOf(x.id)))+"</small>":"")+"</button>").join("")+"</div>" : "";
}
function chPickId(id){
  const ta=$("#chIn"); if(!ta||!CHPOP) return;
  const label=id==="all"? "الكل" : pname(id); if(id!=="all") CH.pick[label]=id;
  const pos=ta.selectionStart, pre=ta.value.slice(0,pos).replace(/@([^\s@]{0,30})$/,"@"+label+" ");
  ta.value=pre+ta.value.slice(pos); ta.focus(); ta.selectionStart=ta.selectionEnd=pre.length; chPopClose();
}
ACT.chPick=t=>chPickId(t.dataset.id);
ACT.chSend=()=>chSend();
ACT.chOpen=t=>{ CH.cur=t.dataset.id; chMarkRead(CH.cur); if(S.view!=="chat"){ S.view="chat"; render(); } else chPaint(true, true); };
ACT.chGo=t=>{ CH.cur=t.dataset.id; S.view="chat"; chMarkRead(CH.cur); render(); };
ACT.chNotifyOn=async()=>{ try{ if(window.Notification){ const r=await Notification.requestPermission(); toast(r==="granted"?L("الإشعارات اشتغلت","Notifications on"):L("المتصفح مامسمحش بالإشعارات","The browser didn't allow notifications"),r!=="granted"); } }catch(e){ toast(L("الإشعارات مش متاحة هنا","Notifications aren't available here"),true); } };
document.addEventListener("keydown",e=>{
  if(!e.target||e.target.id!=="chIn") return;
  if(e.key==="Escape"&&CHPOP){ chPopClose(); return; }
  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault();
    if(CHPOP&&CHPOP.list.length){ chPickId(CHPOP.list[0].id); return; } chSend(); }
});
document.addEventListener("input",e=>{ if(e.target&&e.target.id==="chIn"){ CH.draft[CH.cur]=e.target.value; chPopUpdate(); } });

function chSideHTML(){
  const list=chList(), chans=list.filter(c=>c.kind!=="dm"), dms=list.filter(c=>c.kind==="dm").sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));
  const item=c=>{ const u=chUnread(c.id), mn=chUnreadMen(c.id);
    return '<button class="ch-it'+(c.id===CH.cur?" on":"")+(u?" un":"")+'" data-a="chOpen" data-id="'+esc(c.id)+'">'+

S.tv=Object.assign({view:"list",group:"status",who:"",client:"",project:"",pri:"",due:"",q:"",showDone:false,cal:todayISO().slice(0,7),tl:null},lsGet("mbc.tv",{}));

function taskSort(a,b){ const la=taskLate(a)?0:1, lb=taskLate(b)?0:1; if(la!==lb) return la-lb;
  const da=taskDueTs(a), db=taskDueTs(b); if(da!=null&&db!=null&&da!==db) return da-db; if((da==null)!==(db==null)) return da==null?1:-1;
  return T_PRI.findIndex(x=>x[0]===(a.pri||"normal"))-T_PRI.findIndex(x=>x[0]===(b.pri||"normal")); }
function tvList(ignoreDone){
  const f=S.tv, q=(f.q||"").trim().toLowerCase(), t0=todayISO(), wk=addDays(t0,7);
  return (S.tasks||[]).filter(t=>{
    if(!ignoreDone&&!f.showDone&&t.status==="done") return false;
    if(f.who==="me"&&!(t.assigneeId===ME.id||t.private)) return false;
    if(f.who&&f.who!=="me"&&t.assigneeId!==f.who) return false;
    if(f.client&&t.clientId!==f.client) return false;
    if(f.project&&(t.project||"")!==f.project) return false;
    if(f.pri&&(t.pri||"normal")!==f.pri) return false;
    if(f.due==="late"&&!taskLate(t)) return false;
    if(f.due==="today"&&t.due!==t0) return false;
    if(f.due==="week"&&!(t.due&&t.due>=t0&&t.due<=wk)) return false;
    if(f.due==="none"&&t.due) return false;
    if(q&&[t.title,t.desc,t.project,(t.tags||[]).join(" "),t.type].join(" ").toLowerCase().indexOf(q)<0) return false;
    return true; }).sort(taskSort);
}
function tvProjects(){ const s={}; (S.tasks||[]).forEach(t=>{ if(t.project) s[t.project]=(s[t.project]||0)+(t.status!=="done"?1:0); }); return s; }
function tvDueBucket(t){ const t0=todayISO(); if(!t.due) return ["none",L("من غير ميعاد","No date")]; if(taskLate(t)) return ["late",L("متأخرة","Overdue")];
  if(t.due===t0) return ["today",L("النهارده","Today")]; if(t.due===addDays(t0,1)) return ["tmrw",L("بكرة","Tomorrow")];
  if(t.due<=addDays(t0,7)) return ["week",L("الأسبوع ده","This week")]; return ["later",L("بعدين","Later")]; }
function tvGroups(list){
  const g=S.tv.group, groups=[], idx={};
  const put=(k,label,col,t)=>{ if(!idx[k]){ idx[k]={k:k,label:label,col:col,items:[]}; groups.push(idx[k]); } if(t) idx[k].items.push(t); };
  if(g==="status") T_STATUS.forEach(s=>put(s[0],L(s[1],s[2]),s[3]));
  if(g==="due") [["late",L("متأخرة","Overdue"),"var(--bad)"],["today",L("النهارده","Today"),"var(--amber)"],["tmrw",L("بكرة","Tomorrow")],["week",L("الأسبوع ده","This week")],["later",L("بعدين","Later")],["none",L("من غير ميعاد","No date")]].forEach(x=>put(x[0],x[1],x[2]));
  if(g==="pri") T_PRI.forEach(p=>put(p[0],L(p[1],p[2]),p[3]));
  list.forEach(t=>{

function rtDue(tp,d){ const dt=parseISO(d), dow=dt.getDay();
  if(tp.freq==="daily") return true; if(tp.freq==="weekdays") return dow>=0&&dow<=4;
  if(tp.freq==="weekly") return dow===(+tp.dow||0); if(tp.freq==="monthly") return dt.getDate()===Math.min(+tp.dom||1,new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()); return false; }

async function rtRun(){
  if(isPending()||isClient()||READONLY) return; const d=todayISO(); let n=0;
  for(const tp of (S.rtpl||[])){ if(!tp.active||!rtMine(tp)||!rtDue(tp,d)||(tp.from&&d<tp.from)) continue;
    const id="rt_"+tp.id+"_"+d.replace(/-/g,""); if((S.tasks||[]).some(x=>x.id===id)) continue;
    try{ if(RT.cloud()){ const ex=await RT.get("tasks/"+id); if(ex){ S.tasks.push(ex); continue; } } }catch(e){}
    const o={id:id,title:tp.title,desc:tp.desc||"",status:"todo",pri:tp.pri||"normal",assigneeId:tp.assigneeId||null,clientId:tp.clientId||null,project:tp.project||"",type:tp.type||"",
      due:d,dueTime:tp.time||"",remind:tp.time?"15":"",recurId:tp.id,createdAt:Date.now(),createdBy:tp.createdBy||ME.id,activity:[{at:Date.now(),by:tp.createdBy||ME.id,w:"created",x:"🔁"}]};
    if(await taskSave(o)) n++; }
  if(n&&BOOTED){ toast(L("اتعمل "+n+" مهمة من المهام المتكررة النهارده",n+" recurring task(s) created for today")); render(); }
}

function phasesFor(n,a,z,cname){ const D=plDays(a,z);

  if(n==="2"){ const m=addDays(a,Math.floor(D/2)-1); return [mkPhase(cname+" 1",a,m,50),mkPhase(cname+" 2",addDays(m,1),z,50)]; }
  return [mkPhase(cname,a,z,100)]; }

  const cs=ns.map((n,i)=>({id:sid(),name:n,from:a,to:z,pct:+(100/ns.length).toFixed(2),phases:phasesFor(nph,a,z,n)}));

CHG.pl=(v,t)=>{ const p=plCur(); if(!p||!plCanEdit(p)) return; let val=v; if(t.dataset.t==="n") val=numIn(v); const path=t.dataset.p;
  // تواريخ المرحلة/الحملة بتمشي على السطور اللي كانت ماشية على نفس التاريخ
  let m=path.match(/^campaigns\.(\d+)\.phases\.(\d+)\.(from|to)$/);
  if(m){ const ph=p.campaigns[+m[1]].phases[+m[2]], old=ph[m[3]]; (ph.blocks||[]).forEach(b=>(b.lines||[]).forEach(l=>{ if(l[m[3]]===old) l[m[3]]=null; })); }
  m=path.match(/^campaigns\.(\d+)\.(from|to)$/);
  if(m){ const c=p.campaigns[+m[1]], old=c[m[2]]; (c.phases||[]).forEach(ph=>{ if(ph[m[2]]===old){ (ph.blocks||[]).forEach(b=>(b.lines||[]).forEach(l=>{ if(l[m[2]]===old) l[m[2]]=null; })); ph[m[2]]=val; } }); }
  m=path.match(/^(campaigns\.\d+\.phases\.\d+)\.blocks\.\d+\.lines\.\d+\.(from|to)$/);
  if(m){ const ph=getPath(p,m[1]); if(ph&&ph[m[2]]===val) val=null; }
  setPath(p,path,val); plTouch(); render(); };
CHG.plKpi=(v,t)=>{ const p=plCur(); if(!p||!plCanEdit(p)) return; const n=numIn(v), b=+t.dataset.b||0; setPath(p,t.dataset.p,n>0&&b>0? b/n : null); plTouch(); render(); };

function csvParse(txt){ const rows=[]; let row=[], f="", q=false; for(let i=0;i<txt.length;i++){ const ch=txt[i];
  if(q){ if(ch==='"'){ if(txt[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
  else if(ch==='"') q=true; else if(ch===","){ row.push(f); f=""; } else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&txt[i+1]==="\n") i++; row.push(f); rows.push(row); row=[]; f=""; } else f+=ch; }
  if(f!==""||row.length){ row.push(f); rows.push(row); } return rows.filter(r=>r.some(x=>x!=="")); }

const SYNC_SRV={meta:"Meta Ads",tiktok:"TikTok for Business"};

let MCP_NS=null, MCP_P=null;
function mcpGet(){ if(!MCP_P) MCP_P=(async()=>{ try{ if(window.claude&&typeof claude.use==="function") MCP_NS=await claude.use("mcp"); }catch(e){ MCP_NS=null; } return MCP_NS; })(); return MCP_P; }

function hasLinks(c){ const l=clientLinks(c); return !!(l.meta||l.tiktok); }

const numOf=x=>{ const v=+(x&&typeof x==="object"&&x.value!=null?x.value:x); return isFinite(v)?v:0; };
async function mcpCall(mcp,srv,tool,input){
  try{ return await mcp.callTool(srv,tool,input,{cache:false}); }
  catch(e){ if(e&&e.retryable){ await new Promise(r=>setTimeout(r,Math.min(e.retryAfterMs||0,8000)+800+Math.random()*1200)); return await mcp.callTool(srv,tool,input,{cache:false}); } throw e; }
}
async function pullMeta(mcp,act){
  const rows=[]; let cursor=null, pages=0;
  do{
    const input={ad_account_id:String(act).replace(/^act_/,"").trim(),level:"campaign",date_preset:"today",object_state:"live",limit:200,
      fields:["name","amount_spent","impressions","clicks","link_click","omni_view_content","omni_add_to_cart","omni_initiated_checkout","omni_purchase","omni_purchase_values"]};
    if(cursor) input.cursor=cursor;
    const r=await mcpCall(mcp,SYNC_SRV.meta,"ads_get_ad_entities",input);
    const p=(r&&r.payload)||{}; let list=p.ad_entities; if(typeof list==="string"){ try{ list=JSON.parse(list); }catch(e){ list=[]; } }
    (Array.isArray(list)?list:[]).forEach(e=>{ const sp=numOf(e.amount_spent), im=numOf(e.impressions); if(!(sp>0)&&!(im>0)) return;
      rows.push({campaign:e.name||e.id,values:{spend:sp,impressions:im,clicks:numOf(e.link_click!=null?e.link_click:e.clicks),view_content:numOf(e.omni_view_content),
        add_to_cart:numOf(e.omni_add_to_cart),checkouts:numOf(e.omni_initiated_checkout),orders:numOf(e.omni_purchase),revenue:numOf(e.omni_purchase_values)}}); });
    cursor=p.pagination&&p.pagination.next_cursor;
  }while(cursor&&++pages<5);
  return rows;
}
async function pullTikTok(mcp,adv){
  const d=todayISO();
  const r=await mcpCall(mcp,SYNC_SRV.tiktok,"report_integrated_get",{advertiser_id:String(adv).trim(),report_type:"BASIC",data_level:"AUCTION_CAMPAIGN",dimensions:["campaign_id"],
    metrics:["campaign_name","spend","impressions","clicks","page_browse_view","initiate_checkout","complete_payment","complete_payment_roas"],start_date:d,end_date:d,page_size:1000});
  const p=(r&&r.payload)||{};
  if(p.code!=null&&+p.code!==0) throw {code:"tool_error",message:p.message||("TikTok "+p.code)};
  return (((p.data||{}).list)||[]).map(x=>x.metrics||{}).filter(m=>+m.spend>0||+m.impressions>0).map(m=>({campaign:m.campaign_name||"TikTok",
    values:{spend:+m.spend||0,impressions:+m.impressions||0,clicks:+m.clicks||0,view_content:+m.page_browse_view||0,checkouts:+m.initiate_checkout||0,
      orders:+m.complete_payment||0,revenue:Math.round((+m.complete_payment_roas||0)*(+m.spend||0)*100)/100}}));
}
async function saveSnapBatch(date,cid,pid,rows,ts){
  const id=cid+"__"+date; let doc=await Store.getEntryDoc(id); if(!doc) doc={clientId:cid,date:date,rows:{}}; if(!doc.rows) doc.rows={};
  rows.forEach(r=>{ const k=pid+"|"+(r.campaign||""); const row=doc.rows[k]||{platformId:pid,campaign:r.campaign||"",snaps:[]};
    const last=row.snaps[row.snaps.length-1]; const v=Object.assign({},last?last.v:{},r.values);
    if(last&&Math.abs(last.ts-ts)<60000) row.snaps[row.snaps.length-1]={ts:ts,v:v}; else { row.snaps.push({ts:ts,v:v}); row.snaps.sort((a,b)=>a.ts-b.ts); }
    doc.rows[k]=row; });
  doc.updatedAt=Date.now(); await Store.setEntryDoc(id,doc); DOCS[id]=doc;
}
function syncErr(e,srv){ const c=e&&e.code;

  if(c==="not_in_manifest"||c==="consent_required") return L("المنصة مش مسموحلها تستخدم «"+srv+"» — دوس «ابدأ سناب شوت» تاني ووافق","Not allowed to use “"+srv+"” — press again and allow");
  if(c==="selection_required") return L("عندك أكتر من حساب «"+srv+"» — اختار واحد من رسالة Claude","More than one “"+srv+"” connected — pick one in Claude's prompt");

  if(c==="server_unavailable"||c==="rate_limited") return L("«"+srv+"» مش بيرد دلوقتي — جرّب كمان دقيقة","“"+srv+"” isn't responding — try again in a minute");

}

  if(!cls.length){ S.view="admin"; S.setupTab="links"; render(); return toast(L("اربط حسابات العميل الأول من «الربط التلقائي»","Link the client's accounts first"),true); }

function ssChart(day){   // صعود ونزول اليوم: صرف وإيراد كل فترة + خط الـ ROAS

  const W=1300,H=230,P={l:56,r:50,t:14,b:28}, n=v.length, bw=(W-P.l-P.r)/n, mx=Math.max(1,...v.map(x=>Math.max(x.s,x.r))), mr=Math.max(1,...v.map(x=>x.ro||0));
  const y=x=>H-P.b-(x/mx)*(H-P.t-P.b), yr=x=>H-P.b-(x/mr)*(H-P.t-P.b), cx=i=>P.l+bw*i+bw/2;

  v.forEach((x,i)=>{ const w=Math.max(3,bw*0.32); s+='<rect x="'+(cx(i)-w-1)+'" y="'+y(x.s)+'" width="'+w+'" height="'+(H-P.b-y(x.s))+'" rx="2" class="ss-bs"><title>'+esc(ssTime(x.t)+" · "+L("صرف ","spend ")+fnum(x.s,0))+'</title></rect><rect x="'+(cx(i)+1)+'" y="'+y(x.r)+'" width="'+w+'" height="'+(H-P.b-y(x.r))+'" rx="2" class="ss-br"><title>'+esc(ssTime(x.t)+" · "+L("إيراد ","revenue ")+fnum(x.r,0))+"</title></rect>";

  const pts=v.map((x,i)=>x.ro==null?null:cx(i)+","+yr(x.ro)).filter(Boolean); if(pts.length>1) s+='<polyline points="'+pts.join(" ")+'" class="ss-lr"/>';

function ssMin(t){ const p=new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Riyadh"}).split(":"); return (+p[0])*60+(+p[1]); }
