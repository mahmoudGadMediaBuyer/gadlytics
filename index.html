<style>.ex-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.ex-ctl .fld{display:flex;flex-direction:column;gap:4px;font-size:12px}.ex-q{flex:1;min-width:200px}.ex-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;width:100%}.ex-kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0}.ex-t tr.on td{background:color-mix(in srgb,var(--cyan) 10%,transparent)}.ex-k{max-width:340px;white-space:normal;word-break:break-word}.ex-tot td{font-weight:800}.ex-up{color:var(--good,#12a150)}.ex-dn{color:var(--bad,#d23)}.sb-ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}.sb-ctl .fld{display:flex;flex-direction:column;gap:4px;font-size:12px;min-width:220px}.sb-grid{direction:rtl;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}.sb-c{border-radius:14px;padding:14px}.sb-h{font-weight:800;font-size:15px}.sb-h span{font-size:11px;font-weight:700}.sb-l{font-size:12px;margin-top:8px}.sb-v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}.sb-r{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:13px}.sb-r b{font-weight:800}.sb-tot{grid-column:span 1}.ex-pick{width:100%;border-top:1px solid var(--line,#e5e7eb);padding-top:10px}.ex-pick .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ex-drill{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}</style>

.ss-kl{font-size:12px;opacity:.75}.ss-kv{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0}.ss-kf{font-size:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.ss-d{font-weight:800}
.ss-cmp{margin-bottom:14px}.ss-ct{font-weight:800;margin:4px 0 8px}.ss-ct2 td,.ss-ct2 th{padding:8px 10px}.ss-today td{font-weight:800;box-shadow:inset 0 0 0 999px rgba(70,95,255,.10)}
.ss-wrap{border-radius:12px;border:1px solid var(--line,rgba(128,128,128,.22))}
.ss-t{border-collapse:separate;border-spacing:0;font-size:13.5px;width:100%;direction:rtl}
.ss-t th,.ss-t td{padding:9px 10px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line,rgba(128,128,128,.14))}
.ss-t thead th{font-size:11.5px;font-weight:700;position:sticky;top:0}
.ss-t thead tr:first-child th{font-size:13px;font-weight:800;padding:8px}
.ss-t th small{opacity:.7}
.ss-t tbody tr:nth-child(even) td{background-image:linear-gradient(rgba(128,128,128,.06),rgba(128,128,128,.06))}
.ss-t tbody tr:hover td{background-image:linear-gradient(rgba(70,95,255,.10),rgba(70,95,255,.10))}
.ss-t .gs{border-inline-start:2px solid rgba(128,128,128,.35)}
.ss-t .ss-time{font-weight:800;text-align:start;min-width:84px}
.ss-t .g-meta{background-color:rgba(55,138,221,.10)} .ss-t th.g-meta{background:#E6F1FB;color:#0C447C}
.ss-t .g-tiktok{background-color:rgba(212,83,126,.09)} .ss-t th.g-tiktok{background:#FBEAF0;color:#72243E}
.ss-t .g-snap{background-color:rgba(239,159,39,.10)} .ss-t th.g-snap{background:#FAEEDA;color:#633806}
.ss-t .g-org{background-color:rgba(29,158,117,.07)} .ss-t th.g-org{background:#E1F5EE;color:#085041}
.ss-t .g-tot{background-color:rgba(83,74,183,.16);font-weight:700} .ss-t th.g-tot{background:#EEEDFE;color:#26215C}
.ss-ro{font-weight:800}.ss-g{color:#1D9E75}.ss-b{color:#E24B4A}.ss-m{opacity:.7}.ss-z{opacity:.35}
.ss-best td{box-shadow:inset 0 0 0 999px rgba(29,158,117,.16)}.ss-worst td{box-shadow:inset 0 0 0 999px rgba(226,75,74,.14)}

.ss-legend .ss-best{background:rgba(29,158,117,.16);color:#1D9E75}.ss-legend .ss-worst{background:rgba(226,75,74,.14);color:#E24B4A}
.ss-chw{margin-top:16px}.ss-ch{width:100%;height:auto;max-height:260px;display:block}.ss-gl{stroke:rgba(128,128,128,.2)}.ss-ax{font-size:11px;fill:currentColor;opacity:.6}

.ss-lg{display:flex;gap:14px;font-size:12px;margin-bottom:4px}.ss-lg i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}.ss-lg i.ss-bs{background:#B4B2A9}.ss-lg i.ss-br{background:#7F77DD}.ss-lg i.ss-lr{background:#EF9F27;height:3px}
.sch{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;margin:12px 0;border-radius:10px;background:rgba(70,95,255,.08)}.sch-l{font-size:13px;margin-inline-end:auto}.sch-l b{font-size:18px;font-variant-numeric:tabular-nums;margin:0 4px}.sch-f{font-size:12.5px;display:flex;gap:6px;align-items:center}

<style>
:root{
  /* ——— الفاتح ——— */
  --ground-0:#F4F6FC; --ground-1:#FFFFFF; --ground-2:#EDF1FA;
  --glass:rgba(255,255,255,.86); --glass-2:rgba(255,255,255,1);
  --line:rgba(23,37,84,.13); --line-2:rgba(23,37,84,.24);
  --ink:#131A32; --ink-2:#4A5573; --ink-3:#67718F;
  --grid:rgba(23,37,84,.10); --shadow:0 1px 2px rgba(23,37,84,.06),0 8px 24px rgba(23,37,84,.06);
  --glow:0;
  --bg-a:radial-gradient(1100px 620px at 78% -8%, rgba(8,145,178,.10), transparent 62%);
  --bg-b:radial-gradient(900px 560px at 12% 4%, rgba(124,58,237,.09), transparent 60%);
  --bg-c:linear-gradient(180deg,#FBFCFF 0%,#F4F6FC 46%,#EEF2FB 100%);
  --cyan:#0E8FA8; --teal:#0D9488; --violet:#7C3AED; --amber:#C2740A; --rose:#DB2777; --lime:#4D7C0F;
  --good:#0D9488; --warn:#C2740A; --bad:#DB2777; --info:#4F46E5; --orange:#C2410C;
  --r:16px; --r-s:10px;
  --f-ui:"Cairo",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --f-num:"Cairo",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground-0:#070B1A; --ground-1:#0B1226; --ground-2:#101a38;
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.075);
  --line:rgba(148,176,255,.16); --line-2:rgba(148,176,255,.30);
  --ink:#EDF1FF; --ink-2:#B4C0E2; --ink-3:#93A0C4;
  --grid:rgba(148,176,255,.11); --shadow:0 1px 2px rgba(0,0,0,.4);
  --glow:1;
  --bg-a:radial-gradient(1100px 620px at 78% -8%, rgba(34,211,238,.13), transparent 62%);
  --bg-b:radial-gradient(900px 560px at 12% 4%, rgba(167,139,250,.12), transparent 60%);
  --bg-c:linear-gradient(180deg,#0A1024 0%,#070B1A 46%,#080D20 100%);
  --cyan:#22D3EE; --teal:#2DD4BF; --violet:#A78BFA; --amber:#FBBF24; --rose:#FB7185; --lime:#A3E635;
  --good:#2DD4BF; --warn:#FBBF24; --bad:#FB7185; --info:#818CF8; --orange:#FB923C;
}}
:root[data-theme="dark"]{
  --ground-0:#070B1A; --ground-1:#0B1226; --ground-2:#101a38;
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.075);
  --line:rgba(148,176,255,.16); --line-2:rgba(148,176,255,.30);
  --ink:#EDF1FF; --ink-2:#B4C0E2; --ink-3:#93A0C4;
  --grid:rgba(148,176,255,.11); --shadow:0 1px 2px rgba(0,0,0,.4);
  --glow:1;
  --bg-a:radial-gradient(1100px 620px at 78% -8%, rgba(34,211,238,.13), transparent 62%);
  --bg-b:radial-gradient(900px 560px at 12% 4%, rgba(167,139,250,.12), transparent 60%);
  --bg-c:linear-gradient(180deg,#0A1024 0%,#070B1A 46%,#080D20 100%);
  --cyan:#22D3EE; --teal:#2DD4BF; --violet:#A78BFA; --amber:#FBBF24; --rose:#FB7185; --lime:#A3E635;
  --good:#2DD4BF; --warn:#FBBF24; --bad:#FB7185; --info:#818CF8; --orange:#FB923C;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--ground-0);
  background-image:var(--bg-a),var(--bg-b),var(--bg-c);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--f-ui); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
.num,input[type=number],table td.n,.kpi-v,.chip-d{font-family:var(--f-num);
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"lnum" 1;
  direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;font-weight:800;line-height:1.3;letter-spacing:-.2px}
.card-t,.act-t,.sec-nm,.brand-t,.wsname,.ins-t,.chtip-h,.kpi-v,th{font-weight:700}
a{color:var(--cyan)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.rail{
  border-inline-start:1px solid var(--line);
  background:linear-gradient(180deg,var(--glass),transparent);
  backdrop-filter:blur(14px);padding:22px 16px;display:flex;flex-direction:column;gap:26px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--cyan),var(--violet));
  display:grid;place-items:center;box-shadow:0 4px 16px color-mix(in srgb,var(--cyan) 35%,transparent)}
.brand-mark svg path{stroke:#fff}
.brand-mark svg{width:18px;height:18px}
.brand-t{font-size:14.5px;font-weight:700;letter-spacing:.2px}
.brand-s{font-size:10.5px;color:var(--ink-3);letter-spacing:1.4px;text-transform:uppercase;font-family:var(--f-num)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-h{font-size:10px;letter-spacing:1.6px;color:var(--ink-3);text-transform:uppercase;margin:14px 8px 6px;font-family:var(--f-num)}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-s);color:var(--ink-2);
  font-size:13.5px;font-weight:500;transition:.16s;width:100%;text-align:start;position:relative}
.nav-i:hover{background:var(--glass);color:var(--ink)}
.nav-i.on{background:linear-gradient(90deg,color-mix(in srgb,var(--cyan) 16%,transparent),transparent);
  color:var(--ink);font-weight:600}
.nav-i.on::after{content:"";position:absolute;inset-inline-end:0;top:20%;height:60%;width:2.5px;border-radius:3px;
  background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.nav-i svg{width:16px;height:16px;flex:none;opacity:.85}
.rail-foot{margin-top:auto;font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;gap:7px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-inline-end:6px}

.main{padding:22px 26px 60px;min-width:0}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.hdr h1{font-size:22px;letter-spacing:-.2px}
.hdr p{color:var(--ink-2);font-size:13px;margin-top:3px}

/* ---------- filter bar ---------- */
.fbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:12px 14px;margin-bottom:20px;
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(10px)}
.fgrp{display:flex;align-items:center;gap:7px}
.flab{font-size:10.5px;letter-spacing:1.2px;color:var(--ink-3);text-transform:uppercase;font-family:var(--f-num)}
.sel,.inp{background:var(--ground-1);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;
  color:var(--ink);transition:.15s;min-width:0}
.sel:hover,.inp:hover{border-color:var(--line-2)}
.sel{appearance:none;padding-inline-end:26px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2367718F' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-size:13px;background-position:left 8px center}
.sel option{background:var(--ground-1);color:var(--ink)}
.inp[type=date],.inp[type=time]{color-scheme:light}
:root[data-theme="dark"] .inp[type=date],:root[data-theme="dark"] .inp[type=time]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .inp[type=date],
  :root:not([data-theme="light"]) .inp[type=time]{color-scheme:dark}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);
  background:color-mix(in srgb,var(--ink-3) 7%,transparent);transition:.15s;display:flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip.on{background:color-mix(in srgb,var(--cyan) 15%,transparent);
  border-color:color-mix(in srgb,var(--cyan) 50%,transparent);color:var(--cyan);font-weight:600}
.chip .sw{width:7px;height:7px;border-radius:50%}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 3px}

/* ---------- buttons ---------- */
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--glass);
  font-size:13px;font-weight:500;color:var(--ink);transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--glass-2);border-color:var(--line-2)}
.btn svg{width:15px;height:15px}
.btn-p{background:linear-gradient(135deg,var(--cyan),var(--teal));color:#fff;border:none;font-weight:600;
  box-shadow:0 4px 16px color-mix(in srgb,var(--cyan) 30%,transparent)}
:root[data-theme="dark"] .btn-p{color:#04121A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-p{color:#04121A}}
.btn-p:hover{filter:brightness(1.08)}
.btn-d{color:var(--rose);border-color:rgba(251,113,133,.3)}
.btn-s{padding:5px 9px;font-size:12px}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;
  backdrop-filter:blur(12px);position:relative;overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-2),transparent)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-t{font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:.2px}
.card-x{font-size:10.5px;color:var(--ink-3);font-family:var(--f-num);letter-spacing:.6px}

/* KPI tile */
.kpi{padding:15px 16px}
.kpi-l{font-size:11.5px;color:var(--ink-2);letter-spacing:.3px;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.kpi-v{font-size:30px;font-weight:500;letter-spacing:-1.2px;line-height:1.05}
.kpi-u{font-size:14px;color:var(--ink-3);margin-inline-start:3px;font-weight:400}
.kpi-f{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.kpi-spark{position:absolute;inset-inline-end:0;bottom:0;width:52%;height:44%;opacity:.5;pointer-events:none}
.dlt{font-size:11.5px;font-family:var(--f-num);font-weight:500;padding:2.5px 7px;border-radius:6px;
  display:inline-flex;align-items:center;gap:3px;direction:ltr}
.dlt.up{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.dlt.dn{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.dlt.fl{background:color-mix(in srgb,var(--ink-3) 14%,transparent);color:var(--ink-2)}
.dlt-c{font-size:11px;color:var(--ink-3)}

/* ring */
.ring-w{display:flex;flex-direction:column;align-items:center;gap:8px}
.ring-lab{font-size:11.5px;color:var(--ink-2);text-align:center}

/* tables */
.tw{overflow-x:auto;margin:0 -17px -16px;padding:0 17px 16px}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{text-align:start;font-size:10.5px;letter-spacing:1px;color:var(--ink-3);text-transform:uppercase;
  font-weight:500;padding:0 11px 9px;font-family:var(--f-num);border-bottom:1px solid var(--line)}
td{padding:9px 11px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:.12s}
tbody tr:hover{background:color-mix(in srgb,var(--ink-3) 7%,transparent)}
td.n,th.n{text-align:end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;
  background:color-mix(in srgb,var(--ink-3) 10%,transparent);border:1px solid var(--line)}

/* insight cards */
.ins{border-inline-start:2.5px solid var(--cyan);padding:14px 16px;background:var(--glass);
  border-radius:var(--r-s);border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line)}
.ins.good{border-inline-start-color:var(--teal)} .ins.warn{border-inline-start-color:var(--amber)}
.ins.bad{border-inline-start-color:var(--rose)} .ins.info{border-inline-start-color:var(--violet)}
.ins-h{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.ins-t{font-size:13.5px;font-weight:600}
.ins-b{font-size:13px;color:var(--ink-2);line-height:1.75}
.ins-b b{color:var(--ink);font-family:var(--f-num);font-weight:500}
.ins-m{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.conf{font-size:10px;letter-spacing:.8px;font-family:var(--f-num);color:var(--ink-3);
  border:1px solid var(--line);padding:2px 7px;border-radius:5px}

/* forms */
.form{display:grid;gap:13px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:11px;color:var(--ink-2);letter-spacing:.3px}
.fld .inp,.fld .sel{width:100%}
textarea.inp{resize:vertical;min-height:96px;font-family:var(--f-num);font-size:12px;line-height:1.7;direction:ltr;text-align:left}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.err{color:var(--rose);font-size:12px}
.ok{color:var(--teal);font-size:12px}

/* misc */
.empty{text-align:center;padding:44px 20px;color:var(--ink-3);font-size:13.5px;line-height:1.9}
.empty svg{width:38px;height:38px;opacity:.35;margin-bottom:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 14px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;
  margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tab.on{color:var(--ink);border-bottom-color:var(--cyan)}
.tab:hover{color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-inline-end:6px}
.toast{position:fixed;bottom:22px;inset-inline-start:22px;background:var(--ground-1);border:1px solid var(--line-2);
  padding:11px 16px;border-radius:11px;font-size:13px;z-index:99;box-shadow:0 12px 40px rgba(0,0,0,.5);
  transform:translateY(80px);opacity:0;transition:.25s}
.toast.on{transform:none;opacity:1}
.toast.bad{border-color:rgba(251,113,133,.5)}
.bar-row{display:grid;grid-template-columns:98px 1fr auto;gap:11px;align-items:center;font-size:12.5px;margin-bottom:9px}
.bar-tr{height:8px;background:color-mix(in srgb,var(--ink-3) 15%,transparent);border-radius:5px;overflow:hidden}
.bar-fl{height:100%;width:100%;border-radius:5px;transform:scaleX(0);transform-origin:right center;
  transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.bar-v{font-family:var(--f-num);font-size:12px;color:var(--ink-2);direction:ltr}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,35,.55);backdrop-filter:blur(4px);z-index:90;
  display:grid;place-items:center;padding:20px}
.modal{background:var(--ground-1);border:1px solid var(--line-2);border-radius:var(--r);padding:20px;
  width:min(560px,100%);max-height:86vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.secs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;align-items:start}
.secs>div{min-width:0}
.s-full{grid-column:span 6}.s-two{grid-column:span 4}.s-half{grid-column:span 3}.s-third{grid-column:span 2}
@media (max-width:1180px){.s-third{grid-column:span 3}}
@media (max-width:820px){.s-third,.s-half,.s-two{grid-column:span 6}}
.hide{display:none!important}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:12px;
    border-inline-start:none;border-bottom:1px solid var(--line)}
  .rail .nav{flex-direction:row} .nav-h,.rail-foot{display:none}
  .nav-i.on::after{inset-inline-end:auto;left:15%;right:15%;top:auto;bottom:0;height:2.5px;width:auto}
  .main{padding:16px 14px 50px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── الفريق والمجتمع ── */
.pav{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none;object-fit:cover;vertical-align:middle}
.nav-me{display:flex;align-items:center;gap:10px;padding:10px 10px 12px;margin:-6px 0 10px;border-bottom:1px solid var(--line)}
.nav-me b{display:block;font-size:13px}.nav-me small{display:block;font-size:11px;color:var(--ink-3)}
.chat{display:grid;grid-template-columns:260px minmax(0,1fr);height:calc(100vh - 190px);min-height:520px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--ground-1)}
.ch-side{border-inline-end:1px solid var(--line);padding:14px 10px;overflow:auto;background:var(--ground-2)}

.ch-it{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border:none;background:none;border-radius:9px;color:var(--ink-2);font:inherit;font-size:13.5px;cursor:pointer;text-align:start}
.ch-it:hover{background:color-mix(in srgb,var(--ink-3) 10%,transparent)}
.ch-it.on{background:color-mix(in srgb,var(--cyan) 16%,transparent);color:var(--ink);font-weight:600}
.ch-it.un{color:var(--ink);font-weight:700}
.ch-hash{width:22px;text-align:center;color:var(--ink-3);flex:none}
.ch-nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-b{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--violet);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.ch-b.men{background:var(--bad)}
.ch-empty{padding:6px 10px 10px;font-size:12px;color:var(--ink-3)}
.ch-empty.big{padding:40px 20px;text-align:center;font-size:14px}
.ch-main{display:flex;flex-direction:column;min-width:0}
.ch-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.ch-ttl{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
.ch-tag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);margin-inline-start:6px}
.ch-desc{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.ch-hx{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch-msgs{flex:1;overflow:auto;padding:14px 18px}
.ch-day{display:flex;align-items:center;gap:10px;margin:14px 0 8px;color:var(--ink-3);font-size:11.5px}
.ch-day:before,.ch-day:after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:flex;gap:10px;padding:5px 8px;border-radius:10px;margin-top:6px}
.msg.grp{margin-top:0;padding-top:1px}
.msg:hover{background:color-mix(in srgb,var(--ink-3) 7%,transparent)}
.msg.men{background:color-mix(in srgb,var(--amber) 11%,transparent)}
.msg-sp{width:34px;flex:none}
.msg-b{min-width:0;flex:1}
.msg-h{display:flex;align-items:baseline;gap:8px;font-size:13px}
.msg-h em{font-style:normal;font-size:10.5px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--violet)}
.msg-h span{font-size:11px;color:var(--ink-3)}
.msg-t{font-size:14px;line-height:1.7;color:var(--ink);word-wrap:break-word}
.mn{color:var(--cyan);font-weight:700;background:color-mix(in srgb,var(--cyan) 12%,transparent);padding:0 4px;border-radius:5px}
.mn.me{color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,transparent)}
.ch-comp{position:relative;display:flex;gap:10px;align-items:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.ch-comp textarea{flex:1;resize:none;min-height:46px;max-height:160px;font-family:var(--f-ui);font-size:14px;direction:rtl;text-align:right;line-height:1.6}
#chPop{position:absolute;bottom:100%;inset-inline-start:16px;z-index:5}
.ch-pop{min-width:240px;padding:6px;border-radius:12px;background:var(--ground-1);border:1px solid var(--line-2);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.ch-pi{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border:none;background:none;border-radius:8px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:start}
.ch-pi small{margin-inline-start:auto;color:var(--ink-3);font-size:11px}
.ch-pi.on,.ch-pi:hover{background:color-mix(in srgb,var(--cyan) 14%,transparent)}
.ch-mems{display:flex;flex-wrap:wrap;gap:8px}
.ch-mem{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border:1px solid var(--line);border-radius:999px;background:none;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.ch-mem small{color:var(--ink-3);font-size:11px}
.ch-mem.on,.ch-mem:has(input:checked){border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,transparent)}
.ch-mem input{accent-color:var(--cyan)}
.me-hero{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.me-hi{font-size:20px;font-weight:700}
.me-grid{grid-template-columns:repeat(auto-fit,minmax(360px,1fr));align-items:start}
.me-tasks{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.me-men{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:none;font:inherit;color:var(--ink);cursor:pointer;text-align:start;margin-bottom:8px}
.me-men:hover{border-color:var(--cyan)}
.me-mh{font-size:12.5px;color:var(--ink-2)}.me-mh .num{color:var(--ink-3);font-size:11px}
.me-mt{font-size:13.5px;margin-top:2px;line-height:1.6}
.me-tm{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.me-tm:first-child{border-top:none}
.tm-p{display:flex;align-items:center;gap:10px}
.tm-off{opacity:.5}
.tm-step{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;font-size:13.5px;line-height:1.7}
.tm-step b{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--cyan) 16%,transparent);color:var(--cyan)}
.tk-priv{display:flex;align-items:center;gap:8px;margin:4px 0 10px;font-size:13px;color:var(--ink-2);cursor:pointer}
.tk-priv input{accent-color:var(--violet)}
.tsk-who{display:inline-flex;align-items:center;gap:5px}
@media (max-width:760px){ .chat{grid-template-columns:1fr;height:auto} .ch-side{max-height:220px;border-inline-end:none;border-bottom:1px solid var(--line)} .ch-msgs{min-height:320px} }

/* ── درج التفاصيل ── */
.dw-bg{position:fixed;inset:0;background:rgba(10,15,35,.38);z-index:88}
.dw{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(560px,100vw);z-index:89;background:var(--ground-1);border-inline-start:1px solid var(--line-2);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.dw.wide{width:min(720px,100vw)}
.dw-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dw-t{font-weight:700;font-size:14px;color:var(--ink-2)}
.dw-b{flex:1;overflow:auto;padding:16px 18px 30px}
.dw-f{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.dw-title{font-size:19px;font-weight:700;border:1px solid transparent;background:transparent;padding:6px 8px;width:100%}
.dw-title:hover,.dw-title:focus{border-color:var(--line-2);background:var(--ground-2)}
.dw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.dw-f1 label{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:4px}

.dw-sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.dw-st{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.3px;margin-bottom:8px}
.dw-desc{width:100%;min-height:90px;font-family:var(--f-ui);font-size:13.5px;direction:rtl;text-align:right;line-height:1.7}
.dw-ck{display:flex;align-items:center;gap:8px;padding:5px 0}
.dw-ck.on span{text-decoration:line-through;color:var(--ink-3)}
.dw-x{margin-inline-start:auto;border:none;background:none;color:var(--ink-3);cursor:pointer}
.dw-row{display:flex;gap:8px;align-items:center;margin-top:6px}.dw-row .inp{flex:1}
.dw-prog{height:6px;border-radius:4px;background:color-mix(in srgb,var(--ink-3) 18%,transparent);overflow:hidden;margin-bottom:6px}
.dw-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.dw-cm{display:flex;gap:10px;padding:8px 0}
.dw-cmbox{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.dw-cmbox textarea{font-family:var(--f-ui);direction:rtl;text-align:right}
.dw-cmbox .btn{align-self:flex-start}
.dw-ppl{display:flex;flex-wrap:wrap;gap:6px}
.dw-act{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:5px}
/* ── المهام ── */
.tv-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tv-stats{display:flex;gap:8px;flex-wrap:wrap}
.tv-stat{display:flex;flex-direction:column;align-items:flex-start;min-width:96px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--ground-1);font:inherit;color:var(--ink);cursor:pointer}
.tv-stat b{font-size:20px;font-family:var(--f-num)}.tv-stat span{font-size:11.5px;color:var(--ink-3)}
.tv-stat.on{border-color:var(--cyan);box-shadow:0 0 0 2px color-mix(in srgb,var(--cyan) 25%,transparent)}
div.tv-stat{cursor:default}
.tv-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tv-add{flex:1;min-width:220px}
.tv-projs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tv-list{padding:0;overflow:hidden}
.tv-head,.tv-row{display:grid;grid-template-columns:34px minmax(220px,2.6fr) 1.2fr .9fr .8fr 1.2fr;gap:10px;align-items:center;padding:8px 14px}
.tv-head{font-size:11.5px;color:var(--ink-3);border-bottom:1px solid var(--line);background:var(--ground-2)}
.tv-row{border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}

.tv-ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);background:none;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer;flex:none}

.tv-ck:hover{border-color:var(--good)}
.tv-tt{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.tv-name{font-weight:600}
.tv-mini{font-size:11px;color:var(--ink-3)}
.tv-tag{font-size:10.5px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet)}
.tv-who{display:flex;align-items:center;gap:6px;min-width:0;font-size:12.5px}
.tv-pri,.tv-cl,.tv-due{font-size:12.5px;color:var(--ink-2)}
.tv-g{border-bottom:1px solid var(--line)}
.tv-g.sub{border-bottom:none;padding-inline-start:18px}
.tv-gh{display:flex;align-items:center;gap:8px;width:100%;padding:9px 14px;border:none;background:color-mix(in srgb,var(--ink-3) 5%,transparent);font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:start}
.tv-car{width:14px;color:var(--ink-3)}
.tv-cnt{font-size:11px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--ink-3) 14%,transparent);color:var(--ink-2)}
.tv-addrow{display:block;width:100%;padding:8px 48px;border:none;background:none;text-align:start;color:var(--ink-3);font:inherit;font-size:12.5px;cursor:pointer}
.tv-addrow:hover{color:var(--cyan)}
.tv-calh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tv-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.tv-dn{font-size:11px;color:var(--ink-3);text-align:center;padding:4px 0}
.tv-day{min-height:96px;border:1px solid var(--line);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:3px}
.tv-day.out{opacity:.45}.tv-day.today{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.tv-dh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2)}
.tv-dadd{border:none;background:none;color:var(--ink-3);cursor:pointer;opacity:0}.tv-day:hover .tv-dadd{opacity:1}
.tv-ev{font:inherit;font-size:11.5px;text-align:start;padding:3px 6px;border-radius:6px;border:none;display:flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--cyan) 10%,transparent);color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-pd{width:7px;height:7px;border-radius:50%;flex:none}.tv-ev span{overflow:hidden;text-overflow:ellipsis}.tv-ev.done{opacity:.5;text-decoration:line-through}.tv-ev.late{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.tv-tl{overflow-x:auto}
.tv-tlr{display:grid;grid-template-columns:200px 1fr;align-items:center;border-bottom:1px solid var(--line);min-height:36px}

.tv-tln{border:none;background:none;font:inherit;font-size:12.5px;text-align:start;padding:6px 8px;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-tlbars{display:grid;grid-template-columns:repeat(var(--n),minmax(34px,1fr));padding:5px 0}
.tv-tbar{display:flex;align-items:center;gap:5px;height:24px;padding:0 6px;border-radius:7px;background:linear-gradient(90deg,color-mix(in srgb,var(--cyan) 70%,transparent),color-mix(in srgb,var(--violet) 70%,transparent));color:#fff;font-size:11.5px;overflow:hidden;white-space:nowrap;cursor:pointer}
.tv-tbar.done{opacity:.45}.tv-tbar.late{background:linear-gradient(90deg,var(--bad),color-mix(in srgb,var(--bad) 60%,transparent))}
/* ── الموافقات ── */
.ap-card{margin-bottom:10px}
.ap-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ap-ty{font-size:11px;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet);font-weight:700}

.ap-act{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
/* ── الملخص الصباحي ── */
.br-card{grid-column:1/-1}
.br-body{font-size:14px;line-height:1.85}
.br-h{font-weight:700;margin-top:8px;color:var(--cyan)}
.br-li{position:relative;padding-inline-start:16px}.br-li:before{content:"•";position:absolute;inset-inline-start:2px;color:var(--violet)}
/* ── الميديا بلان ── */
.pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pl-card{cursor:pointer;transition:border-color .15s}.pl-card:hover{border-color:var(--cyan)}

.pl-bar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--ground-2)}
.pl-cs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:12px;color:var(--ink-2)}.pl-cs i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:4px}
.pl-ft{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px}

<script>
(function(){
"use strict";

/* ══════════════════ 1. أدوات عامة ══════════════════ */
const $ = s => document.querySelector(s);
/* ── اللغة: عربي افتراضي، والإنجليزي بيتقلب معاه الاتجاه ── */
let _lang="ar";
const LANG=()=>_lang;
function syncLang(){ try{ _lang=(S.cfg.settings.lang)||"ar"; }catch(e){ _lang="ar"; } return _lang; }
const EN=()=>LANG()==="en";
const L=(ar,en)=>(EN()&&en!=null)?en:ar;
const mLabel=m=>m?L(m.label,m.labelEn):"";
const mkLabel=k=>{ const m=metricByKey(k); return m?mLabel(m):k; };
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
let _gid = 0; const gid = p => p+"_"+(++_gid);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const sum = a => a.reduce((x,y)=>x+(+y||0),0);
const mean = a => a.length? sum(a)/a.length : 0;
const stdev = a => { if(a.length<2) return 0; const m=mean(a); return Math.sqrt(sum(a.map(v=>(v-m)**2))/(a.length-1)); };
const groupBy = (arr,fn) => arr.reduce((o,x)=>{ const k=fn(x); (o[k]=o[k]||[]).push(x); return o; },{});

const NF = new Intl.NumberFormat("en-US");
function fnum(v,dec){ dec=dec||0; if(v==null||!isFinite(v)) return "—";
  return new Intl.NumberFormat("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(v); }
function fcompact(v,dec){ if(v==null||!isFinite(v)) return "—"; const a=Math.abs(v);
  if(a>=1e9) return fnum(v/1e9,1)+"B"; if(a>=1e6) return fnum(v/1e6,2)+"M";
  if(a>=1e4) return fnum(v/1e3,1)+"K"; return fnum(v,dec==null?0:dec); }

const CURR = {SAR:"ر.س",AED:"د.إ",EGP:"ج.م",KWD:"د.ك",QAR:"ر.ق",BHD:"د.ب",OMR:"ر.ع",
  JOD:"د.أ",IQD:"د.ع",LBP:"ل.ل",ILS:"₪",SYP:"ل.س",YER:"ر.ي",SDG:"ج.س",LYD:"د.ل",
  MAD:"د.م",DZD:"د.ج",TND:"د.ت",TRY:"₺",GBP:"£",USD:"$",EUR:"€",
  PKR:"₨",INR:"₹",IDR:"Rp",MYR:"RM",NGN:"₦",ZAR:"R"};
function fval(v,m,compact){
  if(v==null||!isFinite(v)) return "—";
  const d = m&&m.dec!=null?m.dec:0;
  if(!m) return fnum(v,0);
  if(m.unit==="pct") return fnum(v,d)+"%";
  if(m.unit==="x")   return fnum(v,d)+"×";
  if(m.unit==="cur") return compact? fcompact(v,d) : fnum(v,d);
  return compact? fcompact(v,d) : fnum(v,d);
}
const unitSuffix = m => m&&m.unit==="cur" ? (CURR[S.cfg.settings.currency]||"") : "";

/* ── تواريخ ── */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO = () => iso(new Date());
const parseISO = s => { const p=String(s).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); };
const addDays = (s,n) => { const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((parseISO(b)-parseISO(a))/864e5);
function dateRange(a,b){ const out=[]; let c=a; let guard=0; while(c<=b && guard++<800){ out.push(c); c=addDays(c,1);} return out; }
const AR_M_AR=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const AR_M_EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const AR_D_AR=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

/* ══════════════════ 3. محرك المعادلات ══════════════════ */
const FUNCS = {
  SAFE_DIV:(a,b,f)=> (b===0||b==null||!isFinite(b)) ? (f==null?0:f) : a/b,
  MIN:Math.min, MAX:Math.max, ABS:Math.abs,
  ROUND:(v,d)=>{ const p=Math.pow(10,d||0); return Math.round(v*p)/p; },
  SQRT:Math.sqrt,
};
function lex(src){
  const t=[]; let i=0;
  while(i<src.length){
    const c=src[i];
    if(/\s/.test(c)){ i++; continue; }
    if(c==="{"){ const j=src.indexOf("}",i); if(j<0) throw 0;
      t.push({k:"var",v:src.slice(i+1,j).trim()}); i=j+1; continue; }
    if(/[0-9.]/.test(c)){ let j=i; while(j<src.length&&/[0-9.]/.test(src[j])) j++;
      const n=parseFloat(src.slice(i,j)); if(!isFinite(n)) throw 0; t.push({k:"num",v:n}); i=j; continue; }
    if(/[A-Za-z_]/.test(c)){ let j=i; while(j<src.length&&/[A-Za-z0-9_]/.test(src[j])) j++;
      t.push({k:"fn",v:src.slice(i,j).toUpperCase()}); i=j; continue; }
    if("+-*/(),".indexOf(c)>=0){ t.push({k:"op",v:c}); i++; continue; }
    throw 0;
  }
  return t;
}
function evalFormula(src,vals,strict){
  try{
    const t=lex(String(src||"")); const p={i:0,t:t,vals:vals,strict:strict};
    const r=pExpr(p);
    if(p.i<t.length) throw 0;
    return (typeof r==="number"&&isFinite(r))? r : null;
  }catch(e){ return null; }
}
function peek(p){ return p.t[p.i]; }
function eat(p,v){ const tk=p.t[p.i]; if(!tk||tk.v!==v) throw 0; p.i++; return tk; }
function pExpr(p){ let l=pTerm(p);
  while(peek(p)&&peek(p).k==="op"&&(peek(p).v==="+"||peek(p).v==="-")){
    const o=p.t[p.i++].v; const r=pTerm(p); l = o==="+"? l+r : l-r; } return l; }
function pTerm(p){ let l=pUnary(p);
  while(peek(p)&&peek(p).k==="op"&&(peek(p).v==="*"||peek(p).v==="/")){
    const o=p.t[p.i++].v; const r=pUnary(p);
    if(o==="*") l=l*r; else { if(r===0||!isFinite(r)) throw 0; l=l/r; } } return l; }
function pUnary(p){ if(peek(p)&&peek(p).v==="-"){ p.i++; return -pUnary(p); } return pPrim(p); }
function pPrim(p){
  const tk=peek(p); if(!tk) throw 0;
  if(tk.k==="num"){ p.i++; return tk.v; }
  if(tk.k==="var"){ p.i++; const v=p.vals? p.vals[tk.v] : 1;
    if(v==null||!isFinite(v)){ if(p.strict) throw 0; return 0; } return +v; }
  if(tk.k==="op"&&tk.v==="("){ p.i++; const v=pExpr(p); eat(p,")"); return v; }
  if(tk.k==="fn"){ p.i++; const f=FUNCS[tk.v]; if(!f) throw 0; eat(p,"(");
    const args=[]; if(peek(p)&&peek(p).v!==")"){ args.push(pExpr(p));
      while(peek(p)&&peek(p).v===","){ p.i++; args.push(pExpr(p)); } }
    eat(p,")"); const r=f.apply(null,args); if(!isFinite(r)) throw 0; return r; }
  throw 0;
}
function validateFormula(src,selfKey){
  const s=String(src||"").trim(); if(!s) return {ok:false,err:"المعادلة فاضية"};
  let t; try{ t=lex(s); }catch(e){ return {ok:false,err:L("فيه رمز غير مفهوم في المعادلة","There's an unrecognized symbol in the formula")}; }
  const known = {}; S.cfg.metrics.forEach(m=>{ known[m.key]=1; }); known.margin=1;
  for(const tk of t){
    if(tk.k==="var"){
      if(tk.v===selfKey) return {ok:false,err:"المعادلة بتشير لنفسها"};
      if(!known[tk.v]) return {ok:false,err:L("ميترك غير موجود: {","Metric not found: {")+tk.v+"}"};
    }
    if(tk.k==="fn"&&!FUNCS[tk.v]) return {ok:false,err:L("دالة غير معروفة: ","Unknown function: ")+tk.v};
  }
  const probe={}; Object.keys(known).forEach(k=>{ probe[k]=2; });
  if(evalFormula(s,probe)===null) return {ok:false,err:"المعادلة مش متزنة — راجع الأقواس"};
  return {ok:true};
}

/* قاعدة البيانات بترجع نسخ مقفولة (frozen) — أي تعديل عليها بيكسر التشغيل، فبنرجّع نسخة قابلة للتعديل */
const thaw = o => o==null ? o : JSON.parse(JSON.stringify(o));
const Remote = {
  async getConfig(){ const s=await DB.doc("config/app").get(); return s.exists? thaw(s.data()) : null; },
  async setConfig(c){ await DB.doc("config/app").set(c); },
  async getEntries(from,to){
    const q=await DB.collection("entries").where("date",">=",from).where("date","<=",to).get();
    return q.docs.map(d=>thaw(d.data()));
  },
  async getEntryDoc(id){ const s=await DB.doc("entries/"+id).get(); return s.exists? thaw(s.data()) : null; },
  async setEntryDoc(id,doc){ await DB.doc("entries/"+id).set(doc); },
  async delEntryDoc(id){ await DB.doc("entries/"+id).delete(); },
  async getColl(c){ const q=await DB.collection(c).get(); return q.docs.map(d=>thaw(d.data())); },
  async earliest(){
    try{ const q=await DB.collection("entries").orderBy("date").limit(1).get();
      if(q.docs.length) return thaw(q.docs[0].data()).date; }catch(e){}
    // لو الترتيب مش مدعوم: نجيب التواريخ كلها مرة واحدة ونشوف أقدم واحد
    const all=await DB.collection("entries").get();
    const ds=all.docs.map(d=>thaw(d.data()).date).filter(Boolean).sort();
    return ds[0]||null; },
  async setDoc(c,id,d){ await DB.doc(c+"/"+id).set(d); },
  async delDoc(c,id){ await DB.doc(c+"/"+id).delete(); },
};

/* ══════════════════ 6. التجميع والحساب ══════════════════ */
function lastV(fact){ return fact.snaps.length? fact.snaps[fact.snaps.length-1].v : {}; }
function snapAtOrBefore(fact,ts){ let r=null; for(const s of fact.snaps){ if(s.ts<=ts) r=s; else break; } return r; }

/** يجمع حالات خام [{clientId,v}] ويحسب كل الميترِكس المشتقة */
function aggStates(states){
  const raw={}; const rm=rawMetrics();
  rm.forEach(m=>{ raw[m.key]=0; });
  let gp=0, rev=0, mgs=[], anyMargin=false;
  for(const st of states){
    const v=st.v||{};
    for(const m of rm) raw[m.key]+= (+v[m.key]||0);
    const cl=clientById(st.clientId); const mg = cl&&cl.margin!=null? cl.margin : 1;
    if(cl&&cl.margin!=null) anyMargin=true;
    const r=+v.revenue||0; gp += r*mg; rev += r; mgs.push(mg);
  }
  raw._gp = gp;
  raw.margin = rev>0 ? gp/rev : (mgs.length? mean(mgs) : 1);
  if(states.length&&!anyMargin) raw._noMargin=1;   // مفيش هامش ربح = مفيش صافي ربح (مش هامش ١٠٠٪)
  return computeAll(raw);
}
function computeAll(raw){
  const out=Object.assign({},raw); const cm=calcMetrics();
  for(let pass=0;pass<3;pass++){
    let changed=false;
    for(const m of cm){ const r=evalFormula(m.formula,out);
      if(r!==out[m.key]){ out[m.key]=r; changed=true; } }
    if(!changed) break;
  }
  if(out._noMargin) cm.forEach(m=>{ if(String(m.formula||"").indexOf("{margin}")>=0) out[m.key]=null; });
  return out;
}
/** فرق بين حالتين مجمّعتين — الأساس للـ Incremental */
function deltaVals(prev,cur){
  const raw={}; rawMetrics().forEach(m=>{ raw[m.key]=(+cur[m.key]||0)-(+prev[m.key]||0); });
  const gp=(+cur._gp||0)-(+prev._gp||0); const rev=raw.revenue||0;
  raw._gp=gp; raw.margin = rev>0? gp/rev : (cur.margin||1);
  if(cur._noMargin) raw._noMargin=1;
  return computeAll(raw);
}

function matchFilter(f,ov){
  if(S.ws && f.clientId!==S.ws) return false;   // مساحة عمل العميل بتقفل كل حاجة عليه
  const F = Object.assign({},S.f,ov||{});
  if(F.clients.length && F.clients.indexOf(f.clientId)<0) return false;
  if(F.platforms.length && F.platforms.indexOf(f.platformId)<0) return false;
  if(F.campaign && String(f.campaign||"").toLowerCase().indexOf(F.campaign.toLowerCase())<0) return false;
  return true;
}
function factsIn(from,to,ov){
  return memo("fi:"+from+":"+to+":"+fSig(ov),
    ()=> S.facts.filter(f=> f.date>=from && f.date<=to && matchFilter(f,ov)));
}
function aggFacts(facts){ return aggStates(facts.map(f=>({clientId:f.clientId,v:lastV(f)}))); }

function seriesByDay(from,to,ov){
  return memo("sd:"+from+":"+to+":"+fSig(ov),()=>{
    const g=groupBy(factsIn(from,to,ov),f=>f.date);
    return dateRange(from,to).map(d=>({date:d, vals:aggFacts(g[d]||[]), n:(g[d]||[]).length}));
  }).slice();
}
function breakdown(from,to,dim,ov){
  return memo("bd:"+dim+":"+from+":"+to+":"+fSig(ov),()=>{
    const facts=factsIn(from,to,ov);
    const g=groupBy(facts, f=> dim==="platform"? f.platformId : dim==="client"? f.clientId : (f.campaign||"—"));
    return Object.keys(g).map(k=>({key:k, vals:aggFacts(g[k]), n:g[k].length}));
  }).slice();
}
/** منحنى تراكمي خلال يوم واحد */
function intraday(date,ov){
  const facts=factsIn(date,date,ov); if(!facts.length) return [];
  const times=[...new Set(facts.flatMap(f=>f.snaps.map(s=>s.ts)))].sort((a,b)=>a-b);
  return times.map(ts=>{
    const st=[]; for(const f of facts){ const s=snapAtOrBefore(f,ts); if(s) st.push({clientId:f.clientId,v:s.v}); }
    return {ts:ts, vals:aggStates(st)};
  });
}
/** فترات بين اللقطات — لتحليل ساعات الذروة */
function intervals(from,to,ov){
  const out=[];
  for(const f of factsIn(from,to,ov)){
    for(let i=1;i<f.snaps.length;i++){
      const a=f.snaps[i-1], b=f.snaps[i];
      const pv=aggStates([{clientId:f.clientId,v:a.v}]);
      const cv=aggStates([{clientId:f.clientId,v:b.v}]);
      out.push({from:a.ts, to:b.ts, hour:new Date(b.ts).getHours(), date:f.date,
                platformId:f.platformId, vals:deltaVals(pv,cv)});
    }
  }
  return out;
}
function pctChange(a,b){ if(a==null||b==null||!isFinite(a)||!isFinite(b)||a===0) return null; return (b-a)/Math.abs(a)*100; }

/* ── الفترات ── */
function resolveRange(){
  const t=todayISO(), F=S.f;
  switch(F.preset){
    case "today":     return [t,t];
    case "yesterday": return [addDays(t,-1),addDays(t,-1)];
    case "7d":        return [addDays(t,-6),t];
    case "14d":       return [addDays(t,-13),t];
    case "30d":       return [addDays(t,-29),t];
    case "mtd":       return [t.slice(0,8)+"01",t];
    case "lastmonth": { const d=parseISO(t); const s=new Date(d.getFullYear(),d.getMonth()-1,1);
                        const e=new Date(d.getFullYear(),d.getMonth(),0); return [iso(s),iso(e)]; }
    case "life":      return [dataFrom(),t];
    default:          return [F.from,F.to];
  }
}
function resolveCmp(from,to){
  const F=S.f; if(F.cmp==="none") return null;
  const len=diffDays(from,to)+1;
  if(F.cmp==="prev") return [addDays(from,-len), addDays(from,-1)];
  if(F.cmp==="prevmonth"){ const s=parseISO(from), e=parseISO(to);
    return [iso(new Date(s.getFullYear(),s.getMonth()-1,s.getDate())),
            iso(new Date(e.getFullYear(),e.getMonth()-1,e.getDate()))]; }
  if(F.cmp==="prevyear"){ const s=parseISO(from), e=parseISO(to);
    return [iso(new Date(s.getFullYear()-1,s.getMonth(),s.getDate())),
            iso(new Date(e.getFullYear()-1,e.getMonth(),e.getDate()))]; }
  if(F.cmp==="custom" && F.cmpFrom && F.cmpTo) return [F.cmpFrom,F.cmpTo];
  return null;
}

function tickFmt(mn,mx){
  const a=Math.max(Math.abs(mn),Math.abs(mx));
  const w = a>=1e9? [1e9,"B",2] : a>=1e6? [1e6,"M",2] : a>=1e4? [1e3,"K",1]
          : a>=100? [1,"",0] : a>=10? [1,"",1] : [1,"",2];
  return v => (v===0? "0" : fnum(v/w[0],w[2])+w[1]);
}
function axisBounds(vals){
  let mn=Infinity,mx=-Infinity;
  vals.forEach(v=>{ if(v==null||!isFinite(v))return; mn=Math.min(mn,v); mx=Math.max(mx,v); });
  if(!isFinite(mn)){ return {mn:0,mx:1}; }
  if(mn===mx){ return mn===0? {mn:0,mx:1} : {mn:Math.min(0,mn*0.9),mx:mx*1.15}; }
  const r=mx-mn;
  return { mn: (mn>=0 && mn<=r*0.6)? 0 : mn-r*0.12, mx: mx+r*0.14 };
}

function chStack(days,parts,fmt){
  const H=200,W=1000,pb=0,n=Math.max(1,days.length);
  const tot=days.map((_,i)=>sum(parts.map(p=>p.vals[i]||0)));
  const mx=Math.max(1,Math.max.apply(null,tot))*1.12;
  const bw=Math.min(W/n*0.62,44), gap=W/n;
  let body="";
  for(let i=0;i<n;i++){ let acc=0; const x=gap*i+(gap-bw)/2;
    for(let k=parts.length-1;k>=0;k--){ const v=parts[k].vals[i]||0; if(v<=0) continue;
      const h=(v/mx)*H, y=H-acc-h; acc+=h;
      body+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(2)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,0).toFixed(2)+
        '" style="fill:'+parts[k].color+'" opacity=".85" rx="1"/>'; } }
  const tf=tickFmt(0,mx);
  let ylab=""; for(let i=0;i<=3;i++){ const v=mx-(i/3)*mx;
    ylab+='<span style="top:'+((i/3)*100).toFixed(1)+'%">'+esc(tf(v))+"</span>"; }
  let xlab=""; const step=Math.max(1,Math.ceil(n/8));
  days.forEach((d,i)=>{ xlab+="<span>"+(i%step===0||i===n-1? esc(fdate(d)) : "")+"</span>"; });
  return '<div class="ch" dir="ltr" style="--h:200px"><div class="ch-p"><div class="ch-y">'+ylab+"</div>"+
    '<svg viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="none">'+body+"</svg></div>"+
    '<div class="ch-x">'+xlab+"</div></div>";
}
function chBars(items,fmt){
  if(!items.length) return '<div class="empty">مفيش بيانات في الفترة دي</div>';
  const mx=Math.max.apply(null,items.map(i=>Math.abs(i.value)))||1;
  return items.map(i=>'<div class="bar-row"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(i.label)+'">'+esc(i.label)+"</div>"+
    '<div class="bar-tr"><div class="bar-fl" style="background:'+i.color+';transform:scaleX('+

}
function chScatter(pts,xf,yf,xl,yl){

  for(let i=0;i<=3;i++){ const v=xb.mn+(i/3)*(xb.mx-xb.mn);

  const dots=pts.map(p=>'<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(p.r||5)+

    "</svg></div>";
}
function chHeat(rows,cols,matrix,color,fmt){
  const flat=[].concat.apply([],matrix).filter(v=>v!=null&&isFinite(v));
  const mx=Math.max.apply(null,flat.concat([0]))||1, mn=Math.min.apply(null,flat.concat([0]));
  let h='<div class="heat" style="grid-template-columns:74px repeat('+cols.length+',minmax(0,1fr))">';
  h+='<div></div>'+cols.map(c=>'<div class="heat-l">'+esc(c)+"</div>").join("");
  rows.forEach((r,ri)=>{
    h+='<div class="heat-l" style="justify-content:start;font-family:var(--f-ui);font-size:11px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r)+"</div>";
    cols.forEach((c,ci)=>{ const v=matrix[ri][ci];
      const t = (v==null||!isFinite(v))? 0 : (mx===mn? .5 : (v-mn)/(mx-mn));
      h+='<div class="heat-c" style="background:'+(v==null?"var(--line)":color)+
        ";opacity:"+(v==null?1:(0.12+t*0.88)).toFixed(2)+'" title="'+esc(r+" · "+c+" · "+(v==null?"—":fmt(v)))+'"></div>'; });
  });
  return h+"</div>";
}
function spark(pts,color){
  const v=pts.filter(x=>x!=null&&isFinite(x)); if(v.length<2) return "";
  const mn=Math.min.apply(null,v), mx=Math.max.apply(null,v), r=(mx-mn)||1;

  return '<svg class="kpi-spark" viewBox="0 0 100 100" preserveAspectRatio="none">'+
    '<path d="M'+d.join("L")+'" fill="none" stroke="'+color+'" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';
}
