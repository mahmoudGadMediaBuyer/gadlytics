/* ══════════════════ 20. الإقلاع ══════════════════ */
/* ── التشغيل: كل نداء لقاعدة البيانات ليه حد زمني، وأي تعطيل بيظهر برسالة بدل «جارِ التحميل» للأبد ── */
let BOOT_STEP="start";
const BOOT_STEPS={start:["البداية","start"],db:["الاتصال بقاعدة البيانات","connecting to the database"],
  config:["قراءة الإعدادات","reading settings"],identity:["التعرف عليك وعلى فريقك","identifying you and your team"],meta:["تحميل التغييرات والميديا والحملات","loading changes, media and roster"],
  entries:["تحميل الأرقام","loading numbers"],render:["عرض الصفحة","rendering the page"]};
function withTimeout(p,ms,step){
  let t; return Promise.race([Promise.resolve(p).finally(()=>clearTimeout(t)),
    new Promise((_,rej)=>{ t=setTimeout(()=>rej(Object.assign(new Error("timeout: "+step),{code:"timeout",step:step})),ms); })]);
}
function bootFail(title,detail){
  const v=$("#view"); if(!v) return;
  v.innerHTML='<div class="empty"><div style="font-weight:700;color:var(--bad);font-size:15px">'+esc(title)+"</div>"+
    '<div class="hint" style="margin-top:8px;max-width:520px;margin-inline:auto">'+esc(detail||"")+"</div>"+
    '<div style="margin-top:16px"><button class="btn btn-p" data-a="bootRetry">إعادة المحاولة · Retry</button></div></div>';
}
ACT.bootRetry=()=>location.reload();
async function boot(){
  document.documentElement.dir="rtl"; document.documentElement.lang="ar";
  $("#view").innerHTML='<div class="empty">جارِ التحميل…</div>';
  if(window.SUPA_DB&&!window.SUPA_DB.db){ try{ await SUPA_DB.ready(); }catch(e){} }   // نسخة الموقع: تسجيل الدخول قبل أي تحميل
  const watchdog=setTimeout(()=>{ if(!BOOTED){ const st=BOOT_STEPS[BOOT_STEP]||[BOOT_STEP,BOOT_STEP];
    bootFail("التحميل واقف عند: "+st[0],"Loading is stuck at: "+st[1]+". بياناتك محفوظة ومفيش حاجة اتغيرت — جرّب إعادة التحميل، ولو فضلت كده ابعتلي اسم الخطوة دي."); } },30000);
  BOOT_STEP="db";
  try{
    if(window.claude&&typeof claude.use==="function"){
      const d=await Promise.race([claude.use("db"),new Promise(r=>setTimeout(()=>r(null),7000))]);
      if(d){ DB=d; Store=Remote; STORE_MODE="cloud"; }
    }
    else if(window.SUPA_DB&&SUPA_DB.db){ DB=SUPA_DB.db; Store=Remote; STORE_MODE="cloud"; }
  }catch(e){}
  if(STORE_MODE!=="cloud"&&!lsOK()){ Store=Memory; STORE_MODE="memory"; }
  BOOT_STEP="config";
  let cfg=null, cfgErr=null;
  try{ cfg=await withTimeout(Store.getConfig(),15000,"config"); }catch(e){ cfgErr=e; }
  if(cfgErr&&STORE_MODE==="cloud"){
    // مهم: لو القراءة فشلت متكتبش إعدادات افتراضية فوق إعداداتك الحقيقية
    clearTimeout(watchdog);
    return bootFail("مش قادر أقرا إعداداتك من قاعدة البيانات",
      "Couldn't read your settings ("+(cfgErr.code||cfgErr.message||"error")+"). مفيش حاجة اتغيرت في بياناتك — جرّب تاني بعد لحظة.");
  }
  if(!cfg&&!cfgErr&&STORE_MODE==="cloud"){ try{ cfg=await Local.getConfig(); }catch(e){} }
  S.cfg=normalizeCfg(cfg);
  applyTheme(); applyLang();
  if(!cfg&&!cfgErr){ try{ await withTimeout(Store.setConfig(S.cfg),15000,"config"); }catch(e){} }
  BOOT_STEP="identity"; await initIdentity(); applyScope();
  S.entry.clientId=S.cfg.clients.length?S.cfg.clients[0].id:"";
  S.entry.platformId=S.cfg.platforms.length?S.cfg.platforms[0].id:"";
  BOOT_STEP="meta"; await loadMeta();
  BOOT_STEP="entries"; await reload();
  if(SIMPLE()){ if(!SIMPLE_VIEWS[S.view]) S.view=S.cfg.clients.length?"live":"overview"; }
  else if(!S.cfg.clients.length){ S.view="admin"; S.setupTab="clients"; }
  if(isPending()) S.view="pending"; else if(isClient()) S.view="portal"; else if(isMember()) S.view="me";
  BOOTED=true; clearTimeout(watchdog);
  scheduleReminders();
  BOOT_STEP="render";
  try{ render(); }catch(e){ console.error(e); bootFail("حصل خطأ وأنا بعرض الصفحة","Render error: "+(e&&e.message||e)); return; }
  probeAccess();
  chatStart();
  rtRun().catch(()=>{}); if(!isPending()) apNotifyMine();
}
boot().catch(e=>{ console.error(e);
  const at=String(e&&e.stack||"").split("\n").slice(1,3).map(x=>x.trim()).join(" ← ");
  bootFail("حصل خطأ في التشغيل","Startup error: "+(e&&e.message||e)+(at?" · "+at:"")+" · step: "+BOOT_STEP); });
})();
