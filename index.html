const CHREG={};
let _tip=null;
function chTipEl(){ if(!_tip){ _tip=document.createElement("div"); _tip.className="chtip"; document.body.appendChild(_tip);} return _tip; }
function isDark(){
  return (getComputedStyle(document.documentElement).getPropertyValue("--glow")||"").trim()==="1";
}
function chGeom(host){
  const reg=CHREG[host.dataset.ch]; if(!reg) return null;
  const hit=host.querySelector(".ch-hit"); if(!hit) return null;
  const r=hit.getBoundingClientRect();
  return {reg:reg,r:r,hit:hit};
}
function chIndexAt(host,clientX){
  const g=chGeom(host); if(!g||g.r.width<=0) return null;
  const n=g.reg.n;
  if(n<=1) return 0;
  return clamp(Math.round((clientX-g.r.left)/g.r.width*(n-1)),0,n-1);
}
function chShow(host,i){
  const g=chGeom(host); if(g==null) return;
  const reg=g.reg, n=reg.n;
  const frac = n<=1? .5 : i/(n-1);
  const cross=host.querySelector(".ch-cross");
  if(cross){ cross.style.left=(frac*100).toFixed(3)+"%"; cross.classList.add("on"); }
  host.querySelectorAll(".ch-mk").forEach(el=>{
    const si=+el.dataset.s, y=reg.series[si]&&reg.series[si].ypct[i];
    if(y==null){ el.classList.remove("on"); return; }
    el.style.left=(frac*100).toFixed(3)+"%"; el.style.top=y.toFixed(3)+"%"; el.classList.add("on");
  });
  const t=chTipEl();
  t.innerHTML='<div class="chtip-h">'+esc(reg.labels[i]||"")+"</div>"+
    reg.series.map(s=> s.raw[i]==null?"" :
      '<div class="chtip-r"><span class="chtip-n"><i style="background:'+s.color+'"></i>'+esc(s.name)+
      '</span><span class="chtip-v">'+esc(s.txt[i])+"</span></div>").join("");
  t.classList.add("on");
  const tr=t.getBoundingClientRect();
  let x=g.r.left+frac*g.r.width - tr.width/2;
  x=clamp(x,8,window.innerWidth-tr.width-8);
  let y=g.r.top-tr.height-12;
  if(y<8) y=g.r.bottom+12;
  t.style.left=x+"px"; t.style.top=y+"px";
}
function chHide(host){
  const t=chTipEl(); t.classList.remove("on");
  const c=host.querySelector(".ch-cross"); if(c) c.classList.remove("on");
  host.querySelectorAll(".ch-mk").forEach(el=>el.classList.remove("on"));
}
document.addEventListener("pointermove",e=>{
  const hit=e.target.closest&&e.target.closest(".ch-hit"); if(!hit) return;
  const host=hit.closest(".ch-p"); if(!host||!host.dataset.ch) return;
  const i=chIndexAt(host,e.clientX); if(i==null) return;
  host.dataset.i=i; chShow(host,i);
},{passive:true});
document.addEventListener("pointerleave",e=>{
  const hit=e.target.closest&&e.target.closest(".ch-hit"); if(!hit) return;
  const host=hit.closest(".ch-p"); if(host) chHide(host);
},true);
document.addEventListener("keydown",e=>{
  const hit=document.activeElement; if(!hit||!hit.classList||!hit.classList.contains("ch-hit")) return;
  const host=hit.closest(".ch-p"); const reg=host&&CHREG[host.dataset.ch]; if(!reg) return;
  let i=+host.dataset.i; if(!isFinite(i)) i=reg.n-1;
  if(e.key==="ArrowLeft") i=clamp(i-1,0,reg.n-1);
  else if(e.key==="ArrowRight") i=clamp(i+1,0,reg.n-1);
  else if(e.key==="Home") i=0;
  else if(e.key==="End") i=reg.n-1;
  else if(e.key==="Escape"){ chHide(host); hit.blur(); return; }
  else return;
  e.preventDefault(); host.dataset.i=i; chShow(host,i);
});
document.addEventListener("focusin",e=>{
  const hit=e.target.closest&&e.target.closest(".ch-hit"); if(!hit) return;
  const host=hit.closest(".ch-p"), reg=host&&CHREG[host.dataset.ch]; if(!reg) return;
  let i=+host.dataset.i; if(!isFinite(i)) i=reg.n-1;
  host.dataset.i=i; chShow(host,i);
});

/* ══════════════════ 7.6 محرك الرسم الموحّد ══════════════════
   يقبل: line · area · combo (أعمدة + خط) · columns · stacked · table   */
function chPlot(o){
  const type=o.type||"line";
  const S1=o.series.filter(s=>s.pts&&s.pts.some(v=>v!=null&&isFinite(v)));
  if(!S1.length) return '<div class="empty">مفيش قيم ترسم في الفترة دي</div>';
  const n=Math.max(1,o.n||Math.max.apply(null,S1.map(s=>s.pts.length)));
  const L=o.xlab||[];
  if(type==="table")
    return chValTable(Array.from({length:n},(_,i)=>[L[i]||("#"+(i+1))].concat(
        S1.map(s=>s.fmt?s.fmt(s.pts[i]):fcompact(s.pts[i],1)))),
      [o.xtitle||"الفترة"].concat(S1.map(s=>s.name)));
  if(type==="stacked"&&o.parts&&o.parts.length)
    return chStack(o.stackLabels||L,o.parts);

  const H=260, W=1000, pt=16, pb=16, GS=4;
  const A=[axisBounds([].concat.apply([],S1.filter(s=>!s.axis).map(s=>s.pts))),
           axisBounds([].concat.apply([],S1.filter(s=>s.axis===1).map(s=>s.pts)))];
  if(type==="columns"||type==="combo"){ const a=A[0]; if(a.mn>0) a.mn=0; }
  const X=i=> n<=1? W/2 : (i/(n-1))*W;
  const Y=(v,ax)=>{ const a=A[ax||0]; return pt+(1-(v-a.mn)/(a.mx-a.mn))*(H-pt-pb); };
  const gg=gid("g"), fl=gid("f"), dark=isDark();
  const c0=S1[0].color;
  let defs='<linearGradient id="'+gg+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" style="stop-color:'+c0+';stop-opacity:'+(dark?".34":".26")+'"/>'+
    '<stop offset="100%" style="stop-color:'+c0+';stop-opacity:0"/></linearGradient>';
  if(dark) defs+='<filter id="'+fl+'" x="-20%" y="-40%" width="140%" height="180%">'+
    '<feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  let grid="";
  for(let i=0;i<=GS;i++){ const y=pt+(i/GS)*(H-pt-pb);
    grid+='<line x1="0" y1="'+y.toFixed(1)+'" x2="'+W+'" y2="'+y.toFixed(1)+
      '" style="stroke:var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>'; }
  let body="", dots="", marks="";
  const gap=W/n, bw=Math.min(gap*0.6,44);
  S1.forEach((s,si)=>{
    const asBar = (type==="columns") || (type==="combo"&&si===0);
    s.ypct=[]; s.raw=s.pts.slice(); s.txt=s.pts.map(v=>s.fmt?s.fmt(v):fcompact(v,1));
    if(asBar){
      const zero=Y(clamp(0,A[s.axis||0].mn,A[s.axis||0].mx),s.axis);
      s.pts.forEach((v,i)=>{ s.ypct.push(v==null||!isFinite(v)?null:Y(v,s.axis)/H*100);
        if(v==null||!isFinite(v)) return;
        const y=Y(v,s.axis), top=Math.min(y,zero), h=Math.abs(zero-y);
        body+='<rect x="'+(gap*i+(gap-bw)/2).toFixed(1)+'" y="'+top.toFixed(2)+'" width="'+bw.toFixed(1)+
          '" height="'+Math.max(h,1).toFixed(2)+'" style="fill:'+s.color+'" opacity=".82" rx="1"/>'; });
    }else{
      const segs=[]; let cur=[];
      for(let i=0;i<n;i++){ const v=s.pts[i];
        if(v==null||!isFinite(v)){ s.ypct.push(null); if(cur.length){segs.push(cur);cur=[];} continue; }
        const y=Y(v,s.axis); s.ypct.push(y/H*100); cur.push([X(i),y]); }
      if(cur.length) segs.push(cur);
      if(!segs.length) return;
      const d=segs.map(sg=>"M"+sg.map(p=>p[0].toFixed(1)+","+p[1].toFixed(2)).join("L")).join(" ");
      if(type==="area"&&si===0){ const sg=segs[segs.length-1];
        body+='<path d="M'+sg.map(p=>p[0].toFixed(1)+","+p[1].toFixed(2)).join("L")+
          "L"+sg[sg.length-1][0].toFixed(1)+","+(H-pb)+"L"+sg[0][0].toFixed(1)+","+(H-pb)+'Z" fill="url(#'+gg+')"/>'; }
      body+='<path d="'+d+'" fill="none" style="stroke:'+s.color+'" stroke-width="'+(s.dash?1.7:2.2)+
        '" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"'+
        (s.dash?' stroke-dasharray="5 4" opacity=".8"':(dark?' filter="url(#'+fl+')"':""))+'/>';
      const lp=segs[segs.length-1][segs[segs.length-1].length-1];
      dots+='<div class="ch-dot" style="left:'+(lp[0]/W*100).toFixed(2)+"%;top:"+(lp[1]/H*100).toFixed(2)+
        "%;background:"+s.color+(dark?";box-shadow:0 0 10px "+s.color:"")+'"></div>';
    }
    marks+='<div class="ch-mk" data-s="'+si+'" style="background:'+s.color+'"></div>';
  });
  const fm0=o.fmt||tickFmt(A[0].mn,A[0].mx);
  let ylab=""; for(let i=0;i<=GS;i++){ const v=A[0].mx-(i/GS)*(A[0].mx-A[0].mn);
    ylab+='<span style="top:'+((pt+(i/GS)*(H-pt-pb))/H*100).toFixed(2)+'%">'+esc(fm0(v))+"</span>"; }
  const has2=S1.some(s=>s.axis===1);
  let ylab2=""; if(has2){ const f2=tickFmt(A[1].mn,A[1].mx);
    for(let i=0;i<=GS;i++){ const v=A[1].mx-(i/GS)*(A[1].mx-A[1].mn);
      ylab2+='<span style="top:'+((pt+(i/GS)*(H-pt-pb))/H*100).toFixed(2)+'%">'+esc(f2(v))+"</span>"; } }
  let xlab=""; if(L.length){ const step=Math.max(1,Math.ceil(L.length/9));
    for(let i=0;i<L.length;i++) xlab+="<span>"+(i%step===0||i===L.length-1? esc(L[i]) : "")+"</span>"; }
  let notes=""; (o.notes||[]).forEach(nt=>{ notes+='<div class="ch-note" style="left:'+
    ((n<=1?50:nt.i/(n-1)*100)).toFixed(2)+'%" title="'+esc(nt.label)+'"><i></i></div>'; });

  const id=gid("chart");
  CHREG[id]={n:n,labels:L.length?L:Array.from({length:n},(_,i)=>"#"+(i+1)),has2:has2,
    series:S1.map(s=>({name:s.name,color:s.color,ypct:s.ypct,raw:s.raw,txt:s.txt}))};
  return '<div class="ch'+(has2?" has2":"")+'" dir="ltr" style="--h:'+(o.h||200)+'px">'+
    '<div class="ch-p'+(has2?" has2":"")+'" data-ch="'+id+'"><div class="ch-y">'+ylab+"</div>"+
    (has2?'<div class="ch-y2">'+ylab2+"</div>":"")+
    '<svg viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="none"><defs>'+defs+"</defs>"+grid+body+"</svg>"+
    '<div class="ch-ov">'+dots+notes+marks+'<div class="ch-cross"><i></i></div></div>'+
    '<div class="ch-hit" tabindex="0" role="img" aria-label="'+esc(o.aria||"رسم بياني")+'"></div>'+
    "</div>"+(L.length?'<div class="ch-x">'+xlab+"</div>":"")+"</div>";
}

/* ══════════════════ 8. محرك الاستنتاجات ══════════════════ */
function deltaChip(cur,prev,m){
  if(cur!=null&&prev!=null&&isFinite(cur)&&isFinite(prev)&&cur!==0&&prev!==0&&Math.sign(cur)!==Math.sign(prev)){
    // النسبة هنا مالهاش معنى (زي ▼ 629%) — نعرض الفرق بالرقم ونقول اللي حصل
    const d=cur-prev, good=m.dir==="neutral"?null:(m.dir==="down"?d<0:d>0);
    return '<span class="dlt '+(good==null?"fl":good?"up":"dn")+'">'+(d>0?"▲":"▼")+" "+fcompact(Math.abs(d),0)+"</span>"+
      '<span class="dlt-flip'+(cur<0?"":" ok")+'">'+esc(cur<0?L("اتقلب لخسارة","Flipped to loss"):L("رجع لربح","Back to profit"))+"</span>";
  }
  const p=pctChange(prev,cur);
  if(p==null) return '<span class="dlt fl">—</span>';
  const good = m.dir==="down" ? p<0 : p>0;
  const cls = Math.abs(p)<0.5 ? "fl" : (m.dir==="neutral" ? "fl" : good?"up":"dn");
  const ar = p>0?"▲":p<0?"▼":"■";
  const n = Math.abs(p)>999 ? "&gt;999" : fnum(Math.abs(p),1);
  return '<span class="dlt '+cls+'">'+ar+" "+n+"%</span>";
}
function confBadge(n,lo,hi){ return n>=hi? "ثقة عالية" : n>=lo? "ثقة متوسطة" : "ثقة منخفضة"; }
function pctOf(a,b){ return b>0? a/b*100 : 0; }

function buildInsights(from,to){
  const out=[], T=todayISO();
  const daysAll=seriesByDay(from,to).filter(d=>d.n>0);
  const days=daysAll.filter(d=>d.date!==T);   // النهارده ناقص، مينفعش يدخل تحليل الاتجاه
  const tot=aggFacts(factsIn(from,to));
  const cur=S.cfg.settings.currency, C=CURR[cur]||"";
  const push=(tone,title,body,conf,n)=>out.push({tone,title,body,conf,n:n||0});
  if(!daysAll.length) return out;

  /* — ساعات الذروة — */
  const iv=intervals(from,to);
  if(iv.length>=10){
    const hr=Array.from({length:24},(_,h)=>({h,orders:0,revenue:0,spend:0,n:0}));
    iv.forEach(x=>{ const b=hr[x.hour]; b.orders+=x.vals.orders||0; b.revenue+=x.vals.revenue||0;
      b.spend+=x.vals.spend||0; b.n++; });
    const TO=sum(hr.map(b=>b.orders)), TR=sum(hr.map(b=>b.revenue)), TS=sum(hr.map(b=>b.spend));
    if(TR>0&&TS>0){
      let best=null;
      for(let h=0;h<24;h++){ const w=[0,1,2].map(k=>hr[(h+k)%24]);
        const o=sum(w.map(b=>b.orders)), r=sum(w.map(b=>b.revenue)), s=sum(w.map(b=>b.spend));
        if(!best||r>best.r) best={h,o,r,s,end:(h+3)%24}; }
      if(best&&best.r>0){
        const inR=best.s>0?best.r/best.s:null, outR=(TS-best.s)>0?(TR-best.r)/(TS-best.s):null;
        push("good","وقت البيك",
          "أعلى معدل مبيعات بين <b>"+fhour(best.h)+"</b> و<b>"+fhour(best.end)+"</b> — بتجيب <b>"+
          fnum(pctOf(best.r,TR),0)+"%</b> من الإيراد بـ <b>"+fnum(pctOf(best.s,TS),0)+"%</b> من الصرف"+
          (inR!=null&&outR!=null? ". الـ ROAS في الفترة دي <b>"+fnum(inR,2)+"×</b> مقابل <b>"+fnum(outR,2)+"×</b> في باقي اليوم." : "."),
          confBadge(iv.length,20,60), iv.length);
      }
      let worst=null;
      for(let h=0;h<24;h++){ const w=[0,1,2].map(k=>hr[(h+k)%24]);
        const r=sum(w.map(b=>b.revenue)), s=sum(w.map(b=>b.spend));
        if(s < TS*0.08) continue; const ro=r/s;
        if(!worst||ro<worst.ro) worst={h,end:(h+3)%24,ro,s}; }
      if(worst && worst.ro < (TR/TS)*0.7){
        push("warn",L("أضعف فترة في اليوم","Weakest window of the day"),
          "بين <b>"+fhour(worst.h)+"</b> و<b>"+fhour(worst.end)+"</b> الـ ROAS <b>"+fnum(worst.ro,2)+"×</b> مقابل متوسط يومي <b>"+
          fnum(TR/TS,2)+"×</b>، والفترة دي بتاخد <b>"+fnum(pctOf(worst.s,TS),0)+"%</b> من الصرف. شوف جدولة الإعلانات (Dayparting).",
          confBadge(iv.length,20,60), iv.length);
      }
    }
  } else if(days.length>=2){
    push("info",L("تحليل ساعات الذروة مقفول","Peak-hour analysis is off"),
      "عشان أعرف وقت البيك محتاج <b>أكتر من لقطة في اليوم الواحد</b> — دلوقتي عندي <b>"+iv.length+
      "</b> فترة بس. سجّل الأرقام مرتين–٣ في اليوم (صبح/ضهر/بليل) وهيشتغل لوحده.","ثقة منخفضة",iv.length);
  }

  /* — أفضل أيام الأسبوع — */
  if(days.length>=10){
    const wd=Array.from({length:7},()=>({rev:0,sp:0,n:0}));
    days.forEach(d=>{ const b=wd[parseISO(d.date).getDay()];
      b.rev+=d.vals.revenue||0; b.sp+=d.vals.spend||0; b.n++; });
    const ok=wd.map((b,i)=>({i,roas:b.sp>0?b.rev/b.sp:null,rev:b.rev,n:b.n})).filter(x=>x.n>=2&&x.roas!=null);
    if(ok.length>=4){
      ok.sort((a,b)=>b.roas-a.roas); const hi=ok[0], lo=ok[ok.length-1];
      if(hi.roas>lo.roas*1.2)
        push("info",L("أفضل أيام الأسبوع","Best days of the week"),
          "<b>"+AR_D[hi.i]+"</b> أقوى يوم عندك — ROAS <b>"+fnum(hi.roas,2)+"×</b>، وأضعفهم <b>"+AR_D[lo.i]+
          "</b> بـ <b>"+fnum(lo.roas,2)+"×</b>. فرق <b>"+fnum((hi.roas/lo.roas-1)*100,0)+"%</b> يستاهل تعيد توزيع "+esc(L("الميزانية","Budget"))+" عليه.",
          confBadge(days.length,14,28), days.length);
    }
  }

  /* — المنصات — */
  const pl=breakdown(from,to,"platform").filter(p=>(p.vals.spend||0)>0);
  if(pl.length>=2){
    const TS=sum(pl.map(p=>p.vals.spend)), TR=sum(pl.map(p=>p.vals.revenue));
    const elig=pl.filter(p=>p.vals.spend>=TS*0.05&&p.vals.roas!=null);
    if(elig.length>=2){
      elig.sort((a,b)=>b.vals.roas-a.vals.roas); const hi=elig[0], lo=elig[elig.length-1];
      if(hi.vals.roas>lo.vals.roas*1.25)
        push("good",L("الفرق بين المنصات","Difference between platforms"),
          "<b>"+esc(platById(hi.key).name)+"</b> راجعة <b>"+fnum(hi.vals.roas,2)+"×</b> مقابل <b>"+
          esc(platById(lo.key).name)+"</b> بـ <b>"+fnum(lo.vals.roas,2)+"×</b>. لو حوّلت <b>"+fnum(lo.vals.spend*0.2,0)+" "+C+
          "</b> (٢٠% من صرف الأضعف) للأقوى، الفرق التقديري <b>+"+
          fnum(lo.vals.spend*0.2*(hi.vals.roas-lo.vals.roas),0)+" "+C+"</b> إيراد.",
          confBadge(days.length,5,14), days.length);
    }
    if(TR>0) pl.forEach(p=>{
      const ss=pctOf(p.vals.spend,TS), rs=pctOf(p.vals.revenue,TR);
      if(ss-rs>12&&ss>18)
        push("bad",L("توزيع غير متوازن","Unbalanced allocation"),
          "<b>"+esc(platById(p.key).name)+"</b> بتاخد <b>"+fnum(ss,0)+"%</b> من الصرف وراجعة <b>"+fnum(rs,0)+
          "%</b> من الإيراد بس — فجوة <b>"+fnum(ss-rs,0)+"</b> نقطة.",
          confBadge(days.length,5,14), days.length);
    });
  }

  /* — تناقص العائد — */
  if(days.length>=8){
    pl.forEach(p=>{
      const ds=seriesByDay(from,to,{platforms:[p.key]}).filter(d=>d.n>0&&d.date!==T&&d.vals.spend>0&&d.vals.roas!=null);
      if(ds.length<8) return;
      const sorted=ds.slice().sort((a,b)=>a.vals.spend-b.vals.spend);
      const half=Math.floor(sorted.length/2);
      const lowR=mean(sorted.slice(0,half).map(d=>d.vals.roas));
      const hiR =mean(sorted.slice(-half).map(d=>d.vals.roas));
      const knee=sorted[half-1].vals.spend;
      if(lowR>0&&hiR<lowR*0.82)
        push("warn","تناقص العائد",
          "على <b>"+esc(platById(p.key).name)+"</b>: في الأيام اللي الصرف فيها أقل من <b>"+fnum(knee,0)+" "+C+
          "</b> الـ ROAS متوسطه <b>"+fnum(lowR,2)+"×</b>، وفوق كده بينزل لـ <b>"+fnum(hiR,2)+
          "×</b>. نقطة التشبع التقريبية حوالي <b>"+fnum(knee,0)+" "+C+"</b> في اليوم.",
          confBadge(ds.length,8,18), ds.length);
    });
  }

  /* — الاتجاه — */
  if(days.length>=6){
    ["roas","cpa"].forEach(k=>{
      const m=metricByKey(k); if(!m) return;
      const pts=days.map((d,i)=>({x:i,y:d.vals[k]})).filter(p=>p.y!=null&&isFinite(p.y));
      if(pts.length<6) return;
      const mx=mean(pts.map(p=>p.x)), my=mean(pts.map(p=>p.y));
      const sxy=sum(pts.map(p=>(p.x-mx)*(p.y-my))), sxx=sum(pts.map(p=>(p.x-mx)**2));
      const syy=sum(pts.map(p=>(p.y-my)**2)); if(sxx===0||syy===0) return;
      const b=sxy/sxx, r2=(sxy*sxy)/(sxx*syy);
      const first=my+b*(pts[0].x-mx), last=my+b*(pts[pts.length-1].x-mx);
      const ch=pctChange(first,last);
      if(r2<0.35||ch==null||Math.abs(ch)<10) return;
      const good = m.dir==="down"? ch<0 : ch>0;
      push(good?"good":"bad","اتجاه ثابت في "+m.label,
        "<b>"+m.label+"</b> "+(ch>0?"طالع":"نازل")+" <b>"+fnum(Math.abs(ch),0)+"%</b> على مدار <b>"+
        pts.length+"</b> يوم بشكل منتظم (قوة الاتجاه <b>"+fnum(r2*100,0)+"%</b>). "+
        (good?"استمر على نفس الاتجاه.":L("محتاج تدخل قبل ما يستمر.","Needs action before it continues.")),
        confBadge(pts.length,6,14), pts.length);
    });
  }

  /* — شذوذ — */
  if(days.length>=7){
    [["spend","الصرف"],["revenue","الإيراد"]].forEach(pair=>{
      const k=pair[0], vals=days.map(d=>d.vals[k]||0);
      const mu=mean(vals), sd=stdev(vals); if(sd<=0||mu<=0) return;
      let worst=null;
      days.forEach((d,i)=>{ const z=(vals[i]-mu)/sd;
        if(Math.abs(z)>2.1&&(!worst||Math.abs(z)>Math.abs(worst.z))) worst={d:d.date,z,v:vals[i]}; });
      if(worst) push("info",L("يوم خارج المألوف","An unusual day"),
        "<b>"+fdateFull(worst.d)+"</b>: "+pair[1]+" <b>"+fnum(worst.v,0)+" "+(k==="spend"||k==="revenue"?C:"")+
        "</b> مقابل متوسط <b>"+fnum(mu,0)+"</b> — "+(worst.z>0?"أعلى":"أقل")+" من المعتاد بـ <b>"+
        fnum(Math.abs(worst.z),1)+"</b> انحراف معياري. راجع اليوم ده قبل ما تحسب أي متوسط.",
        confBadge(days.length,7,20), days.length);
    });
  }

  /* — نقطة التعادل — */
  const cls=S.cfg.clients.filter(c=>c.margin!=null&&c.margin>0&&c.margin<1&&(!S.f.clients.length||S.f.clients.indexOf(c.id)>=0));
  cls.forEach(c=>{
    const be=1/c.margin;
    const rows=breakdown(from,to,"platform",{clients:[c.id]}).filter(p=>p.vals.spend>0&&p.vals.roas!=null);
    const bad=rows.filter(p=>p.vals.roas<be);
    if(bad.length&&rows.length){
      const lost=sum(bad.map(p=>p.vals.spend-p.vals.revenue*c.margin));
      push("bad",L("تحت نقطة التعادل — ","Below break-even — ")+esc(c.name),
        "بهامش <b>"+fnum(c.margin*100,0)+"%</b> نقطة التعادل <b>"+fnum(be,2)+"×</b>. "+
        bad.map(p=>esc(platById(p.key).name)+" ("+fnum(p.vals.roas,2)+"×)").join("، ")+
        " تحتها — خسارة تقديرية <b>"+fnum(lost,0)+" "+C+"</b> في الفترة دي.",
        confBadge(days.length,5,14), days.length);
    }
  });

  /* — حرق الميزانية — */
  cls.concat(S.cfg.clients.filter(c=>c.monthlyBudget>0&&cls.indexOf(c)<0))
     .filter(c=>c.monthlyBudget>0).forEach(c=>{
    const t=todayISO(), mStart=t.slice(0,8)+"01";
    const mtd=aggFacts(S.facts.filter(f=>f.date>=mStart&&f.date<=t&&f.clientId===c.id));
    const spent=mtd.spend||0; if(spent<=0) return;
    const dayN=parseISO(t).getDate(), dim=new Date(parseISO(t).getFullYear(),parseISO(t).getMonth()+1,0).getDate();
    const proj=spent/dayN*dim, pctB=proj/c.monthlyBudget;
    const tone = pctB>1.08? "bad" : pctB<0.85? "warn":"good";
    push(tone,L("حرق "+esc(L("الميزانية","Budget"))+" — ","Budget burn — ")+esc(c.name),
      esc(L("صرفت","Spent"))+" <b>"+fnum(spent,0)+" "+C+"</b> من <b>"+fnum(c.monthlyBudget,0)+" "+C+
      "</b> في <b>"+dayN+"</b> يوم. بنفس المعدل هتقفل الشهر على <b>"+fnum(proj,0)+" "+C+"</b> — "+
      (pctB>1.02? "<b>"+esc(L("تجاوز","Over"))+" بـ "+fnum((pctB-1)*100,0)+"%</b>" : pctB<0.9? "<b>أقل من "+esc(L("الميزانية","Budget"))+" بـ "+fnum((1-pctB)*100,0)+"%</b>" : esc(L("في المسار","On track"))+" الصح")+".",
      "ثقة عالية", dayN);
  });

  /* — أيام ناقصة — */
  const all=dateRange(from,to).filter(d=>d<=todayISO());
  const have={}; factsIn(from,to).forEach(f=>{ have[f.date]=1; });
  const miss=all.filter(d=>!have[d]);
  if(miss.length&&miss.length<all.length)
    push("warn","بيانات ناقصة",
      "<b>"+miss.length+"</b> يوم من <b>"+all.length+"</b> في الفترة دي من غير أي بيانات ("+
      miss.slice(0,4).map(fdate).join("، ")+(miss.length>4?" و"+(miss.length-4)+" غيرهم":"")+
      L("). المتوسطات محسوبة على الأيام اللي فيها بيانات بس.","). Averages are computed only over days that have data."),"ثقة عالية",miss.length);

  const order={bad:0,warn:1,good:2,info:3};
  return out.sort((a,b)=>order[a.tone]-order[b.tone]);
}
/* ══════════════════ 8.5 محرك الذكاء ══════════════════
   طبقة فوق محرك الميترِكس. مش بتلمس الداتا الخام ولا بتخترع أسباب —
   كل حكم بيرجع معاه الأرقام اللي اتبنى عليها ودرجة الثقة.        */

const INTEL_DEF={
  minSpend:500, minOrders:10, minDays:3, minSnaps:3,
  sigma:2, baselineDays:30, baselineMin:7,
  pacingTol:0.10,
  weights:{target:30,cpa:15,trend:15,pacing:10,cvr:10,ctr:5,suff:15},
  bandHealthy:80, bandWatch:60, bandOpt:40,
  scaleMargin:1.15, killMargin:0.70, changeMinPct:8, trendMinR2:0.30
};
function IN(){
  const u=S.cfg.intel||{};
  return Object.assign({},INTEL_DEF,u,{weights:Object.assign({},INTEL_DEF.weights,u.weights||{})});
}

/* ── ذاكرة مؤقتة: مفيش إعادة حساب مع كل رسمة ── */
let DATA_VER=0; const MEMO=new Map();
function bumpVer(){ DATA_VER++; MEMO.clear(); }
function memo(k,fn){ const key=DATA_VER+"|"+k;
  if(MEMO.has(key)) return MEMO.get(key);
  const v=fn(); if(MEMO.size>3000) MEMO.clear(); MEMO.set(key,v); return v; }
function fSig(ov){ const F=Object.assign({},S.f,ov||{});
  return (S.ws||"-")+"/"+(F.clients||[]).join(",")+"/"+(F.platforms||[]).join(",")+"/"+(F.campaign||""); }

/* ── الأهداف ── */
function targetFor(key,clientId){
  const t=S.cfg.targets||[];
  let x=clientId? t.find(q=>q.metricKey===key&&q.clientId===clientId) : null;
  if(!x) x=t.find(q=>q.metricKey===key&&q.clientId==="*");
  return x? x.value : null;
}
function roasTarget(clientId){
  const t=targetFor("roas",clientId);
  if(t!=null&&t>0) return {v:t,src:L("الهدف المحدد","the set target"),kind:"target"};
  const c=clientId?clientById(clientId):null;
  if(c&&c.margin>0) return {v:1/c.margin,src:L("نقطة التعادل","break-even"),kind:"breakeven"};
  const ms=S.cfg.clients.filter(x=>x.margin>0);
  if(!clientId&&ms.length) return {v:1/mean(ms.map(x=>x.margin)),src:L("نقطة التعادل","break-even"),kind:"breakeven"};
  return null;
}
/** المرجع بالترتيب: هدف محدد ← نقطة التعادل ← معتادك التاريخي.
    التالت بيخلي النظام يشتغل من غير هامش ربح، بس بيحكم على «أحسن/أوحش من عادتك»
    مش على «رابح/خسران» — وده فرق لازم يفضل واضح في كل جملة. */
function roasRef(sc){
  const t=roasTarget(sc.clientId); if(t) return t;
  const bl=sc.baselines&&sc.baselines.roas;
  if(bl&&bl.mean>0&&bl.n>=IN().baselineMin)
    return {v:bl.mean,src:L("معتادك التاريخي","your historical usual"),kind:"self",n:bl.n};
  return null;
}

/* ── كفاية البيانات ── */
function sufficiency(vals,nDays,nSnaps){
  const c=IN(), miss=[], part=[];
  const chk=(have,need,label,fmt)=>{
    have=+have||0; part.push(clamp(have/need,0,1));
    if(have<need) miss.push(label+" "+(fmt?fmt(have):fnum(have,0))+" من "+(fmt?fmt(need):fnum(need,0))+" المطلوب");
  };
  chk(vals.spend,c.minSpend,"الصرف");
  chk(vals.orders,c.minOrders,"الطلبات");
  chk(nDays,c.minDays,"أيام البيانات");
  chk(nSnaps,c.minSnaps,"عدد اللقطات");
  const score=mean(part);
  return {ok:miss.length===0, score:score,
    level: miss.length===0?"high" : score>=.6?"medium" : score>=.3?"low":"none",
    label: miss.length===0?esc(L("بيانات كافية","Enough data")) : score>=.6?esc(L("بيانات شبه كافية","Nearly enough data")) : L("بيانات غير كافية","Not enough data"),
    reasons:miss};
}

/* ── الخط المرجعي التاريخي ── */
function baselineFor(key,from,ov){
  const c=IN();
  return memo("bl:"+key+":"+from+":"+fSig(ov),()=>{
    const days=seriesByDay(addDays(from,-c.baselineDays),addDays(from,-1),ov)
      .filter(d=>d.n>0&&d.vals[key]!=null&&isFinite(d.vals[key]));
    if(days.length<c.baselineMin) return null;
    const v=days.map(d=>d.vals[key]), mu=mean(v), sd=stdev(v);
    return {mean:mu,sd:sd,lo:mu-c.sigma*sd,hi:mu+c.sigma*sd,n:days.length};
  });
}
function rawScopeForDim(dim,key){
  if(dim==="platform") return {platforms:[key]};
  if(dim==="client")   return {clients:[key]};
  return {campaignExact:key};
}
/** خط مرجعي محسوب من تاريخ النطاق نفسه — بيشتغل على الحملات كمان مش المنصات بس */
function baselineFromFacts(key,from,sc){
  const c=IN();
  return memo("blf:"+key+":"+from+":"+JSON.stringify(sc),()=>{
    const f=factsRaw(addDays(from,-c.baselineDays),addDays(from,-1),sc);
    if(!f.length) return null;
    const g=groupBy(f,x=>x.date);
    const v=Object.keys(g).map(d=>aggFacts(g[d])[key]).filter(x=>x!=null&&isFinite(x));
    if(v.length<c.baselineMin) return null;
    const mu=mean(v), sd=stdev(v);
    return {mean:mu,sd:sd,lo:mu-c.sigma*sd,hi:mu+c.sigma*sd,n:v.length};
  });
}
function anomalyFor(cur,bl){
  if(!bl||cur==null||!isFinite(cur)||!(bl.sd>0)) return null;
  const z=(cur-bl.mean)/bl.sd;
  if(Math.abs(z)<IN().sigma) return null;
  return {z:z,dir:z>0?"up":"down",lo:bl.lo,hi:bl.hi,mean:bl.mean,n:bl.n};
}

/* ── الاتجاه ── */
function linreg(ys){
  const pts=[]; ys.forEach((y,i)=>{ if(y!=null&&isFinite(y)) pts.push([i,y]); });
  if(pts.length<4) return null;
  const mx=mean(pts.map(p=>p[0])), my=mean(pts.map(p=>p[1]));
  const sxy=sum(pts.map(p=>(p[0]-mx)*(p[1]-my))), sxx=sum(pts.map(p=>Math.pow(p[0]-mx,2))),
        syy=sum(pts.map(p=>Math.pow(p[1]-my,2)));
  if(sxx===0||syy===0) return null;
  const b=sxy/sxx, r2=(sxy*sxy)/(sxx*syy);
  const f=my+b*(pts[0][0]-mx), l=my+b*(pts[pts.length-1][0]-mx);
  return {slope:b,r2:r2,pct:pctChange(f,l),n:pts.length};
}

/* ── حرق الميزانية والتوقع ── */
function pacingFor(clientId){
  const c=clientId?clientById(clientId):null;
  if(!c||!(c.monthlyBudget>0)) return null;
  const T=todayISO();
  const start=c.budgetStart||T.slice(0,8)+"01";
  const end=c.budgetEnd||iso(new Date(parseISO(T).getFullYear(),parseISO(T).getMonth()+1,0));
  if(T<start) return null;
  const cur=T>end?end:T;
  const total=diffDays(start,end)+1, done=diffDays(start,cur)+1, left=total-done;
  const actual=aggFacts(S.facts.filter(f=>f.date>=start&&f.date<=cur&&f.clientId===clientId)).spend||0;
  const expected=c.monthlyBudget*(done/total);
  const forecast=done>0? actual/done*total : 0;
  const pacing=expected>0? actual/expected : 0;
  const tol=IN().pacingTol;
  return {budget:c.monthlyBudget,start,end,total,done,left,actual,expected,forecast,pacing,
    remaining:Math.max(0,c.monthlyBudget-actual),
    dailyLeft: left>0? Math.max(0,c.monthlyBudget-actual)/left : 0,
    status: pacing>1+tol?"over" : pacing<1-tol?"under" : "ok"};
}

/* ── درجة الصحة ── */
function healthScore(sc){
  const c=IN(), W=c.weights, parts=[], v=sc.vals||{};
  const add=(key,label,score,weight,note)=>{
    if(score==null||!isFinite(score)) return;
    parts.push({key,label,score:clamp(score,0,100),weight,note});
  };
  const rt=roasRef(sc);
  if(rt&&v.roas!=null&&isFinite(v.roas))
    add("target",L("ROAS مقابل ","ROAS vs ")+rt.src, v.roas/rt.v*75, W.target,
      fnum(v.roas,2)+L("× مقابل ","× vs ")+fnum(rt.v,2)+"×");
  const ct=targetFor("cpa",sc.clientId);
  if(ct>0&&v.cpa>0) add("cpa",L("تكلفة الطلب مقابل الهدف","CPA vs target"), ct/v.cpa*75, W.cpa,
    fnum(v.cpa,2)+" مقابل هدف "+fnum(ct,2));
  if(sc.trend&&sc.trend.pct!=null&&sc.trend.r2>=c.trendMinR2)
    add("trend",L("اتجاه ROAS","ROAS trend"), 70+sc.trend.pct*1.5, W.trend,
      (sc.trend.pct>0?"+":"")+fnum(sc.trend.pct,0)+"% على "+sc.trend.n+L(" يوم"," days"));
  if(sc.pacing) add("pacing",L(L("انضباط "+esc(L("الميزانية","Budget")),"Budget discipline"),"Budget discipline"),
    100-Math.max(0,Math.abs(sc.pacing.pacing-1)-c.pacingTol)*250, W.pacing,
    fnum(sc.pacing.pacing*100,0)+L("% من المخطط","% of plan"));
  ["cvr","ctr"].forEach(k=>{
    const bl=sc.baselines&&sc.baselines[k];
    if(bl&&bl.mean>0&&v[k]!=null&&isFinite(v[k]))
      add(k,mkLabel(k)+L(" مقابل المعتاد"," vs usual"), v[k]/bl.mean*75, W[k],
        fval(v[k],metricByKey(k),true)+L(" مقابل معتاد "," vs usual ")+fval(bl.mean,metricByKey(k),true));
  });
  if(sc.suff) add("suff",L("كفاية البيانات","Data sufficiency"), sc.suff.score*100, W.suff, sc.suff.label);
  const tw=sum(parts.map(p=>p.weight));
  if(!tw) return {score:null, band:"nodata", label:"مفيش مرجع", parts:[],
    why:L("مفيش هدف ولا هامش ربح ولا تاريخ كافي أقيس عليه.","No target, no margin and not enough history to measure against.")};
  const score=sum(parts.map(p=>p.score*p.weight))/tw;
  const band = score>=c.bandHealthy?"healthy" : score>=c.bandWatch?"watch"
             : score>=c.bandOpt?"optimize" : "critical";
  return {score:score, band:band, label:HEALTH_LABEL[band], parts:parts,
    weakest: parts.slice().sort((a,b)=>a.score-b.score)[0]};
}
const HEALTH_LABEL=new Proxy({},{get:(t,k)=>({
  healthy:L("سليم","Healthy"),watch:L(L("تحت المراقبة","Monitor"),"Watch"),optimize:L("محتاج تحسين","Needs work"),
  critical:L("حرج","Critical"),nodata:L("مفيش مرجع","No reference")}[k])});
const HEALTH_TONE ={healthy:"good",watch:"warn",optimize:"warn",critical:"bad",nodata:"info"};
const HEALTH_COLOR={healthy:"var(--good)",watch:"var(--warn)",optimize:"var(--orange)",critical:"var(--bad)",nodata:"var(--ink-3)"};

/* ── القرار والتوصية ── */
const DEC=new Proxy({},{get:(t,k)=>({
  scale:{label:L("وسّع","Scale"),tone:"good",color:"var(--good)",icon:"▲"},
  watch:{label:L("راقب","Watch"),tone:"warn",color:"var(--warn)",icon:"◆"},
  optimize:{label:L("حسّن","Optimize"),tone:"warn",color:"var(--orange)",icon:"◇"},
  kill:{label:L("أوقف / راجع","Pause / review"),tone:"bad",color:"var(--bad)",icon:"■"},
  nodata:{label:L(L("بيانات غير كافية","Not enough data"),"Insufficient data"),tone:"info",color:"var(--ink-3)",icon:"?"}
}[k])});
function decisionFor(sc){
  const c=IN(), v=sc.vals||{}, suff=sc.suff, hs=sc.health, rt=roasRef(sc);
  const C=CURR[S.cfg.settings.currency]||"";
  if(!suff||!suff.ok)
    return {status:"nodata", conf:"منخفضة",
      why:"مقدرش أحكم — "+(suff?suff.reasons.join("، "):L("مفيش بيانات","No data"))+".",
      rec:L("كمّل تجميع بيانات قبل أي قرار وقف أو توسيع.","Keep gathering data before any pause or scale decision.")};
  if(!rt)
    return {status:"watch", conf:"منخفضة",
      why:L("مفيش هدف ROAS ولا هامش ربح، ولسه مفيش تاريخ كافي أبني منه مرجع.","No ROAS target, no profit margin, and not yet enough history to build a reference."),
      rec:L("كمّل تسجيل بيانات — بعد ","Keep logging data — after ")+c.baselineMin+L(" يوم النظام هيبني مرجع من أرقامك نفسها، "," days the system will build a reference from your own numbers, ")+
        L("أو حدد هدف ROAS دلوقتي من لوحة التحكم ← الأهداف.","or set a ROAS target now from Admin → Targets.")};
  const r=v.roas/rt.v, tr=sc.trend, trTxt = tr&&tr.pct!=null&&tr.r2>=c.trendMinR2
    ? " والاتجاه "+(tr.pct>0?"صاعد":"هابط")+" "+fnum(Math.abs(tr.pct),0)+"% على "+tr.n+L(" يوم"," days") : "";
  const self=rt.kind==="self";
  const base="ROAS "+fnum(v.roas,2)+L("× مقابل ","× vs ")+rt.src+" "+fnum(rt.v,2)+"×"+
    (self?" (متوسط "+rt.n+" يوم)":"")+trTxt+".";
  const dc = self? (suff.level==="high"?"متوسطة":L("منخفضة","low")) : (suff.level==="high"?"عالية":L("متوسطة","medium"));
  if(r>=c.scaleMargin && hs.score!=null && hs.score>=c.bandWatch+10 && (!tr||tr.pct==null||tr.pct>-10))
    return {status:"scale", conf:dc, why:base,
      rec:L("زوّد "+esc(L("الميزانية","Budget"))+" تدريجياً ١٥–٢٠% وراقب يومين. القفزات الكبيرة بتعيد مرحلة التعلّم.","Raise the budget gradually by 15-20% and watch for two days. Big jumps reset the learning phase.")+
        (self?" <b>ملحوظة:</b> "+esc(L("المرجع","Reference"))+" هنا معتادك مش ربحيتك — لو الهامش ضعيف ممكن ده يكون توسيع في خسارة.":"")};
  // من غير هامش ربح أو هدف، مينفعش النظام يقول «أوقف» — أقصى حكم «حسّن»
  if(r<c.killMargin && (v.spend||0)>=c.minSpend*2 && (!tr||tr.pct==null||tr.pct<5)){
    if(self) return {status:"optimize", conf:"منخفضة",
      why:base+L(" أقل من معتادك بفارق كبير على صرف "," well below your usual, on spend of ")+fnum(v.spend,0)+" "+C+".",
      rec:L("مقدرش أقول «أوقف» من غير هامش ربح أو هدف — معنديش مرجع للربحية، ","I can't say 'stop' without a margin or a target — I have no profitability reference, ")+
        L("معنديش غير إنه أقل من عادتك. حدد هامش الربح أو هدف ROAS وأنا أقدر أحسم.","all I have is that it's below your usual. Set a profit margin or a ROAS target and I can call it.")};
    return {status:"kill", conf:"عالية", why:base+" صرف "+fnum(v.spend,0)+" "+C+L(" من غير ما يوصل لنقطة التعادل."," without reaching break-even."),
      rec:L("فكّر في الإيقاف أو تخفيض "+esc(L("الميزانية","Budget"))+" بشكل حاد. لو هتكمل، غيّر حاجة واحدة بس عشان تعرف أثرها.","Consider pausing or cutting the budget sharply. If you continue, change one thing only so you can tell what it did.")};
  }
  if(r<1){
    const w=hs.weakest;
    return {status:"optimize", conf: suff.level==="high"?"متوسطة":L("منخفضة","low"), why:base,
      rec:L("أضعف مؤشر عندك: ","Your weakest signal: ")+(w?w.label+" ("+fnum(w.score,0)+"/100)":"—")+
        L(". ابدأ من عنده — شوف قسم «التشخيص» عشان تعرف المشكلة قبل الكليك ولا بعده.",". Start there — check the diagnosis section to see whether the problem is before or after the click.")};
  }
  return {status:"watch", conf:"متوسطة", why:base,
    rec:L("الأداء فوق "+esc(L("المرجع","Reference"))+" بس مش بفارق يستاهل توسيع. سيبه يجمع بيانات أكتر.","Performance is above the reference but not by enough to scale. Let it gather more data.")};
}

/* ── إيه اللي اتغير + التشخيص ── */
const CHANGE_KEYS=["spend","revenue","roas","orders","cpa","aov","ctr","cvr","cpc","cpm"];
function whatChanged(A,B){
  const out=[];
  CHANGE_KEYS.forEach(k=>{
    const m=metricByKey(k); if(!m) return;
    const a=A[k], b=B[k];
    if(a==null||b==null||!isFinite(a)||!isFinite(b)) return;
    const p=pctChange(b,a); if(p==null) return;
    out.push({key:k,label:mLabel(m),m:m,cur:a,prev:b,pct:p,
      good: m.dir==="down"? p<0 : m.dir==="up"? p>0 : null});
  });
  return out.sort((x,y)=>Math.abs(y.pct)-Math.abs(x.pct));
}
/** تشخيص مبني على تفكيك ROAS = (impressions × CTR × CVR × AOV) ÷ spend — من غير أي سبب مخترع */
function diagnose(ch){
  const c=IN(), by={}; ch.forEach(x=>{ by[x.key]=x; });
  const roas=by.roas;
  if(!roas||Math.abs(roas.pct)<c.changeMinPct)
    return {text:L("الـ ROAS ما اتغيرش بشكل يستاهل تشخيص في الفترة دي.","ROAS didn't move enough to warrant a diagnosis this period."),sure:true};
  const comp=[["ctr","جذب الكليك"],["cvr",L("التحويل بعد الكليك","conversion after the click")],["aov",L("متوسط قيمة الطلب","Average order value")],["cpm","تكلفة الظهور"]]
    .map(p=>by[p[0]]?{k:p[0],name:p[1],pct:by[p[0]].pct,label:by[p[0]].label}:null).filter(Boolean);
  if(!comp.length)
    return {text:L("البيانات غير كافية لتحديد السبب — محتاج ظهور ونقرات وطلبات مسجلة، مش الصرف والإيراد بس.","Not enough data to identify the cause — impressions, clicks and orders need to be recorded, not just spend and revenue."),sure:false};
  const down=roas.pct<0;
  const blame=comp.slice().sort((a,b)=> down? a.pct-b.pct : b.pct-a.pct)[0];
  if(Math.abs(blame.pct)<c.changeMinPct)
    return {text:"الـ ROAS "+(down?"نزل":"طلع")+" <b>"+fnum(Math.abs(roas.pct),0)+
      "%</b> من غير ما أي مؤشر من مؤشرات القمع يتحرك بشكل واضح — التغيير غالباً من تركيبة الصرف بين المنصات أو الحملات مش من كفاءة القمع نفسه.",sure:false};
  const stable=comp.filter(x=>x.k!==blame.k&&Math.abs(x.pct)<c.changeMinPct).map(x=>x.label);
  const where = blame.k==="ctr" ? L("المشكلة قبل الكليك — الكرييتف أو الاستهداف.","The problem is before the click — creative or targeting.")
    : blame.k==="cvr" ? L("المشكلة بعد الكليك — اللاندنج أو العرض أو الشيك أوت.","The problem is after the click — landing page, offer or checkout.")
    : blame.k==="aov" ? L("المشكلة في تركيبة السلة أو العرض، مش في جلب الزيارات.","The problem is in the basket mix or the offer, not in attracting traffic.")
    : L("التكلفة الإعلانية نفسها اتغيرت — مزاد أو جمهور أو تشبع كرييتف.","Ad cost itself moved — auction, audience, or creative fatigue.");
  return {text:"الـ ROAS "+(down?"نزل":"طلع")+" <b>"+fnum(Math.abs(roas.pct),0)+"%</b>، وأكبر محرك هو <b>"+
    blame.label+"</b> ("+(blame.pct>0?"+":"")+fnum(blame.pct,0)+"%)"+
    (stable.length?L(" مع ثبات نسبي في "," while staying relatively stable in ")+stable.join(" و"):"")+". "+where,sure:true};
}

/* ── الأولوية ── */
function priorityOf(a){
  const sevW={bad:1,warn:.6,info:.3}[a.tone]||.3;
  const confW={"عالية":1,"متوسطة":.65,"منخفضة":.3}[a.conf]||.5;
  const tot=aggFacts(factsIn.apply(null,resolveRange()));
  const sShare=tot.spend>0? clamp((a.spend||0)/tot.spend,0,1) : 0;
  const rShare=tot.revenue>0? clamp((a.revenue||0)/tot.revenue,0,1) : 0;
  const dev=clamp(Math.abs(a.dev||0)/100,0,1);
  const raw=sevW*(0.40*sShare+0.30*rShare+0.20*dev+0.10*confW);
  const score=Math.round(raw*100);
  return {score:score,
    band: score>=28?"critical" : score>=15?"high" : score>=7?"medium" : "low"};
}
const PRI_C={critical:"var(--bad)",high:"var(--orange)",medium:"var(--warn)",low:"var(--info)"};
const PRI=new Proxy({},{get:(t,k)=>({
  critical:{label:L("حرج","Critical"),color:PRI_C.critical,note:L(L("يحتاج تدخل فوري","Act now"),"Act now")},
  high:{label:L("عالي","High"),color:PRI_C.high,note:L(L("راجعه النهارده","Review today"),"Review today")},
  medium:{label:L("متوسط","Medium"),color:PRI_C.medium,note:L(L("تحت المراقبة","Monitor"),"Monitor")},
  low:{label:L("للعلم","Info"),color:PRI_C.low,note:L(L("معلومة فقط","For information"),"For information")}}[k])});

/* ── ملف تقييم لأي شريحة ── */
function assess(from,to,ov,clientId){
  return memo("as:"+from+":"+to+":"+fSig(ov)+":"+(clientId||"-"),()=>{
    const facts=factsIn(from,to,ov);
    const vals=aggFacts(facts);
    const days=seriesByDay(from,to,ov).filter(d=>d.n>0);
    const nSnaps=sum(facts.map(f=>f.snaps.length));
    const suff=sufficiency(vals,days.length,nSnaps);
    const trend=linreg(days.filter(d=>d.date!==todayISO()).map(d=>d.vals.roas));
    const pacing=clientId?pacingFor(clientId):null;
    const baselines={}; ["roas","cpa","cvr","ctr","spend","revenue"].forEach(k=>{
      baselines[k]=baselineFor(k,from,ov); });
    const sc={vals,days,nSnaps,suff,trend,pacing,baselines,clientId};
    sc.health=healthScore(sc);
    sc.decision=decisionFor(sc);
    return sc;
  });
}

function ovForDim(dim,key,ov){
  if(dim==="campaign") return null;
  const o=Object.assign({},ov||{});
  if(dim==="platform") o.platforms=[key]; else if(dim==="client") o.clients=[key];
  return o;
}
function factsForDim(from,to,dim,key,ov){
  if(dim==="campaign") return factsIn(from,to,ov).filter(f=>(f.campaign||"—")===key);
  return factsIn(from,to,ovForDim(dim,key,ov));
}
/** التقييم الكامل لأي بُعد — بيستخدمه مركز الإجراءات وجدول القرارات مع بعض */
function assessDim(from,to,dim,key,ov){
  return memo("ad:"+dim+":"+key+":"+from+":"+to+":"+fSig(ov),()=>{
    const facts=factsForDim(from,to,dim,key,ov), dov=ovForDim(dim,key,ov);
    const vals=aggFacts(facts);
    const dayset={}; facts.forEach(f=>{ dayset[f.date]=1; });
    const nDays=Object.keys(dayset).length, nSnaps=sum(facts.map(f=>f.snaps.length));
    const suff=sufficiency(vals,nDays,nSnaps);
    let series;
    if(dov) series=seriesByDay(from,to,dov).filter(d=>d.n>0);
    else { const g=groupBy(facts,f=>f.date);
      series=Object.keys(g).sort().map(d=>({date:d,n:g[d].length,vals:aggFacts(g[d])})); }
    const trend=linreg(series.filter(d=>d.date!==todayISO()).map(d=>d.vals.roas));
    const cids={}; facts.forEach(f=>{ cids[f.clientId]=1; });
    const ck=Object.keys(cids), clientId=ck.length===1?ck[0]:null;
    const baselines={}, rsc=rawScopeForDim(dim,key);
    ["cvr","ctr","cpa","roas"].forEach(k=>{ baselines[k]=baselineFromFacts(k,from,rsc); });
    const sc={vals,suff,trend,clientId,baselines,facts,series,ov:dov,
      pacing: dim==="client"? pacingFor(key) : null};
    sc.health=healthScore(sc); sc.decision=decisionFor(sc);
    return sc;
  });
}

/* ══ مركز الإجراءات ══ */
function decisionDim(from,to,ov){
  const camps=breakdown(from,to,"campaign",ov).filter(r=>r.key!=="—"&&(r.vals.spend||0)>0);
  return camps.length>=2? "campaign" : "platform";
}
function buildActions(from,to){
  return memo("ac:"+from+":"+to+":"+fSig(),()=>{
    const out=[], C=CURR[S.cfg.settings.currency]||"", c=IN();
    const cmp=resolveCmp(from,to);
    const push=o=>{ o.pri=priorityOf(o); out.push(o); };

    /* 1) قواعد التنبيه اللي كتبتها بنفسك */
    evalAlerts(from,to).forEach(a=>push(Object.assign({
      kind:"rule", ts:Date.now(), conf:"عالية", dev:a.dev||0,
      spend:a.spend||0, revenue:a.revenue||0,
      rec:L("القاعدة دي إنت كاتبها. راجع الشريحة أو عدّل الحد من لوحة التحكم ← التنبيهات.","You wrote this rule. Review the segment or change the threshold in Admin → Alerts.")
    },a)));

    /* 2) حالة كل حملة: قرار + هدف + شذوذ */
    const dim=decisionDim(from,to,null);
    const scopes=breakdown(from,to,dim).filter(r=>(r.vals.spend||0)>0).map(r=>({
      key:r.key, name: dim==="campaign"? (r.key==="—"?"(بدون حملة)":r.key)
        : dim==="platform"? platById(r.key).name : ((clientById(r.key)||{}).name||r.key)}));

    scopes.forEach(sp=>{
      const sc=assessDim(from,to,dim,sp.key,null);
      const vals=sc.vals, suff=sc.suff, dec=sc.decision, ov=sc.ov, clientId=sc.clientId;
      if(!(vals.spend>0)) return;
      const pls={}; sc.facts.forEach(f=>{ pls[f.platformId]=1; });
      const pl=Object.keys(pls);
      const meta={clientId:clientId, platformId:pl.length===1?pl[0]:null,
        campaign:dim==="campaign"?sp.name:null, scopeName:sp.name,
        spend:vals.spend, revenue:vals.revenue, conf:dec.conf, health:sc.health, dec:dec, vals:vals};

      const rt=roasRef(sc);
      if(rt&&vals.roas!=null&&vals.roas<rt.v&&suff.ok){
        const dev=(vals.roas/rt.v-1)*100;
        push(Object.assign({kind:"target",
          tone: (rt.kind!=="self"&&vals.roas<rt.v*c.killMargin)?"bad":"warn",
          conf: rt.kind==="self"?"متوسطة":L("عالية","high"),
          title: rt.kind==="self"?"أقل من معتادك — ROAS":"ROAS تحت "+rt.src, ts:Date.now(), dev:dev,
          cur:fnum(vals.roas,2)+"×", tgt:fnum(rt.v,2)+"×",
          body:"<b>"+esc(sp.name)+"</b> — ROAS <b>"+fnum(vals.roas,2)+"×</b> مقابل <b>"+fnum(rt.v,2)+
            "×</b> ("+fnum(dev,0)+"%) على صرف <b>"+fnum(vals.spend,0)+" "+C+"</b>.",
          rec:dec.rec},meta));
      }
      if(dec.status==="scale")
        push(Object.assign({kind:"opportunity",tone:"info",title:"فرصة توسيع",ts:Date.now(),
          conf:dec.conf,
          dev: rt? (vals.roas/rt.v-1)*100 : 0, cur:fnum(vals.roas,2)+"×", tgt:rt?fnum(rt.v,2)+"×":"—",
          body:"<b>"+esc(sp.name)+"</b> — "+dec.why, rec:dec.rec},meta));

      /* شذوذ مقابل التاريخ */
      {
        ["cpa","roas"].forEach(k=>{
          const bl=sc.baselines[k], an=anomalyFor(vals[k],bl);
          if(!an) return;
          const m=metricByKey(k), bad = m.dir==="down"? an.dir==="up" : an.dir==="down";
          if(!bad) return;
          push(Object.assign({kind:"anomaly",tone:"warn",title:L("خروج عن المعتاد — ","Outside the usual range — ")+m.label,ts:Date.now(),
            dev:pctChange(bl.mean,vals[k])||0, cur:fval(vals[k],m,true), tgt:fval(bl.mean,m,true),
            body:"<b>"+esc(sp.name)+"</b> — "+esc(mLabel(m))+" <b>"+fval(vals[k],m,true)+
              "</b> والنطاق المعتاد <b>"+fval(bl.lo,m,true)+" – "+fval(bl.hi,m,true)+
              "</b> (محسوب من "+bl.n+" يوم).",
            conf: bl.n>=14?"عالية":L("متوسطة","medium"),
            rec:L("اتأكد الأول إن ده مش تغيير إنت عملته (ميزانية / كرييتف / استهداف) قبل ما تتعامل معاه كمشكلة.","First make sure this isn't a change you made yourself (budget / creative / targeting) before treating it as a problem.")},meta));
        });
      }
    });

    /* 3) حرق الميزانية */
    S.cfg.clients.forEach(cl=>{
      if(S.ws&&cl.id!==S.ws) return;
      if(S.f.clients.length&&S.f.clients.indexOf(cl.id)<0) return;
      const p=pacingFor(cl.id); if(!p||p.actual<=0) return;
      if(p.status==="ok") return;
      const over=p.status==="over";
      push({kind:"pacing",tone:over?"bad":"warn",title:over?esc(L("تجاوز","Over"))+" "+esc(L("الميزانية","Budget")):L("صرف "+esc(L("أبطأ من الخطة","Slower than plan")),"Spending slower than planned"),
        clientId:cl.id, scopeName:cl.name, ts:Date.now(), conf:"عالية",
        dev:(p.pacing-1)*100, spend:p.actual, revenue:0,
        cur:fnum(p.actual,0)+" "+C, tgt:fnum(p.expected,0)+" "+C,
        body: EN()
          ? "<b>"+esc(cl.name)+"</b> — spent <b>"+fnum(p.actual,0)+" "+C+"</b> against a plan of <b>"+
            fnum(p.expected,0)+" "+C+"</b> to date ("+fnum(p.pacing*100,0)+"%). At this rate the period ends at <b>"+
            fnum(p.forecast,0)+" "+C+"</b> on a budget of <b>"+fnum(p.budget,0)+" "+C+"</b>, with <b>"+p.left+"</b> days left."
          : "<b>"+esc(cl.name)+"</b> — صرفت <b>"+fnum(p.actual,0)+" "+C+"</b> والمخطط لحد النهارده <b>"+
            fnum(p.expected,0)+" "+C+"</b> ("+fnum(p.pacing*100,0)+"%). المتوقع آخر الفترة <b>"+
            fnum(p.forecast,0)+" "+C+"</b> من ميزانية <b>"+fnum(p.budget,0)+" "+C+"</b>، فاضل <b>"+p.left+"</b> يوم.",
        rec: over
          ? L("قلّل السقف اليومي لـ <b>"+fnum(p.dailyLeft,0)+" "+C+"</b> عشان تخلص الفترة في الميزانية.",
              "Cut the daily cap to <b>"+fnum(p.dailyLeft,0)+" "+C+"</b> to finish the period within budget.")
          : L("تقدر تزوّد السقف اليومي لـ <b>"+fnum(p.dailyLeft,0)+" "+C+"</b> من غير ما تتجاوز.",
              "You can raise the daily cap to <b>"+fnum(p.dailyLeft,0)+" "+C+"</b> without going over.")});
    });

    /* 4) جودة البيانات */
    const all=dateRange(from,to).filter(d=>d<=todayISO());
    const have={}; factsIn(from,to).forEach(f=>{ have[f.date]=1; });
    const miss=all.filter(d=>!have[d]);
    if(miss.length&&miss.length<all.length)
      push({kind:"data",tone:"warn",title:L("أيام من غير بيانات","Days with no data"),scopeName:"جودة البيانات",
        ts:Date.now(),conf:"عالية",dev:miss.length/all.length*100,spend:0,revenue:0,
        cur:miss.length+L(" يوم"," days"),tgt:"0",
        body:"<b>"+miss.length+"</b> يوم من <b>"+all.length+"</b> من غير أي بيانات ("+
          miss.slice(0,4).map(fdate).join("، ")+(miss.length>4?" و"+(miss.length-4)+" غيرهم":")")+
          L(". كل المتوسطات والاتجاهات محسوبة على الأيام اللي فيها بيانات بس.",". All averages and trends are computed only over days that have data."),
        rec:L("سجّل الأيام الناقصة أو استوردها، وإلا الاستنتاجات هتفضل ناقصة.","Log or import the missing days, otherwise the insights stay incomplete.")});

    const ord={critical:0,high:1,medium:2,low:3};
    return out.sort((a,b)=> ord[a.pri.band]-ord[b.pri.band] || b.pri.score-a.pri.score);
  });
}

/* ══════════════════ 8.7 قياس التدخل ══════════════════
   سجل التغييرات والتجارب. الهدف: نقفل السؤال السادس — «قراري نفع ولا لأ؟»
   القياس هنا مقارنة قبل/بعد، مش اختبار دلالة إحصائية — والفرق ده مكتوب في الواجهة. */

const CH_TYPES=[["budget","ميزانية","Budget"],["creative","كرييتف","Creative"],["audience","استهداف","Audience"],
  ["bid","مزايدة","Bidding"],["landing","لاندنج / موقع","Landing page"],["offer","عرض / سعر","Offer / price"],
  ["pause","إيقاف","Paused"],["resume","تشغيل","Resumed"],["structure","هيكلة حملات","Restructure"],
  ["other","حاجة تانية","Other"]];
const chTypeName=t=>pickL(CH_TYPES,t);

/** فلترة مستقلة تماماً عن فلاتر الواجهة — القياس لازم يبقى ثابت مهما غيّرت الشاشة */
function factsRaw(from,to,sc){
  sc=sc||{};
  return memo("fr:"+from+":"+to+":"+JSON.stringify(sc),()=>
    S.facts.filter(f=> f.date>=from && f.date<=to
      && (!sc.clients||!sc.clients.length||sc.clients.indexOf(f.clientId)>=0)
      && (!sc.platforms||!sc.platforms.length||sc.platforms.indexOf(f.platformId)>=0)
      && (!sc.campaign||String(f.campaign||"").toLowerCase().indexOf(String(sc.campaign).toLowerCase())>=0)
      && (!sc.campaignExact||(f.campaign||"—")===sc.campaignExact)));
}
function scopeOf(o){
  const s={};
  if(o.clientId) s.clients=[o.clientId];
  if(o.platformId) s.platforms=[o.platformId];
  if(o.campaign) s.campaign=o.campaign;
  return s;
}
function scopeLabel(o){
  const p=[];
  if(o.clientId) p.push((clientById(o.clientId)||{}).name||o.clientId);
  if(o.platformId) p.push(platById(o.platformId).name);
  if(o.campaign) p.push(o.campaign);
  return p.length?p.join(" · "):"كل الحسابات";
}
function windowStats(from,to,sc){
  const facts=factsRaw(from,to,sc);
  const d={}; facts.forEach(f=>{ d[f.date]=1; });
  const nDays=Object.keys(d).length, nSnaps=sum(facts.map(f=>f.snaps.length));
  const vals=aggFacts(facts);
  return {vals:vals, nDays:nDays, nSnaps:nSnaps, suff:sufficiency(vals,nDays,nSnaps), facts:facts};
}

/** قياس أثر تغيير واحد: نافذة قبل مقابل نافذة بعد، بنفس الطول */
function changeImpact(ch){
  const win=+ch.win||IN().impactDays||7, T=todayISO(), sc=scopeOf(ch);
  const bF=addDays(ch.date,-win), bT=addDays(ch.date,-1);
  const aF=ch.date, aT=(addDays(ch.date,win-1)>T)? T : addDays(ch.date,win-1);
  if(!S.loadedFrom||bF<S.loadedFrom) return {state:"unloaded",bF:bF,bT:bT,aF:aF,aT:aT,win:win};
  const daysAfter=diffDays(aF,aT)+1;
  const key=ch.metric||"roas", m=metricByKey(key)||metricByKey("roas");
  const B=windowStats(bF,bT,sc), A=windowStats(aF,aT,sc);
  const out={state:"ok",win:win,bF:bF,bT:bT,aF:aF,aT:aT,daysAfter:daysAfter,m:m,B:B,A:A,
    before:B.vals[key],after:A.vals[key],pct:pctChange(B.vals[key],A.vals[key])};
  /* تغييرات تانية في نفس النطاق والفترة = النتيجة مش منسوبة لتغيير واحد */
  out.overlap=(S.changes||[]).filter(o=>o.id!==ch.id && o.date>=bF && o.date<=aT &&
    scopeLabel(o)===scopeLabel(ch)).length;
  if(daysAfter<2){ out.verdict="early";
    out.why="لسه "+daysAfter+L(" يوم بس بعد التغيير — استنى على الأقل يومين."," day only after the change — wait at least two days."); return out; }
  if(!B.suff.ok||!A.suff.ok){ out.verdict="insufficient";
    out.why=L(esc(L("بيانات غير كافية","Not enough data"))+" — ","Not enough data — ")+[...new Set(B.suff.reasons.concat(A.suff.reasons))].join("، ")+"."; return out; }
  if(out.pct==null){ out.verdict="insufficient"; out.why=L("مفيش قيمة للميترك في إحدى النافذتين.","The metric has no value in one of the windows."); return out; }
  const good = m.dir==="down"? out.pct<0 : out.pct>0;
  if(Math.abs(out.pct)<IN().changeMinPct){ out.verdict="flat";
    out.why="فرق "+fnum(Math.abs(out.pct),1)+L("% بس — تحت حد الملاحظة (","% only — below the reporting threshold (")+IN().changeMinPct+"%)."; return out; }
  out.verdict=good?"better":"worse";
  out.why=esc(mLabel(m))+" "+(out.pct>0?"طلع":"نزل")+" "+fnum(Math.abs(out.pct),1)+"% ("+
    fval(out.before,m,true)+" ← "+fval(out.after,m,true)+") على "+daysAfter+" يوم.";
  return out;
}
const VERDICT=new Proxy({},{get:(t,k)=>({
  better:{label:L("اتحسّن","Improved"),tone:"good",color:"var(--good)"},
  worse:{label:L("وحش","Worse"),tone:"bad",color:"var(--bad)"},
  flat:{label:L("مفيش فرق واضح","No clear change"),tone:"info",color:"var(--info)"},
  early:{label:L("لسه بدري","Too early"),tone:"warn",color:"var(--warn)"},
  insufficient:{label:L(L("بيانات غير كافية","Not enough data"),"Insufficient data"),tone:"warn",color:"var(--ink-3)"},
  unloaded:{label:L("خارج الفترة المحمّلة","Outside loaded range"),tone:"info",color:"var(--ink-3)"}}[k])});

/** نتيجة تجربة: مجموعة ضابطة مقابل مجموعة اختبار على نفس الفترة */
const CMP_KEYS=["spend","orders","revenue","roas","cpa","ctr","cvr","aov"];
function experimentResult(x){
  const T=todayISO(), end=(x.end&&x.end<T)?x.end:T;
  if(!x.start||x.start>end) return {state:"pending"};
  if(!S.loadedFrom||x.start<S.loadedFrom) return {state:"unloaded",from:x.start,to:end};
  const key=x.metric||"roas", m=metricByKey(key)||metricByKey("roas");
  // لازم نحوّل {clientId,platformId,campaign} لشكل الفلترة {clients,platforms,campaign}
  const C=windowStats(x.start,end,scopeOf(x.control||{})),
        E=windowStats(x.start,end,scopeOf(x.test||{}));
  const out={state:"ok",from:x.start,to:end,m:m,C:C,E:E,
    control:C.vals[key],test:E.vals[key],pct:pctChange(C.vals[key],E.vals[key]),
    rows:CMP_KEYS.map(k=>{ const mm=metricByKey(k); if(!mm) return null;
      return {k:k,m:mm,c:C.vals[k],t:E.vals[k],pct:pctChange(C.vals[k],E.vals[k])}; }).filter(Boolean)};
  if(!C.suff.ok||!E.suff.ok){ out.verdict="inconclusive";
    out.why=L(esc(L("بيانات غير كافية","Not enough data"))+" في ","Not enough data in ")+(!C.suff.ok?"المجموعة الضابطة":"")+
      (!C.suff.ok&&!E.suff.ok?" و":"")+(!E.suff.ok?"مجموعة الاختبار":"")+" — "+
      [...new Set(C.suff.reasons.concat(E.suff.reasons))].join("، ")+"."; return out; }
  if(out.pct==null||Math.abs(out.pct)<IN().changeMinPct){ out.verdict="inconclusive";
    out.why="الفرق في "+esc(mLabel(m))+" "+(out.pct==null?"مش محسوب":fnum(Math.abs(out.pct),1)+"%")+
      L(" — أقل من إنه يبقى فرق حقيقي."," — too small to be a real difference."); return out; }
  const good = m.dir==="down"? out.pct<0 : out.pct>0;
  /* تحذير المقايضة: الميترك الأساسي اتحسن بس التكلفة زادت */
  const cpa=out.rows.find(r=>r.k==="cpa");
  out.tradeoff = good && cpa && cpa.pct!=null && cpa.pct>IN().changeMinPct ? cpa : null;
  out.verdict=good?"win":"lose";
  out.why=esc(mLabel(m))+L(" في مجموعة الاختبار "," in the test group ")+(out.pct>0?"أعلى":"أقل")+" بـ "+
    fnum(Math.abs(out.pct),1)+"% ("+fval(out.control,m,true)+" ← "+fval(out.test,m,true)+").";
  return out;
}
const XV=new Proxy({},{get:(t,k)=>({win:{label:L("ناجحة","Winning"),color:"var(--good)"},
  lose:{label:L("فاشلة","Failed"),color:"var(--bad)"},
  inconclusive:{label:L("غير حاسمة","Inconclusive"),color:"var(--warn)"},
  pending:{label:L("لسه ما بدأتش","Not started"),color:"var(--ink-3)"},
  unloaded:{label:L("خارج الفترة المحمّلة","Outside loaded range"),color:"var(--ink-3)"}}[k])});

function renderChanges(){
  const list=(S.changes||[]).slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
  let h='<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px">'+
    '<button class="btn btn-p" data-a="chAdd">+ سجّل تغيير</button>'+
    (list.length?'<span class="hint" style="align-self:center">'+list.length+" تغيير مسجل</span>":"")+"</div>";
  if(!list.length) return h+emptyBox(
    "سجّل كل تغيير مهم بتعمله — ميزانية، كرييتف، استهداف، لاندنج.<br>"+
    L("النظام هيقيس بنفسه إيه اللي حصل بعده ويقولك نفع ولا لأ.","The system measures what happened after and tells you whether it worked."),
    '<button class="btn btn-p" data-a="chAdd">سجّل أول تغيير</button>');
  h+='<div class="grid">'+list.map(ch=>{
    const im=changeImpact(ch), V=VERDICT[im.verdict||im.state]||VERDICT.insufficient;
    let body='<div class="act-b">'+esc(ch.note||"")+"</div>";
    if(im.state==="unloaded")
      body+='<div class="hint" style="margin-top:9px">التغيير ده قبل الفترة المحمّلة — وسّع الفترة من الشريط فوق عشان أقيس أثره.</div>';
    else if(im.verdict&&im.verdict!=="early"&&im.verdict!=="insufficient"){
      body+='<div class="act-nums">'+
        '<div class="act-n">'+esc(mLabel(im.m))+' قبل<b>'+esc(fval(im.before,im.m,true))+"</b></div>"+
        '<div class="act-n">بعد<b style="color:'+V.color+'">'+esc(fval(im.after,im.m,true))+"</b></div>"+
        '<div class="act-n">الفرق<b style="color:'+V.color+'">'+(im.pct>0?"+":"")+fnum(im.pct,1)+"%</b></div>"+
        '<div class="act-n">نافذة القياس<b>'+im.win+" يوم</b></div></div>";
      ["spend","orders","revenue"].forEach(k=>{});
      body+='<div class="tw" style="margin:4px -17px -6px"><table><thead><tr><th>'+esc(L("الميترك","Metric"))+'</th>'+
        '<th class="n">'+esc(L("قبل","Before"))+'</th><th class="n">'+esc(L("بعد","After"))+'</th><th class="n">'+esc(L("الفرق","Change"))+'</th></tr></thead><tbody>'+
        ["spend","orders","revenue","roas","cpa"].map(k=>{ const m=metricByKey(k); if(!m) return "";
          return "<tr><td>"+esc(mLabel(m))+'</td><td class="n num">'+esc(fval(im.B.vals[k],m,true))+
            '</td><td class="n num">'+esc(fval(im.A.vals[k],m,true))+'</td><td class="n">'+
            deltaChip(im.A.vals[k],im.B.vals[k],m)+"</td></tr>"; }).join("")+"</tbody></table></div>";
    }
    if(im.why) body+='<div class="act-rec" style="--x:1">'+esc(im.why)+"</div>";
    if(im.overlap>0) body+='<div class="hint" style="margin-top:8px;color:var(--amber)">⚠ فيه <b>'+im.overlap+
      "</b> تغيير تاني في نفس النطاق خلال نافذة القياس — النتيجة مش منسوبة للتغيير ده لوحده.</div>";
    return '<div class="act"><div class="act-bar" style="background:'+V.color+'"></div><div class="act-in">'+
      '<div class="act-top"><span class="act-pri" style="color:'+V.color+'">'+esc(V.label)+"</span>"+
      '<span class="act-t">'+esc(chTypeName(ch.type))+(ch.field?" — "+esc(ch.field):"")+"</span>"+
      '<span class="act-w">'+esc(scopeLabel(ch))+"</span>"+
      '<span class="act-w" style="margin-inline-start:auto">'+esc(fdateFull(ch.date))+
        (ch.by?" · "+esc(ch.by):"")+"</span>"+
      '<button class="btn btn-s btn-d" data-a="chDel" data-id="'+esc(ch.id)+'">حذف</button></div>'+
      body+"</div></div>";
  }).join("")+"</div>";
  h+='<div class="hint" style="margin-top:18px">القياس مقارنة <b>قبل/بعد</b> على نفس النطاق وبنفس طول النافذة. '+
    L("مش اختبار دلالة إحصائية — عوامل تانية (موسم، منافسة، تغييرات متزامنة) ممكن تكون هي السبب. ","Not a statistical significance test — other factors (season, competition, simultaneous changes) could be the cause. ")+
    "عشان كده النظام بيحذّرك لما يلاقي تغييرين متداخلين.</div>";
  return h;
}

function renderExperiments(){
  const list=(S.experiments||[]).slice().sort((a,b)=> a.start<b.start?1:-1);
  let h='<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px">'+
    '<button class="btn btn-p" data-a="xAdd">+ تجربة جديدة</button></div>';
  if(!list.length) return h+emptyBox(
    L("سجّل فرضية، حدد المجموعة الضابطة ومجموعة الاختبار، والنظام يحسب النتيجة من بياناتك.","Log a hypothesis, define the control and test groups, and the system computes the result from your data."),
    '<button class="btn btn-p" data-a="xAdd">أول تجربة</button>');
  h+='<div class="grid">'+list.map(x=>{
    const r=experimentResult(x), V=XV[r.verdict||r.state]||XV.inconclusive;
    let body='<div class="act-b"><b style="font-family:var(--f-ui)">الفرضية:</b> '+esc(x.hypothesis||"—")+"</div>";
    body+='<div class="act-nums"><div class="act-n">الضابطة<b style="font-size:12px">'+esc(scopeLabel(x.control||{}))+"</b></div>"+
      '<div class="act-n">الاختبار<b style="font-size:12px">'+esc(scopeLabel(x.test||{}))+"</b></div>"+
      '<div class="act-n">الميترك الأساسي<b style="font-size:12px">'+esc(x.metric?mkLabel(x.metric):"ROAS")+"</b></div>"+
      (x.expected?'<div class="act-n">المتوقع<b style="font-size:12px">'+esc(x.expected)+"</b></div>":"")+"</div>";
    if(r.state==="ok"){
      body+='<div class="tw" style="margin:4px -17px -6px"><table><thead><tr><th>'+esc(L("الميترك","Metric"))+'</th>'+
        '<th class="n">الضابطة</th><th class="n">الاختبار</th><th class="n">'+esc(L("الفرق","Change"))+'</th></tr></thead><tbody>'+
        r.rows.map(row=>"<tr"+(row.k===(x.metric||"roas")?' style="background:rgba(34,211,238,.06)"':"")+
          "><td>"+esc(mLabel(row.m))+'</td><td class="n num">'+esc(fval(row.c,row.m,true))+
          '</td><td class="n num">'+esc(fval(row.t,row.m,true))+'</td><td class="n">'+
          deltaChip(row.t,row.c,row.m)+"</td></tr>").join("")+"</tbody></table></div>";
      if(r.tradeoff) body+='<div class="hint" style="margin-top:10px;color:var(--amber)">⚠ الميترك الأساسي اتحسن بس <b>'+
        esc(mLabel(r.tradeoff.m))+"</b> زاد "+fnum(r.tradeoff.pct,1)+"% — شوف المقايضة دي قبل ما تعتمدها.</div>";
    }
    if(r.why) body+='<div class="act-rec">'+esc(r.why)+"</div>";
    if(r.state==="unloaded") body+='<div class="hint" style="margin-top:9px">التجربة بدأت قبل الفترة المحمّلة — وسّع الفترة عشان أحسبها.</div>';
    return '<div class="act"><div class="act-bar" style="background:'+V.color+'"></div><div class="act-in">'+
      '<div class="act-top"><span class="act-pri" style="color:'+V.color+'">'+esc(V.label)+"</span>"+
      '<span class="act-t">'+esc(x.name||"تجربة")+"</span>"+
      '<span class="act-w">'+esc(fdate(x.start))+" — "+esc(x.end?fdate(x.end):"مستمرة")+"</span>"+
      '<button class="btn btn-s btn-d" style="margin-inline-start:auto" data-a="xDel" data-id="'+esc(x.id)+'">حذف</button></div>'+
      body+"</div></div>";
  }).join("")+"</div>";
  h+='<div class="hint" style="margin-top:18px">النتيجة مقارنة مباشرة بين مجموعتين على نفس الفترة — '+
    "<b>مش اختبار دلالة إحصائية</b>. عشان تكون النتيجة معتبرة لازم المجموعتين يبقى فيهم "+esc(L("بيانات كافية","Enough data"))+"، "+
    "والنظام بيقول «غير حاسمة» لو مش كده بدل ما يدّيك حكم على الفاضي.</div>";
  return h;
}

    {id:"s_tcli",  screen:"overview", type:"table", title:"أداء العملاء", dim:"client", metrics:k, size:"half"},
    {id:"s_tplat", screen:"overview", type:"table", title:"أداء المنصات", dim:"platform", metrics:k, size:"half"},
    pick("dailyreport"), pick("decisions"), pick("action"), pick("livereport"),
    {id:"s_alerts",screen:"overview", type:"alerts",title:"تنبيهات", size:"full"},
    {id:"s_ins",   screen:"overview", type:"insights", title:L("أهم الاستنتاجات","Key insights"), limit:3, size:"full"},
  ];
}
function sectionsOf(screen){
  const all=S.cfg.sections.filter(s=>s.screen===screen&&!s.hidden);
  if(!SIMPLE()) return all;
  const keep=all.filter(secSimple);
  return keep.length? keep : all;   // شاشة مفيهاش ولا قسم مختار للبسيط بتتعرض كاملة
}
function secScope(sec){
  const f=sec.filter||{};
  const ov={};
  if(f.clients&&f.clients.length)   ov.clients=f.clients;
  if(f.platforms&&f.platforms.length) ov.platforms=f.platforms;
  return Object.keys(ov).length? ov : null;
}
function secScopeLabel(sec){
  const o=secScope(sec); if(!o) return "";
  const p=[];
  if(o.clients)   p.push(o.clients.map(c=>{const x=clientById(c);return x?x.name:c;}).join("، "));
  if(o.platforms) p.push(o.platforms.map(x=>platById(x).name).join("، "));
  return p.join(" · ");
}

const SEC_FN={action:secAction,health:secHealth,whatchanged:secWhatChanged,funnel:secFunnel,
  decisions:secDecisions,pacing:secPacing,dailyreport:secDailyReport,livereport:secLiveReport,
  tracking:secTracking,hourmap:secHourMap,changelog:secChangeLog,peaks:secPeaks,
  roundentry:secRoundEntry,brief:secBrief,eod:secEod,daysheet:secDaySheet,
  liveruler:secLiveRuler,livecompare:secLiveCompare,livekpi:secLiveKpi,livecurve:secLiveCurve,livesnaps:secLiveSnaps,liveproj:secLiveProj,livehours:secLiveHours,reportentry:secReportEntry,sheet:secSheet,aiblock:secAiBlock,tasks:secTasks,dailytotals:secDailyTotals};
function renderSection(sec,ctx){
  ctx=secCtx(sec,ctx);
  if(SEC_FN[sec.type]) return SEC_FN[sec.type](sec,ctx);
  const {from,to,cmp}=ctx, ov=secScope(sec), C=CURR[S.cfg.settings.currency]||"";
  const mk=k=>metricByKey(k);
  const facts=factsIn(from,to,ov);
  const note=secScopeLabel(sec);
  const wrap=(body,extra,raw)=>card(esc(secTitle(sec)),raw?extra:esc(extra||note||""),body);

  if(sec.type==="note")
    return '<div class="card"><div class="card-t" style="margin-bottom:8px">'+esc(secTitle(sec))+"</div>"+
      '<div class="ins-b" style="white-space:pre-wrap">'+esc(sec.text||"")+"</div></div>";

  if(sec.type==="kpi"){
    const vals=aggFacts(facts), cmpVals=cmp?aggFacts(factsIn(cmp[0],cmp[1],ov)):null;
    const days=seriesByDay(from,to,ov);
    const own=!!(sec.metrics&&sec.metrics.length);
    const keys=(own?sec.metrics:kpiKeys()).filter(mk);
    const edit=!!S.ctl[sec.id];
    const head='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">'+
      (note?'<span class="card-x">'+esc(note)+"</span>":"")+
      '<span style="margin-inline-start:auto"></span>'+ctlBtn(sec)+"</div>";
    if(!keys.length) return head+'<div class="card"><div class="empty">مفيش ميترِكس. دوس «خيارات» وزوّد اللي تحب.</div></div>'+
      (edit?'<div class="card" style="margin-top:10px">'+kpiPicker(sec,keys)+"</div>":"");
    const drag=edit||S.edit;
    if(drag&&!own){ sec.metrics=keys.slice(); saveCfg(); }
    return head+'<div class="grid" data-sort="kpi:'+esc(sec.id)+
      '" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">'+
      keys.map((k,i)=>{
        let tile=kpiTile(k,vals,cmpVals,days);
        if(drag) tile=tile.replace('<div class="kpi-l">',
          '<div style="display:flex;gap:4px;margin-bottom:8px;align-items:center">'+
          '<span class="sec-h kpi-drag" title="اسحب">⠿</span>'+
          '<button class="btn btn-s btn-d" style="margin-inline-start:auto" data-a="kpiDel" data-id="'+
            esc(sec.id)+'" data-k="'+k+'">✕</button>'+
          '</div><div class="kpi-l">');
        return drag? '<div data-sid="'+esc(k)+'">'+tile+"</div>" : tile;
      }).join("")+"</div>"+
      (edit?'<div class="card" style="margin-top:10px">'+kpiPicker(sec,keys)+"</div>":"");
  }

  if(sec.type==="trend"){
    const g=seriesGrain(from,to,ov,sec.grain);
    const rows=g.rows;
    if(!rows.length) return wrap('<div class="empty">مفيش أيام في الفترة دي</div>');
    const keys=(sec.metrics&&sec.metrics.length?sec.metrics:["revenue","spend","roas"]).filter(mk).slice(0,3);
    if(!keys.length) return wrap('<div class="empty">اختار ميترك واحد على الأقل</div>'+chartCtl(sec,{chart:"trend",grain:1,metrics:1,plats:1,date:1}));
    const cols=["var(--cyan)","var(--violet)","var(--amber)"];
    const series=keys.map((k,i)=>({name:mLabel(mk(k)),color:cols[i],pts:rows.map(r=>r.vals[k]),
      axis:i===2?1:0, dash:i===2, fmt:v=>fval(v,mk(k),true)}));
    const ct=sec.chart||"area";
    let parts=null;
    if(ct==="stacked"){
      const pls=breakdown(from,to,"platform",ov).filter(r=>(r.vals[keys[0]]||0)>0)
        .sort((a,b)=>b.vals[keys[0]]-a.vals[keys[0]]).slice(0,8);
      parts=pls.map(r=>{ const o=Object.assign({},ov||{}); o.platforms=[r.key];
        const gg=seriesGrain(from,to,o,sec.grain);
        const byKey={}; gg.rows.forEach(x=>{ byKey[x.key]=x.vals[keys[0]]||0; });
        return {color:platById(r.key).color,name:platById(r.key).name,
          vals:rows.map(x=>byKey[x.key]||0)}; });
    }
    const idx={}; rows.forEach((r,i)=>{ if(r.date) idx[r.date]=i; });
    const notes=(S.changes||[]).filter(ch=>idx[ch.date]!=null)
      .map(ch=>({i:idx[ch.date],label:chTypeName(ch.type)+" · "+scopeLabel(ch)}));
    const gl = g.fallback==="hour"
      ? '<span style="color:var(--amber)">مفيش لقطات كفاية للساعات — بعرض يوم بيوم</span>'
      : grainName(g.grain);
    return wrap(chPlot({type:ct,series:series,parts:parts,stackLabels:rows.map(r=>r.label),
        h:sec.size==="full"?230:190,notes:notes,xlab:rows.map(r=>r.label),
        aria:keys.map(k=>mLabel(mk(k))).join(" و ")})+
      '<div class="legend" style="margin-top:12px">'+series.map((x,i)=>'<span><i style="background:'+x.color+'"></i>'+
        esc(x.name)+(i===2?" (محور يمين)":"")+"</span>").join("")+
        '<span style="color:var(--ink-3)">'+gl+"</span>"+
        (notes.length?'<span style="color:var(--ink-3)">'+notes.length+" تغيير مسجل</span>":"")+"</div>"+
      chartCtl(sec,{chart:"trend",grain:1,metrics:1,plats:1,date:1}),
      (note?'<span style="margin-inline-end:8px">'+esc(note)+"</span>":"")+ctlBtn(sec), true);
  }
  if(sec.type==="bars"){
    const dim=sec.dim||"platform", k=(sec.metrics&&sec.metrics[0])||"spend", m=mk(k);
    if(!m) return wrap('<div class="empty">الميترك مش موجود</div>');
    let rows=breakdown(from,to,dim,ov).filter(r=>r.vals[k]!=null&&isFinite(r.vals[k]));
    rows.sort((a,b)=>b.vals[k]-a.vals[k]);
    if(sec.limit) rows=rows.slice(0,sec.limit);
    const nm=r=> dim==="platform"?platById(r.key).name : dim==="client"?((clientById(r.key)||{}).name||r.key) : r.key;
    const cl=r=> dim==="platform"?platById(r.key).color : PAL[Math.abs(hashStr(r.key))%PAL.length];
    const tot=m.type==="raw"? sum(rows.map(r=>r.vals[k])) : null;
    const items=rows.map(r=>({label:nm(r),value:r.vals[k],color:cl(r)}));
    const f=v=>fval(v,m,true), ct=sec.chart||"bars";
    const draw = !rows.length? '<div class="empty">مفيش بيانات</div>'
      : ct==="pie"? chPie(items,f)
      : ct==="donut"? chDonutSplit(items,f)
      : ct==="columns"? chCols(items.map(i=>i.label),items.map(i=>i.value),items[0].color)
      : ct==="table"? chValTable(items.map(i=>[i.label,f(i.value)]),[dimName(dim),m.label])
      : chBars(items,f);
    return wrap(draw+chartCtl(sec,{chart:"bars",metrics:1,plats:1,date:1}),
      '<span style="margin-inline-end:8px">'+(note?esc(note)+" · ":"")+esc(mLabel(m))+
      (tot!=null?" · إجمالي "+esc(fnum(tot,0))+(m.unit==="cur"?" "+esc(C):""):"")+"</span>"+ctlBtn(sec), true);
  }

  if(sec.type==="stack"){
    const dim=sec.dim||"platform", k=(sec.metrics&&sec.metrics[0])||"spend", m=mk(k);
    const days=seriesByDay(from,to,ov);
    let rows=breakdown(from,to,dim,ov).filter(r=>(r.vals[k]||0)>0).sort((a,b)=>b.vals[k]-a.vals[k]).slice(0,8);
    if(!rows.length||days.length<2) return wrap('<div class="empty">محتاج يومين على الأقل وبيانات في الفترة</div>');
    const parts=rows.map(r=>{
      const key = dim==="platform"?"platforms":dim==="client"?"clients":null;
      const o=Object.assign({},ov||{}); if(key) o[key]=[r.key];
      const s = key? seriesByDay(from,to,o)
        : days.map(d=>({vals:aggFacts(factsIn(d.date,d.date,ov).filter(f=>(f.campaign||"—")===r.key))}));
      return {color: dim==="platform"?platById(r.key).color:PAL[Math.abs(hashStr(r.key))%PAL.length],
              name: dim==="platform"?platById(r.key).name: dim==="client"?((clientById(r.key)||{}).name||r.key):r.key,
              vals: s.map(d=>d.vals[k]||0)};
    });
    return wrap(chStack(days.map(d=>d.date),parts)+
      '<div class="legend" style="margin-top:12px">'+parts.map(p=>'<span><i style="background:'+p.color+'"></i>'+
        esc(p.name)+"</span>").join("")+"</div>", (note?note+" · ":"")+esc(m?mLabel(m):k));
  }

  if(sec.type==="table"){
    const dim=sec.dim||"platform";
    const cols=(sec.metrics&&sec.metrics.length?sec.metrics:kpiKeys()).filter(mk);
    let rows=breakdown(from,to,dim,ov);
    rows.sort((a,b)=>(b.vals.spend||0)-(a.vals.spend||0));
    if(sec.limit) rows=rows.slice(0,sec.limit);
    const nm=k=> dim==="platform"?platById(k).name : dim==="client"?((clientById(k)||{}).name||k) : k;
    const cf=dim==="platform"? (k=>platById(k).color) : null;
    return wrap(dimTable(rows,cols,nm,cf), (note?note+" · ":"")+L("حسب ","by ")+dimName(dim));
  }

  if(sec.type==="rings") return renderTargets(aggFacts(facts),from,to,sec);

  if(sec.type==="heat"){
    const dim=sec.dim||"platform", k=(sec.metrics&&sec.metrics[0])||"roas", m=mk(k);
    const days=seriesByDay(from,to,ov).filter(d=>d.n>0);
    let rows=breakdown(from,to,dim,ov).filter(r=>(r.vals.spend||0)>0).slice(0,10);
    if(!rows.length||days.length<2) return wrap('<div class="empty">محتاج يومين على الأقل</div>');
    const key = dim==="platform"?"platforms":dim==="client"?"clients":null;
    const names=rows.map(r=> dim==="platform"?platById(r.key).name : dim==="client"?((clientById(r.key)||{}).name||r.key):r.key);
    const mtx=rows.map(r=>{
      const o=Object.assign({},ov||{}); if(key) o[key]=[r.key];
      const s = key? seriesByDay(from,to,o)
        : days.map(d=>({date:d.date,n:1,vals:aggFacts(factsIn(d.date,d.date,ov).filter(f=>(f.campaign||"—")===r.key))}));
      return days.map(d=>{ const x=s.find(y=>y.date===d.date); return x&&x.n?x.vals[k]:null; });
    });
    return wrap(chHeat(names,days.map(d=>fdate(d.date).split(" ")[0]),mtx,"var(--cyan)",v=>fval(v,m,true)),
      (note?note+" · ":"")+esc(m?mLabel(m):k)+" · أغمق = أعلى");
  }

  if(sec.type==="scatter"){
    const kx=(sec.metrics&&sec.metrics[0])||"spend", ky=(sec.metrics&&sec.metrics[1])||"roas";
    const mx=mk(kx), my=mk(ky);
    if(!mx||!my) return wrap('<div class="empty">اختار ميتركين</div>');
    const days=seriesByDay(from,to,ov).filter(d=>d.n>0&&d.vals[kx]!=null&&d.vals[ky]!=null&&
      isFinite(d.vals[kx])&&isFinite(d.vals[ky]));
    if(days.length<3) return wrap('<div class="empty">محتاج ٣ أيام على الأقل</div>');
    return wrap(chScatter(days.map(d=>({x:d.vals[kx],y:d.vals[ky],color:"var(--violet)",
      t:fdateFull(d.date)+" · "+fval(d.vals[kx],mx,true)+" → "+fval(d.vals[ky],my,true)})),
      v=>fval(v,mx,true), v=>fval(v,my,true), mx.label),
      (note?note+" · ":"")+esc(mLabel(mx))+L(" مقابل "," vs ")+esc(mLabel(my))+L(" · كل نقطة = يوم"," · each dot = one day"));
  }

  if(sec.type==="insights"){
    const all=buildInsights(from,to), ins=all.slice(0,sec.limit||3);
    if(!ins.length) return "";
    return (sec.title?'<div class="card-t" style="margin-bottom:10px">'+esc(sec.title)+"</div>":"")+
      '<div class="grid">'+ins.map(insCard).join("")+
      (all.length>ins.length?'<button class="btn" data-a="go" data-v="insights" style="justify-content:center">'+
        L("كل الاستنتاجات (","All insights (")+all.length+")</button>":"")+"</div>";
  }

  if(sec.type==="alerts"){
    const hits=evalAlerts(from,to);
    if(!hits.length) return "";
    return (sec.title?'<div class="card-t" style="margin-bottom:10px">'+esc(sec.title)+"</div>":"")+
      '<div class="grid">'+hits.map(a=>'<div class="ins '+a.tone+'"><div class="ins-h"><div class="ins-t">'+
      esc(a.title)+'</div></div><div class="ins-b">'+a.body+"</div></div>").join("")+"</div>";
  }
  return "";
}
function hashStr(s){ let h=0; for(let i=0;i<String(s).length;i++) h=(h*31+String(s).charCodeAt(i))|0; return h; }

function renderSections(screen){
  const [from,to]=resolveRange(), cmp=resolveCmp(from,to), ctx={from,to,cmp};
  const secs=sectionsOf(screen);
  if(!S.cfg.clients.length&&isMember()) return emptyBox(L("الأدمن لسه ماحددلكش عملاء تتابعهم.","An admin hasn't assigned you any clients yet."));
  if(!S.cfg.clients.length) return emptyBox(L("ابدأ بإضافة أول عميل، وبعدين سجّل أرقام الصرف والإيراد.","Start by adding your first client, then log spend and revenue."),
    '<button class="btn btn-p" data-a="go" data-v="admin" data-tab="clients">إضافة عميل</button>');
  if(!secs.length) return emptyBox("الشاشة دي فاضية.<br>ركّب أقسامها من لوحة التحكم.",
    '<button class="btn btn-p" data-a="go" data-v="admin" data-tab="sections">بناء الأقسام</button>');
  if(!factsIn(from,to).length){
    const why=[];
    if(S.ws) why.push("مساحة العمل مقفولة على <b>"+esc((clientById(S.ws)||{}).name||S.ws)+"</b>");
    if(S.f.clients.length) why.push("فلتر العملاء: <b>"+
      esc(S.f.clients.map(c=>(clientById(c)||{}).name||c).join("، "))+"</b>");
    if(S.f.platforms.length) why.push("فلتر المنصات: <b>"+
      esc(S.f.platforms.map(x=>platById(x).name).join("، "))+"</b>");
    if(S.f.campaign) why.push("بحث الحملات: <b>"+esc(S.f.campaign)+"</b>");
    // مين عنده بيانات فعلاً في نفس الفترة؟
    const has={}; S.facts.forEach(f=>{ if(f.date>=from&&f.date<=to) has[f.clientId]=(has[f.clientId]||0)+1; });
    const withData=Object.keys(has).map(id=>({id:id,n:has[id],name:(clientById(id)||{}).name||id}))
      .sort((a,b)=>b.n-a.n);
    // ولو مفيش خالص في الفترة، امتى آخر بيانات؟
    const last=S.facts.length? S.facts.map(f=>f.date).sort().slice(-1)[0] : null;
    let msg, btns="";
    if(withData.length){
      msg="مفيش بيانات بالفلاتر "+esc(L("الحالي","Current"))+"ة في <b>"+fdate(from)+" — "+fdate(to)+"</b>.<br>"+
        (why.length? why.join("<br>")+"<br>" : "")+
        "<span style=\"color:var(--ink-2)\">فيه بيانات في نفس الفترة عند: </span>"+
        withData.map(c=>esc(c.name)+" ("+c.n+")").join("، ");
      btns=withData.map(c=>'<button class="btn btn-p" data-a="jumpClient" data-id="'+esc(c.id)+
        '">افتح '+esc(c.name)+"</button>").join(" ")+
        (why.length?' <button class="btn" data-a="clearAllF">شيل كل الفلاتر</button>':"");
    } else if(last){
      msg="مفيش بيانات في <b>"+fdate(from)+" — "+fdate(to)+"</b>.<br>"+
        "آخر يوم فيه بيانات عندك هو <b>"+fdateFull(last)+"</b>.";
      btns='<button class="btn btn-p" data-a="jumpLast" data-d="'+esc(last)+'">روح لآخر يوم فيه بيانات</button>'+
        ' <button class="btn" data-a="go" data-v="entry">إدخال بيانات</button>';
    } else {
      msg=L("مفيش بيانات مسجلة لسه.","No data logged yet.");
      btns='<button class="btn btn-p" data-a="go" data-v="entry">إدخال بيانات</button>'+
        ' <button class="btn" data-a="go" data-v="admin" data-tab="data">تعبئة بيانات تجريبية</button>';
    }
    return emptyBox(msg,btns);
  }
  return sectionsBlock(screen,ctx);
}
/** يبني شبكة الأقسام لأي شاشة — بيستخدمها الأوفرفيو وشاشة اليوم مباشر */
let _roundShown=false;
function sectionsBlock(screen,ctx){
  let list = S.edit? S.cfg.sections.filter(x=>x.screen===screen) : sectionsOf(screen);
  if(_roundShown&&!S.edit) list=list.filter(x=>x.type!=="roundentry"&&x.type!=="daysheet");
  let out="";
  for(const sec of list){
    let body="";
    if(!(S.edit&&sec.hidden)){
      try{ body=renderSection(sec,ctx); if(body){ body=secHelp(body,sec); body=secRangeInject(body,sec); } }
      catch(err){ body='<div class="card"><div class="ins-t">خطأ في قسم "'+esc(sec.title||sec.type)+'"</div>'+
        '<div class="ins-b num" style="direction:ltr;text-align:left">'+esc(err&&err.message||err)+"</div></div>"; }
    }
    if(S.edit){
      if(!body) body='<div class="card"><div class="empty" style="padding:20px">'+
        (sec.hidden?"مخفي":L("مفيش محتوى يتعرض بالفلاتر دي","Nothing to show with these filters"))+"</div></div>";
      out+='<div class="sec-w editing s-'+(sec.size||"full")+'" data-sid="'+esc(sec.id)+'">'+
        secBar(sec)+body+"</div>";
    } else if(body) out+='<div class="sec-w s-'+(sec.size||"full")+'" data-sid="'+esc(sec.id)+'">'+secQuick(sec)+body+"</div>";
  }
  return (S.edit?editBar(screen):"")+
    '<div class="secs'+(S.edit?"":" packed")+'" data-sort="sec:'+esc(screen)+'">'+out+"</div>"+
    (S.edit?'<div class="addsec" data-a="secAddPal" data-scr="'+esc(screen)+
      '" style="margin-top:14px">+ زوّد قسم جديد</div>':"");
}

/* ── التنبيهات ── */
const ALERT_OPS=[["lt","أقل من","Less than"],["gt","أكبر من","Greater than"]];
function evalAlerts(from,to){
  const out=[], C=CURR[S.cfg.settings.currency]||"";
  (S.cfg.alerts||[]).filter(a=>!a.off).forEach(a=>{
    const m=metricByKey(a.metricKey); if(!m) return;
    const dim=a.dim||"total";
    const rows = dim==="total"
      ? [{key:"__t",vals:aggFacts(factsIn(from,to))}]
      : breakdown(from,to,dim).filter(r=>(r.vals.spend||0)>0);
    rows.forEach(r=>{
      const v=r.vals[a.metricKey];
      if(v==null||!isFinite(v)) return;
      const hit = a.op==="lt" ? v<a.value : v>a.value;
      if(!hit) return;
      const who = dim==="total" ? L("الإجمالي","Total")
        : dim==="platform"? platById(r.key).name
        : dim==="client"? ((clientById(r.key)||{}).name||r.key) : r.key;
      out.push({tone: a.tone||"bad", scopeName:who, kind:"rule",
        dev: a.value? (v-a.value)/Math.abs(a.value)*100 : 0,
        spend: r.vals.spend||0, revenue: r.vals.revenue||0,
        clientId: dim==="client"?r.key:null, platformId: dim==="platform"?r.key:null,
        cur: fval(v,m,true), tgt: fval(a.value,m,true),
        title:(a.title||"تنبيه")+" — "+who,
        body:"<b>"+esc(mLabel(m))+"</b> = <b>"+esc(fval(v,m,true))+(m.unit==="cur"?" "+C:"")+
             "</b>، والقاعدة بتقول "+(a.op==="lt"?"لازم ميقلش عن":"لازم ميزيدش عن")+" <b>"+
             esc(fval(a.value,m,true))+"</b>."});
    });
  });
