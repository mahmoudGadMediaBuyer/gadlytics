/* ── بيانات تجريبية ── */
function demoPlan(nDays){
  let seed=20260902;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  const segs=[["10:00",.18,.30],["13:00",.30,.44],["16:00",.45,.59],["20:00",.65,.77],["23:30",1,1]];
  const T=todayISO(), nowH=new Date().getHours()+new Date().getMinutes()/60;
  const out=[];
  for(let i=nDays-1;i>=0;i--){
    const date=addDays(T,-i), t=(nDays-1-i)/Math.max(1,nDays-1), isT=(date===T);
    const wd=parseISO(date).getDay(), wk=(wd===5?1.18:wd===6?1.12:1);
    [["meta",900+1700*t,4.2-1.35*t,[["Meta — ريتارجتنج",.62],["Meta — جمهور جديد",.38]]],
     ["google",700+90*Math.sin(i),2.65,[["Search — براند",.55],["PMax — عام",.45]]],
     ["snap",1150+80*Math.cos(i*1.3),1.62,[["Snap — عروض",.60],["Snap — وعي",.40]]]]
    .forEach(p=>{
      p[3].forEach(cm=>{
        const sp=Math.round(p[1]*cm[1]*(1+(rnd()-.5)*.16)), ro=p[2]*wk*(1+(rnd()-.5)*.16), rev=sp*ro;
        const or=Math.max(1,Math.round(rev/(410*(1+(rnd()-.5)*.2))));
        const cl=Math.round(sp/(2.6*(1+(rnd()-.5)*.3))), im=Math.round(cl/(0.019*(1+(rnd()-.5)*.4)));
        const vc=Math.round(cl*0.72), atc=Math.round(vc*0.28), chk=Math.round(atc*0.46);
        let use=segs;
        if(isT) use=segs.filter(s=>+s[0].split(":")[0] <= nowH);
        if(!use.length) use=[segs[0]];
        use.forEach(s=>{
          const hm=s[0].split(":");
          out.push({date:date, ts:parseISO(date).getTime()+(+hm[0])*36e5+(+hm[1])*6e4,
            platformId:p[0], campaign:cm[0],
            values:{spend:Math.round(sp*s[2]), impressions:Math.round(im*s[2]),
              clicks:Math.round(cl*s[2]), view_content:Math.round(vc*s[2]),
              add_to_cart:Math.round(atc*s[1]), checkouts:Math.round(chk*s[1]),
              orders:Math.round(or*s[1]), revenue:Math.round(rev*s[1]),
              backend_orders:Math.round(or*s[1]*0.91), backend_revenue:Math.round(rev*s[1]*0.93)}});
        });
      });
    });
  }
  return out;
}
async function seedDemo(nDays,clientId){
  let cl = clientId? clientById(clientId) : S.cfg.clients.find(c=>c.demo);
  if(!cl){ cl={id:"demo_"+uid(), name:"عميل تجريبي (Demo)", margin:0.35, monthlyBudget:60000, demo:true};
    S.cfg.clients.push(cl); saveCfg(); }
  ["meta","google","snap"].forEach(id=>{ if(!S.cfg.platforms.find(p=>p.id===id)){
    const d=DEF_PLATFORMS.find(x=>x.id===id); if(d) S.cfg.platforms.push(Object.assign({},d)); } });
  const plan=demoPlan(nDays||14);
  const byDate={};
  plan.forEach(r=>{ (byDate[r.date]=byDate[r.date]||[]).push(r); });
  for(const date of Object.keys(byDate).sort()){
    const doc={clientId:cl.id, date:date, rows:{}, updatedAt:Date.now(), demo:true, seeded:true};
    byDate[date].sort((a,b)=>a.ts-b.ts).forEach(r=>{
      const k=r.platformId+"|"+(r.campaign||"");
      const row=doc.rows[k]||(doc.rows[k]={platformId:r.platformId,campaign:r.campaign||"",snaps:[]});
      const prev=row.snaps.length?row.snaps[row.snaps.length-1].v:{};
      row.snaps.push({ts:r.ts, v:Object.assign({},prev,r.values)});
    });
    await Store.setEntryDoc(cl.id+"__"+date,doc); DOCS[cl.id+"__"+date]=doc;
  }
  rebuildFacts();
}
async function wipeDemo(){

/* ══════════════════ 11.4 التقسيم الزمني التلقائي ══════════════════
   يوم واحد → ساعة بساعة · مدى عادي → يوم بيوم · مدى طويل → أسبوع بأسبوع */
const GRAINS=[["auto","تلقائي","Auto"],["hour","ساعة بساعة","Hourly"],["day","يوم بيوم","Daily"],["week","أسبوع بأسبوع","Weekly"]];
function grainAuto(from,to){
  if(from===to) return "hour";
  return (diffDays(from,to)+1)>70 ? "week" : "day";
}
function bucketVals(list){
  const b={}; const rm=rawMetrics();
  list.forEach(v=>{ rm.forEach(m=>{ b[m.key]=(b[m.key]||0)+(+v[m.key]||0); });
    b._gp=(b._gp||0)+(+v._gp||0); });
  return computeAll(b);
}
function seriesGrain(from,to,ov,grain){
  const want=(!grain||grain==="auto")? grainAuto(from,to) : grain;
  return memo("sg:"+want+":"+from+":"+to+":"+fSig(ov),()=>{
    if(want==="hour"){
      const iv=intervals(from,to,ov);
      if(iv.length>=2){
        const hr={};
        iv.forEach(x=>{ (hr[x.hour]=hr[x.hour]||[]).push(x.vals); });
        const ks=Object.keys(hr).map(Number).sort((a,b)=>a-b);
        return {grain:"hour",fallback:false,
          rows:ks.map(h=>({key:String(h),label:fhour(h),n:hr[h].length,vals:bucketVals(hr[h])}))};
      }
      const d=seriesByDay(from,to,ov);
      return {grain:"day",fallback:"hour",
        rows:d.map(x=>({key:x.date,label:fdate(x.date),n:x.n,vals:x.vals,date:x.date}))};
    }
    if(want==="week"){
      const d=seriesByDay(from,to,ov).filter(x=>x.n>0), g={};
      d.forEach(x=>{ const wk=addDays(x.date,-parseISO(x.date).getDay()); (g[wk]=g[wk]||[]).push(x); });
      const ks=Object.keys(g).sort();
      return {grain:"week",fallback:false,
        rows:ks.map(k=>({key:k,label:fdate(k)+" ←",n:sum(g[k].map(x=>x.n)),
          vals:bucketVals(g[k].map(x=>x.vals))}))};
    }
    const d=seriesByDay(from,to,ov);
    return {grain:"day",fallback:false,
      rows:d.map(x=>({key:x.date,label:fdate(x.date),n:x.n,vals:x.vals,date:x.date}))};
  });
}

function peaksFor(from,to,ov){
  return memo("pk:"+from+":"+to+":"+fSig(ov),()=>{
    const out={}, T=todayISO();
    const pl=breakdown(from,to,"platform",ov).filter(p=>(p.vals.spend||0)>0);
    if(pl.length){
      const TS=sum(pl.map(p=>p.vals.spend)), TR=sum(pl.map(p=>p.vals.revenue));
      out.platform={TS:TS,TR:TR,
        top:pl.slice().sort((a,b)=>(b.vals.revenue||0)-(a.vals.revenue||0))[0],
        best:pl.filter(p=>p.vals.spend>=TS*0.05&&p.vals.roas!=null)
               .sort((a,b)=>b.vals.roas-a.vals.roas)[0]};
    }
    const days=seriesByDay(from,to,ov).filter(d=>d.n>0&&d.date!==T);
    if(days.length){
      out.day={n:days.length,
        best:days.slice().sort((a,b)=>(b.vals.revenue||0)-(a.vals.revenue||0))[0]};
      if(days.length>=7){
        const wd=Array.from({length:7},()=>[]);
        days.forEach(d=>{ wd[parseISO(d.date).getDay()].push(d.vals); });
        const list=wd.map((v,i)=>({i:i,n:v.length,vals:v.length?bucketVals(v):null}))
                     .filter(x=>x.n>=1&&x.vals);
        out.weekday={n:days.length,list:list,
          best:list.filter(x=>x.vals.roas!=null).sort((a,b)=>b.vals.roas-a.vals.roas)[0],
          busiest:list.slice().sort((a,b)=>(b.vals.revenue||0)-(a.vals.revenue||0))[0]};
      }
    }
    const iv=intervals(from,to,ov);
    if(iv.length>=8){
      const hr={}; iv.forEach(x=>{ (hr[x.hour]=hr[x.hour]||[]).push(x.vals); });
      const list=Object.keys(hr).map(h=>({h:+h,n:hr[h].length,vals:bucketVals(hr[h])}));
      const TS=sum(list.map(x=>x.vals.spend||0)), TR=sum(list.map(x=>x.vals.revenue||0));
      let bw=null;
      for(let h=0;h<24;h++){
        const w=[0,1,2].map(k=>list.find(x=>x.h===(h+k)%24)).filter(Boolean);
        if(w.length<3) continue;
        const r=sum(w.map(x=>x.vals.revenue||0)), sp=sum(w.map(x=>x.vals.spend||0));
        if(!bw||r>bw.r) bw={h:h,end:(h+3)%24,r:r,sp:sp,roas:sp>0?r/sp:null}; }
      out.hour={n:iv.length,list:list,TS:TS,TR:TR,
        best:list.filter(x=>x.n>=3&&x.vals.roas!=null).sort((a,b)=>b.vals.roas-a.vals.roas)[0],
        busiest:list.slice().sort((a,b)=>(b.vals.revenue||0)-(a.vals.revenue||0))[0],
        window:bw};
    }
    return out;
  });
}

/** مجموع الزيادة في كل ساعة من ساعات اليوم (0–23). الفرق بين لقطتين بيتوزع على الساعات اللي بينهم حسب المدة */
function hourBuckets(from,to,ov){
  return memo("hb:"+from+":"+to+":"+fSig(ov),()=>{
    const rk=rawMetrics().map(m=>m.key);
    const H=Array.from({length:24},(_,h)=>{ const raw={}; rk.forEach(k=>{ raw[k]=0; }); return {h:h,raw:raw,days:{}}; });
    for(const f of factsIn(from,to,ov)){
      for(let i=1;i<f.snaps.length;i++){
        const a=f.snaps[i-1], b=f.snaps[i], span=b.ts-a.ts; if(span<=0) continue;
        let t=a.ts;
        while(t<b.ts){
          const d=new Date(t), h=d.getHours();
          const next=Math.min(b.ts,new Date(d.getFullYear(),d.getMonth(),d.getDate(),h+1).getTime());
          const w=(next-t)/span;
          rk.forEach(k=>{ const dv=(+b.v[k]||0)-(+a.v[k]||0); if(dv) H[h].raw[k]+=dv*w; });
          H[h].days[f.date]=1; t=next;
        }
      }
    }
    return H.map(x=>{ const nd=Object.keys(x.days).length;
      return {h:x.h,days:nd,vals:nd? computeAll(Object.assign({},x.raw,{_gp:0,margin:1})) : null}; });
  });
}

      rawMetrics().filter(m=>["spend","impressions","clicks"].indexOf(m.key)<0).map(m=>'<option value="'+m.key+'"'+(by.key===m.key?" selected":"")+">"+

  if(!p.weekday) miss.push(L("أيام الأسبوع محتاجة ٧ أيام بيانات على الأقل","Weekday analysis needs at least 7 days of data"));

    (miss.length?'<div class="hint" style="margin-top:12px">'+miss.map(esc).join(" · ")+"</div>":""));

function chCols(labels,vals,color){
  const H=200,W=1000,n=Math.max(1,vals.length);
  const fin=vals.filter(v=>v!=null&&isFinite(v));
  const mx=Math.max.apply(null,fin.concat([0]))*1.12||1;
  const mn=Math.min.apply(null,fin.concat([0]));
  const span=mx-Math.min(0,mn)||1, zero=H*(mx/span);
  const gap=W/n, bw=Math.min(gap*0.62,46);
  let body="";
  vals.forEach((v,i)=>{ if(v==null||!isFinite(v)) return;
    const h=Math.abs(v)/span*H, y=v>=0? zero-h : zero;
    body+='<rect x="'+(gap*i+(gap-bw)/2).toFixed(1)+'" y="'+y.toFixed(2)+'" width="'+bw.toFixed(1)+
      '" height="'+Math.max(h,0.5).toFixed(2)+'" style="fill:'+color+'" opacity=".85" rx="1"/>'; });
  const tf=tickFmt(Math.min(0,mn),mx);
  let ylab=""; for(let i=0;i<=3;i++){ const v=mx-(i/3)*span;
    ylab+='<span style="top:'+((i/3)*100).toFixed(1)+'%">'+esc(tf(v))+"</span>"; }
  let xlab=""; const step=Math.max(1,Math.ceil(n/8));
  labels.forEach((d,i)=>{ xlab+="<span>"+(i%step===0||i===n-1? esc(d):"")+"</span>"; });
  return '<div class="ch" dir="ltr" style="--h:200px"><div class="ch-p"><div class="ch-y">'+ylab+"</div>"+
    '<svg viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="none">'+body+"</svg></div>"+
    '<div class="ch-x">'+xlab+"</div></div>";
}

  const ov=secScope(sec);
  const v=aggFacts(factsIn(ctx.from,ctx.to,ov));
  const pv=ctx.cmp? aggFacts(factsIn(ctx.cmp[0],ctx.cmp[1],ov)) : null;
  const st=FUNNEL_STAGES.filter(s=>(v[s[0]]||0)>0);
  if(st.length<2) return card(esc(secTitle(sec)),"",
    '<div class="empty" style="padding:26px">القمع محتاج مرحلتين على الأقل فيهم أرقام.<br>'+
    L("المراحل المدعومة: ","Supported stages: ")+FUNNEL_STAGES.map(s=>esc(s[1])).join(" ← ")+
    '.<br><span class="hint">سجّل «مشاهدة منتج» و«إضافة للسلة» و«بدء دفع» من شاشة إدخال البيانات عشان يشتغل بالكامل.</span></div>');
  const top=v[st[0][0]];
  let rows="", worst=null;
  st.forEach((s,i)=>{
    const val=v[s[0]], frac=top>0?val/top:0;
    let cvr=null, pcvr=null;
    if(i>0){ const prev=v[st[i-1][0]]; cvr=prev>0? val/prev*100 : null;
      if(pv){ const a=pv[st[i][0]], b=pv[st[i-1][0]]; pcvr = b>0? a/b*100 : null; } }
    // التسريب = أكبر تراجع نسبي في نفس الخطوة عن نفسها، مش أصغر نسبة عبور
    // (CTR طبيعي يكون ١–٢% و ATC→شراء ٤٠% — مقارنتهم ببعض غلط)
    if(cvr!=null&&pcvr!=null&&pcvr>0){
      const rel=(cvr-pcvr)/pcvr*100;
      if(rel<0&&(!worst||rel<worst.rel))
        worst={name:st[i-1][1]+" ← "+s[1],cvr:cvr,pcvr:pcvr,rel:rel,key:s[0]};
    }
    const col = (cvr==null||pcvr==null||!(pcvr>0))? "var(--cyan)"
      : (cvr-pcvr)/pcvr*100 <= -10 ? "var(--bad)"
      : (cvr-pcvr)/pcvr*100 <= -3  ? "var(--warn)" : "var(--good)";
    rows+='<div class="stg"><div>'+esc(s[1])+"</div>"+
      '<div class="stg-tr"><div class="stg-fl" style="background:'+col+';opacity:.55;transform:scaleX('+
        Math.max(frac,0.004).toFixed(4)+')"></div></div>'+
      '<div class="stg-d">'+fcompact(val,0)+(cvr!=null?' <span style="color:'+col+'">'+fnum(cvr,2)+"%</span>":"")+
      (pcvr!=null&&Math.abs(cvr-pcvr)>=0.01? ' <span style="color:var(--ink-3)">('+(cvr-pcvr>0?"+":"")+
        fnum(cvr-pcvr,2)+" ن)</span>":"")+
      "</div></div>";
  });
  let diag="";
  if(worst&&worst.rel<=-5){
    diag='<div class="ins '+(worst.rel<=-15?"bad":"warn")+'" style="margin-top:12px"><div class="ins-b">'+
      "أكبر تراجع عند <b>"+esc(worst.name)+"</b> — نسبة العبور <b>"+fnum(worst.cvr,2)+
      "%</b> بعد ما كانت <b>"+fnum(worst.pcvr,2)+"%</b> ("+fnum(worst.rel,0)+"%). "+
      (worst.key==="clicks"?L("التراجع قبل الكليك — كرييتف أو استهداف.","The drop is before the click — creative or targeting.")
        :worst.key==="orders"?L("التراجع في آخر خطوة — الدفع أو الشحن أو الثقة.","The drop is at the last step — payment, shipping or trust.")
        :L("راجع الخطوة دي في الموقع.","Review this step on the site."))+"</div></div>";
  } else if(!pv){
    diag='<div class="hint" style="margin-top:12px">مفيش فترة مقارنة، فمقدرش أقول فين التسريب — '+
      L("نسب العبور لوحدها مش قابلة للمقارنة ببعض (CTR طبيعي ١–٢% وشراء بعد السلة ٤٠%). ","Pass-through rates aren't comparable to each other (CTR is normally 1-2% and cart-to-purchase 40%). ")+
      "اختار فترة مقارنة من الشريط فوق.</div>";
  } else {
    diag='<div class="hint" style="margin-top:12px">مفيش خطوة تراجعت أكتر من ٥% عن الفترة اللي فاتت — القمع مستقر.</div>';
  }
  return card(esc(secTitle(sec)),secScopeLabel(sec)||"",rows+diag+
    (st.length<FUNNEL_STAGES.length?'<div class="hint" style="margin-top:10px">مراحل مش مسجلة: '+
      FUNNEL_STAGES.filter(x=>!(v[x[0]]>0)).map(x=>esc(x[1])).join("، ")+"</div>":""));
}

    "النظام مش بيوصي بإيقاف من بيانات قليلة — بيقول «"+esc(L("بيانات غير كافية","Not enough data"))+"» بدل ما يخمّن.</div>");

      '<div class="stg-tr" style="height:14px"><div class="stg-fl" style="background:'+col+
        ';opacity:.7;transform:scaleX('+clamp(p.actual/p.budget,0,1).toFixed(4)+')"></div>'+
      '<div style="position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.65;'+
        "inset-inline-end:"+(clamp(p.expected/p.budget,0,1)*100).toFixed(2)+'%"></div></div>'+
      '<div class="act-nums" style="margin:10px 0 0">'+
      '<div class="act-n">'+esc(L("صرفت","Spent"))+'<b>'+fnum(p.actual,0)+" "+C+"</b></div>"+
      '<div class="act-n">'+esc(L("المخطط لحد النهارده","Planned to date"))+'<b>'+fnum(p.expected,0)+" "+C+"</b></div>"+
      '<div class="act-n">'+esc(L("المتوقع آخر الفترة","Forecast at end"))+'<b style="color:'+(p.forecast>p.budget?"var(--bad)":"var(--ink)")+'">'+
        fnum(p.forecast,0)+" "+C+"</b></div>"+
      '<div class="act-n">'+esc(L("الميزانية","Budget"))+'<b>'+fnum(p.budget,0)+" "+C+"</b></div>"+
      '<div class="act-n">'+esc(L("فاضل","Left"))+'<b>'+p.left+" يوم</b></div>"+
      '<div class="act-n">'+esc(L("السقف اليومي المتاح","Safe daily cap"))+'<b>'+fnum(p.dailyLeft,0)+" "+C+"</b></div></div></div>";
  });
  return card(esc(secTitle(sec)),L("الخط الأبيض = "+esc(L("المخطط لحد النهارده","Planned to date")),"The white line = planned to date"),body||
    '<div class="empty">مفيش صرف في فترة '+esc(L("الميزانية","Budget"))+'</div>');

/* ── التقرير اليومي: منصات تتفتح على حملات + صف إجمالي ── */
function secDailyReport(sec,ctx){
  const ov=secScope(sec), dim=sec.dim||"platform";
  const cols=(sec.metrics&&sec.metrics.length?sec.metrics:["spend","orders","revenue","roas","cpa"])
    .filter(metricByKey);
  const rows=breakdown(ctx.from,ctx.to,dim,ov).filter(r=>(r.vals.spend||0)>0||(r.vals.revenue||0)>0)
    .sort((a,b)=>(b.vals.spend||0)-(a.vals.spend||0));
  if(!rows.length) return card(esc(secTitle(sec)),"",'<div class="empty">مفيش بيانات في الفترة دي</div>');
  const tot=aggFacts(factsIn(ctx.from,ctx.to,ov));
  const nm=k=> dim==="platform"?platById(k).name : dim==="client"?((clientById(k)||{}).name||k)
    : (k==="—"?"(بدون حملة)":k);
  const allOpen=rows.every(r=>S.expand[sec.id+"|"+r.key]);
  let t='<div class="tw"><table><thead><tr><th>'+esc(dimName(dim))+"</th>"+
    cols.map(k=>'<th class="n">'+esc(mkLabel(k))+"</th>").join("")+"</tr></thead><tbody>"+
    '<tr class="tot"><td>الإجمالي</td>'+cols.map(k=>'<td class="n num">'+
      esc(fval(tot[k],metricByKey(k),true))+"</td>").join("")+"</tr>";
  rows.forEach(r=>{
    const ek=sec.id+"|"+r.key, open=!!S.expand[ek];
    const subOv=Object.assign({},ov||{});
    if(dim==="platform") subOv.platforms=[r.key]; else if(dim==="client") subOv.clients=[r.key];
    const subs = dim==="campaign" ? [] :
      breakdown(ctx.from,ctx.to,"campaign",subOv).filter(x=>(x.vals.spend||0)>0)
        .sort((a,b)=>(b.vals.spend||0)-(a.vals.spend||0));
    t+='<tr class="exp" data-a="toggleExp" data-k="'+esc(ek)+'"><td>'+
      (subs.length?'<span class="exp-i">'+(open?"−":"+")+"</span>":'<span class="exp-i"></span>')+
      (dim==="platform"?'<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+
        platById(r.key).color+';margin-inline-end:7px"></span>':"")+esc(nm(r.key))+
      (subs.length?' <span class="conf">'+subs.length+" حملة</span>":"")+"</td>"+
      cols.map(k=>'<td class="n num">'+esc(fval(r.vals[k],metricByKey(k),true))+"</td>").join("")+"</tr>";
    if(open) subs.forEach(s=>{ t+='<tr class="sub"><td>'+esc(s.key==="—"?"(بدون حملة)":s.key)+"</td>"+
      cols.map(k=>'<td class="n num">'+esc(fval(s.vals[k],metricByKey(k),true))+"</td>").join("")+"</tr>"; });
  });
  return card(esc(secTitle(sec)),

    t+"</tbody></table></div>"+
    '<div class="hint" style="margin-top:10px">دوس على أي صف عشان تفتحه على الحملات. الأعمدة والبُعد بيتحددوا من إعدادات القسم.</div>');
}

/* ── التقرير اللحظي: كل منصة دلوقتي + آخر فترة ── */

    t+="<tr><td>"+(dim==="platform"?'<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+

  });

/* ── صحة التتبع ── */
function secTracking(sec,ctx){
  const ov=secScope(sec), C=CURR[S.cfg.settings.currency]||"";
  // المقارنة لازم تتم على نفس الصفوف بالظبط — لو صف مالوش أرقام نظام، بيتشال من الطرفين
  const g=groupBy(factsIn(ctx.from,ctx.to,ov),f=>f.platformId);
  const rows=Object.keys(g).map(pid=>{
    const all=g[pid];
    const both=all.filter(f=>{ const v=lastV(f); return (+v.backend_orders>0)||(+v.backend_revenue>0); });
    return {key:pid, vals:aggFacts(all), cmp: both.length? aggFacts(both) : null,
      cov: all.length? both.length/all.length : 0};
  }).filter(r=>(r.vals.orders||0)>0);
  const any=rows.some(r=>r.cmp);
  if(!any) return card(esc(secTitle(sec)),"",
    '<div class="empty" style="padding:26px">محتاج تسجّل <b>طلبات النظام</b> و<b>إيراد النظام</b> جنب أرقام المنصة'+
    "<br>عشان أقدر أقارن المصدرين وأطلع فرق التتبع."+
    '<br><button class="btn btn-s" style="margin-top:12px" data-a="go" data-v="entry">إدخال البيانات</button></div>');
  let t='<div class="tw"><table><thead><tr><th>'+esc(L("المنصة","Platform"))+'</th><th class="n">'+esc(L("تغطية المقارنة","Comparable rows"))+'</th>'+
    '<th class="n">طلبات المنصة</th><th class="n">طلبات النظام</th>'+
    '<th class="n">'+esc(L("الفرق","Change"))+'</th><th class="n">إيراد المنصة</th><th class="n">إيراد النظام</th><th class="n">'+esc(L("الفرق","Change"))+'</th>'+
    "<th>"+esc(L("الحالة","Status"))+"</th></tr></thead><tbody>";
  rows.forEach(r=>{
    const c=r.cmp, bo=c?(c.backend_orders||0):0, br=c?(c.backend_revenue||0):0;
    const dO=(c&&bo>0)? (c.orders-bo)/bo*100 : null, dR=(c&&br>0)? (c.revenue-br)/br*100 : null;
    const worst=Math.max(Math.abs(dO==null?0:dO),Math.abs(dR==null?0:dR));
    const st = !c? [L("مفيش أرقام نظام","No system numbers"),"var(--ink-3)"] : worst>20? ["فرق كبير","var(--bad)"]
      : worst>10? ["فرق ملحوظ","var(--warn)"] : ["متطابق","var(--good)"];
    t+="<tr><td>"+esc(platById(r.key).name)+"</td>"+
      '<td class="n num" style="color:'+(r.cov<0.6?"var(--amber)":"var(--ink-3)")+'">'+
        (r.cov>0?fnum(r.cov*100,0)+"%":"—")+"</td>"+
      '<td class="n num">'+(c?fnum(c.orders,0):"—")+'</td><td class="n num">'+(bo>0?fnum(bo,0):"—")+"</td>"+
      '<td class="n num" style="color:'+(Math.abs(dO==null?0:dO)>10?"var(--bad)":"var(--ink-2)")+'">'+
        (dO==null?"—":(dO>0?"+":"")+fnum(dO,1)+"%")+"</td>"+
      '<td class="n num">'+(c?fcompact(c.revenue,0):"—")+'</td><td class="n num">'+(br>0?fcompact(br,0):"—")+"</td>"+
      '<td class="n num" style="color:'+(Math.abs(dR==null?0:dR)>10?"var(--bad)":"var(--ink-2)")+'">'+
        (dR==null?"—":(dR>0?"+":"")+fnum(dR,1)+"%")+"</td>"+
      '<td><span class="pill" style="color:'+st[1]+';border-color:'+st[1]+'44">'+esc(st[0])+"</span></td></tr>";
  });
  return card(esc(secTitle(sec)),L("مقارنة أرقام المنصة بأرقام نظامك","Comparing platform numbers to your own system"),
    t+"</tbody></table></div>"+
    '<div class="hint" style="margin-top:10px">فرق موجب معناه المنصة بتنسب لنفسها أكتر من اللي وصل نظامك — طبيعي لحد ~١٠% بسبب نوافذ الـ attribution. '+
    L("فوق كده يستاهل مراجعة البيكسل أو الـ deduplication. ","Above that, it's worth reviewing the pixel or deduplication. ")+
    "<b>تغطية المقارنة</b> = نسبة الصفوف اللي فيها أرقام نظام فعلاً — الصفوف اللي من غيرها متشالة من الطرفين "+
    "عشان الفرق ميطلعش مضروب.</div>");
}

function secHourMap(sec,ctx){
  const ov=secScope(sec), k=(sec.metrics&&sec.metrics[0])||"revenue", m=metricByKey(k);
  if(!m) return card(esc(secTitle(sec)),"",'<div class="empty">اختار ميترك</div>');
  const iv=intervals(ctx.from,ctx.to,ov);
  const c=IN();
  if(iv.length<12) return card(esc(secTitle(sec)),"",
    '<div class="empty" style="padding:26px">محتاج لقطات أكتر خلال اليوم عشان أقدر أوزّع الأداء على الساعات.<br>'+
    "دلوقتي عندي <b>"+iv.length+"</b> فترة بس — سجّل مرتين–تلاتة في اليوم وهيشتغل لوحده.</div>");
  const rm=rawMetrics().map(x=>x.key);
  const cells={}, hourTot={};
  iv.forEach(x=>{
    const key=x.date+"|"+x.hour, cell=cells[key]||(cells[key]={});
    rm.forEach(r=>{ cell[r]=(cell[r]||0)+(+x.vals[r]||0); });
    cell._gp=(cell._gp||0)+(+x.vals._gp||0);
    const ht=hourTot[x.hour]||(hourTot[x.hour]={n:0}); ht.n++;
    rm.forEach(r=>{ ht[r]=(ht[r]||0)+(+x.vals[r]||0); });
    ht._gp=(ht._gp||0)+(+x.vals._gp||0);
  });
  const days=[...new Set(iv.map(x=>x.date))].sort();
  const hours=Object.keys(hourTot).map(Number).sort((a,b)=>a-b);
  if(!hours.length) return card(esc(secTitle(sec)),"",'<div class="empty">مفيش ساعات مسجلة</div>');
  const mtx=days.map(d=>hours.map(h=>{ const cell=cells[d+"|"+h]; if(!cell) return null;
    const v=computeAll(cell)[k]; return (v!=null&&isFinite(v))?v:null; }));
  // أفضل وأسوأ ساعة على مستوى الفترة كلها
  const ranked=hours.map(h=>{ const v=computeAll(hourTot[h]);
    return {h:h, v:v[k], spend:v.spend||0, revenue:v.revenue||0, n:hourTot[h].n}; })
    .filter(x=>x.v!=null&&isFinite(x.v)&&x.n>=3);
  const TS=sum(ranked.map(x=>x.spend)), TR=sum(ranked.map(x=>x.revenue));
  let note="";
  if(ranked.length>=4){
    const srt=ranked.slice().sort((a,b)=> m.dir==="down"? a.v-b.v : b.v-a.v);
    const best=srt[0], worst=srt[srt.length-1];
    note='<div class="ins '+(iv.length>=40?"good":"warn")+'" style="margin-top:12px"><div class="ins-b">'+
      "أفضل ساعة <b>"+fhour(best.h)+"</b> ("+esc(mLabel(m))+" <b>"+fval(best.v,m,true)+"</b>"+
      (TS>0?"، <b>"+fnum(pctOf(best.spend,TS),0)+"%</b> من الصرف و<b>"+fnum(pctOf(best.revenue,TR),0)+"%</b> من الإيراد":"")+
      ") وأضعفها <b>"+fhour(worst.h)+"</b> (<b>"+fval(worst.v,m,true)+"</b>). "+
      (iv.length>=40? "" : "<b>خد بالك:</b> ده مبني على "+iv.length+L(" فترة بس — مش كفاية لقرار جدولة، سجّل لقطات أكتر."," intervals only — not enough for a scheduling decision, log more snapshots."))+
      '</div></div>';
  } else note='<div class="hint" style="margin-top:12px">مفيش ساعات فيها ٣ قراءات على الأقل، فمش هقول لك أنهي ساعة أحسن.</div>';
  return card(esc(secTitle(sec)),
    (secScopeLabel(sec)?secScopeLabel(sec)+" · ":"")+esc(mLabel(m))+L(" · أغمق = أعلى · "," · darker = higher · ")+iv.length+L(" فترة"," intervals"),
    chHeat(days.map(fdate),hours.map(fhour),mtx,"var(--cyan)",v=>fval(v,m,true))+note);
}

const ROUND_STEPS=[[15,"١٥ دقيقة","15 min"],[30,"نص ساعة","30 min"],[60,"ساعة","1 hour"],
                   [120,"ساعتين","2 hours"],[0,"من غير تذكير","No reminder"]];
function roundMins(){ const v=S.cfg.settings.roundMins; return v==null?30:+v; }
function roundMetrics(sec){
  const pick=(sec&&sec.metrics&&sec.metrics.length)?sec.metrics:(S.cfg.settings.roundMetrics||null);
  const kind=clientKindOf(roundClient());
  const rel=m=>!m.kinds||!m.kinds.length||(kind&&m.kinds.indexOf(kind)>=0);
  if(pick&&pick.length) return pick.map(metricByKey).filter(m=>m&&m.type==="raw");
  const base=["spend","orders","revenue"];
  if(kind==="app") base.splice(1,0,"installs");
  if(kind==="leadgen") base.splice(1,0,"leads");
  return base.map(metricByKey).filter(m=>m&&rel(m));
}
function roundClient(){
  if(S.round.clientId&&clientById(S.round.clientId)) return S.round.clientId;
  if(S.ws) return S.ws;
  if(S.f.clients.length===1) return S.f.clients[0];
  return S.cfg.clients.length? S.cfg.clients[0].id : null;
}
/** الصفوف: توليفات النهاردة، وإلا توليفات امبارح عشان تبدأ اليوم بسرعة */
function roundRows(date,cid){
  const seen={}, out=[];
  const add=f=>{ const k=f.platformId+"|"+(f.campaign||"");
    if(seen[k]) return; seen[k]=1;
    out.push({key:k,platformId:f.platformId,campaign:f.campaign||""}); };
  S.facts.filter(f=>f.date===date&&f.clientId===cid).forEach(add);
  if(!out.length) S.facts.filter(f=>f.date===addDays(date,-1)&&f.clientId===cid).forEach(add);
  (S.round.extra||[]).forEach(x=>add({platformId:x.platformId,campaign:x.campaign}));
  const hid=S.round.hidden||{};
  return out.filter(r=>!hid[r.key]).sort((a,b)=>a.key<b.key?-1:1);
}
function lastSnapFor(date,cid,key){
  const f=S.facts.find(x=>x.date===date&&x.clientId===cid&&(x.platformId+"|"+(x.campaign||""))===key);
  if(!f||!f.snaps.length) return null;
  return f.snaps[f.snaps.length-1];
}
function roundLastTs(date,cid){
  let t=0;
  S.facts.filter(f=>f.date===date&&f.clientId===cid).forEach(f=>{
    f.snaps.forEach(s=>{ if(s.ts>t) t=s.ts; }); });
  return t||null;
}
function nowHM(){ const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }

  let h='<div class="rnd-hd">'+

    '<input class="inp" type="time" data-c="roundTime" value="'+esc(S.round.time)+'" style="width:120px">'+
    (isToday?'<button class="btn btn-s" data-a="roundNow">'+esc(L("دلوقتي","Now"))+"</button>":"")+
    (S.cfg.clients.length>1?'<span class="flab">'+esc(L("العميل","Client"))+'</span>'+
      '<select class="sel" data-c="roundClient">'+S.cfg.clients.map(c=>'<option value="'+c.id+'"'+
        (cid===c.id?" selected":"")+">"+esc(c.name)+"</option>").join("")+"</select>":"")+
    '<span class="flab">'+esc(L("كل","Every"))+'</span><select class="sel" data-c="roundStep">'+
      ROUND_STEPS.map(x=>'<option value="'+x[0]+'"'+(step===x[0]?" selected":"")+">"+
        esc(L(x[1],x[2]))+"</option>").join("")+"</select>"+
    due+"</div>";

  if(!rows.length) return card(esc(secTitle(sec)),"",h+
    '<div class="empty" style="padding:22px">'+
    esc(L("مفيش منصات مسجلة للعميل ده. زوّد صف عشان تبدأ.","No platforms logged for this client yet. Add a row to start."))+
    '<div style="margin-top:12px"><button class="btn btn-p" data-a="roundAddRow">'+

  /* ── الجدول ── */
  let t='<div class="tw"><table class="rnd-t"><thead><tr><th>'+esc(L("المنصة","Platform"))+"</th>"+
    mets.map(m=>'<th class="n">'+esc(mLabel(m))+(m.unit==="cur"?" ("+esc(C)+")":"")+"</th>").join("")+
    "<th></th></tr></thead><tbody>";
  rows.forEach(r=>{
    const last=lastSnapFor(date,cid,r.key);
    t+="<tr><td><div class='rnd-plat'><i style='background:"+platById(r.platformId).color+"'></i>"+
      esc(platById(r.platformId).name)+"</div>"+
      (r.campaign?"<div class='rnd-cmp'>"+esc(r.campaign)+"</div>":"")+"</td>"+
      mets.map(m=>{

        const cur=(S.round.vals[r.key]||{})[m.key];
        return '<td><input type="number" step="any" min="0" inputmode="decimal"'+

          '<span class="rnd-d" data-dk="'+esc(r.key)+"|"+m.key+'"></span></td>';
      }).join("")+
      '<td class="n"><button class="btn btn-s btn-d" data-a="roundDelRow" data-k="'+esc(r.key)+
        '" title="'+esc(L("شيل الصف من الجولة","Remove row from this round"))+'">✕</button></td></tr>';
  });
  t+="</tbody></table></div>";

  h+=t+'<div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px">'+

    '<button class="btn" data-a="roundFill">'+esc(L("املأ بآخر جولة","Fill from last round"))+"</button>"+
    '<button class="btn" data-a="roundAddRow">'+esc(L("+ صف","+ Row"))+"</button>"+
    '<button class="btn" data-a="roundClear">'+esc(L("فضّي","Clear"))+"</button>"+
    '<span class="hint">'+esc(L("اكتب الأرقام التراكمية زي ما هي في المنصة. الخانة الفاضية بتاخد آخر قيمة.",
      "Enter cumulative figures as shown in the platform. An empty cell keeps the last value."))+

  return card(esc(secTitle(sec)),
    esc(fdateFull(date))+" · "+rows.length+esc(L(" منصة"," rows")),h);
}

ACT.roundSave=async t=>{
  const date=S.liveDate||todayISO(), cid=roundClient();
  const hm=(S.round.time||nowHM()).split(":");
  const ts=parseISO(date).getTime()+(+hm[0])*36e5+(+hm[1]||0)*6e4;
  const rows=roundRows(date,cid);
  const jobs=[];
  document.querySelectorAll("[data-rk]").forEach(i=>{
    if(i.value==="") return;
    const k=i.dataset.rk;
    let job=jobs.find(x=>x.key===k);
    if(!job){ const r=rows.find(x=>x.key===k); if(!r) return;
      job={key:k,platformId:r.platformId,campaign:r.campaign,values:{}}; jobs.push(job); }

  });
  if(!jobs.length) return toast(L("مفيش أرقام في الجولة دي","No numbers in this round"),true);

      campaign:j.campaign,values:j.values,ts:ts}); ok++; }
    catch(e){ bad++; }

function briefDate(sec){

/** أحسن وأوحش شريحة في يوم — بشرط صرف معتبر */
function bestWorst(date,dim,minShare){
  const rows=breakdown(date,date,dim).filter(r=>(r.vals.spend||0)>0&&r.vals.roas!=null);
  if(rows.length<2) return null;
  const TS=sum(rows.map(r=>r.vals.spend));
  const elig=rows.filter(r=>r.vals.spend>=TS*(minShare||0.08));
  if(elig.length<2) return null;
  const srt=elig.slice().sort((a,b)=>b.vals.roas-a.vals.roas);
  const nm=k=> dim==="platform"?platById(k).name
    : dim==="client"?((clientById(k)||{}).name||k) : (k==="—"?L("(بدون حملة)","(no campaign)"):k);
  return {best:srt[0],worst:srt[srt.length-1],name:nm,TS:TS};
}

function secBrief(sec,ctx){
  const D=briefDate(sec), C=CURR[S.cfg.settings.currency]||"", isToday=D===todayISO();
  const pts=intraday(D);
  if(!pts.length) return card(esc(secTitle(sec)),esc(fdateFull(D)),

    esc(L("مفيش أي جولة مسجلة في اليوم ده.","No rounds logged for this day."))+

    esc(L("سجّل جولة","Log a round"))+"</button></div></div>");
  const last=pts[pts.length-1], v=last.vals;
  const msOfDay=last.ts-parseISO(D).getTime();
  const yAt=stateAt(addDays(D,-1),msOfDay);
  let h="";

  /* الأرقام مقابل نفس التوقيت امبارح */
  h+='<div class="bf-row">'+BF_KEYS.map(k=>{ const m=metricByKey(k); if(!m) return "";
    return bfKpi(mLabel(m),fval(v[k],m,true)+(m.unit==="cur"?" "+C:""),
      yAt?deltaChip(v[k],yAt[k],m):'<span class="dlt fl">—</span>',m,

  }).join("")+"</div>";

  /* الإسقاط */
  if(isToday&&msOfDay>36e5){
    const f=864e5/msOfDay;
    const yFull=(()=>{ const q=factsIn(addDays(D,-1),addDays(D,-1)); return q.length?aggFacts(q):null; })();
    h+='<div class="bf-b">'+esc(L("لو كمّل بنفس المعدل","If it holds this pace"))+"</div>"+
      '<div class="bf-row">'+["spend","orders","revenue"].map(k=>{ const m=metricByKey(k); if(!m) return "";
        const proj=(v[k]||0)*f;
        return bfKpi(mLabel(m),fval(proj,m,true)+(m.unit==="cur"?" "+C:""),
          yFull?deltaChip(proj,yFull[k],m):"",m,
          yFull?L("امبارح كامل ","yesterday full ")+fval(yFull[k],m,true):"");
      }).join("")+"</div>"+
      '<div class="hint" style="margin-top:-6px">'+
      esc(L("الإسقاط خطي — لو مبيعاتك بتتركّز بالليل هيطلع أقل من الحقيقي.",
            "The projection is linear — if your sales skew late it will read low."))+"</div>";
  }

  /* أكبر مكسب وأكبر مشكلة */
  const bwP=bestWorst(D,"platform"), bwC=bestWorst(D,"campaign");
  const bw=bwC||bwP;
  h+='<div class="bf-b">'+esc(L("أكبر مكسب وأكبر مشكلة","Biggest win and biggest problem"))+"</div>";
  if(bw){
    h+=bfLine("var(--good)","<b>"+esc(bw.name(bw.best.key))+"</b> — ROAS <b>"+
      fnum(bw.best.vals.roas,2)+"×</b> "+esc(L("على صرف","on spend"))+" <b>"+
      fnum(bw.best.vals.spend,0)+" "+esc(C)+"</b>");
    h+=bfLine("var(--bad)","<b>"+esc(bw.name(bw.worst.key))+"</b> — ROAS <b>"+
      fnum(bw.worst.vals.roas,2)+"×</b> "+esc(L("على صرف","on spend"))+" <b>"+
      fnum(bw.worst.vals.spend,0)+" "+esc(C)+"</b>");
  } else h+='<div class="bf-none">'+esc(L("محتاج شريحتين على الأقل فيهم صرف معتبر عشان أقارن.",
    "Needs at least two segments with meaningful spend to compare."))+"</div>";

  /* تنبيهات حرجة */
  const acts=buildActions(D,D).filter(a=>a.pri.band==="critical"||a.pri.band==="high").slice(0,4);
  h+='<div class="bf-b">'+esc(L("محتاج تدخلك","Needs you"))+"</div>";
  if(acts.length) acts.forEach(a=>{ h+=bfLine(PRI[a.pri.band].color,
    "<b>"+esc(a.title)+"</b>"+(a.scopeName?" — "+esc(a.scopeName):"")+
    (a.cur?' <span style="color:var(--ink-3)">('+esc(a.cur)+
      (a.tgt?" "+esc(L("مقابل","vs"))+" "+esc(a.tgt):"")+")</span>":"")); });
  else h+='<div class="bf-none">'+esc(L("مفيش حاجة حرجة النهاردة.","Nothing critical today."))+"</div>";

  /* جودة البيانات */
  const seen={}; factsIn(D,D).forEach(f=>{ seen[f.platformId]=1; });
  const yPl={}; factsIn(addDays(D,-1),addDays(D,-1)).forEach(f=>{ yPl[f.platformId]=1; });
  const missing=Object.keys(yPl).filter(p=>!seen[p]);
  const step=roundMins();
  const staleMins=isToday&&step>0? Math.round((Date.now()-last.ts)/60000)-step : 0;
  h+='<div class="bf-b">'+esc(L("جودة البيانات","Data quality"))+"</div>";
  let dq=[];
  if(missing.length) dq.push(bfLine("var(--warn)",
    esc(L("منصات شغالة امبارح ومفيهاش أرقام النهاردة: ","Platforms that ran yesterday with nothing today: "))+
    "<b>"+missing.map(p=>esc(platById(p).name)).join("، ")+"</b>"));
  if(staleMins>0) dq.push(bfLine("var(--warn)",
    esc(L("آخر جولة من ","Last round was "))+"<b>"+(staleMins+step)+"</b>"+
    esc(L(" دقيقة — فات ميعاد الجولة الجاية."," min ago — the next round is overdue."))));
  if(pts.length<3) dq.push(bfLine("var(--info)",
    "<b>"+pts.length+"</b>"+esc(L(" جولة بس النهاردة — تحليل الساعات والـ ROAS اللحظي محتاجين أكتر.",
      " round(s) today — hourly analysis and interval ROAS need more."))));
  h+= dq.length? dq.join("") : '<div class="bf-none">'+esc(L("مفيش مشاكل في البيانات.","No data issues."))+"</div>";

  return card(esc(secTitle(sec)),
    esc(fdateFull(D))+" · "+esc(L("لحد ","as of "))+ftime(last.ts)+" · "+pts.length+esc(L(" جولة"," rounds")),
    h+'<div style="margin-top:14px"><button class="btn btn-s" data-a="briefCopy" data-d="'+esc(D)+
    '" data-k="brief">'+esc(L("انسخ الملخص","Copy summary"))+"</button></div>");
}

/* ── تقرير إقفال اليوم ── */
function secEod(sec,ctx){
  const T=todayISO();
  const D=sec&&sec.date? sec.date : (S.liveDate&&S.liveDate!==T? S.liveDate : addDays(T,-1));
  const C=CURR[S.cfg.settings.currency]||"";
  const facts=factsIn(D,D);
  if(!facts.length) return card(esc(secTitle(sec)),esc(fdateFull(D)),
    '<div class="empty" style="padding:26px">'+
    esc(L("مفيش بيانات في اليوم ده.","No data for this day."))+"</div>");
  const v=aggFacts(facts);
  const y=(()=>{ const q=factsIn(addDays(D,-1),addDays(D,-1)); return q.length?aggFacts(q):null; })();
  /* متوسط الـ ٧ أيام اللي قبله */
  const prev=seriesByDay(addDays(D,-7),addDays(D,-1)).filter(d=>d.n>0);
  const avg=prev.length? (()=>{ const b={}; rawMetrics().forEach(m=>{
      b[m.key]=mean(prev.map(d=>d.vals[m.key]||0)); });
    b._gp=mean(prev.map(d=>d.vals._gp||0)); return computeAll(b); })() : null;
  let h="";

  h+='<div class="bf-row">'+BF_KEYS.map(k=>{ const m=metricByKey(k); if(!m) return "";
    return bfKpi(mLabel(m),fval(v[k],m,true)+(m.unit==="cur"?" "+C:""),
      y?deltaChip(v[k],y[k],m):"",m,
      y?L("امبارح ","yesterday ")+fval(y[k],m,true):L("مفيش يوم قبله","no prior day"));
  }).join("")+"</div>";

  if(avg){
    h+='<div class="bf-b">'+esc(L("مقابل متوسط آخر ","vs the average of the last "))+prev.length+
      esc(L(" أيام"," days"))+"</div><div class='bf-row'>"+
      BF_KEYS.map(k=>{ const m=metricByKey(k); if(!m) return "";
        return bfKpi(mLabel(m),fval(avg[k],m,true)+(m.unit==="cur"?" "+C:""),
          deltaChip(v[k],avg[k],m),m,L("المتوسط","average"));
      }).join("")+"</div>";
  } else h+='<div class="hint">'+esc(L("مفيش تاريخ كافي أقارن بيه المتوسط.",
      "Not enough history to compare against an average."))+"</div>";

  /* أفضل وأسوأ */
  const bwP=bestWorst(D,"platform"), bwC=bestWorst(D,"campaign");
  h+='<div class="bf-b">'+esc(L("أفضل وأسوأ","Winner and loser"))+"</div>";
  let any=false;
  [["المنصات","Platforms",bwP],["الحملات","Campaigns",bwC]].forEach(g=>{
    if(!g[2]) return; any=true;
    h+=bfLine("var(--good)",esc(L(g[0],g[1]))+": <b>"+esc(g[2].name(g[2].best.key))+"</b> "+
      fnum(g[2].best.vals.roas,2)+"× · "+fnum(g[2].best.vals.spend,0)+" "+esc(C));
    h+=bfLine("var(--bad)",esc(L(g[0],g[1]))+": <b>"+esc(g[2].name(g[2].worst.key))+"</b> "+
      fnum(g[2].worst.vals.roas,2)+"× · "+fnum(g[2].worst.vals.spend,0)+" "+esc(C));
  });
  if(!any) h+='<div class="bf-none">'+esc(L("مفيش شرايح كفاية للمقارنة.","Not enough segments to compare."))+"</div>";

  /* استنتاجات اليوم */
  const ins=buildInsights(addDays(D,-13),D).slice(0,3);
  h+='<div class="bf-b">'+esc(L("أهم الاستنتاجات","Key insights"))+"</div>";
  if(ins.length) ins.forEach(x=>{ h+=bfLine(
    x.tone==="bad"?"var(--bad)":x.tone==="warn"?"var(--warn)":x.tone==="good"?"var(--good)":"var(--info)",
    "<b>"+esc(x.title)+"</b> — "+x.body); });
  else h+='<div class="bf-none">'+esc(L("مفيش استنتاجات كفاية لسه.","Not enough for insights yet."))+"</div>";

  /* إجراءات بكرة */
  const dim=decisionDim(D,D,null);
  const rows=breakdown(D,D,dim).filter(r=>(r.vals.spend||0)>0)
    .sort((a,b)=>(b.vals.spend||0)-(a.vals.spend||0)).slice(0,6);
  h+='<div class="bf-b">'+esc(L("إجراءات بكرة","Tomorrow's actions"))+"</div>";
  let acts=0;
  rows.forEach(r=>{
    const sc=assessDim(D,D,dim,r.key,null), d=sc.decision;
    if(d.status==="watch"||d.status==="nodata") return;
    acts++;
    const nm= dim==="platform"?platById(r.key).name
      : dim==="client"?((clientById(r.key)||{}).name||r.key)
      : (r.key==="—"?L("(بدون حملة)","(no campaign)"):r.key);
    h+=bfLine(DEC[d.status].color,'<span class="pill" style="color:'+DEC[d.status].color+
      ';border-color:color-mix(in srgb,'+DEC[d.status].color+' 40%,transparent)">'+DEC[d.status].icon+" "+
      esc(DEC[d.status].label)+"</span> <b>"+esc(nm)+"</b> — "+esc(d.why));
  });
  if(!acts) h+='<div class="bf-none">'+esc(L("مفيش شريحة محتاجة قرار — كله تحت المراقبة.",
    "No segment needs a decision — everything is in watch mode."))+"</div>";

  return card(esc(secTitle(sec)),esc(fdateFull(D)),
    h+'<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn btn-s" data-a="briefCopy" data-d="'+esc(D)+'" data-k="eod">'+
      esc(L("انسخ التقرير","Copy report"))+"</button>"+
    '<button class="btn btn-s" data-a="eodDay" data-d="'+esc(addDays(D,-1))+'">'+
      esc(L("اليوم اللي قبله","Previous day"))+"</button>"+
    (D<T?'<button class="btn btn-s" data-a="eodDay" data-d="'+esc(addDays(D,1))+'">'+
      esc(L("اليوم اللي بعده","Next day"))+"</button>":"")+"</div>");
}
ACT.eodDay=t=>{ S.liveDate=t.dataset.d; refresh(); };

/* ── نسخة نصية للإرسال ── */
function briefText(D,kind){
  const C=CURR[S.cfg.settings.currency]||"";
  const facts=factsIn(D,D); if(!facts.length) return "";
  const v=aggFacts(facts);
  const y=(()=>{ const q=factsIn(addDays(D,-1),addDays(D,-1)); return q.length?aggFacts(q):null; })();
  const lines=[];
  lines.push((kind==="eod"?L("تقرير إقفال — ","End of day — "):L("ملخص اليوم — ","Daily brief — "))+fdateFull(D));
  if(S.ws) lines.push(L("العميل: ","Client: ")+((clientById(S.ws)||{}).name||""));
  lines.push("");
  BF_KEYS.forEach(k=>{ const m=metricByKey(k); if(!m) return;
    const p=y?pctChange(y[k],v[k]):null;
    lines.push("• "+mLabel(m)+": "+fval(v[k],m,true)+(m.unit==="cur"?" "+C:"")+
      (p!=null?"  ("+(p>0?"+":"")+fnum(p,1)+"% "+L("عن امبارح","vs yesterday")+")":"")); });
  const bw=bestWorst(D,"campaign")||bestWorst(D,"platform");
  if(bw){ lines.push("");
    lines.push(L("أفضل: ","Best: ")+bw.name(bw.best.key)+" — ROAS "+fnum(bw.best.vals.roas,2)+"×");
    lines.push(L("أضعف: ","Weakest: ")+bw.name(bw.worst.key)+" — ROAS "+fnum(bw.worst.vals.roas,2)+"×"); }
  const acts=buildActions(D,D).filter(a=>a.pri.band==="critical"||a.pri.band==="high").slice(0,4);
  if(acts.length){ lines.push(""); lines.push(L("محتاج تدخل:","Needs action:"));
    acts.forEach(a=>lines.push("• "+a.title+(a.scopeName?" — "+a.scopeName:"")+
      (a.cur?" ("+a.cur+(a.tgt?" "+L("مقابل","vs")+" "+a.tgt:"")+")":""))); }
  return lines.join("\n");
}
ACT.briefCopy=async t=>{
  const txt=briefText(t.dataset.d,t.dataset.k);
  if(!txt) return toast(L("مفيش بيانات","No data"),true);
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(txt);
      toast(L("الملخص اتنسخ","Summary copied")); return;
    }
  }catch(e){}
  modal(L("انسخ الملخص","Copy summary"),
    '<textarea class="inp" style="min-height:260px;direction:rtl;text-align:right;font-family:var(--f-ui)" readonly>'+
    esc(txt)+"</textarea>"+
    '<div class="hint" style="margin-top:8px">'+
    esc(L("اختار الكل وانسخ.","Select all and copy."))+"</div>");
};

const ACCT="__acct";
function isAcct(id){ return id===ACCT; }
function acctPlat(){ return {id:ACCT,name:L("إجمالي الحساب","Account total"),color:"var(--ink-3)"}; }

function sheetPlatforms(sec){
  const pick=(sec&&sec.filter&&sec.filter.platforms)||[];
  if(pick.length) return pick.map(id=>platById(id)).filter(p=>p&&!isAcct(p.id));
  const vis=livePlats();
  return S.cfg.platforms.filter(p=>!isAcct(p.id)&&(!vis.length||vis.indexOf(p.id)>=0));
}
function sheetAcctCols(sec){
  const keys=(sec&&sec.metrics&&sec.metrics.length)?sec.metrics:["orders","revenue"];
  return keys.map(metricByKey).filter(m=>m&&m.type==="raw");
}
function sheetPlatCols(sec){
  const k=(sec&&sec.platCols&&sec.platCols.length)? sec.platCols : ["spend"];
  return k.map(metricByKey).filter(m=>m&&m.type==="raw");
}
function sheetCalcCols(sec){
  const keys=(sec&&sec.calc&&sec.calc.length)?sec.calc:["spend","roas","aov","cpa"];
  return keys.map(metricByKey).filter(Boolean);
}
/** كل الأوقات المسجلة في اليوم لعميل واحد */
function sheetTimes(date,cid){
  const t={};
  S.facts.filter(f=>f.date===date&&f.clientId===cid).forEach(f=>f.snaps.forEach(s=>{ t[s.ts]=1; }));
  return Object.keys(t).map(Number).sort((a,b)=>a-b);
}
function factAt(date,cid,pid,ts){
  const f=S.facts.find(x=>x.date===date&&x.clientId===cid&&x.platformId===pid&&!(x.campaign||""));
  if(!f){
    // مفيش صف على مستوى المنصة (زي السحب الأوتوماتيك) → نجمع صفوف الحملات
    const cs=S.facts.filter(x=>x.date===date&&x.clientId===cid&&x.platformId===pid&&(x.campaign||""));
    if(!cs.length) return null;
    const v={}; let any=false;
    cs.forEach(c=>{ const sn=snapAtOrBefore(c,ts); if(!sn) return; any=true; Object.keys(sn.v).forEach(k=>{ v[k]=(v[k]||0)+(+sn.v[k]||0); }); });
    return any? {ts:ts,v:v} : null;
  }
  return snapAtOrBefore(f,ts);
}
function sheetRowVals(date,cid,plats,ts){
  const raw={}; rawMetrics().forEach(m=>{ raw[m.key]=0; });
  let gp=0;
  plats.forEach(p=>{ const s=factAt(date,cid,p.id,ts); if(!s) return;
    rawMetrics().forEach(m=>{ raw[m.key]+=(+s.v[m.key]||0); }); });
  const a=factAt(date,cid,ACCT,ts);
  if(a) rawMetrics().forEach(m=>{ raw[m.key]+=(+a.v[m.key]||0); });
  const cl=clientById(cid), mg=cl&&cl.margin!=null?cl.margin:1, _nm=!(cl&&cl.margin!=null);
  raw._gp=(raw.revenue||0)*mg;
  raw.margin=mg; if(_nm) raw._noMargin=1;
  return computeAll(raw);
}

function secDaySheet(sec,ctx){
  if(!S.cfg.clients.length) return card(esc(secTitle(sec)),"",
    '<div class="empty" style="padding:24px">'+esc(L("محتاج تضيف عميل الأول.","Add a client first."))+"</div>");
  const date=secDay(sec), cid=roundClient();
  const plats=sheetPlatforms(sec), acct=sheetAcctCols(sec), calc=sheetCalcCols(sec), pcols=sheetPlatCols(sec);
  const times=sheetTimes(date,cid);
  const C=CURR[S.cfg.settings.currency]||"";
  if(!plats.length) return card(esc(secTitle(sec)),"",
    '<div class="empty" style="padding:24px">'+esc(L("اختار منصات للأعمدة من خيارات القسم.",
      "Pick platform columns in the section options."))+chartCtl(sec,{plats:1,metrics:"raw",calc:1})+"</div>");

  const cell=(ts,kind,id,val,ph)=>
    '<td><input type="number" step="any" min="0" inputmode="decimal" data-sh="'+kind+':'+esc(id)+
    '" data-ts="'+(ts==null?"new":ts)+'" value="'+(val==null?"":esc(val))+'"'+
    (ph!=null?' placeholder="'+esc(fnum(ph,0))+'"':"")+"></td>";

  let h='<div class="sh-w" data-shsec="'+esc(sec.id)+'"><table class="sh"><thead>'+
    '<tr><th rowspan="2">'+esc(L("الوقت","Time"))+"</th>"+
    '<th class="grp" colspan="'+(plats.length*pcols.length)+'">'+esc(pcols.length===1&&pcols[0].key==="spend"
      ? L("الصرف لكل منصة","Spend by platform") : L("أرقام كل منصة","Per-platform figures"))+"</th>"+
    (acct.length?'<th class="grp sh-sep" colspan="'+acct.length+'">'+
      esc(L("من داشبورد المبيعات","From the sales dashboard"))+"</th>":"")+
    (calc.length?'<th class="grp sh-sep" colspan="'+calc.length+'">'+
      esc(L("محسوب","Computed"))+"</th>":"")+"</tr><tr>"+
    plats.map(p=>pcols.map((m,j)=>'<th style="text-align:center"'+(j===0&&pcols.length>1?' class="sh-sep"':"")+
      '><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+p.color+
      ';margin-inline-end:5px"></span>'+esc(p.name)+(pcols.length>1?' <span class="sh-sub">'+esc(mLabel(m))+"</span>":"")+
      "</th>").join("")).join("")+
    acct.map((m,i)=>'<th style="text-align:center"'+(i===0?' class="sh-sep"':"")+">"+esc(mLabel(m))+"</th>").join("")+
    calc.map((m,i)=>'<th style="text-align:center"'+(i===0?' class="sh-sep"':"")+">"+esc(mLabel(m))+"</th>").join("")+
    "</tr></thead><tbody>";

  times.forEach(ts=>{
    const v=sheetRowVals(date,cid,plats,ts);
    h+="<tr><td class='tm'>"+ftime(ts)+"</td>"+
      plats.map(p=>{ const s=factAt(date,cid,p.id,ts);
        const own=S.facts.some(f=>f.date===date&&f.clientId===cid&&f.platformId===p.id&&
          !(f.campaign||"")&&f.snaps.some(x=>x.ts===ts));
        return pcols.map(m=>cell(ts,"p",p.id+"|"+m.key, s&&own? s.v[m.key] : "", s? s.v[m.key] : null)).join("");
      }).join("")+
      acct.map((m,i)=>{ const a=factAt(date,cid,ACCT,ts);
        const own=S.facts.some(f=>f.date===date&&f.clientId===cid&&f.platformId===ACCT&&
          f.snaps.some(x=>x.ts===ts));
        const c=cell(ts,"a",m.key, a&&own? a.v[m.key] : "", a? a.v[m.key] : null);
        return i===0? c.replace("<td>",'<td class="sh-sep">') : c;
      }).join("")+
      calc.map((m,i)=>'<td class="calc'+(i===0?" sh-sep":"")+'"><b>'+esc(fval(v[m.key],m,true))+"</b></td>").join("")+
      "</tr>";
  });

  /* صف جديد */
  const nt=S.sheet.time||(date===todayISO()?nowHM():"23:30");

/* ── تحديث الأعمدة المحسوبة في الصف الجديد وإنت بتكتب ── */
function sheetRecalcNew(box){
  const date=S.liveDate||todayISO(), cid=roundClient();
  const sec=(box&&secById(box.dataset.shsec))||S.cfg.sections.find(x=>x.type==="daysheet");
  const plats=sheetPlatforms(sec), calc=sheetCalcCols(sec);
  const times=sheetTimes(date,cid), lastTs=times.length?times[times.length-1]:null;
  const raw={}; rawMetrics().forEach(m=>{ raw[m.key]=0; });
  const pcols=sheetPlatCols(sec);
  plats.forEach(p=>{
    const s=lastTs?factAt(date,cid,p.id,lastTs):null;
    pcols.forEach(m=>{ const typed=S.sheet.vals["p:"+p.id+"|"+m.key];
      const v=(typed!==undefined&&typed!=="")? parseFloat(typed) : (s? +s.v[m.key]||0 : 0);
      if(isFinite(v)) raw[m.key]+=v; });
  });
  rawMetrics().forEach(m=>{
    if(pcols.some(x=>x.key===m.key)) return;
    const typed=S.sheet.vals["a:"+m.key];
    const a=lastTs?factAt(date,cid,ACCT,lastTs):null;
    const v=(typed!==undefined&&typed!=="")? parseFloat(typed) : (a? +a.v[m.key]||0 : 0);
    if(isFinite(v)) raw[m.key]+=v;
  });
  const cl=clientById(cid), mg=cl&&cl.margin!=null?cl.margin:1, _nm=!(cl&&cl.margin!=null);
  raw._gp=(raw.revenue||0)*mg; raw.margin=mg; if(_nm) raw._noMargin=1;
  const out=computeAll(raw);
  const win=(box||document).querySelector("[data-nwin]");
  if(win&&lastTs){ const pv=sheetRowVals(date,cid,plats,lastTs), dS=(raw.spend||0)-(pv.spend||0), dR=(raw.revenue||0)-(pv.revenue||0), dO=(raw.orders||0)-(pv.orders||0);
    const C=CURR[S.cfg.settings.currency]||"";
    win.innerHTML=esc(L("الفترة الجديدة من ","New interval since "))+"<b>"+ftime(lastTs)+"</b>: "+esc(mkLabel("spend"))+" <b>"+(dS>=0?"+":"")+fnum(dS,0)+"</b> · "+
      esc(mkLabel("revenue"))+" <b>"+(dR>=0?"+":"")+fnum(dR,0)+"</b> · "+esc(mkLabel("orders"))+" <b>"+(dO>=0?"+":"")+fnum(dO,0)+"</b> · "+
      esc(L("ROAS الفترة ","Interval ROAS "))+'<b class="'+(dS>0&&dR/dS<1?"sh-bad":"")+'">'+(dS>0?fnum(dR/dS,2)+"×":"—")+"</b>"; }
  calc.forEach(m=>{ const el=(box||document).querySelector('[data-nc="'+m.key+'"]');
    if(el) el.innerHTML="<b>"+esc(fval(out[m.key],m,true))+"</b>"; });
}
CHG.sheetTime=v=>{ S.sheet.time=v; };
ACT.shPCol=t=>{ const x=secById(t.dataset.id); if(!x) return;
  const cur=(x.platCols&&x.platCols.length)?x.platCols.slice():["spend"];
  const i=cur.indexOf(t.dataset.k);
  if(i<0) cur.push(t.dataset.k); else if(cur.length>1) cur.splice(i,1); else return toast(L("لازم عمود واحد على الأقل","At least one column"),true);
  x.platCols=cur; saveCfg(); reSec(); };
ACT.sheetFill=t=>{

  const sec=(t&&secById(t.dataset.id))||S.cfg.sections.find(x=>x.type==="daysheet");
  const times=sheetTimes(date,cid); if(!times.length) return;
  const lastTs=times[times.length-1];
  sheetPlatforms(sec).forEach(p=>{ const s=factAt(date,cid,p.id,lastTs);
    if(s&&s.v.spend!=null) S.sheet.vals["p:"+p.id]=String(s.v.spend); });
  const a=factAt(date,cid,ACCT,lastTs);

ACT.sheetSave=async t=>{
  const date=S.liveDate||todayISO(), cid=roundClient();
  const hm=(S.sheet.time||nowHM()).split(":");
  const ts=parseISO(date).getTime()+(+hm[0])*36e5+(+hm[1]||0)*6e4;
  const byPlat={}, acctVals={};
  const shBox=(t&&document.querySelector('[data-shsec="'+t.dataset.id+'"]'))||document;
  shBox.querySelectorAll('[data-sh][data-ts="new"]').forEach(i=>{
    if(i.value==="") return;
    const [kind,id]=i.dataset.sh.split(":");
    if(kind==="p"){ const [pid,mk]=id.split("|"); (byPlat[pid]=byPlat[pid]||{})[mk||"spend"]=i.value; }
    else acctVals[id]=i.value;
  });
  const jobs=Object.keys(byPlat).map(pid=>({platformId:pid,values:byPlat[pid]}));
  if(Object.keys(acctVals).length) jobs.push({platformId:ACCT,values:acctVals});
  if(!jobs.length) return toast(L("مفيش أرقام في الصف","No numbers in this row"),true);
  t.disabled=true;
  let ok=0;
  for(const j of jobs){
    try{ await saveSnapshot({date:date,clientId:cid,platformId:j.platformId,campaign:"",
      values:j.values,ts:ts}); ok++; }catch(e){}
  }
  S.sheet.vals={};
  toast(L("اتحفظ صف ","Row saved ")+ftime(ts)+" · "+ok+L(" عمود"," columns"));
  await refresh();
};

function stateAt(date,msOfDay){

  for(const f of facts){ const s=snapAtOrBefore(f,base+msOfDay); if(s) st.push({clientId:f.clientId,v:s.v}); }
  return st.length? aggStates(st) : null;
}

function liveOv(sec){
  const vis=livePlats(), sp=(sec&&sec.filter&&sec.filter.platforms)||[];

  if(sp.length&&!pl.length) pl=sp;
  const o={}; if(pl.length) o.platforms=pl.concat([ACCT]);
  if(sec&&sec.filter&&sec.filter.clients&&sec.filter.clients.length) o.clients=sec.filter.clients;
  return Object.keys(o).length? o : null;

function stateAtOv(date,ms,ov){

  for(const f of factsIn(date,date,ov)){ const s=snapAtOrBefore(f,base+ms); if(s) st.push({clientId:f.clientId,v:s.v}); }
  return st.length? aggStates(st) : null;

    chartCtl(sec,{metrics:1,plats:1}));

/** إسقاط إقفال اليوم: على شكل منحنى امبارح لو امبارح فيه لقطات كفاية، وإلا خطي */
function projectDay(D,ov){
  const pts=intraday(D,ov); if(!pts.length) return null;
  const last=pts[pts.length-1], ms=last.ts-parseISO(D).getTime(), Y=addDays(D,-1);
  const yAt=stateAtOv(Y,ms,ov), yf=factsIn(Y,Y,ov), yFull=yf.length?aggFacts(yf):null;
  const shaped=!!(yAt&&yFull&&intraday(Y,ov).length>=2);
  const out={ms:ms,last:last,vals:{},method:{}};
  rawMetrics().forEach(m=>{ const k=m.key, cur=+last.vals[k]||0;
    if(shaped&&(+yAt[k]||0)>0&&(+yFull[k]||0)>0){ out.vals[k]=cur*(yFull[k]/yAt[k]); out.method[k]="y"; }
    else { out.vals[k]=ms>0? cur*864e5/ms : cur; out.method[k]="lin"; } });
  out.vals.roas=out.vals.spend>0? out.vals.revenue/out.vals.spend : null;
  out.vals.cpa=out.vals.orders>0? out.vals.spend/out.vals.orders : null;
  return out;
}
function secLiveRuler(sec){
  const D=secDay(sec), ov=liveOv(sec), pts=intraday(D,ov), isToday=D===todayISO(), base=parseISO(D).getTime();
  const pos=ts=>clamp((ts-base)/864e5*100,0,100), C=CURR[S.cfg.settings.currency]||"";
  const last=pts.length?pts[pts.length-1]:null, step=roundMins();
  const next=isToday&&last? last.ts+step*6e4 : null, late=next&&Date.now()>next;
  const pr=isToday? projectDay(D,ov) : null;
  const nowP=isToday? pos(Date.now()) : null;
  let h='<div class="rul" dir="ltr"><div class="rul-track"></div>'+
    (last?'<div class="rul-done" style="width:'+pos(last.ts).toFixed(2)+'%"></div>':"")+
    (isToday?'<div class="rul-proj" style="left:'+(last?pos(last.ts):nowP).toFixed(2)+'%;right:0"></div>':"");
  for(let x=0;x<=24;x+=3) h+='<span class="rul-h" style="left:'+(x/24*100).toFixed(2)+'%">'+String(x).padStart(2,"0")+"</span>";
  pts.forEach(p=>{ const v=p.vals;
    h+='<div class="rul-s" style="left:'+pos(p.ts).toFixed(2)+'%" title="'+esc(ftime(p.ts)+"\n"+mkLabel("spend")+": "+fnum(v.spend,0)+"\n"+mkLabel("revenue")+": "+fnum(v.revenue,0)+
      "\n"+mkLabel("orders")+": "+fnum(v.orders,0)+"\nROAS: "+(v.roas!=null?fnum(v.roas,2)+"×":"—"))+'"><span class="rul-l">'+ftime(p.ts)+'</span><i></i></div>'; });
  if(next&&next<base+864e5) h+='<div class="rul-s next'+(late?" late":"")+'" style="left:'+pos(next).toFixed(2)+'%"><span class="rul-l">'+ftime(next)+'</span><span class="rul-v">'+
    esc(late?L("متأخرة","overdue"):L("الجاية","next"))+"</span><i></i></div>";
  if(isToday) h+='<div class="rul-now" style="left:'+nowP.toFixed(2)+'%"><span>'+esc(L("الآن","Now"))+" "+ftime(Date.now())+"</span></div>";
  if(pr) h+='<div class="rul-s end" style="left:100%"><span class="rul-l">'+esc(L("إقفال متوقع","Expected close"))+'</span><span class="rul-v">'+fcompact(pr.vals.revenue,0)+" "+esc(C)+"</span><i></i></div>";
  h+="</div>";
  const info=[];
  if(last) info.push(L("آخر لقطة ","Last snapshot ")+ftime(last.ts));
  if(next) info.push(L("الجاية ","Next ")+ftime(next)+L(" (كل "," (every ")+step+L(" دقيقة)"," min)"));
  if(pr) info.push(L("الإقفال المتوقع للإيراد ","Expected revenue close ")+fnum(pr.vals.revenue,0)+" "+C+" · "+
    (pr.method.revenue==="y"?L("على شكل منحنى امبارح","shaped like yesterday's curve"):L("خطي — امبارح مفيهوش لقطات كفاية","linear — not enough snapshots yesterday")));
  if(!pts.length) info.push(L("مفيش لقطات في اليوم ده لسه","No snapshots on this day yet"));
  return card(esc(secTitle(sec))+" · "+esc(fdateFull(D)),"",h+'<div class="hint" style="margin-top:6px">'+info.map(esc).join(" · ")+"</div>");
}
function secLiveProj(sec){
  const D=secDay(sec), ov=liveOv(sec);
  if(D!==todayISO()) return card(esc(secTitle(sec)),"",'<div class="empty" style="padding:20px">'+

    '<div style="display:flex;gap:22px;flex-wrap:wrap">'+ks.map(k=>{ const m=metricByKey(k), v=pr.vals[k];

        '</div><div class="kpi-f">'+(yF&&yF[k]?deltaChip(v,yF[k],m)+'<span class="dlt-c">'+esc(L("امبارح ","Yesterday "))+esc(fval(yF[k],m,true))+"</span>":"")+"</div></div>"; }).join("")+
    '</div><div class="hint" style="margin-top:12px">'+esc(shaped
      ? L("بياخد نسبة النهارده لامبارح في نفس التوقيت ويطبقها على باقي منحنى امبارح — فلو مبيعاتك بتتركز بالليل الإسقاط بياخد ده في الحساب.",
          "Takes today's ratio to yesterday at the same time and applies it to the rest of yesterday's curve — so evening-heavy sales are accounted for.")
      : L("امبارح مفيهوش لقطات كفاية، فالإسقاط خطي وممكن يطلع أقل من الحقيقة لو مبيعاتك بتتركز بالليل.",
          "Yesterday lacks snapshots, so the projection is linear and may undershoot if sales concentrate at night."))+"</div>"+

async function saveSnapshot(o){
  const id=o.clientId+"__"+o.date;
  let doc=await Store.getEntryDoc(id);
  if(!doc) doc={clientId:o.clientId,date:o.date,rows:{}};
  if(!doc.rows) doc.rows={};
  const k=o.platformId+"|"+(o.campaign||"");
  const row=doc.rows[k]||{platformId:o.platformId,campaign:o.campaign||"",snaps:[]};
  const prevSnap=row.snaps.length?row.snaps[row.snaps.length-1]:null;
  const v=Object.assign({},prevSnap?prevSnap.v:{});
  let any=false;
  Object.keys(o.values).forEach(kk=>{ const x=o.values[kk];
    if(x!==""&&x!=null&&isFinite(+x)){ v[kk]=+x; any=true; } });
  if(!any&&!prevSnap) throw new Error(L("مفيش أرقام تتسجل","No numbers to save"));
  if(prevSnap&&Math.abs(prevSnap.ts-o.ts)<60000) row.snaps[row.snaps.length-1]={ts:o.ts,v:v};
  else { row.snaps.push({ts:o.ts,v:v}); row.snaps.sort((a,b)=>a.ts-b.ts); }
  doc.rows[k]=row; doc.updatedAt=Date.now();
  await Store.setEntryDoc(id,doc); DOCS[id]=doc; rebuildFacts();
}

const HEAD_MAP={date:"date",التاريخ:"date",اليوم:"date",time:"time",الوقت:"time",الساعة:"time",
  client:"client",العميل:"client",account:"client",الحساب:"client",
  platform:"platform",المنصة:"platform",channel:"platform",القناة:"platform",source:"platform",
  campaign:"campaign",الحملة:"campaign","campaign name":"campaign"};
function normDate(s){
  s=String(s).trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){ const p=s.split("-"); return p[0]+"-"+pad(+p[1])+"-"+pad(+p[2]); }
  let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m) return m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]);
  return null;
}
function parseTable(text){
  const lines=String(text||"").trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return {err:L("محتاج صف عناوين + صف بيانات على الأقل","Needs a header row plus at least one data row")};
  const d=lines[0].indexOf("\t")>=0?"\t":(lines[0].split(",").length>=lines[0].split(";").length?",":";");
  const cut=l=>l.split(d).map(x=>x.trim().replace(/^["']|["']$/g,""));
  const raw=cut(lines[0]);
  const byLabel={}; S.cfg.metrics.forEach(m=>{ byLabel[m.label.toLowerCase()]=m.key; byLabel[m.key]=m.key; });
  const cols=raw.map(hh=>{ const l=hh.toLowerCase();
    if(HEAD_MAP[l]) return HEAD_MAP[l]; if(HEAD_MAP[hh]) return HEAD_MAP[hh];
    const mk=byLabel[l]||byLabel[hh]; const m=mk?metricByKey(mk):null;
    return (m&&m.type==="raw")? {metric:m.key} : null; });
  if(cols.indexOf("date")<0) return {err:L("مفيش عمود تاريخ (date أو التاريخ)","No date column (date)")};
  if(!cols.some(c=>c&&c.metric)) return {err:L("مفيش أي عمود ميترك خام مفهوم","No recognizable raw-metric column")};
  const findBy=(list,val)=>{ const v=String(val||"").trim().toLowerCase();
    return list.find(x=>String(x.id).toLowerCase()===v||String(x.name).toLowerCase()===v); };
  const rows=[], warn=[], unkC=new Set(), unkP=new Set();
  for(let i=1;i<lines.length;i++){
    const c=cut(lines[i]); if(!c.length||!c.join("")) continue;
    const r={values:{},campaign:""};
    let bad=null;
    cols.forEach((col,j)=>{ const val=c[j]; if(val==null) return;
      if(col==="date"){ const dd=normDate(val); if(!dd) bad=L("تاريخ غير مفهوم: ","Unrecognized date: ")+val; else r.date=dd; }
      else if(col==="time") r.time=String(val).trim();
      else if(col==="client"){ const x=findBy(S.cfg.clients,val); if(!x) unkC.add(val); else r.clientId=x.id; }
      else if(col==="platform"){ const x=findBy(S.cfg.platforms,val); if(!x) unkP.add(val); else r.platformId=x.id; }
      else if(col==="campaign") r.campaign=String(val).trim();
      else if(col&&col.metric){ const n=parseFloat(String(val).replace(/[,\s٬]/g,""));
        if(isFinite(n)) r.values[col.metric]=n; } });
    if(bad){ warn.push("سطر "+(i+1)+": "+bad); continue; }
    if(!r.date){ warn.push("سطر "+(i+1)+": مفيش تاريخ"); continue; }
    if(!r.clientId) r.clientId=S.entry.clientId;
    if(!r.platformId) r.platformId=S.entry.platformId;
    if(!r.clientId||!r.platformId){ warn.push("سطر "+(i+1)+L(": عميل أو منصة ناقصة",": missing client or platform")); continue; }
    const base=parseISO(r.date).getTime();
    let off=12*36e5;
    if(r.time&&/^\d{1,2}:\d{2}/.test(r.time)){ const p=r.time.split(":"); off=(+p[0])*36e5+(+p[1])*6e4; }
    else if(r.date===todayISO()){ const n=new Date(); off=n.getHours()*36e5+n.getMinutes()*6e4; }
    else off=23*36e5+59*6e4;
    r.ts=base+off;
    rows.push(r);
  }
  if(unkC.size) warn.push(L("عملاء مش موجودين: ","Clients not found: ")+[...unkC].join("، ")+L(" — أضفهم من الإعدادات"," — add them in settings"));
  if(unkP.size) warn.push(L("منصات مش موجودة: ","Platforms not found: ")+[...unkP].join("، ")+L(" — أضفها من الإعدادات"," — add them in settings"));
  return {rows,warn};
}

const DOCS={};
function rebuildFacts(){
  bumpVer();
  S.facts=[];
  Object.keys(DOCS).forEach(id=>{ const d=DOCS[id]; if(!d||!d.rows) return; if(SCOPE&&!SCOPE.has(d.clientId)) return;
    Object.keys(d.rows).forEach(k=>{ const r=d.rows[k];
      S.facts.push({date:d.date,clientId:d.clientId,platformId:r.platformId,campaign:r.campaign||"",
        snaps:(r.snaps||[]).slice().sort((a,b)=>a.ts-b.ts)}); }); });
}
function neededWindow(){
  const [a,b]=resolveRange(); const c=resolveCmp(a,b); const t=todayISO();
  let lo=a, hi=b;
  if(c){ if(c[0]<lo) lo=c[0]; if(c[1]>hi) hi=c[1]; }
  const mStart=t.slice(0,8)+"01"; if(mStart<lo) lo=mStart;
  const blStart=addDays(a,-(IN().baselineDays));   // تاريخ كافي للخط المرجعي والشذوذ
  if(blStart<lo) lo=blStart;
  const floor=addDays(t,-180);                    // سقف معقول عشان ما نحمّلش التاريخ كله
  (S.changes||[]).forEach(ch=>{ const w=addDays(ch.date,-(+ch.win||7));
    if(w>=floor&&w<lo) lo=w; });
  (S.experiments||[]).forEach(x=>{ if(x.start>=floor&&x.start<lo) lo=x.start; });
  if(S.insDay&&S.insDay<lo) lo=S.insDay;
  (S.cfg.sections||[]).forEach(x=>{ (x.days||[]).forEach(d=>{ if(d<lo) lo=d; if(d>hi) hi=d; }); });
  (S.cfg.sections||[]).forEach(x=>{ const r=secRange(x); if(!r) return;
    const len=diffDays(r[0],r[1])+1, c0=addDays(r[0],-len);
    if(c0<lo) lo=c0; if(r[1]>hi) hi=r[1]; });
  { const pl=addDays(S.liveDate,-1); if(pl<lo) lo=pl; }
  if(S.insDay){ const pi=addDays(S.insDay,-1); if(pi<lo) lo=pi; }
  if(S.liveDate<lo) lo=S.liveDate; if(S.liveDate>hi) hi=S.liveDate;
  if(S.entry.date<lo) lo=S.entry.date; if(S.entry.date>hi) hi=S.entry.date;
  if(S.view==="reports"&&S.rp){ const r=rpRange(), len=diffDays(r[0],r[1])+1, pa=addDays(r[0],-len);   // التقرير يقدر يطلب فترة قديمة
    if(pa<lo) lo=pa; if(r[1]>hi) hi=r[1]; }
  if(addDays(t,-1)>hi) hi=addDays(t,-1);
  if(t>hi) hi=t;
  return [lo,hi];
}

  const [lo,hi]=neededWindow();
  try{ const docs=await withTimeout(Store.getEntries(lo,hi),20000,"entries");
    Object.keys(DOCS).forEach(k=>{ delete DOCS[k]; });
    docs.forEach(d=>{ if(d&&d.date&&d.clientId) DOCS[d.clientId+"__"+d.date]=d; });
    rebuildFacts(); S.loadedFrom=lo; S.loadedTo=hi;
    const ls=$("#lastSync"); if(ls) ls.textContent="آخر تحميل "+ftime(Date.now());

let _cfgT;
let BOOTED=false, CFG_ERR=false;
function saveCfg(){
  // حارس: قبل ما التحميل يخلص، S.cfg لسه فاضي — الكتابة هنا كانت بتمسح إعداداتك
  if(!BOOTED){ console.warn("saveCfg blocked before boot"); return; }
  if(isMember()||isPending()||isClient()){ if(!_cfgToast){ _cfgToast=true; toast(L("شكل الشاشات بيظبطه الأدمن — تعديلك هيفضل لحد ما تقفل الصفحة","Layout is set by an admin — your change lasts until you close the page")); } return; }
  if(READONLY){ toast(L("معاك صلاحية مشاهدة بس — التعديل مش هيتحفظ","You have view-only access — changes won't be saved"),true); return; }
  if(!S.cfg.metrics.length||!S.cfg.platforms.length){
    console.warn("saveCfg blocked: empty metrics/platforms"); return; }
  bumpVer(); clearTimeout(_cfgT); _cfgT=setTimeout(async()=>{
    try{ await Store.setConfig(S.cfg); if(CFG_ERR){ CFG_ERR=false; updateStoreState(); } }
    catch(e){ CFG_ERR=true; updateStoreState();
      toast(L("الإعدادات مش اتحفظت — الاتصال بقاعدة البيانات فيه مشكلة",
              "Settings did not save — there's a problem reaching the database"),true); } },250); }

/* الأقسام اللي بتطلع من «نظرة عامة» وتروح لشاشتها — والمخفي منها لأن الشاشة نفسها بتعرضه */
const OV_MOVE={whatchanged:"insights",peaks:"insights",insights:"insights",alerts:"insights",scatter:"insights",stack:"insights",
  table:"insights",heat:"insights",pacing:"actions",tracking:"actions",action:"actions",dailyreport:"brief",livereport:"live"};
const OV_HIDE={insights:1,pacing:1,tracking:1,action:1};
function normalizeCfg(c){
  // الترقيات بتعدّل الأقسام — لازم نسخة مش النسخة المقفولة اللي راجعة من قاعدة البيانات
  c=c? JSON.parse(JSON.stringify(c)) : {};
  const o=defaultConfig();
  o.settings=Object.assign(o.settings,c.settings||{});
  o.clients=Array.isArray(c.clients)?c.clients:[];
  o.platforms=Array.isArray(c.platforms)&&c.platforms.length?c.platforms:DEF_PLATFORMS.slice();
  o.targets=Array.isArray(c.targets)?c.targets:[];
  o.views=Array.isArray(c.views)?c.views:[];
  o.notes=Array.isArray(c.notes)?c.notes:[];
  o.alerts=Array.isArray(c.alerts)?c.alerts:[];
  o.screens=Array.isArray(c.screens)?c.screens:[];
  o.templates=Array.isArray(c.templates)?c.templates:[];
  // الافتراضيات بتتحط أول مرة بس — بعد كده الأقسام ملكك، حتى لو مسحتهم كلهم
  o.sections=Array.isArray(c.sections)?c.sections:defaultSections();
  const live=new Set(["overview","live","brief","entry_snap","entry_daily","actions","insights"].concat(o.screens.map(x=>x.id)));
  o.sections=o.sections.filter(x=>x&&x.id&&x.type&&live.has(x.screen));
  o.sectionsV=c.sectionsV||1;
  if(o.sectionsV<2 && Array.isArray(c.sections)){       // ترقية: نزوّد الجديد بس
    const have=new Set(o.sections.map(x=>x.type+"@"+x.screen));
    const add=newIntelSections().filter(x=>!have.has(x.type+"@"+x.screen));
    o.sections=add.filter(x=>x.screen==="overview").concat(o.sections,
      add.filter(x=>x.screen!=="overview"));
  }
  if(o.sectionsV<4){   // أقسام أفضل الأوقات وخريطة الساعات
    const have=new Set(o.sections.filter(x=>x.screen==="overview").map(x=>x.type));
    const add=newIntelSections().filter(x=>x.screen==="overview"&&!have.has(x.type));
    if(add.length){ const at=o.sections.map((x,i)=>x.screen==="overview"&&x.type==="whatchanged"?i:-1)
        .reduce((a,b)=>Math.max(a,b),-1);
      o.sections.splice(at<0?o.sections.length:at+1,0,...add); }
  }
  if(o.sectionsV<3){   // مركز الإجراءات ينزل آخر «نظرة عامة» تحت الشارتات والإحصائيات
    const act=o.sections.filter(x=>x.screen==="overview"&&x.type==="action");
    if(act.length){ o.sections=o.sections.filter(x=>!(x.screen==="overview"&&x.type==="action"));
      const last=o.sections.map((x,i)=>x.screen==="overview"?i:-1).reduce((a,b)=>Math.max(a,b),-1);
      o.sections.splice(last+1,0,...act); }
  }
  if(o.sectionsV<5){
    if(!o.sections.some(x=>x.screen==="live"&&x.type==="roundentry"))
      o.sections.unshift({id:"s_round",screen:"live",type:"roundentry",
        title:L("إدخال جولة لحظية","Quick round entry"),size:"full"});
  }
  if(o.sectionsV<6){   // شاشة الملخص اليومي
    if(!o.sections.some(x=>x.screen==="brief")){
      o.sections=o.sections.concat([
        {id:"s_brief",screen:"brief",type:"brief",title:L("الملخص اليومي","Daily brief"),size:"full"},
        {id:"s_eod",screen:"brief",type:"eod",title:L("تقرير إقفال اليوم","End-of-day report"),size:"full"}]);
    }
  }
  if(o.sectionsV<7){   // جدول اليوم بشكل الشيت
    if(!o.sections.some(x=>x.screen==="live"&&x.type==="daysheet")){
      const at=o.sections.findIndex(x=>x.screen==="live");
      o.sections.splice(at<0?0:at,0,{id:"s_sheet",screen:"live",type:"daysheet",
        title:L("جدول اليوم","Day sheet"),metrics:["orders","revenue"],
        calc:["spend","roas","aov","cpa"],size:"full"});
    }
    o.sections.forEach(x=>{ if(x.screen==="live"&&x.type==="roundentry") x.hidden=true; });
  }
  if(o.sectionsV<8){   // اليوم مباشر كله أقسام + شاشتين إدخال قابلين للتعديل
    const nw=newIntelSections(), want=["livekpi","livecurve","livesnaps","liveproj","livehours","livecompare"];
    const have=new Set(o.sections.filter(x=>x.screen==="live").map(x=>x.type));
    const add=nw.filter(x=>x.screen==="live"&&want.indexOf(x.type)>=0&&!have.has(x.type));
    if(add.length){ const at=o.sections.findIndex(x=>x.screen==="live"&&x.type==="daysheet");
      if(at<0) o.sections=o.sections.concat(add); else o.sections.splice(at+1,0,...add); }
    ["entry_snap","entry_daily"].forEach(sc=>{ if(!o.sections.some(x=>x.screen===sc))
      o.sections=o.sections.concat(nw.filter(x=>x.screen===sc)); });
  }
  if(o.sectionsV<9){   // نظرة عامة قصيرة + مسطرة اليوم
    o.sections.forEach(x=>{ if(x.screen!=="overview") return; const to=OV_MOVE[x.type]; if(!to) return;
      const dup=o.sections.some(y=>y!==x&&y.screen===to&&y.type===x.type);
      x.screen=to; if(dup||OV_HIDE[x.type]) x.hidden=true; });
    if(!o.sections.some(x=>x.screen==="live"&&x.type==="liveruler")){
      const at=o.sections.findIndex(x=>x.screen==="live");
      o.sections.splice(at<0?o.sections.length:at,0,{id:"s_lruler",screen:"live",type:"liveruler",title:L("مسطرة اليوم","Day ruler"),size:"full"});
    }
  }
  if(o.sectionsV<10){   // قسم مقارنة الأيام في اليوم مباشر
    if(!o.sections.some(x=>x.screen==="live"&&x.type==="livecompare")){
      const nw=newIntelSections().filter(x=>x.type==="livecompare");
      const at=o.sections.map((x,i)=>x.screen==="live"?i:-1).reduce((a,b)=>Math.max(a,b),-1);
      o.sections.splice(at<0?o.sections.length:at+1,0,...nw);
    }
  }
  o.sectionsV=10;
  o.intel=Object.assign({},c.intel||{});
  const ms=Array.isArray(c.metrics)&&c.metrics.length?c.metrics.slice():[];
  DEF_METRICS.forEach(d=>{ if(!ms.find(m=>m.key===d.key)) ms.push(Object.assign({},d)); });
  o.metrics=ms;
  return o;
}

ACT.fillPrev=()=>{ const rf=currentRowFacts(); if(!rf.length) return;
  const v=rf[0].snaps[rf[0].snaps.length-1].v;
  document.querySelectorAll("[data-mk]").forEach(i=>{ const x=v[i.dataset.mk]; if(x!=null) i.value=x; }); };
ACT.saveSnap=async()=>{
  const E=S.entry;
  if(!E.clientId||!E.platformId) return toast(L("اختار عميل ومنصة","Pick a client and a platform"),true);
  const vals={}; let any=false;
  document.querySelectorAll("[data-mk]").forEach(i=>{ if(i.value!==""){ vals[i.dataset.mk]=i.value; any=true; } });
  const rf=currentRowFacts();
  if(!any&&!rf.length) return toast(L("اكتب رقم واحد على الأقل","Enter at least one number"),true);
  const tv=($("#eTime")&&$("#eTime").value)||nowTime();
  const p=tv.split(":"), ts=parseISO(E.date).getTime()+(+p[0])*36e5+(+p[1]||0)*6e4;
  try{ await saveSnapshot({date:E.date,clientId:E.clientId,platformId:E.platformId,
        campaign:E.campaign,values:vals,ts:ts});
    toast("اتسجلت لقطة "+ftime(ts)); render(); }
  catch(e){ toast(e.message||"مشكلة في الحفظ",true); }
};
ACT.delSnap=async t=>{
  const E=S.entry, id=E.clientId+"__"+E.date, k=E.platformId+"|"+(E.campaign||"");
  const doc=DOCS[id]; if(!doc||!doc.rows[k]) return;
  doc.rows[k].snaps.splice(+t.dataset.i,1);
  if(!doc.rows[k].snaps.length) delete doc.rows[k];
  try{
    if(!Object.keys(doc.rows).length){ await Store.delEntryDoc(id); delete DOCS[id]; }
    else { doc.updatedAt=Date.now(); await Store.setEntryDoc(id,doc); DOCS[id]=doc; }
    rebuildFacts(); toast("اتحذفت"); render();
  }catch(e){ toast("مشكلة في الحذف",true); }
};
ACT.pastePreview=()=>{
  const r=parseTable($("#pasteBox").value), o=$("#pasteOut");
  if(r.err){ o.innerHTML='<span class="err">'+esc(r.err)+"</span>"; return; }
  o.innerHTML='<span class="ok">'+r.rows.length+" سطر جاهز للاستيراد</span>"+
    (r.warn.length?'<br><span class="err">'+r.warn.map(esc).join("<br>")+"</span>":"");
};
ACT.pasteApply=async()=>{
  const r=parseTable($("#pasteBox").value), o=$("#pasteOut");
  if(r.err){ o.innerHTML='<span class="err">'+esc(r.err)+"</span>"; return; }
  if(!r.rows.length){ o.innerHTML='<span class="err">مفيش أسطر صالحة</span>'; return; }
  o.innerHTML=L("جارِ الاستيراد…","Importing…"); let n=0, bad=0;
  r.rows.sort((a,b)=>a.ts-b.ts);
  for(const row of r.rows){
    try{ await saveSnapshot({date:row.date,clientId:row.clientId,platformId:row.platformId,
      campaign:row.campaign,values:row.values,ts:row.ts}); n++; }catch(e){ bad++; }
  }
  toast("اتسجل "+n+" سطر"+(bad?" · فشل "+bad:""));
  $("#pasteBox").value=""; await reload(); render();
};

ACT.saveClient=t=>{
  const name=$("#mName").value.trim(); if(!name) return toast("اكتب اسم",true);
  const mg=parseFloat($("#mMargin").value), bd=parseFloat($("#mBudget").value);
  const bs=$("#mBStart")?$("#mBStart").value:"", be=$("#mBEnd")?$("#mBEnd").value:"";
  const gv=id=>{ const e=$(id); return e? e.value.trim() : ""; };
  const o={name:name, margin:isFinite(mg)&&mg>0?clamp(mg,0.1,100)/100:null,
           monthlyBudget:isFinite(bd)&&bd>0?bd:null,
           budgetStart:(bs&&be&&bs<=be)?bs:null, budgetEnd:(bs&&be&&bs<=be)?be:null,
           kind:gv("#mKind")||null, channel:gv("#mChannel")||null,
           site:gv("#mSite")||null, country:gv("#mCountry")||null,
           currency:gv("#mCurrency")||null};
  const ex=t.dataset.id?clientById(t.dataset.id):null;
  if(ex) Object.assign(ex,o); else S.cfg.clients.push(Object.assign({id:uid()},o));
  saveCfg(); closeModal(); toast("اتحفظ"); render();
};

    '<button class="btn" data-a="mclose">إلغاء</button><button class="btn btn-d" data-a="delClientOk" data-id="'+c.id+'">احذف</button>');
};
ACT.delClientOk=t=>{ S.cfg.clients=S.cfg.clients.filter(c=>c.id!==t.dataset.id);

  S.cfg.targets=S.cfg.targets.filter(x=>x.clientId!==t.dataset.id);

    '<div class="fld"><label>'+esc(L("اللون","Color"))+'</label><div class="chips" id="mColors">'+

      ((p&&p.color===c)?"border-color:"+c+";":"")+'"><i class="sw" style="background:'+c+'"></i></button>').join("")+
