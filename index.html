ACT.pickCol=t=>{ $("#mColor").value=t.dataset.col;
  document.querySelectorAll("#mColors .chip").forEach(c=>{ c.style.borderColor=""; });
  t.style.borderColor=t.dataset.col; };
ACT.savePlat=t=>{
  const name=$("#mName").value.trim(); if(!name) return toast(L("اكتب اسم","Enter a name"),true);
  const color=$("#mColor").value;
  const ex=t.dataset.id?S.cfg.platforms.find(p=>p.id===t.dataset.id):null;
  if(S.cfg.platforms.some(p=>p!==ex&&!isAcct(p.id)&&String(p.name).trim().toLowerCase()===name.toLowerCase()))
    return toast(L("فيه منصة بنفس الاسم","A platform with this name already exists"),true);
  if(ex) Object.assign(ex,{name,color});
  else{
    // المعرّف لازم يكون فريد — لو اتكرر، الترتيب والحذف يمسكوا منصة غلط
    let id=name.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")||uid();
    while(isAcct(id)||S.cfg.platforms.some(p=>p.id===id)) id=id+"_"+Math.random().toString(36).slice(2,5);
    S.cfg.platforms.push({id,name,color});
  }
  saveCfg(); closeModal(); toast(L("اتحفظ","Saved")); render();
};
ACT.delPlat=t=>{
  const p=S.cfg.platforms.find(x=>x.id===t.dataset.id); if(!p) return;
  if(S.cfg.platforms.filter(x=>!isAcct(x.id)).length<=1)
    return toast(L("لازم تفضل منصة واحدة على الأقل","At least one platform has to stay"),true);
  const n=S.facts.filter(f=>f.platformId===p.id).length;
  modal(L("حذف ","Delete ")+p.name+"؟",
    '<div class="hint">'+(n? esc(L("فيه ","There are "))+"<b>"+n+"</b>"+
      esc(L(" سجل مرتبط بالمنصة دي. الأرقام هتفضل مخزنة بس مش هتظهر.",
            " records linked to this platform. The data stays stored but stops showing."))
      : esc(L("مفيش بيانات مرتبطة بيها.","No data is linked to it.")))+"</div>",
    '<button class="btn" data-a="mclose">'+esc(L("إلغاء","Cancel"))+"</button>"+
    '<button class="btn btn-d" data-a="delPlatOk" data-id="'+esc(p.id)+'">'+esc(L("احذف","Delete"))+"</button>");
};
ACT.delPlatOk=t=>{ S.cfg.platforms=S.cfg.platforms.filter(p=>p.id!==t.dataset.id);
  S.f.platforms=S.f.platforms.filter(x=>x!==t.dataset.id);
  if(S.rf&&S.rf.plat===t.dataset.id) S.rf.plat="";
  saveCfg(); closeModal(); toast(L("اتحذفت","Deleted")); render(); };
ACT.platMove=t=>{
  // الترتيب بين المنصات الظاهرة بس — عشان السهم ميبدّلش مع عنصر مخفي فيبان إنه مش شغال
  const vis=S.cfg.platforms.filter(p=>!isAcct(p.id));
  const i=vis.findIndex(p=>p.id===t.dataset.id), j=i+(+t.dataset.d);
  if(i<0||j<0||j>=vis.length) return;
  const a=vis[i]; vis[i]=vis[j]; vis[j]=a;
  let k=0; S.cfg.platforms=S.cfg.platforms.map(p=>isAcct(p.id)?p:vis[k++]);
  saveCfg(); render();
};

/* — ميترِكس — */
ACT.editMetric=t=>{
  const m=t.dataset.id?metricByKey(t.dataset.id):null;
  const units=[["cur","عملة"],["num","رقم"],["pct","نسبة %"],["x","مضاعف ×"]];
  const dirs=[["up","أعلى أحسن"],["down","أقل أحسن"],["neutral","محايد"]];
  modal(m?"تعديل "+m.label:"ميترك جديد",
    '<div class="form"><div class="frow">'+
    '<div class="fld"><label>الاسم</label><input class="inp" id="mLabel" value="'+esc(m?m.label:"")+'"></div>'+
    '<div class="fld"><label>المفتاح (إنجليزي)</label><input class="inp num" id="mKey" value="'+
      esc(m?m.key:"")+'"'+(m?" disabled":"")+' placeholder="my_metric"></div></div>'+
    '<div class="frow"><div class="fld"><label>النوع</label><select class="sel" id="mType"'+(m?" disabled":"")+'>'+
      '<option value="calc"'+(!m||m.type==="calc"?" selected":"")+">معادلة</option>"+
      '<option value="raw"'+(m&&m.type==="raw"?" selected":"")+">خام (بتدخله بإيدك)</option></select></div>"+
    '<div class="fld"><label>الوحدة</label><select class="sel" id="mUnit">'+
      units.map(u=>'<option value="'+u[0]+'"'+(m&&m.unit===u[0]?" selected":"")+">"+u[1]+"</option>").join("")+"</select></div>"+
    '<div class="fld"><label>خانات عشرية</label><input class="inp num" id="mDec" type="number" min="0" max="4" value="'+
      (m?m.dec:2)+'"></div>'+
    '<div class="fld"><label>الاتجاه الأحسن</label><select class="sel" id="mDir">'+
      dirs.map(d=>'<option value="'+d[0]+'"'+(m&&m.dir===d[0]?" selected":"")+">"+d[1]+"</option>").join("")+"</select></div></div>"+
    '<div class="fld" id="fWrap"'+(m&&m.type==="raw"?' style="display:none"':"")+'><label>المعادلة</label>'+
    '<input class="inp num" id="mFormula" value="'+esc(m&&m.formula?m.formula:"")+'" placeholder="{revenue} / {spend}"></div>'+
    '<div id="mPrev" class="hint"></div>'+
    '<div class="hint">الميترِكس المتاحة: '+S.cfg.metrics.filter(x=>!m||x.key!==m.key).map(x=>"<b>{"+esc(x.key)+"}</b>").join("، ")+
    "، <b>{margin}</b></div></div>",
    '<button class="btn btn-p" data-a="saveMetric" data-id="'+(m?m.key:"")+'">حفظ</button>');
  const prev=()=>{
    const f=$("#mFormula"); if(!f) return;
    const v=validateFormula(f.value,$("#mKey").value.trim());
    const out=$("#mPrev");
    if(!v.ok){ out.innerHTML='<span class="err">'+esc(v.err)+"</span>"; return; }
    const vals=aggFacts(factsIn.apply(null,resolveRange()));
    const r=evalFormula(f.value,vals);
    out.innerHTML='<span class="ok">✓ المعادلة سليمة</span> — على بيانات الفترة '+esc(L("الحالي","Current"))+'ة النتيجة: <b class="num">'+
      esc(r==null?"—":fnum(r,+$("#mDec").value||2))+"</b>";
  };
  const fi=$("#mFormula"); if(fi){ fi.addEventListener("input",prev); prev(); }
  const ty=$("#mType"); if(ty) ty.addEventListener("change",()=>{
    $("#fWrap").style.display = ty.value==="raw"?"none":""; });
};
ACT.saveMetric=t=>{
  const label=$("#mLabel").value.trim();
  const key=$("#mKey").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,"");
  if(!label||!key) return toast(L("محتاج اسم ومفتاح","Needs a name and a key"),true);
  const ex=t.dataset.id?metricByKey(t.dataset.id):null;
  if(!ex&&metricByKey(key)) return toast("المفتاح ده مستخدم",true);
  const type=ex?ex.type:$("#mType").value;
  const o={label:label, unit:$("#mUnit").value, dec:clamp(+$("#mDec").value||0,0,4), dir:$("#mDir").value};
  if(type==="calc"){ const f=$("#mFormula").value.trim(); const v=validateFormula(f,key);
    if(!v.ok) return toast(v.err,true); o.formula=f; }
  if(ex) Object.assign(ex,o);
  else S.cfg.metrics.push(Object.assign({key:key,type:type},o));
  saveCfg(); closeModal(); toast("اتحفظ"); render();
};
ACT.delMetric=t=>{
  const k=t.dataset.id;
  const used=S.cfg.metrics.filter(m=>m.formula&&m.formula.indexOf("{"+k+"}")>=0);
  if(used.length) return toast("مستخدم في: "+used.map(m=>m.label).join("، "),true);
  S.cfg.metrics=S.cfg.metrics.filter(m=>m.key!==k);
  S.cfg.targets=S.cfg.targets.filter(x=>x.metricKey!==k);
  if(S.cfg.settings.kpis) S.cfg.settings.kpis=S.cfg.settings.kpis.filter(x=>x!==k);
  saveCfg(); render();
};

  const cid=t?t.clientId:(S.ws||"*"), mk=t?t.metricKey:"roas";
  return '<tr data-gi="'+esc(gi)+'"><td><select class="sel" data-g="c"><option value="*">'+esc(L("كل العملاء","All clients"))+"</option>"+
    S.cfg.clients.map(c=>'<option value="'+esc(c.id)+'"'+(cid===c.id?" selected":"")+">"+esc(c.name)+"</option>").join("")+"</select></td>"+
    '<td><select class="sel" data-g="m">'+S.cfg.metrics.map(m=>'<option value="'+m.key+'"'+(mk===m.key?" selected":"")+">"+
      esc(mLabel(m))+"</option>").join("")+"</select></td>"+
    '<td><input class="inp num" type="number" step="any" data-g="v" style="width:110px" value="'+(t?esc(t.value):"")+'" placeholder="0"></td>'+
    '<td class="n"><button class="btn btn-s btn-d" data-a="goalRowDel" title="'+esc(L("شيل","Remove"))+'">✕</button></td></tr>';
}
ACT.editTarget=()=>{
  const ex=S.cfg.targets||[];
  modal(L("الأهداف","Goals"),
    '<div class="hint" style="margin-bottom:10px">'+esc(L("زوّد كذا هدف مرة واحدة وعدّل أو امسح القديم. لو كررت نفس العميل ونفس الميترك، الأحدث هو اللي بيتحفظ.",

    '</th><th>'+esc(L("الهدف","Goal"))+'</th><th></th></tr></thead><tbody id="glBody">'+
    ex.map((t,i)=>goalRow(t,i)).join("")+(ex.length?goalRow(null,"new"):goalRow(null,"new")+goalRow(null,"new")+goalRow(null,"new"))+
    "</tbody></table></div>"+
    '<button class="btn btn-s" data-a="goalRowAdd" style="margin-top:10px">'+esc(L("+ هدف تاني","+ Another goal"))+"</button>",
    '<button class="btn" data-a="mclose">'+esc(L("إلغاء","Cancel"))+"</button>"+
    '<button class="btn btn-p" data-a="goalsSave">'+esc(L("احفظ الأهداف","Save goals"))+"</button>");
};
ACT.goalRowAdd=()=>{ const b=$("#glBody"); if(!b) return;
  const last=b.querySelector("tr:last-child [data-g=c]");
  b.insertAdjacentHTML("beforeend",goalRow(null,"new"));
  if(last) b.querySelector("tr:last-child [data-g=c]").value=last.value; };
ACT.goalRowDel=t=>{ const r=t.closest("tr"); if(r) r.remove(); };
ACT.goalsSave=()=>{
  const out=[], idx={}; let bad=0;
  document.querySelectorAll("#glBody tr").forEach(r=>{
    const raw=r.querySelector("[data-g=v]").value.trim();
    if(raw===""){ return; }
    const v=parseFloat(raw); if(!isFinite(v)){ bad++; return; }
    const o={clientId:r.querySelector("[data-g=c]").value,metricKey:r.querySelector("[data-g=m]").value,value:v};
    const k=o.clientId+"|"+o.metricKey;
    if(idx[k]!=null) out[idx[k]]=o; else { idx[k]=out.length; out.push(o); }
  });
  if(bad) return toast(L("فيه قيمة مش رقم","A value isn't a number"),true);
  S.cfg.targets=out; saveCfg(); closeModal();
  toast(L("اتحفظ ","Saved ")+out.length+L(" هدف"," goals")); render();
};
ACT.delTarget=t=>{ S.cfg.targets.splice(+t.dataset.i,1); saveCfg(); render(); };

/* — بيانات — */
async function download(filename,data){
  try{ if(window.claude&&claude.use){ const d=await claude.use("downloads");
    if(d){ await d.save({filename:filename,data:data}); toast("اتحفظ الملف"); return; } } }catch(e){}
  modal(L("انسخ المحتوى — ","Copy the contents — ")+filename,
    '<textarea class="inp" style="min-height:260px" readonly>'+esc(data)+"</textarea>"+

ACT.secSave=t=>{

  const o={ id: t.dataset.id||("s_"+uid()), screen:$("#sScreen").value, type:type,
    title:$("#sTitle").value.trim(), size:$("#sSize").value };
  if(["bars","stack","table","heat","decisions","dailyreport","livereport"].indexOf(type)>=0) o.dim=$("#sDim").value;
  if(CHARTS[type]&&$("#sChart")) o.chart=$("#sChart").value;
  if(["kpi","trend","table","bars","stack","heat","scatter","dailyreport","livereport","hourmap","livekpi","livecurve","livesnaps","liveproj","livehours","reportentry"].indexOf(type)>=0){
    if(!TMP.metrics.length&&["bars","stack","heat","scatter"].indexOf(type)>=0)
      return toast(L("اختار ميترك على الأقل","Pick at least one metric"),true);
    o.metrics=TMP.metrics.slice();
  }
  const lim=parseInt($("#sLimit").value,10); if(isFinite(lim)&&lim>0) o.limit=lim;
  if(type==="note") o.text=$("#sText").value;
  const f={}; if(TMP.clients.length) f.clients=TMP.clients.slice();
  if(TMP.platforms.length) f.platforms=TMP.platforms.slice();
  if(Object.keys(f).length) o.filter=f;
  if(!o.title) o.title=(secType(type)||["",""])[1];
  const ex=t.dataset.id? S.cfg.sections.find(s=>s.id===t.dataset.id) : null;
  if(ex){ const keep=ex.hidden; S.cfg.sections[S.cfg.sections.indexOf(ex)]=Object.assign(o,{hidden:keep}); }
  else S.cfg.sections.push(o);
  S.adminScreen=o.screen; saveCfg(); closeModal(); toast("اتحفظ"); render();
};

  const t=(S.cfg.settings&&S.cfg.settings.theme)||"system";
  if(t==="system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme=t;
}
function applyLang(){
  syncLang();
  const en=EN(), root=document.documentElement;
  root.lang=en?"en":"ar"; root.dir=en?"ltr":"rtl";
  const sh=document.querySelector(".shell");
  if(sh){ sh.dir=en?"ltr":"rtl"; sh.lang=en?"en":"ar"; }
}
ACT.langToggle=()=>{
  if(!BOOTED) return toast(L("استنى التحميل يخلص","Wait for loading to finish"),true);
  S.cfg.settings.lang=EN()?"ar":"en"; syncLang();
  applyLang(); saveCfg(); bumpVer(); render();
};
ACT.themeCycle=()=>{
  if(!BOOTED) return toast(L("استنى التحميل يخلص","Wait for loading to finish"),true);
  const cur=(S.cfg.settings.theme)||"system";
  const i=THEMES.findIndex(x=>x[0]===cur);
  S.cfg.settings.theme=THEMES[(i+1)%THEMES.length][0];
  applyTheme(); saveCfg(); render();
};

  Object.keys(S.expand).forEach(k=>{ if(k.indexOf(sid+"|")===0) delete S.expand[k]; });

/* ── محرك السحب: يشتغل على أي حاوية فيها data-sort وعناصر فيها data-sid ── */
let DRAG=null;
function sortAfter(cont,x,y){
  const els=[].slice.call(cont.children).filter(e=>e.dataset&&e.dataset.sid&&!e.classList.contains("dragging"));
  // ترتيب القراءة عربي من اليمين للشمال — فالعنصر اللي «بعد» المؤشر هو اللي شماله
  const rtl=getComputedStyle(cont).direction==="rtl";
  // صفوف الجدول فوق بعض: المهم فوق/تحت نص الصف، مش يمين/شمال (الجدول ممكن يكون عامل scroll بالعرض)
  const vert=cont.tagName==="TBODY";
  for(const el of els){
    const r=el.getBoundingClientRect(), cx=r.left+r.width/2;
    if(vert){ if(y<r.top+r.height/2) return el; continue; }
    if(y<r.top) return el;                                       // صف تحت المؤشر
    if(y<=r.bottom && (rtl ? x>cx : x<cx)) return el;            // نفس الصف
  }
  return null;
}
function dragStart(handle,e){
  const item=handle.closest("[data-sid]"); if(!item) return;
  const cont=item.parentElement; if(!cont||!cont.dataset.sort) return;
  const r=item.getBoundingClientRect();
  const isRow=item.tagName==="TR";
  let ghost;
  if(isRow){
    // صف جدول: الشبح اسم العنصر بس، مش الصف كله بعرض الجدول
    ghost=document.createElement("div");
    ghost.className="drag-ghost drag-row";
    ghost.textContent="⠿ "+(item.dataset.gname||item.textContent.trim().slice(0,40));
  }else{
    ghost=item.cloneNode(true);
    ghost.className="drag-ghost";
    ghost.style.width=r.width+"px"; ghost.style.height=Math.min(r.height,320)+"px";
  }
  document.body.appendChild(ghost);
  let dx=e.clientX-r.left, dy=e.clientY-r.top;
  if(isRow){ dx=getComputedStyle(cont).direction==="rtl"? ghost.getBoundingClientRect().width-14 : 14; dy=16; }
  DRAG={item,cont,ghost,dx,dy,sx:e.clientX,sy:e.clientY,moved:false};
  item.classList.add("dragging");
  try{ handle.setPointerCapture&&handle.setPointerCapture(e.pointerId); }catch(_){}
  document.body.style.userSelect="none";
  dragMove(e);
}
function dragMove(e){
  if(!DRAG) return;
  DRAG.ghost.style.left=(e.clientX-DRAG.dx)+"px";
  DRAG.ghost.style.top=(e.clientY-DRAG.dy)+"px";
  // ضغطة من غير حركة مش سحب — متغيّرش الترتيب ومتحفظش
  if(!DRAG.moved&&Math.abs(e.clientX-DRAG.sx)+Math.abs(e.clientY-DRAG.sy)<5) return;
  DRAG.moved=true;
  const after=sortAfter(DRAG.cont,e.clientX,e.clientY);
  if(after) DRAG.cont.insertBefore(DRAG.item,after);
  else DRAG.cont.appendChild(DRAG.item);
  const m=70;
  if(e.clientY<m) window.scrollBy(0,-16);
  else if(e.clientY>window.innerHeight-m) window.scrollBy(0,16);
}
function dragEnd(){
  if(!DRAG) return;
  const {item,cont,ghost}=DRAG;
  ghost.remove(); item.classList.remove("dragging");
  document.body.style.userSelect="";
  const moved=DRAG.moved; DRAG=null;
  if(!moved) return;
  const ids=[].slice.call(cont.children).filter(e=>e.dataset&&e.dataset.sid).map(e=>e.dataset.sid);
  const sort=cont.dataset.sort, kind=sort.split(":")[0], key=sort.slice(kind.length+1);
  if(kind==="sec") reorderScreen(key,ids);
  else if(kind==="kpi"){ const sec=secById(key); if(sec) sec.metrics=ids; }
  else if(kind==="task"){
    ids.forEach((id,i)=>{ const t=(S.tasks||[]).find(x=>x.id===id); if(!t) return;
      const ch=t.status!==key; t.order=i; if(ch){ t.status=key; if(key==="done") t.doneAt=todayISO(); }
      if(ch||t.order!==i) taskSave(t); });
    return;
  }
  else if(kind==="list"){ const j=key.lastIndexOf(":"), sec=secById(key.slice(0,j)), fld=key.slice(j+1);
    if(sec) sec[fld]= fld==="cols"? ids.map(id=>(sec.cols||[]).find(c=>c.id===id)).filter(Boolean) : ids; }
  else if(kind==="plat"){
    // المنصات اللي مش ظاهرة في الجدول (فلتر أو إجمالي الحساب) بتفضل في مكانها
    const by={}, shown={}; S.cfg.platforms.forEach(p=>{ by[p.id]=p; }); ids.forEach(x=>{ shown[x]=1; });
    let k=0;
    S.cfg.platforms=S.cfg.platforms.map(p=> shown[p.id] ? (by[ids[k++]]||p) : p);
  }
  saveCfg(); reSec();
}
function reorderScreen(screen,ids){
  const map={}; S.cfg.sections.forEach(x=>{ map[x.id]=x; });
  let k=0;
  S.cfg.sections=S.cfg.sections.map(x=> x.screen===screen ? (map[ids[k++]]||x) : x);
}
document.addEventListener("pointerdown",e=>{
  const h=e.target.closest&&e.target.closest(".sec-h,.kpi-drag");
  if(!h||e.button) return;
  e.preventDefault(); dragStart(h,e);
});
document.addEventListener("pointermove",e=>{ if(DRAG){ e.preventDefault(); dragMove(e); } });
document.addEventListener("pointerup",dragEnd);
document.addEventListener("pointercancel",dragEnd);

    '<span style="margin-inline-start:auto"></span>'+

    (SIMPLE()?'<span class="mode-h" style="flex-basis:100%;order:9">'+esc(L("في الوضع البسيط بتشوف هنا كل الأقسام — «★» يحدد اللي يفضل ظاهر لما تخلص.","In simple mode you see every section here — «★» picks what stays visible when you're done."))+"</span>"
     :'<button class="btn btn-s" data-a="scrDup" data-id="'+esc(screen)+'">'+esc(L("نسخ الصفحة","Duplicate page"))+"</button>"+
    '<button class="btn btn-s" data-a="tplSave" data-scr="'+esc(screen)+'">احفظ كقالب</button>'+
    '<button class="btn btn-s" data-a="tplOpen" data-scr="'+esc(screen)+'">القوالب</button>')+
    '<button class="btn btn-s" data-a="secResetScr" data-scr="'+esc(screen)+'">استرجاع الافتراضي</button>'+
    '<button class="btn btn-s btn-p" data-a="editOff">خلصت</button></div>';
}
ACT.editOn=()=>{ S.edit=true; reSec(); };
ACT.secSimp=t=>{ const x=secById(t.dataset.id); if(!x) return; x.simple=!secSimple(x); saveCfg(); reSec(); };
ACT.editOff=()=>{ S.edit=false; reSec(); };
ACT.secSize=t=>{ const x=secById(t.dataset.id); if(x){ x.size=t.dataset.z; saveCfg(); reSec(); } };
ACT.secToggleR=t=>{ const x=secById(t.dataset.id); if(x){ x.hidden=!x.hidden; saveCfg(); reSec(); } };
ACT.secDupR=t=>{ const x=secById(t.dataset.id); if(!x) return;
  const c=cloneSecs([x])[0]; c.title=secTitle(x)+L(" (نسخة)"," (copy)");
  S.cfg.sections.splice(S.cfg.sections.indexOf(x)+1,0,c); saveCfg(); reSec(); toast(L("اتنسخ القسم تحته","Section duplicated below")); };
ACT.secDelR=t=>{ const x=secById(t.dataset.id); if(!x) return;
  modal("حذف «"+(x.title||x.type)+"»؟",'<div class="hint">القسم بس اللي بيتشال — البيانات ما بتتمسش.</div>',
    '<button class="btn" data-a="mclose">إلغاء</button>'+
    '<button class="btn btn-d" data-a="secDelOk" data-id="'+esc(x.id)+'">احذف</button>'); };
ACT.secDelOk=t=>{ S.cfg.sections=S.cfg.sections.filter(x=>x.id!==t.dataset.id);
  saveCfg(); closeModal(); reSec(); };
ACT.secResetScr=t=>{ const scr=t.dataset.scr;
  modal(L("ارجع للأقسام الافتراضية؟","Restore the default sections?"),'<div class="hint">هيمسح ترتيبك '+esc(L("الحالي","Current"))+' في الشاشة دي ويرجّعها زي الأول. البيانات ما بتتمسش.</div>',
    '<button class="btn" data-a="mclose">إلغاء</button>'+
    '<button class="btn btn-d" data-a="secResetOk" data-scr="'+esc(scr)+'">ارجع</button>'); };
ACT.secResetOk=t=>{ const scr=t.dataset.scr;
  const def=(scr==="overview")? defaultSections().filter(x=>x.screen==="overview"&&!OV_MOVE[x.type])
    : newIntelSections().filter(x=>x.screen===scr);
  S.cfg.sections=S.cfg.sections.filter(x=>x.screen!==scr).concat(
    def.map(x=>Object.assign({},x,{id:"s_"+uid()})));
  saveCfg(); closeModal(); reSec(); };
const SEC_GROUPS=[["entry","إدخال بيانات وشيتات","Data entry & sheets",["daysheet","reportentry","roundentry","sheet"]],
  ["charts","تشارتات","Charts",["trend","liveruler","livecurve","livecompare","bars","stack","scatter","heat","hourmap","livehours"]],
  ["numbers","أرقام وجداول","Numbers & tables",["dailytotals","kpi","livekpi","table","dailyreport","livereport","livesnaps","rings"]],
  ["analysis","تحليل وقرارات","Analysis & decisions",["insights","peaks","whatchanged","funnel","health","decisions","pacing","liveproj","action","alerts","tracking","changelog"]],
  ["other","أخرى","Other",["tasks","note","aiblock","brief","eod"]]];
ACT.secAddPal=t=>{
  const scr=t.dataset.scr||sectionScreen()||S.adminScreen||"overview";
  const inG=new Set([].concat.apply([],SEC_GROUPS.map(g=>g[3])));
  const groups=SEC_GROUPS.map(g=>g[3].slice()).map((l,i)=>i===SEC_GROUPS.length-1? l.concat(SEC_TYPES.map(x=>x[0]).filter(k=>!inG.has(k))) : l);
  const btn=k=>{ const x=SEC_TYPES.find(y=>y[0]===k); if(!x) return "";
    const hw=helpOf("sec:"+x[0]);
    return '<button data-a="secAddNew" data-scr="'+esc(scr)+'" data-t="'+x[0]+'"'+(hw?' title="'+esc(hw.u)+'"':"")+"><b>"+esc(L(x[1],x[3]||x[1]))+"</b><span>"+esc(EN()?(x[3]||""):x[2])+"</span></button>"; };
  modal(L("زوّد قسم","Add a section"),
    '<div class="ai-idea"><div class="card-t" style="font-size:13.5px">'+esc(L("✨ اطلبه من المساعد الذكي","✨ Ask the AI assistant"))+"</div>"+
    '<div class="hint" style="margin:4px 0 8px">'+esc(L("اشرح فكرة القسم وهو يختار النوع والميترِكس ويبنيه في الصفحة دي.","Describe the section and it picks the type and metrics and builds it on this page."))+"</div>"+
    '<textarea class="inp" id="aiIdea" style="min-height:70px" placeholder="'+esc(L("مثلاً: قسم يوريني ROAS كل منصة على مدار اليوم مع الصرف","e.g. a section showing each platform's ROAS through the day with spend"))+'"></textarea>'+
    '<button class="btn btn-p" style="margin-top:8px" data-a="secAddAI" data-scr="'+esc(scr)+'">'+esc(L("ابنيه بالمساعد","Build it with the assistant"))+"</button></div>"+
    '<div class="card-t" style="font-size:13.5px;margin:16px 0 4px">'+esc(L("✍️ أو اختار بنفسك","✍️ Or pick one yourself"))+"</div>"+
    SEC_GROUPS.map((g,i)=>'<div class="pal-g">'+esc(L(g[1],g[2]))+'</div><div class="pal">'+groups[i].map(btn).join("")+"</div>").join("")+
    '<div class="hint" style="margin-top:12px">'+esc(L("القسم الجديد بينزل في آخر الصفحة، واسحبه لمكانه بعد كده.","The new section lands at the end of the page; drag it into place afterwards."))+"</div>");
};
ACT.secAddAI=t=>{
  const idea=($("#aiIdea")||{}).value||""; if(!idea.trim()) return toast(L("اكتب فكرة القسم","Describe the section"),true);
  const scr=t.dataset.scr, nm=(screenList().find(x=>x.k===scr)||{}).n||scr;
  closeModal(); ACT.aiOpen&&ACT.aiOpen();
  aiSend(L("ابنيلي قسم جديد في شاشة «","Build a new section on the screen \"")+nm+L("» (screen id: ","\" (screen id: ")+scr+"): "+idea.trim());
};
ACT.secAddNew=t=>{
  const type=t.dataset.t, scr=t.dataset.scr, ty=secType(type);
  const o={id:"s_"+uid(),screen:scr,type:type,title:ty?ty[1]:type,size:"full",simple:true};
  if(["bars","stack","table","heat","decisions","dailyreport","livereport"].indexOf(type)>=0) o.dim="platform";
  if(type==="kpi") o.metrics=kpiKeys().slice();
  else if(type==="trend") o.metrics=["revenue","spend","roas"];
  else if(["bars","stack","heat","hourmap"].indexOf(type)>=0) o.metrics=[type==="bars"?"spend":"revenue"];
  else if(type==="scatter") o.metrics=["spend","roas"];
  else if(["table","dailyreport","livereport"].indexOf(type)>=0) o.metrics=kpiKeys().slice();
  if(type==="note") o.text=L("اكتب ملاحظتك هنا…","Write your note here…");
  if(!o.metrics&&secDefMetrics(o).length) o.metrics=secDefMetrics(o).slice();
  if(type==="sheet") o.cols=[{id:"c"+uid(),name:L("البند","Item"),type:"text"},{id:"c"+uid(),name:L("القيمة","Value"),type:"num"},
    {id:"c"+uid(),name:L("ملاحظات","Notes"),type:"text"}];
  if(type==="aiblock"){ o.prompt=""; S.ctl[o.id]=true; }
  S.cfg.sections.push(o); S.edit=true; saveCfg(); closeModal(); reSec();
  toast("اتزود «"+(ty?ty[1]:type)+L("» في آخر الصفحة","» at the end of the page"));
};

/* ══════════ شرح كل حاجة: علامة ⓘ جنب أي قسم أو ميترك أو شاشة ══════════ */
const HELP={"sec:kpi": ["كروت بأهم الأرقام في الفترة المختارة، وتحت كل رقم الفرق عن فترة المقارنة، والخط الصغير بيوريك اتجاهه.", "بصة واحدة تعرف منها الوضع كويس ولا لأ. زوّد أو شيل كروت من «خيارات» ورتبها بالسحب عشان أهم رقم يبقى أول واحد.", "Cards with the key numbers for the selected period; under each, the change vs the comparison period and a sparkline of its direction.", "One glance tells you whether things are fine. Add or remove cards from Options and drag them so the most important number comes first."], "sec:trend": ["خط زمني لحد ٣ ميترِكس على مدار الفترة، والتالت على محور لوحده.", "تشوف الأداء طالع ولا نازل وتربط الصرف بالإيراد: لو الصرف زاد والإيراد مزادش يبقى فيه مشكلة. غيّر التقسيم (ساعة/يوم/أسبوع) والشكل من «خيارات»، وحرّك الماوس أو الأسهم على النقط تشوف قيمها.", "A time line for up to 3 metrics across the period; the third gets its own axis.", "See whether performance is rising or falling and tie spend to revenue: spend up with flat revenue means trouble. Change grain (hour/day/week) and chart type in Options; hover or use arrow keys to read points."], "sec:bars": ["ترتيب المنصات أو العملاء أو الحملات حسب ميترك واحد، بار أو دائري.", "تعرف مين واخد أكبر حصة من الصرف أو مين بيجيب أعلى عائد، فتنقل الميزانية للأحسن.", "Ranks platforms, clients or campaigns by one metric, as bars or a pie.", "See who takes the biggest share of spend or returns the most, so you can move budget to the winners."], "sec:stack": ["الصرف (أو أي ميترك) يوم بيوم، وكل عمود متقسم حسب المنصة أو العميل.", "تشوف توزيع الصرف اتغير إزاي على الأيام، وتلقط يوم منصة صرفت فيه زيادة عن العادة.", "Spend (or any metric) day by day, each column split by platform or client.", "See how the spend mix shifts over the days and spot a day a platform overspent."], "sec:table": ["جدول: صف لكل منصة أو عميل أو حملة، وعمود لكل ميترك تختاره.", "تقارن الأرقام جنب بعض بالتفصيل وتختار الأعمدة اللي تهمك بس.", "A table with a row per platform, client or campaign and a column per metric you pick.", "Compare numbers side by side in detail, showing only the columns you care about."], "sec:rings": ["دواير بتوريك وصلت لكام في المية من كل هدف في الفترة المختارة.", "تعرف قريب ولا بعيد عن أهدافك. دوس «✎ الأهداف» تضيف كذا هدف مرة واحدة أو تعدّلهم. في الميترِكس اللي الأقل فيها أحسن (زي تكلفة الطلب) النسبة بتتحسب بالعكس.", "Rings showing what percent of each goal you reached in the selected period.", "Know how close you are to your goals. Press ✎ Goals to add several at once or edit them. For lower-is-better metrics (like CPA) the percentage is inverted."], "sec:heat": ["جدول ألوان: صف لكل منصة أو عميل وعمود لكل يوم، واللون الأغمق قيمة أعلى.", "تلقط بسرعة الأيام أو المنصات اللي أداؤها شاذ من غير ما تقرا أرقام.", "A color grid: a row per platform or client, a column per day; darker means higher.", "Spot unusual days or platforms instantly without reading numbers."], "sec:scatter": ["كل نقطة يوم، ومكانها بميتركين (مثلاً الصرف مقابل ROAS).", "تكتشف نقطة التشبع: لو كل ما الصرف يزيد العائد ينزل، يبقى التوسيع زيادة عن كده مش مجدي.", "Each dot is a day positioned by two metrics (e.g. spend vs ROAS).", "Find the saturation point: if ROAS drops as spend rises, scaling further isn't worth it."], "sec:insights": ["استنتاجات بيطلعها النظام لوحده من بياناتك، وكل واحد عليه درجة ثقة.", "توفر عليك التحليل: أهم اللي حصل وفين الفرص من غير ما تدوّر. الثقة بتعلى كل ما البيانات تزيد.", "Automatic conclusions drawn from your data, each with a confidence level.", "Saves analysis time: the key events and opportunities without digging. Confidence rises with more data."], "sec:alerts": ["القواعد اللي إنت حاطتها في تبويب التنبيهات واتكسرت في الفترة دي.", "ينبهك أول ما رقم يعدّي حد إنت محدده (مثلاً تكلفة الطلب أكبر من ٥٠) عشان تتصرف بدري.", "The rules you set in the Alerts tab that were broken in this period.", "Warns you as soon as a number crosses a limit you set (e.g. CPA above 50) so you act early."], "sec:note": ["كارت نص حر بتكتبه إنت.", "ملاحظات للفريق، خطة الأسبوع، أو تذكير بحاجة لازم تتعمل.", "A free-text card you write.", "Notes for the team, the week's plan, or a reminder."], "sec:action": ["كل اللي محتاج تدخلك مرتب بالأولوية: حرج، عالي، متوسط، للعلم.", "ابدأ يومك منه: امسك أول بند ونفّذ الإجراء المقترح. كل بند معاه الرقم اللي اتبنى عليه ودرجة الثقة.", "Everything that needs you, ranked: critical, high, medium, info.", "Start your day here: take the first item and apply the suggested action. Each item shows the number behind it and its confidence."], "sec:health": ["درجة من ١٠٠ بتلخص حالة الحساب من: ROAS مقابل الهدف أو نقطة التعادل، تكلفة الطلب، اتجاه ROAS، انضباط الميزانية، التحويل، النقرات، وكفاية البيانات — كل واحد بوزن.", "٨٠+ سليم، ٦٠–٨٠ تحت المراقبة، ٤٠–٦٠ محتاج تحسين، أقل من ٤٠ حرج. بص على أضعف مكوّن لأنه اللي بيشد الدرجة لتحت. الأوزان والحدود بتتعدل من لوحة التحكم ← الذكاء.", "A 0–100 score summarizing account health from ROAS vs target or break-even, CPA, ROAS trend, budget discipline, conversion, CTR and data sufficiency — each weighted.", "80+ healthy, 60–80 watch, 40–60 needs work, under 40 critical. Look at the weakest component — it drags the score down. Weights and bands are editable in Admin → Intelligence."], "sec:whatchanged": ["أكبر الفروقات بين الفترة الحالية وفترة المقارنة، مع تشخيص للسبب المحتمل.", "لما الأداء يتغير فجأة تعرف منين: الظهور؟ النقرات؟ التحويل؟ قيمة الطلب؟ فتعالج السبب مش العَرَض.", "The biggest differences between this period and the comparison period, with a likely cause.", "When performance shifts, see where it came from — reach, clicks, conversion or order value — and fix the cause, not the symptom."], "sec:funnel": ["مراحل الشراء من الظهور للنقرة للمشاهدة للسلة للدفع للطلب، ونسبة العبور بين كل مرحلة.", "تعرف العملاء بيقعوا فين. أكبر تسريب مقارنة بالفترة اللي فاتت هو أول حاجة تشتغل عليها. محتاج تسجّل المقاييس الإضافية في الإدخال.", "Purchase stages from impression to click, view, cart, checkout and order, with pass-through rates.", "See where customers drop off. The biggest leak vs the previous period is the first thing to fix. Requires the optional metrics in data entry."], "sec:decisions": ["قرار مقترح لكل منصة أو حملة: وسّع، راقب، حسّن، أوقف/راجع، أو بيانات غير كافية — ومعاه السبب.", "بيقولك تزوّد الفلوس فين وتقلل فين. «أوقف» مش بيظهر غير لو فيه هامش ربح أو هدف ROAS يقيس عليه، ومن غير بيانات كفاية مش هيحكم.", "A suggested call per platform or campaign — scale, watch, optimize, pause/review, or not enough data — with the reason.", "Tells you where to add money and where to cut. Pause only appears with a margin or ROAS target to judge against, and it won't judge without enough data."], "sec:pacing": ["الميزانية الشهرية للعميل: اتصرف كام، المفروض يكون اتصرف كام لحد النهارده، والمتوقع آخر الفترة.", "تمنع إن الميزانية تخلص بدري أو تفضل فلوس مش متصرفة، وبيقولك أقصى صرف يومي آمن للأيام الباقية. حدد الميزانية من بيانات العميل.", "The client's monthly budget: spent so far, what should be spent by today, and the forecast at period end.", "Prevents running out early or leaving money unspent, and gives a safe daily cap for the remaining days. Set the budget in the client's details."], "sec:dailyreport": ["تقرير الفترة: كل منصة في صف مع صف إجمالي، ودوس على المنصة تتفتح على حملاتها.", "التقرير اللي بتبعته للعميل أو المدير. اختار أعمدته من إعدادات القسم.", "The period report: a row per platform plus a total; click a platform to expand its campaigns.", "The report you send to the client or manager. Pick its columns in the section settings."], "sec:livereport": ["كل منصة بآخر أرقامها في اليوم، ومعاها صرفت كام وجابت كام بين آخر لقطتين.", "تعرف مين شغال كويس دلوقتي حالاً مش على مدار اليوم بس، فتتدخل في نفس اليوم.", "Each platform's latest numbers for the day, plus what it spent and earned between the last two snapshots.", "See who's performing right now, not just across the day, so you can act the same day."], "sec:tracking": ["مقارنة الطلبات والإيراد اللي المنصة بتقول عليهم بالأرقام الحقيقية من نظامك.", "تكتشف لو البكسل بيبالغ أو بيضيّع تحويلات قبل ما تاخد قرارات على أرقام غلط. محتاج تسجّل طلبات وإيراد النظام.", "Compares orders and revenue reported by the platform with the real numbers from your system.", "Catch a pixel that over-reports or loses conversions before deciding on wrong numbers. Needs backend orders and revenue logged."], "sec:hourmap": ["خريطة ألوان: يوم الأسبوع × ساعة اليوم، بلون حسب الميترك.", "تعرف أحسن وأسوأ أوقات الأسبوع عشان تجدول الإعلانات أو تزوّد الميزانية في الأوقات القوية.", "A color map of weekday × hour, colored by the metric.", "Find the best and worst times of the week to schedule ads or push budget into strong hours."], "sec:changelog": ["آخر التغييرات اللي سجلتها (ميزانية، كرييتف، استهداف…) وإيه اللي حصل للأرقام بعد كل واحد.", "تقيس تدخلك: القرار ده نفع ولا لأ. سجّل أي تغيير بتعمله في المنصة من شاشة سجل التغييرات.", "Your latest logged changes (budget, creative, audience…) and what the numbers did after each.", "Measures your interventions: did that decision work? Log every change you make from the Change log screen."], "sec:peaks": ["أقوى منصة، أقوى يوم، أفضل يوم في الأسبوع، أفضل فترة، وأفضل ساعات في اليوم للمبيعات أو الطلبات.", "تركّز الصرف في الأوقات والمنصات اللي بتبيع، وتعرف أهم ساعة لتقريرك. اختار الحساب على الإيراد أو الطلبات أو التبرعات، ولكل عميل لوحده.", "Top platform, strongest day, best weekday, best window and best hours of the day for sales or orders.", "Concentrate spend where and when it sells, and know the key hour for your report. Choose revenue, orders or donations, per client."], "sec:roundentry": ["جدول إدخال سريع: صف لكل منصة أو حملة وأعمدة للصرف والطلبات والإيراد، بيتحفظوا كلهم بنفس التوقيت.", "لو بتعمل تقرير كل نص ساعة أو ساعة، بتخلّص الجولة في ضربة واحدة وبينبهك لو ميعادها فات.", "Quick entry table: a row per platform or campaign with spend, orders and revenue, all saved at one time.", "If you report every 30 or 60 minutes, finish the round in one go; it warns you when a round is overdue."], "sec:daysheet": ["شيت اليوم زي الإكسيل: صف لكل وقت، عمود صرف لكل منصة، وأعمدة الطلبات والمبيعات من داشبورد المبيعات، والأعمدة المحسوبة (ROAS، AOV، CPA) بتتحسب لوحدها.", "تسجّل لقطة لكل المنصات مرة واحدة وتشوف اليوم كله تحت بعض. اكتب الأرقام التراكمية زي ما هي، والخانة الفاضية بتاخد آخر قيمة. من «خيارات» تختار المنصات والأعمدة وترتيبها.", "The day sheet, like Excel: a row per time, a spend column per platform, orders and sales from the sales dashboard, and computed columns (ROAS, AOV, CPA) filled automatically.", "Log one snapshot for all platforms at once and see the whole day stacked. Enter cumulative figures as shown; empty cells keep the last value. Pick platforms, columns and their order in Options."], "sec:sheet": ["جدول فاضي إنت اللي بتحدد أعمدته (نص، رقم، تاريخ، لينك، اختيار، صح/غلط) وبتكتب صفوفه.", "لأي حاجة مالهاش قسم جاهز: خطة كرييتف، متابعة مهام، أكواد خصم، أسعار منافسين… والأعمدة الرقمية بيتحسب مجموعها تحت.", "A blank sheet whose columns you define (text, number, date, link, choice, checkbox) and whose rows you write.", "For anything without a ready section: creative plan, task tracking, discount codes, competitor prices… Number columns are totaled at the bottom."], "sec:aiblock": ["قسم بتكتب فيه فكرة، والمساعد الذكي بيقرا بياناتك الحقيقية ويكتب النتيجة جواه.", "لأي تحليل مخصوص زي «قولي أحسن ٣ حملات النهاردة وليه». دوس «حدّث» كل ما تحب تجدد النتيجة.", "A section where you write an idea and the AI assistant reads your real data and writes the result inside.", "For custom analysis like 'tell me today's best 3 campaigns and why'. Press Refresh whenever you want an updated result."], "sec:reportentry": ["إدخال التقرير اليومي الكامل: صف لكل منصة وعمود لكل ميترك تختاره، وصف إجمالي بيتحسب وإنت بتكتب.", "آخر اليوم تسجّل كل أرقام المنصات (صرف، ظهور، نقرات، طلبات…) وتحفظهم بزرار واحد. اللي متغيرش مش بيتسجل تاني. من «خيارات» تختار الأعمدة وترتبها بالسحب.", "Full daily report entry: a row per platform, a column per metric you choose, and a total that updates as you type.", "At day end log every platform's numbers (spend, impressions, clicks, orders…) and save with one button. Unchanged cells aren't re-saved. Choose and drag-order columns in Options."], "sec:livekpi": ["آخر أرقام في اليوم المختار، وكل رقم متقارن بنفس التوقيت امبارح.", "مقارنة عادلة: الساعة ٣ النهاردة مقابل الساعة ٣ امبارح، مش مقابل يوم كامل.", "The latest numbers for the chosen day, each compared with the same time yesterday.", "A fair comparison: 3 pm today vs 3 pm yesterday, not vs a full day."], "sec:livecurve": ["شارت بكل أوقات اللقطات اللي سجلتها في اليوم.", "تتابع اليوم ساعة بساعة. «تراكمي» تشوف الإجمالي بيكبر إزاي، «الزيادة» تشوف كل فترة جابت كام، و«خط لكل منصة» تقارن المنصات. زوّد ميترِكس واختار المنصات من فوق الشارت.", "A chart of every snapshot time you logged in the day.", "Follow the day hour by hour. Cumulative shows the total growing, Increase shows what each interval added, Line per platform compares platforms. Add metrics and pick platforms above the chart."], "sec:livesnaps": ["كل لقطة سجلتها في اليوم، الأحدث فوق، ومعاها الفرق عن اللي قبلها و ROAS و CPA الفترة.", "تعرف آخر ساعة كانت كسبانة ولا لأ من غير ما المتوسط التراكمي يخبي المشكلة.", "Every snapshot logged in the day, newest first, with the change from the previous one and period ROAS and CPA.", "Know whether the last hour was profitable without the cumulative average hiding the problem."], "sec:liveproj": ["لو كمّلت بنفس معدل النهاردة هتقفل اليوم على كام صرف وطلبات وإيراد، مقارنة بامبارح.", "تقرر بدري تزوّد ولا تقلل الصرف. الإسقاط خطي، فلو مبيعاتك بتتركز بالليل هيطلع أقل من الحقيقة.", "If today's pace holds, where the day closes on spend, orders and revenue, vs yesterday.", "Decide early whether to raise or cut spend. The projection is linear, so it undershoots if sales concentrate at night."], "sec:livehours": ["كل ساعة في اليوم اتزود فيها كام إيراد (أو أي ميترك تختاره).", "تعرف الساعات اللي شايلة اليوم. محتاج لقطتين على الأقل، وكل ما تسجّل أكتر الصورة تبقى أدق.", "How much revenue (or any metric) each hour of the day added.", "See which hours carry the day. Needs at least two snapshots; more snapshots, sharper picture."], "sec:brief": ["ملخص النهاردة في دقيقة: الأرقام الأساسية، أكبر مكسب، أكبر مشكلة، وأهم اللي محتاج تدخلك.", "أول حاجة تفتحها الصبح أو تبعتها للمدير.", "Today in a minute: key numbers, biggest win, biggest problem and what needs you.", "The first thing to open in the morning or send to your manager."], "sec:eod": ["تقرير إقفال اليوم: مقابل امبارح والمتوسط، أحسن وأسوأ منصة، وإجراءات بكرة.", "تقفل بيه يومك وتعرف تبدأ بكرة بإيه.", "End-of-day report: vs yesterday and the average, best and worst platform, and tomorrow's actions.", "Close your day with it and know how to start tomorrow."], "m:spend": ["الفلوس اللي اتصرفت على الإعلانات.", "أساس أي حساب تكلفة أو عائد. قارنه بالميزانية وبالإيراد اللي جابه.", "Money spent on ads.", "The base of every cost and return figure. Compare it with the budget and the revenue it brought."], "m:impressions": ["عدد مرات ظهور الإعلان.", "بيوريك وصولك. لو نزل فجأة غالباً فيه مشكلة في الميزانية أو الاستهداف أو المزاد.", "How many times the ad was shown.", "Shows your reach. A sudden drop usually means a budget, targeting or auction issue."], "m:clicks": ["عدد النقرات على الإعلان.", "بيتحسب منها CTR و CPC ومعدل التحويل.", "Clicks on the ad.", "Feeds CTR, CPC and conversion rate."], "m:leads": ["عدد الليدز (بيانات عملاء محتملين) اللي جت من الإعلان.", "أهم رقم لحملات جمع العملاء، ومنه تكلفة الليد.", "Leads (prospect details) from the ad.", "The key number for lead-gen campaigns; feeds cost per lead."], "m:orders": ["عدد الطلبات (أو التبرعات أو التحويلات).", "منه تكلفة الطلب ومتوسط قيمة الطلب ومعدل التحويل. سجّله من داشبورد المبيعات لو عايز الرقم الحقيقي.", "Number of orders (or donations or conversions).", "Feeds CPA, AOV and conversion rate. Take it from the sales dashboard for the real figure."], "m:revenue": ["قيمة المبيعات (أو التبرعات).", "منه ROAS ومتوسط قيمة الطلب وصافي الربح.", "Sales (or donations) value.", "Feeds ROAS, AOV and net profit."], "m:view_content": ["عدد مرات مشاهدة صفحة المنتج.", "أول مرحلة بعد النقرة في القمع. لو قليلة مقابل النقرات يبقى فيه مشكلة في سرعة الصفحة أو التتبع.", "Product page views.", "The first funnel step after the click. Low vs clicks points to page speed or tracking issues."], "m:add_to_cart": ["عدد مرات الإضافة للسلة.", "لو المشاهدات كتير والإضافة قليلة، المشكلة غالباً في المنتج أو السعر أو الصفحة.", "Add-to-cart events.", "Many views but few adds usually means a product, price or page problem."], "m:checkouts": ["عدد مرات بدء الدفع.", "لو بدء الدفع كتير والطلبات قليلة، المشكلة في صفحة الدفع أو الشحن أو طرق الدفع.", "Checkout starts.", "Many checkouts but few orders points to the payment page, shipping or payment methods."], "m:backend_orders": ["الطلبات الحقيقية من نظامك (مش من المنصة).", "بتتقارن بطلبات المنصة في «صحة التتبع» عشان تعرف دقة البكسل.", "Real orders from your own system (not the platform).", "Compared with platform orders in Tracking health to judge pixel accuracy."], "m:backend_revenue": ["الإيراد الحقيقي من نظامك.", "بيتقارن بإيراد المنصة في «صحة التتبع».", "Real revenue from your own system.", "Compared with platform revenue in Tracking health."], "m:installs": ["عدد تثبيتات التطبيق.", "أساس حملات التطبيقات، ومنه تكلفة التثبيت.", "App installs.", "The base of app campaigns; feeds cost per install."], "m:registrations": ["عدد التسجيلات في التطبيق أو الموقع.", "منها تكلفة التسجيل ومعدل التسجيل من التثبيت.", "Sign-ups in the app or site.", "Feeds cost per registration and install-to-registration rate."], "m:trials": ["عدد التجارب المجانية اللي بدأت.", "منها تكلفة التجربة ونسبة تحويل التجربة لاشتراك.", "Free trials started.", "Feeds cost per trial and trial-to-subscription rate."], "m:subscriptions": ["عدد الاشتراكات المدفوعة.", "منها تكلفة الاشتراك — أهم رقم في حملات الاشتراكات.", "Paid subscriptions.", "Feeds cost per subscription — the key number for subscription campaigns."], "m:iap_revenue": ["الإيراد من المشتريات جوه التطبيق.", "منه متوسط إيراد التثبيت.", "Revenue from in-app purchases.", "Feeds revenue per install."], "m:new_customers": ["عدد العملاء الجدد (أول مرة يشتروا).", "منه تكلفة اكتساب العميل، وبيفرّق بين نمو حقيقي ومبيعات من عملاء قدام.", "First-time customers.", "Feeds CAC and separates real growth from repeat buyers."], "m:roas": ["العائد على الإنفاق الإعلاني: كل ١ صرفته جاب كام إيراد.", "٣× يعني كل ١٠٠ جابت ٣٠٠. قارنه بـ ROAS التعادل: لو أعلى منه الحملة كسبانة.", "Return on ad spend: revenue per 1 spent.", "3× means every 100 brought 300. Compare with break-even ROAS: above it, the campaign makes money."], "m:cpa": ["تكلفة الطلب الواحد.", "كل ما تقل أحسن. قارنها بمتوسط قيمة الطلب وهامش ربحك تعرف الطلب كسبان ولا لأ.", "Cost per order.", "Lower is better. Compare with AOV and your margin to know whether an order is profitable."], "m:aov": ["متوسط قيمة الطلب الواحد.", "لو زاد تقدر تستحمل تكلفة طلب أعلى. بتزوّده بالعروض والباقات.", "Average order value.", "When it rises you can afford a higher CPA. Raise it with bundles and offers."], "m:cvr": ["نسبة النقرات اللي بقت طلبات.", "لو نزلت والنقرات زي ما هي، المشكلة غالباً في الموقع أو العرض مش في الإعلان.", "Share of clicks that became orders.", "If it drops while clicks hold, the problem is usually the site or offer, not the ad."], "m:ctr": ["نسبة اللي شافوا الإعلان ودوسوا عليه.", "مقياس جاذبية الكرييتف. لو نزل يبقى الإعلان محتاج تجديد.", "Share of viewers who clicked.", "Measures creative appeal. A drop means the ad needs refreshing."], "m:cpc": ["تكلفة النقرة الواحدة.", "لو زادت فجأة يبقى المزاد اتنافس أكتر أو الـ CTR نزل.", "Cost per click.", "A sudden rise means a tighter auction or a falling CTR."], "m:cpm": ["تكلفة كل ١٠٠٠ ظهور.", "بيوريك الوصول للجمهور ده غالي ولا رخيص.", "Cost per 1,000 impressions.", "Shows how expensive it is to reach this audience."], "m:cpl": ["تكلفة الليد الواحد.", "كل ما تقل أحسن. قارنها بقيمة الليد عندك.", "Cost per lead.", "Lower is better. Compare with what a lead is worth to you."], "m:profit": ["الإيراد × هامش الربح ناقص الصرف.", "الرقم اللي بيقولك كسبت فعلاً. محتاج هامش ربح العميل، ولو مش محدد مش هيتحسب.", "Revenue × profit margin minus spend.", "Tells you what you actually earned. Needs the client's margin; without it, it isn't calculated."], "m:poas": ["صافي الربح على كل ١ صرفته.", "أدق من ROAS لأنه بيحسب الهامش. أكبر من صفر يبقى كسبان.", "Net profit per 1 spent.", "More precise than ROAS because it includes margin. Above zero means profit."], "m:be_roas": ["أقل ROAS تحتاجه عشان متخسرش (١ ÷ هامش الربح).", "هامش ٢٥٪ يبقى محتاج ٤× على الأقل. أي حملة ROAS بتاعها أقل من كده خسرانة.", "The minimum ROAS to avoid a loss (1 ÷ margin).", "A 25% margin needs at least 4×. Any campaign below that loses money."], "m:cpi": ["تكلفة التثبيت الواحد.", "كل ما تقل أحسن. قارنها بمتوسط إيراد التثبيت.", "Cost per install.", "Lower is better. Compare with revenue per install."], "m:cac": ["تكلفة اكتساب عميل جديد.", "قارنها بقيمة العميل على المدى الطويل تعرف النمو صحي ولا لأ.", "Cost to acquire a new customer.", "Compare with customer lifetime value to judge healthy growth."], "m:cpreg": ["تكلفة التسجيل الواحد.", "كل ما تقل أحسن.", "Cost per registration.", "Lower is better."], "m:reg_rate": ["نسبة اللي نزّلوا التطبيق وسجلوا.", "لو قليلة، المشكلة في أول تجربة جوه التطبيق مش في الإعلان.", "Share of installers who registered.", "If low, the problem is the first in-app experience, not the ad."], "m:cpt": ["تكلفة التجربة المجانية الواحدة.", "كل ما تقل أحسن.", "Cost per free trial.", "Lower is better."], "m:cps": ["تكلفة الاشتراك المدفوع الواحد.", "كل ما تقل أحسن. قارنها بقيمة الاشتراك.", "Cost per paid subscription.", "Lower is better. Compare with the subscription's value."], "m:trial_cvr": ["نسبة التجارب اللي بقت اشتراك مدفوع.", "بتقيس جودة الجمهور اللي الإعلان جايبه مش بس عدده.", "Share of trials that became paid.", "Measures the quality of the audience the ad brings, not just its size."], "m:arpi": ["متوسط الإيراد من كل تثبيت.", "لو أعلى من تكلفة التثبيت يبقى الحملة كسبانة.", "Average revenue per install.", "Above the cost per install means the campaign pays off."], "v:overview": ["اللوحة الرئيسية: الأرقام والشارتات والتحليلات للفترة والفلاتر اللي فوق.", "غيّر الفترة والمقارنة والعميل والمنصة من الشريط فوق، ودوس «✎ عدّل الصفحة» ترتب أو تضيف أو تنسخ أقسام.", "The main board: numbers, charts and analysis for the period and filters above.", "Change period, comparison, client and platform in the bar above; press ✎ Edit page to reorder, add or duplicate sections."], "v:actions": ["كل اللي محتاج تدخل منك دلوقتي، مرتب بالأولوية.", "ابدأ من فوق لتحت ونفّذ الإجراء المقترح في كل بند.", "Everything that needs your action now, ranked by priority.", "Work top to bottom and apply the suggested action on each item."], "v:live": ["متابعة يوم واحد لحظة بلحظة من اللقطات اللي بتسجلها.", "اختار اليوم والمنصات الظاهرة، سجّل اللقطة من جدول اليوم، وتابع المسار والإسقاط. كل الأقسام بتترتب وتتنسخ من «✎ عدّل الصفحة».", "Follow one day moment by moment from the snapshots you log.", "Pick the day and visible platforms, log a snapshot in the day sheet, and follow the curve and projection. Every section can be reordered or duplicated via ✎ Edit page."], "v:brief": ["الملخص اليومي وتقرير إقفال اليوم.", "افتحها الصبح تعرف الوضع، وآخر اليوم تقفل بتقرير الإقفال.", "The daily brief and end-of-day report.", "Open it in the morning for the state of play and close the day with the end-of-day report."], "v:compare": ["مقارنة فترتين بكل الميترِكس جنب بعض.", "اختار الفترة والمقارنة من فوق. لو الفترتين مش بنفس الطول قارن بالمتوسط اليومي.", "Two periods side by side across every metric.", "Pick the period and comparison above. If lengths differ, compare by daily average."], "v:insights": ["الاستنتاجات الآلية، وتحليل يوم بعينه ساعة بساعة.", "اختار يوم من «تحليل يوم» تشوف أداءه وساعاته، وتحته الاستنتاجات والخرايط.", "Automatic insights plus an hour-by-hour analysis of any day.", "Pick a day in Day analysis to see its performance and hours; insights and maps follow below."], "v:entry": ["كل طرق إدخال البيانات: لقطة سريعة، التقرير اليومي الكامل، وإدخال تفصيلي واستيراد.", "استخدم function helpOf(key){
  const E=EN();
  if(key.indexOf("m:")===0){
    const m=metricByKey(key.slice(2)); if(!m) return null; const h=HELP[key];
    const w=h?(E?h[2]:h[0]):(m.type==="raw"?L("رقم خام بتدخله بإيدك من المنصة أو من داشبورد المبيعات.","A raw number you enter from the platform or the sales dashboard.")
      :L("ميترك محسوب بمعادلة من ميترِكس تانية.","A metric calculated by a formula from other metrics."));
    const u=h?(E?h[3]:h[1]):L("استخدمه في الكروت والجداول والشارتات والأهداف زي أي ميترك.","Use it in cards, tables, charts and goals like any metric.");
    const x=[];
    if(m.formula) x.push(L("المعادلة: ","Formula: ")+m.formula.replace(/\{(\w+)\}/g,(_,k)=>k==="margin"?L("هامش الربح","margin"):mkLabel(k)));
    x.push(L("الأحسن: ","Better: ")+(m.dir==="up"?L("أعلى","higher"):m.dir==="down"?L("أقل","lower"):L("محايد","neutral")));
    return {t:mLabel(m),w:w,u:u,x:x.join(" · ")};
  }
  const h=HELP[key]; if(!h) return null;
  return {t:"",w:E?h[2]:h[0],u:E?h[3]:h[1]};
}
function hlp(key,title){
  if(!HELP[key]&&!(key.indexOf("m:")===0&&metricByKey(key.slice(2)))) return "";
  return '<span class="hlp" tabindex="0" role="button" aria-label="'+esc(L("شرح","Explain"))+'" data-h="'+esc(key)+'"'+
    (title?' data-ht="'+esc(title)+'"':"")+">i</span>";
}
function helpWhat(key){ const h=helpOf(key); return h? h.w+(h.u?" — "+h.u:"") : ""; }

    const s2=t.replace(/\s*\([^)]*\)\s*$/,""); if(lab[s2]) return "m:"+lab[s2];
    return HELP_TERMS[t]||null; };
  html=html.replace(/<th([^>]*)>([^<>]+)<\/th>/g,(all,at,txt)=>{ const k=keyOf(txt); return k? "<th"+at+">"+txt+hlp(k)+"</th>" : all; });
  html=html.replace(/<div class="kpi-l">([^<>]+)<\/div>/g,(all,txt)=>{ const k=keyOf(txt); return k? '<div class="kpi-l">'+txt+hlp(k)+"</div>" : all; });
  html=html.replace(/<span class="flab">([^<>]+)<\/span>/g,(all,txt)=>{ const k=HELP_FLAB[txt.trim()]; return k? '<span class="flab">'+txt+hlp(k)+"</span>" : all; });
  html=html.replace(/<span class="conf"([^>]*)>(ثقة (?:عالية|متوسطة|منخفضة))<\/span>/g,(all,at,txt)=>'<span class="conf"'+at+">"+txt+"</span>"+hlp("t:conf"));
  return html;
}

function calShift(m,n){ const d=parseISO(m); return iso(new Date(d.getFullYear(),d.getMonth()+n,1)); }
function calGrid(m){
  const first=parseISO(m), y=first.getFullYear(), mo=first.getMonth();
  const days=new Date(y,mo+1,0).getDate(), lead=new Date(y,mo,1).getDay(), T=todayISO();
  const a=CAL.a, b=CAL.b, lo=a&&b? (a<b?a:b) : a, hi=a&&b? (a<b?b:a) : a;

    '<div class="cal-w">'+["ح","ن","ث","ر","خ","ج","س"].map(d=>"<span>"+esc(EN()?({"ح":"S","ن":"M","ث":"T","ر":"W","خ":"T","ج":"F","س":"S"})[d]:d)+"</span>").join("")+"</div><div class=\"cal-g\">";
  for(let i=0;i<lead;i++) h+="<span></span>";
  for(let d=1;d<=days;d++){

    const inR=lo&&hi&&iso2>=lo&&iso2<=hi, edge=iso2===lo||iso2===hi;
    h+='<button class="cal-d'+(inR?" in":"")+(edge?" edge":"")+(iso2===T?" today":"")+

function calBody(){

  else { const x=secById(CAL.target.slice(4)); if(x){ x.range=a===b?{preset:"day",from:a}:{preset:"custom",from:a,to:b}; delete x.date; saveCfg(); } }

/* ══════════ فترة كل قسم: يتبع الشريط، أو يوم، أو مدة، أو كل الفترة ══════════ */
const SEC_PRESETS=[["","يتبع الشريط فوق","Follows the page bar"],["day","يوم واحد","A single day"],["custom","مدة مخصصة","Custom range"],
  ["today","النهارده","Today"],["yesterday","امبارح","Yesterday"],["7d","آخر ٧ أيام","Last 7 days"],["30d","آخر ٣٠ يوم","Last 30 days"],
  ["mtd","من أول الشهر","Month to date"],["lastmonth","الشهر اللي فات","Last month"],["life","كل الفترة","All time"]];
/** أول يوم فيه بيانات — بيتحدد من قاعدة البيانات مرة واحدة وقت التشغيل */
function dataFrom(){
  if(S.dataFrom) return S.dataFrom;
  const ds=S.facts.map(f=>f.date).sort();
  return ds.length? ds[0] : todayISO();
}
function rangeOf(p,from,to){
  const t=todayISO();
  switch(p){
    case "day":       { const d=from||t; return [d,d]; }
    case "custom":    return [from||addDays(t,-6), to||t];
    case "today":     return [t,t];
    case "yesterday": return [addDays(t,-1),addDays(t,-1)];
    case "7d":        return [addDays(t,-6),t];
    case "30d":       return [addDays(t,-29),t];
    case "mtd":       return [t.slice(0,8)+"01",t];
    case "lastmonth": { const d=parseISO(t), a=new Date(d.getFullYear(),d.getMonth()-1,1), b=new Date(d.getFullYear(),d.getMonth(),0);
                        return [iso(a),iso(b)]; }
    case "life":      return [dataFrom(),t];
    default:          return null;
  }
}
function secRange(sec){
  if(!sec) return null;
  if(sec.range&&sec.range.preset) return rangeOf(sec.range.preset,sec.range.from,sec.range.to);
  if(sec.date) return [sec.date,sec.date];   // توافق مع «يوم محدد» القديم
  return null;
}
function secRangeLabel(sec){
  const r=secRange(sec); if(!r) return "";
  const p=(sec.range&&sec.range.preset)||"day";

  return r[0]===r[1]? fdate(r[0]) : (["custom","day"].indexOf(p)>=0? fdate(r[0])+" — "+fdate(r[1]) : nm+" · "+fdate(r[0])+" — "+fdate(r[1]));
}
/** اليوم اللي القسم شغال عليه — لأقسام اليوم مباشر والإدخال */
function secDay(sec){
  const r=secRange(sec);
  return r? r[1] : (S.liveDate||todayISO());
}
function secCtx(sec,ctx){
  const r=secRange(sec); if(!r) return ctx;
  const len=diffDays(r[0],r[1])+1;

}

/* ══════════ جدول حر (شيت): أعمدة بتحددها وصفوف بتتحفظ في sheets/<id> ══════════ */
const SH_TYPES=[["text","نص","Text"],["num","رقم","Number"],["date","تاريخ","Date"],["link","لينك","Link"],["select","اختيار","Choice"],["check","صح/غلط","Checkbox"]];
S.sheets={}; S.shq={};
function shDoc(id){ return S.sheets[id]||(S.sheets[id]={id:id,rows:[]}); }
const _shT={};
function shSave(id){ clearTimeout(_shT[id]); _shT[id]=setTimeout(async()=>{
  try{ await Store.setDoc("sheets",id,shDoc(id)); }catch(e){ toast(L("الجدول مش اتحفظ","The sheet did not save"),true); } },400); }
function secSheet(sec){
  const cols=sec.cols||[], doc=shDoc(sec.id), q=(S.shq[sec.id]||"").trim().toLowerCase();
  const rows=q? doc.rows.filter(r=>cols.some(c=>String(r.c[c.id]==null?"":r.c[c.id]).toLowerCase().indexOf(q)>=0)) : doc.rows;
  const cell=(r,c)=>{ const v=r.c[c.id], k=esc(sec.id)+"|"+esc(r.id)+"|"+esc(c.id);
    if(c.type==="check") return '<td style="text-align:center"><input type="checkbox" data-sc="'+k+'"'+(v?" checked":"")+"></td>";
    if(c.type==="select") return '<td><select class="sel" data-sc="'+k+'"><option value=""></option>'+String(c.opts||"").split(/[,،]/).map(x=>x.trim()).filter(Boolean)
      .map(o=>'<option'+(v===o?" selected":"")+">"+esc(o)+"</option>").join("")+"</select></td>";
    const ty=c.type==="num"?"number":c.type==="date"?"date":c.type==="link"?"url":"text";
    return '<td><div style="display:flex;gap:4px;align-items:center"><input class="inp" type="'+ty+'"'+(c.type==="num"?' step="any"':"")+' data-sc="'+k+'" value="'+(v==null?"":esc(v))+'">'+
      (c.type==="link"&&v&&/^https?:\/\//i.test(v)?'<a href="'+esc(v)+'" target="_blank" rel="noopener" title="'+esc(L("افتح","Open"))+'">▶</a>':"")+"</div></td>"; };
  let h='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">'+
    '<button class="btn btn-s btn-p" data-a="shAddRow" data-id="'+esc(sec.id)+'">'+esc(L("+ صف","+ Row"))+"</button>"+
    '<input class="inp" style="width:180px" placeholder="'+esc(L("بحث في الجدول","Search the sheet"))+'" data-c="shQ" data-id="'+esc(sec.id)+'" value="'+esc(S.shq[sec.id]||"")+'">'+
    '<span class="hint">'+rows.length+(q?" / "+doc.rows.length:"")+esc(L(" صف"," rows"))+"</span></div>";
  if(!cols.length) h+='<div class="empty" style="padding:20px">'+esc(L("مفيش أعمدة — افتح الخيارات وزوّد عمود.","No columns — open options and add one."))+"</div>";
  else{
    h+='<div class="sh-w"><table class="sh fs-t"><thead><tr><th>#</th>'+cols.map(c=>"<th>"+esc(c.name)+"</th>").join("")+"<th></th></tr></thead><tbody>"+
      rows.map((r,i)=>'<tr><td class="tm">'+(i+1)+"</td>"+cols.map(c=>cell(r,c)).join("")+
        '<td class="n" style="white-space:nowrap"><button class="btn btn-s" data-a="shDupRow" data-id="'+esc(sec.id)+'" data-r="'+esc(r.id)+'" title="'+esc(L("نسخ الصف","Duplicate row"))+'">⧉</button> '+
        '<button class="btn btn-s btn-d" data-a="shDelRow" data-id="'+esc(sec.id)+'" data-r="'+esc(r.id)+'" title="'+esc(L("امسح الصف","Delete row"))+'">✕</button></td></tr>').join("")+"</tbody>";
    const nums=cols.filter(c=>c.type==="num");
    if(nums.length&&rows.length) h+='<tfoot><tr><td class="tm">Σ</td>'+cols.map(c=>c.type==="num"?'<td class="calc"><b>'+
      esc(fnum(sum(rows.map(r=>parseFloat(r.c[c.id])||0)),2))+"</b></td>":"<td></td>").join("")+"<td></td></tr></tfoot>";
    h+="</table></div>";
  }
  if(S.ctl[sec.id]) h+='<div class="cctl"><span class="flab">'+esc(L("الأعمدة","Columns"))+'</span><div style="flex-basis:100%;height:0"></div>'+
    '<div data-sort="list:'+esc(sec.id)+':cols" style="display:flex;flex-direction:column;gap:6px;width:100%">'+cols.map(c=>
      '<div data-sid="'+esc(c.id)+'" data-gname="'+esc(c.name)+'" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="sec-h">⠿</span>'+
      '<input class="inp" style="width:160px" data-c="shColName" data-id="'+esc(sec.id)+'" data-col="'+esc(c.id)+'" value="'+esc(c.name)+'">'+
      '<select class="sel" data-c="shColType" data-id="'+esc(sec.id)+'" data-col="'+esc(c.id)+'">'+SH_TYPES.map(x=>'<option value="'+x[0]+'"'+(c.type===x[0]?" selected":"")+">"+esc(L(x[1],x[2]))+"</option>").join("")+"</select>"+
      (c.type==="select"?'<input class="inp" style="width:200px" placeholder="'+esc(L("الاختيارات مفصولة بفاصلة","Choices, comma separated"))+'" data-c="shColOpts" data-id="'+esc(sec.id)+'" data-col="'+esc(c.id)+'" value="'+esc(c.opts||"")+'">':"")+
      '<button class="btn btn-s btn-d" data-a="shDelCol" data-id="'+esc(sec.id)+'" data-col="'+esc(c.id)+'">✕</button></div>').join("")+"</div>"+
    '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><input class="inp" id="shNew_'+esc(sec.id)+'" style="width:160px" placeholder="'+esc(L("اسم العمود الجديد","New column name"))+'">'+
      '<select class="sel" id="shNewT_'+esc(sec.id)+'">'+SH_TYPES.map(x=>'<option value="'+x[0]+'">'+esc(L(x[1],x[2]))+"</option>").join("")+"</select>"+
      '<button class="btn btn-s btn-p" data-a="shAddCol" data-id="'+esc(sec.id)+'">'+esc(L("+ عمود","+ Column"))+"</button></div></div>";
  return card(esc(secTitle(sec)),ctlBtn(sec),h);
}

CHG.shQ=(v,t)=>{ S.shq[t.dataset.id]=v; reSec(); };
ACT.shAddRow=t=>{ shDoc(t.dataset.id).rows.push({id:"r"+uid(),c:{}}); shSave(t.dataset.id); reSec(); };
ACT.shDupRow=t=>{ const d=shDoc(t.dataset.id), i=d.rows.findIndex(x=>x.id===t.dataset.r); if(i<0) return;

CHG.shColName=(v,t)=>{ const c=shCol(t); if(c&&v.trim()){ c.name=v.trim(); saveCfg(); reSec(); } };
CHG.shColType=(v,t)=>{ const c=shCol(t); if(c){ c.type=v; saveCfg(); reSec(); } };
CHG.shColOpts=(v,t)=>{ const c=shCol(t); if(c){ c.opts=v; saveCfg(); reSec(); } };
ACT.shDelCol=t=>{ const x=secById(t.dataset.id); if(!x) return; x.cols=(x.cols||[]).filter(c=>c.id!==t.dataset.col); saveCfg(); reSec(); };
ACT.shAddCol=t=>{ const x=secById(t.dataset.id); if(!x) return;
  const n=($("#shNew_"+t.dataset.id)||{}).value||""; if(!n.trim()) return toast(L("اكتب اسم العمود","Enter a column name"),true);

S.aib={};

  h+='<div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap"><button class="btn btn-s btn-p" data-a="aibRun" data-id="'+esc(sec.id)+'"'+(busy?" disabled":"")+">"+

CHG.aibPrompt=(v,t)=>{ const x=secById(t.dataset.id); if(x){ x.prompt=v; saveCfg(); } };
ACT.aibRun=async t=>{
  const x=secById(t.dataset.id); if(!x) return;
  const ta=document.querySelector('[data-c="aibPrompt"][data-id="'+x.id+'"]'); if(ta) x.prompt=ta.value;
  if(!(x.prompt||"").trim()) return toast(L("اكتب فكرة القسم الأول","Write the section's idea first"),true);
  const s=await aiInit(); if(!s) return toast(L("المساعد مش متاح في العرض ده.","The assistant isn't available in this view."),true);
  S.aib[x.id]=true; reSec();
  const turns=[{role:"user",content:AI_RULES_GET()+"\n\n---\n\n"+L("المطلوب في القسم ده: ","This section's task: ")+x.prompt+
    "\n\n"+L("اكتب النتيجة نص مختصر منظم بنقط، من غير مقدمة ولا خاتمة.","Write the result as short organized bullet points, no intro or outro.")}];
  const opts={modelTier:aiTier()};
  if(AI.limits&&AI.limits.tools) opts.tools=aiTools().filter(k=>k.name!=="build_ui").slice(0,Math.min(6,AI.limits.tools.maxCount||6));
  else turns[0].content+="\n\n"+JSON.stringify({context:aiTools()[0].execute(),totals:aiTools()[1].execute({})}).slice(0,12000);
  try{ const r=await s(turns,opts); x.out=String(r.text||"").slice(0,6000); x.outAt=Date.now(); saveCfg(); }
  catch(e){ const m=aiErrMsg(e); if(m) toast(m,true); }
  S.aib[x.id]=false; reSec();
};

function cloneSecs(list,screen){
  return list.map(x=>{ const c=JSON.parse(JSON.stringify(x)); c.id="s_"+uid(); c.screen=screen||x.screen;

    return c; });
}
ACT.scrDup=t=>{

ACT.dupMetric=t=>{ const m=metricByKey(t.dataset.id); if(!m) return;

   تحفظ ترتيب الصفحة كله باسم، وتطبّقه على أي شاشة أو تعمل منه شاشة جديدة. */
const TPL_MAX=40;
function builtinTpls(){

     sections:[S1("kpi",{title:L("الأرقام الأساسية","Key numbers"),metrics:k}),
       S1("trend",{title:"الاتجاه",metrics:["revenue","spend","roas"],chart:"area"}),
       S1("dailyreport",{title:"التقرير اليومي",dim:"platform",metrics:["spend","orders","revenue","roas","cpa"]}),
       S1("action",{title:"مركز الإجراءات",limit:5})]},
    {id:"bt_diag",builtin:true,name:"تشخيص وأداء",desc:L("إيه اتغير، فين التسريب، وأنهي وقت أحسن","What changed, where the leak is, and which time works best"),
     sections:[S1("kpi",{title:"الأرقام",metrics:k}),
       S1("whatchanged",{title:L("إيه اللي اتغير؟","What changed?")}),
       S1("funnel",{title:"القمع والتشخيص",size:"half"}),
       S1("health",{title:"درجة الصحة",size:"half"}),
       S1("peaks",{title:L("أفضل الأوقات والمنصات","Best times and platforms")}),
       S1("hourmap",{title:L("الأداء: يوم × ساعة","Performance: day × hour"),metrics:["revenue"]}),
       S1("decisions",{title:L("القرارات المقترحة","Recommended decisions"),dim:"campaign",limit:12})]},
    {id:"bt_client",builtin:true,name:"تقرير عميل",desc:L("شكل نضيف تبعته للعميل — أرقام وشارتات من غير تفاصيل داخلية","A clean layout to send the client — numbers and charts without internal detail"),
     sections:[S1("kpi",{title:"ملخص الفترة",metrics:["spend","orders","revenue","roas"]}),
       S1("trend",{title:L("الأداء على مدار الفترة","Performance over the period"),metrics:["revenue","spend"],chart:"area"}),
       S1("bars",{title:"توزيع الصرف",dim:"platform",metrics:["spend"],chart:"donut",size:"half"}),
       S1("bars",{title:L("العائد لكل منصة","Return by platform"),dim:"platform",metrics:["roas"],size:"half"}),
       S1("dailyreport",{title:"التفاصيل",dim:"platform",metrics:["spend","orders","revenue","roas"]}),
       S1("note",{title:"ملاحظات",text:L("اكتب ملخصك للعميل هنا…","Write your client summary here…")})]},

function allTpls(){ return builtinTpls().concat(S.cfg.templates||[]); }
function tplById(id){ return allTpls().find(t=>t.id===id); }
function tplNameTaken(name,exceptId){
  const k=String(name||"").trim().replace(/\s+/g," ").toLowerCase();
  return allTpls().some(t=>t.id!==exceptId&&
    String(t.name||"").trim().replace(/\s+/g," ").toLowerCase()===k);
}
function tplSummary(t){
  const c={}; (t.sections||[]).forEach(s=>{ const y=secType(s.type); const n=y?y[1]:s.type;
    c[n]=(c[n]||0)+1; });
  return Object.keys(c).map(n=>n+(c[n]>1?" ×"+c[n]:"")).join(" · ");
}

      e.innerHTML = tplNameTaken(i.value)

ACT.tplSaveOk=t=>{
  const name=$("#tplName").value.trim().replace(/\s+/g," ");
  if(!name) return toast(L("اكتب اسم للقالب","Name the template"),true);
  if(tplNameTaken(name)){
    const ex=(S.cfg.templates||[]).find(x=>
      String(x.name).trim().replace(/\s+/g," ").toLowerCase()===name.toLowerCase());
    if(!ex) return toast(L("الاسم ده محجوز لقالب جاهز — اختار اسم تاني","That name belongs to a built-in template — pick another"),true);
    $("#tplErr").innerHTML='<span class="err">فيه قالب اسمه كده.</span> '+
      '<button class="btn btn-s btn-d" data-a="tplOverwrite" data-id="'+esc(ex.id)+
      '" data-scr="'+esc(t.dataset.scr)+'">استبدل القالب القديم</button>';
    return;
  }
  const scr=t.dataset.scr;
  S.cfg.templates=S.cfg.templates||[];
  if(S.cfg.templates.length>=TPL_MAX) return toast(L("وصلت للحد الأقصى (","You've reached the maximum (")+TPL_MAX+" قالب)",true);
  S.cfg.templates.push({id:"tpl_"+uid(),name:name,createdAt:todayISO(),
    sections:S.cfg.sections.filter(x=>x.screen===scr).map(x=>{
      const c=JSON.parse(JSON.stringify(x)); delete c.id; delete c.screen; return c; })});
  saveCfg(); closeModal(); toast("اتحفظ القالب «"+name+"»"); render();
};
ACT.tplOverwrite=t=>{
  const ex=(S.cfg.templates||[]).find(x=>x.id===t.dataset.id); if(!ex) return;
  ex.sections=S.cfg.sections.filter(x=>x.screen===t.dataset.scr).map(x=>{

/* ── ملخص مركز الإجراءات: كل منصة + أحسن وأضعف الحملات والفيديوهات والمشاهير (الصرف من المنصات، الطلبات والإيراد من خزامى) ── */
const ACS={key:"",busy:false,err:""};
async function acsLoad(a,b,c,d){ const k=a+"|"+b+"|"+(c||""); if(ACS.key===k||ACS.busy) return; ACS.busy=true; ACS.err="";
  try{ await exFetch(a,b); if(c) await exFetch(c,d); ACS.key=k; }catch(e){ ACS.err=e.message||String(e); }
  ACS.busy=false; render(); }
function acsAgg(rows,kz,dim){ const cm=exCrMap(rows), sc=exScope(rows,dim), g=exGroup(sc,dim), kg=exKzGroup((kz||[]).filter(k=>["meta","tiktok","snap"].indexOf(k.platform)>=0),dim,cm);
  Object.keys(kg).forEach(k=>{ if(!g[k]) g[k]=[]; }); const o={}; Object.keys(g).forEach(k=>{ o[k]=exUseKz(exAgg(g[k]),kg[k]); }); return o; }
function acsChip(ro,avg){ if(ro==null||!avg) return ""; const r=ro/avg; const c= r>=1.15? ["ممتاز","Strong","#1D9E75"] : r>=0.9? ["كويس","OK","#888780"] : ["ضعيف","Weak","#E24B4A"];
  return '<span class="acs-chip" style="color:'+c[2]+';border-color:'+c[2]+'">'+esc(L(c[0],c[1]))+"</span>"; }
function acsName(rows,k,dim){ const r=rows.find(x=>dim==="campaign"? (x.camp_no||x.campaign_name)===k : dim==="creative"? x.creative_id===k : x.influencer===k);
  if(!r) return k; const ex=dim==="campaign"? [r.variation||r.product] : dim==="creative"? [r.influencer,r.variation||r.product] : [];
  return [k].concat(ex.filter(Boolean)).join(" · "); }
function acsRank(map,minSpend,label,dim,rows){ const arr=Object.keys(map).map(k=>({k:k,v:map[k]})).filter(x=>x.k!=="—"&&x.v.spend>=minSpend&&x.v.roas!=null);
  if(!arr.length) return ""; arr.sort((x,y)=>y.v.roas-x.v.roas);
  const top=arr.slice(0,3), bot=arr.length>3? arr.slice(-3).reverse() : [];
  const row=(x,good)=>'<tr data-a="acsOpen" data-dim="'+dim+'" data-k="'+esc(x.k)+'" style="cursor:pointer"><td class="acs-n">'+esc(acsName(rows,x.k,dim))+'</td><td class="num">'+fnum(x.v.spend,0)+'</td><td class="num" style="color:'+(good?"#1D9E75":"#E24B4A")+';font-weight:800">'+x.v.roas.toFixed(2)+'x</td><td class="num">'+(x.v.cpa==null?"—":fnum(x.v.cpa,0))+"</td></tr>";
  return '<div class="acs-box"><div class="acs-bt">'+esc(label)+'</div><table class="acs-t"><tr><th></th><th class="num">'+esc(L("الصرف","Spend"))+'</th><th class="num">ROAS</th><th class="num">CPA</th></tr>'+
    '<tr><td colspan="4" class="acs-sub" style="color:#1D9E75">'+esc(L("الأحسن","Best"))+"</td></tr>"+top.map(x=>row(x,1)).join("")+
    (bot.length?'<tr><td colspan="4" class="acs-sub" style="color:#E24B4A">'+esc(L("الأضعف","Weakest"))+"</td></tr>"+bot.map(x=>row(x,0)).join(""):"")+"</table></div>"; }
function acSummary(from,to){
  if(!(window.SUPA_DB&&SUPA_DB.client)) return "";
  const len=diffDays(from,to)+1, pt=addDays(from,-1), pf=addDays(pt,-(len-1));
  const cur=EX.cache[from+"|"+to], prv=EX.cache[pf+"|"+pt];
  if(!cur||!prv){ setTimeout(()=>acsLoad(from,to,pf,pt),0); return '<div class="card acs"><div class="card-t">'+esc(L("الملخص","Summary"))+'</div><div class="hint">'+esc(ACS.err||L("بحمّل الملخص…","Loading summary…"))+"</div></div>"; }
  const P=acsAgg(cur,cur.kz,"platform"), PP=acsAgg(prv,prv.kz,"platform");
  let ts=0,tr=0,tn=0; ["meta","tiktok","snap"].forEach(id=>{ const v=P[id]; if(v){ ts+=v.spend; tr+=v.revenue; tn+=v.purchases; } });
  const avg=ts? tr/ts : null, minSp=Math.max(300,ts*0.01);
  const cards=["meta","tiktok","snap"].filter(id=>P[id]&&(P[id].spend||P[id].revenue)).map(id=>{ const v=P[id], p=PP[id], pl=platById(id)||{name:id,color:"#888"};
    const d=(a,b,inv)=>{ if(a==null||b==null||!b) return ""; const x=(a-b)/Math.abs(b)*100, good=inv?x<0:x>0; return ' <small style="color:'+(good?"#1D9E75":"#E24B4A")+'">'+(x>0?"▲":"▼")+fnum(Math.abs(x),Math.abs(x)<10?1:0)+"%</small>"; };
    return '<div class="acs-pc" style="border-top:3px solid '+pl.color+'"><div class="acs-ph"><b>'+esc(pl.name)+"</b>"+acsChip(v.roas,avg)+"</div>"+
      '<div class="acs-kv"><span>'+esc(L("الصرف","Spend"))+"</span><b>"+fnum(v.spend,0)+d(v.spend,p&&p.spend)+"</b></div>"+
      '<div class="acs-kv"><span>'+esc(L("الطلبات","Orders"))+"</span><b>"+fnum(v.purchases,0)+d(v.purchases,p&&p.purchases)+"</b></div>"+
      '<div class="acs-kv"><span>'+esc(L("الإيراد","Revenue"))+"</span><b>"+fnum(v.revenue,0)+d(v.revenue,p&&p.revenue)+"</b></div>"+
      '<div class="acs-kv"><span>ROAS</span><b>'+(v.roas==null?"—":v.roas.toFixed(2)+"x")+d(v.roas,p&&p.roas)+"</b></div>"+
      '<div class="acs-kv"><span>CPA</span><b>'+(v.cpa==null?"—":fnum(v.cpa,0))+d(v.cpa,p&&p.cpa,1)+"</b></div>"+
      '<div class="acs-kv"><span>AOV</span><b>'+(v.aov==null?"—":fnum(v.aov,0))+"</b></div></div>"; }).join("");
  const C=acsAgg(cur,cur.kz,"campaign"), V=acsAgg(cur,cur.kz,"creative"), I=acsAgg(cur,cur.kz,"influencer");
  return '<div class="card acs"><div class="card-h"><div class="card-t">'+esc(L("الملخص","Summary")+" · "+fdate(from)+" — "+fdate(to))+'</div><div class="card-x">'+
    esc(L("الإجمالي: صرف ","Total: spend ")+fnum(ts,0)+L(" · طلبات "," · orders ")+fnum(tn,0)+L(" · إيراد "," · revenue ")+fnum(tr,0)+" · ROAS "+(avg?avg.toFixed(2)+"x":"—"))+"</div></div>"+
    (cards?'<div class="acs-pg">'+cards+"</div>":'<div class="hint">'+esc(L("مفيش صرف في الفترة دي.","No spend in this period."))+"</div>")+
    '<div class="acs-rk">'+acsRank(C,minSp,L("الحملات","Campaigns"),"campaign",cur)+acsRank(V,minSp,L("الفيديوهات","Videos"),"creative",cur)+acsRank(I,minSp,L("المشاهير","Influencers"),"influencer",cur)+"</div>"+
    '<div class="hint">'+esc(L("الصرف من المنصات · الطلبات والإيراد والـ ROAS والـ CPA والـ AOV من خزامى · «ممتاز/ضعيف» مقارنة بمتوسط الفترة · النسب مقارنة بالفترة اللي قبلها بنفس الطول · اللي صرفه أقل من ١٪ من الإجمالي مش داخل في الترتيب · دوس على أي سطر يفتحه في المحلل.","Spend from platforms; orders, revenue, ROAS, CPA, AOV from Khzama."))+"</div></div>"; }

/** شريط أرقام النهارده مقابل امبارح في نفس التوقيت */
function acTape(){
  const T=todayISO(), Y=addDays(T,-1), pts=intraday(T);
  let cur, prev, lab;
  if(pts.length){ const last=pts[pts.length-1]; cur=last.vals; prev=stateAt(Y,last.ts-parseISO(T).getTime());
    lab=L("امبارح لحد ","Yesterday by ")+ftime(last.ts); }
  else { const fy=factsIn(Y,Y), fp=factsIn(addDays(Y,-1),addDays(Y,-1)); if(!fy.length) return "";
    cur=aggFacts(fy); prev=fp.length?aggFacts(fp):null; lab=L("أول امبارح","Day before"); }
  const ks=["spend","revenue","orders","roas","cpa"].concat(S.cfg.clients.some(c=>c.margin>0)?["profit"]:[]).filter(metricByKey);
  return '<div class="tape">'+ks.map(k=>{ const m=metricByKey(k);
    return '<div class="tape-c"><div class="kpi-l">'+esc(mLabel(m))+"</div>"+
      '<div class="tape-v num">'+esc(fval(cur[k],m,true))+'<small>'+esc(unitSuffix(m))+"</small></div>"+
      '<div class="tape-f">'+(prev?deltaChip(cur[k],prev[k],m)+'<span class="dlt-c">'+esc(lab)+" "+esc(fval(prev[k],m,true))+"</span>":"")+"</div></div>"; }).join("")+
    '<div class="tape-note">'+esc(pts.length?L("النهارده لحد آخر لقطة","Today up to the last snapshot"):L("امبارح — مفيش لقطات النهارده لسه","Yesterday — no snapshots today yet"))+"</div></div>";
}
function acBudget(){
  const ids=(S.ws?[S.ws]:S.cfg.clients.map(c=>c.id)).filter(id=>{ const c=clientById(id); return c&&c.monthlyBudget>0; });
  const C=CURR[S.cfg.settings.currency]||"";
  const body=ids.map(id=>{ const p=pacingFor(id), c=clientById(id); if(!p) return "";
    const st=p.status==="over"?["var(--bad)",L("هتتخطى","Overspending")]:p.status==="under"?["var(--warn)",L("أقل من المخطط","Under plan")]:["var(--good)",L("ماشية مظبوط","On track")];
    return '<div class="pc"><div class="pc-h"><b>'+esc(c.name)+'</b><span class="acr-pill" style="color:'+st[0]+';border-color:'+st[0]+'">'+esc(st[1])+" · "+fnum(p.pacing*100,0)+"%</span></div>"+

      '<div class="pc-f"><span>'+esc(L("اتصرف ","Spent "))+fcompact(p.actual,0)+" / "+fcompact(p.budget,0)+" "+esc(C)+"</span><span>"+esc(L("المتوقع ","Forecast "))+fcompact(p.forecast,0)+"</span><span>"+
        esc(L("سقف يومي آمن ","Safe daily cap "))+fcompact(p.dailyLeft,0)+"</span></div></div>"; }).join("");
  return card(esc(L("الميزانية الشهرية","Monthly budget")),"",body||'<div class="hint">'+esc(L("حدد ميزانية شهرية للعميل من لوحة التحكم ← العملاء عشان تتابع الحرق هنا.","Set a client's monthly budget in Admin → Clients to track burn here."))+"</div>");

function acSnaps(){
  const T=todayISO(), pts=intraday(T), step=roundMins();
  const last=pts.length?pts[pts.length-1].ts:null, next=last?last+step*6e4:null, late=next&&Date.now()>next;
  const row=(l,v,col)=>'<div class="side-r"><span>'+esc(l)+"</span><b"+(col?' style="color:'+col+'"':"")+">"+v+"</b></div>";
  return card(esc(L("اللقطات","Snapshots")),esc(L("النهارده","Today")),
    row(L("آخر لقطة","Last snapshot"),last?ftime(last):"—")+
    row(L("اللقطة الجاية","Next snapshot"),next?ftime(next)+(late?" · "+esc(L("متأخرة","overdue")):""):"—",late?"var(--bad)":null)+
    row(L("اتسجل النهارده","Logged today"),pts.length+esc(L(" لقطة"," snapshots")))+
    '<div style="margin-top:10px"><button class="btn btn-s" data-a="go" data-v="live">'+esc(L("افتح اليوم مباشر","Open Live Today"))+"</button></div>");

function acTracking(from,to){
  const g=groupBy(factsIn(from,to),f=>f.platformId);
  const rows=Object.keys(g).filter(pid=>!isAcct(pid)).map(pid=>{
    const both=g[pid].filter(f=>{ const v=lastV(f); return +v.backend_revenue>0; });
    if(!both.length) return null; const v=aggFacts(both);
    return {pid:pid,gap:v.revenue>0?(v.revenue-(v.backend_revenue||0))/v.revenue*100:null};
  }).filter(r=>r&&r.gap!=null);
  return card(esc(L("صحة التتبع","Tracking health")),esc(L("المنصة مقابل نظامك","Platform vs your system")),
    rows.length? rows.map(r=>'<div class="side-r"><span><i class="sw" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+platById(r.pid).color+'"></i> '+
      esc(platById(r.pid).name)+'</span><b style="color:'+(Math.abs(r.gap)>15?"var(--warn)":"var(--good)")+'">'+(r.gap>0?"+":"")+fnum(r.gap,0)+"%</b></div>").join("")+
      '<div class="hint" style="margin-top:8px">'+esc(L("أكتر من ١٥٪ يعني البكسل غالباً بيبالغ أو بيضيّع.","Over 15% usually means the pixel over- or under-reports."))+"</div>"
    : '<div class="hint">'+esc(L("سجّل «إيراد النظام» جنب أرقام المنصة عشان يظهر الفرق هنا.","Log backend revenue next to platform numbers to see the gap here."))+"</div>");
}

  const v=a[k]; return typeof v==="function"?v.bind(a):(v!==undefined?v:a[k]);}});
const r2=n=>(n==null||!isFinite(n))?null:Math.round(n*100)/100;
function aiScope(){
  const [from,to]=resolveRange();
  const p=[];
  if(S.ws) p.push(L("عميل: ","Client: ")+((clientById(S.ws)||{}).name||S.ws));
  else if(S.f.clients.length) p.push(L("عملاء: ","Clients: ")+S.f.clients.map(c=>(clientById(c)||{}).name||c).join("، "));
  if(S.f.platforms.length) p.push(L("منصات: ","Platforms: ")+S.f.platforms.map(x=>platById(x).name).join("، "));
  if(S.f.campaign) p.push(L("بحث: ","Search: ")+S.f.campaign);
  return {from,to,label:fdate(from)+" — "+fdate(to)+
    (p.length?" · "+p.join(" · "):" · "+L("كل العملاء","All clients"))};
}
function aiVals(v){
  const o={};
  S.cfg.metrics.forEach(m=>{ const x=v[m.key];
    if(x!=null&&isFinite(x)) o[m.key]=r2(x); });
  return o;
}
function aiScopeOf(i){
  const o={};
  if(i.clientId) o.clients=[String(i.clientId)];
  if(i.platformId) o.platforms=[String(i.platformId)];
  if(i.campaign) o.campaign=String(i.campaign);
  return Object.keys(o).length?o:null;
}
function aiRange(i){
  const [f,t]=resolveRange();
  const from=i&&i.from?String(i.from):f, to=i&&i.to?String(i.to):t;
  return [from<to?from:to, to>from?to:from];
}
